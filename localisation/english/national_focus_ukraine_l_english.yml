 ### POLITICAL - TYMOSHENKO AND UDOVENKO ###
 UKR_the_gas_princess:0 "The Gas Princess"
 UKR_the_gas_princess_desc:0 "She built United Energy Systems into the largest gas trader in the country before she was thirty-five, and everybody knows roughly how. Then she took the fuel and energy portfolio and turned on the trade that made her, which nobody expected and several people will never forgive.\n\nShe is the most effective politician of her generation and the least predictable. The braid is a costume and she knows it; it works anyway."
 UKR_batkivshchyna:0 "Batkivshchyna"
 UKR_batkivshchyna_desc:0 "Fatherland: a party built in her own image in 1999, with no ideology to speak of beyond her. It does not need a programme. It needs her on a platform and a camera pointed at her."
 UKR_the_fuel_and_energy_ministry:0 "The Fuel and Energy Ministry"
 UKR_the_fuel_and_energy_ministry_desc:0 "Deputy prime minister for the sector she grew rich in. Every director in the industry expects business as usual, and discovers within a month that they have made a serious error of judgement."
 UKR_the_salvation_committee:0 "The Salvation Committee"
 UKR_the_salvation_committee_desc:0 "A coordinating body for everyone who wants the president gone, assembled in February and chaired by the one member willing to say the word impeachment out loud."
 UKR_take_it_to_the_street:0 "Take It to the Street"
 UKR_take_it_to_the_street_desc:0 "The chamber can be bought and the courts can be leaned on. A hundred thousand people on Khreshchatyk cannot be either, and she is better in front of them than anybody alive."
 UKR_break_the_gas_traders:0 "Break the Gas Traders"
 UKR_break_the_gas_traders_desc:0 "Barter schemes ended, intermediaries stripped of licences, and payment demanded in cash from enterprises that have not paid in cash since 1993. Budget revenue from the sector triples in a year.\n\nShe knows exactly where every body is buried in this industry, which is the whole point and also the danger."
 UKR_the_arrest_warrant:0 "The Arrest Warrant"
 UKR_the_arrest_warrant_desc:0 "Forgery, gas smuggling, tax evasion. The charges date from her trading days and might even be true; the timing has nothing whatever to do with when the offences allegedly occurred."
 UKR_lukyanivska_prison:0 "Lukyanivska"
 UKR_lukyanivska_prison_desc:0 "Six weeks in a Kyiv remand cell. The government believes this ends her.\n\nWhat it actually does is convert a wealthy former gas trader into a political prisoner on the evening news, which is the single most valuable transformation available in this country."
 UKR_released_and_unrepentant:0 "Released and Unrepentant"
 UKR_released_and_unrepentant_desc:0 "The court releases her and the charges dissolve over the following months. She walks out to a crowd, makes a speech she has had six weeks to write, and is measurably more dangerous than when she went in."
 UKR_the_bloc:0 "The Bloc"
 UKR_the_bloc_desc:0 "Her name on the ballot instead of the party's, because the name polls better than any programme ever could. It works, and every other politician in the country takes note of exactly how well."
 UKR_the_orange_ally:0 "An Alliance of Convenience"
 UKR_the_orange_ally_desc:0 "She and the banker need each other and cannot stand each other, and both facts are obvious to everyone including them. The alliance will hold exactly as long as they have a common enemy."
 UKR_reprivatization:0 "Reprivatization"
 UKR_reprivatization_desc:0 "The sales that were rigged will be undone. A list is drawn up, and the steelworks that went for eight hundred million is resold for four times that to an open bidder.\n\nEvery investor in the country recalculates their risk overnight, which is either the price of justice or an act of economic vandalism depending on which of them you ask."
 UKR_the_thousand_hryvnia:0 "The Thousand Hryvnia"
 UKR_the_thousand_hryvnia_desc:0 "Compensation for Soviet savings annihilated in 1993, paid to every claimant, in cash, in an election year. The economists produce a paper explaining why this is inflationary. Six million people receive the money."
 UKR_cheap_gas_for_the_people:0 "Cheap Gas for the People"
 UKR_cheap_gas_for_the_people_desc:0 "Household tariffs held below import cost by decree, and the difference absorbed by a budget that cannot absorb it. Any successor who raises them will be destroyed, which is understood and is arguably the point."
 UKR_defend_the_land_moratorium:0 "Defend the Moratorium"
 UKR_defend_the_land_moratorium_desc:0 "The ban on farmland sales stays. The economists call it the single largest drag on rural investment in Europe. Eleven million share certificate holders call it the only thing standing between them and a man from Kyiv with a briefcase."
 UKR_the_war_with_the_oligarchs:0 "The War with the Oligarchs"
 UKR_the_war_with_the_oligarchs_desc:0 "Not regulation, not taxation. Names read out on television, assets frozen, cases opened. She is not trying to civilise them, she is trying to break them, and one of the two sides is going to lose."
 UKR_the_social_budget:0 "The Social Budget"
 UKR_the_social_budget_desc:0 "Pensions, salaries, child payments and student stipends all raised in a single reading, funded by revenue that has been projected rather than collected. It passes with the largest majority of the session."
 UKR_the_referendum_on_everything:0 "The Referendum on Everything"
 UKR_the_referendum_on_everything_desc:0 "Why argue with the parliament when you can go over its head? Land, privatisation, the constitution, the alliance: put each of them to the people and let the chamber explain itself afterwards."
 UKR_confront_the_president:0 "Confront the President"
 UKR_confront_the_president_desc:0 "Whoever holds that office, she will not be a subordinate in it. The government splits in public, the coalition partners are forced to choose, and the country watches two allies destroy each other on live television."
 UKR_the_gas_contract:0 "The Gas Contract"
 UKR_the_gas_contract_desc:0 "She flies to Moscow and comes back with a price, a ten-year term and a signature. It ends a shutoff in midwinter and it will be read out in a courtroom one day as the indictment against her.\n\nBoth of those things are true and they do not cancel out."
 UKR_the_premiership_of_yulia:0 "The Premiership"
 UKR_the_premiership_of_yulia_desc:0 "The office at last, held on her own terms, with a cabinet chosen for loyalty and a programme consisting of everything promised at once. The first hundred days are the most energetic this government has ever seen."
 UKR_the_coalition_collapses:0 "The Coalition Collapses"
 UKR_the_coalition_collapses_desc:0 "It was never going to hold. The partners defect, the majority evaporates and the chamber spends four months unable to elect a speaker.\n\nShe is not damaged by this. She is never damaged by this. Chaos is the medium she swims in."
 UKR_all_or_nothing:0 "All or Nothing"
 UKR_all_or_nothing_desc:0 "There is no version of this where she governs quietly in coalition and hands over at the end of a term. Either the country is reorganised around her or it removes her, and both of them know it."
 UKR_the_plebiscitary_republic:0 "The Plebiscitary Republic"
 UKR_the_plebiscitary_republic_desc:0 "Parliament reduced to a registry, the executive answerable to referendums, and the referendums called by the executive. It is entirely constitutional and entirely unaccountable."
 UKR_the_permanent_campaign:0 "The Permanent Campaign"
 UKR_the_permanent_campaign_desc:0 "There is no governing phase. There is only the next vote, the next rally and the next announcement, indefinitely, and a machine built to do nothing else."
 UKR_the_enemies_list:0 "The Enemies List"
 UKR_the_enemies_list_desc:0 "The oligarchs first, then the disloyal deputies, then the journalists who asked about the gas contract. Each removal is popular. The cumulative effect is a country where opposition is a category of crime."
 UKR_ukraine_is_yulia:0 "Ukraine Is Yulia"
 UKR_ukraine_is_yulia_desc:0 "Pensions arrive, tariffs stay low, the enemies of the people are named on the evening news, and the budget deficit is a problem for a later government.\n\nShe is genuinely loved by half the country and genuinely hated by the other half, and she has arranged matters so that the half who love her is slightly larger. That is the whole system."
 UKR_the_peoples_movement:0 "The People's Movement"
 UKR_the_peoples_movement_desc:0 "Rukh was the thing that made independence, and by the time it inherits the state it is a party of dissidents in their sixties who have spent thirty years waiting to be allowed to govern properly.\n\nThe man leading it is a career diplomat who presided over the United Nations General Assembly and has never once raised his voice in public. He intends to do this correctly, which will take considerably longer."
 UKR_the_rukh_inheritance:0 "The Rukh Inheritance"
 UKR_the_rukh_inheritance_desc:0 "The language, the flag, the anthem and the memory. Everything the movement won between 1989 and 1991 and then watched being administered by the same men as before."
 UKR_the_chornovil_legacy:0 "The Chornovil Legacy"
 UKR_the_chornovil_legacy_desc:0 "He died in a road accident in March 1999 that a great many people have never accepted as one. The movement that split over his succession is put back together in his name."
 UKR_rukh_takes_power:0 "Rukh Takes Power"
 UKR_rukh_takes_power_desc:0 "The dissidents form a government. There is a great deal of goodwill, a coherent view of what the country should eventually be, and almost no experience of administering anything larger than a newspaper."
 UKR_the_law_on_language:0 "The Law on Language"
 UKR_the_law_on_language_desc:0 "Ukrainian in the ministries, the courts, the broadcasters and the schools, phased in over years rather than imposed overnight. It is the founding demand of the movement and it will cost votes in nine oblasts for a generation."
 UKR_the_school_curriculum:0 "The School Curriculum"
 UKR_the_school_curriculum_desc:0 "A history that starts before 1917 and does not end in 1991, taught to children whose parents learned a different one. This is the slowest instrument available and the only one that actually works."
 UKR_the_diaspora_returns:0 "The Diaspora Returns"
 UKR_the_diaspora_returns_desc:0 "Toronto, Chicago, Melbourne, Buenos Aires. Lawyers, professors and engineers who kept the language alive in places their grandparents fled to, invited home with a residency scheme and a modest tax exemption."
 UKR_the_national_idea:0 "The National Idea"
 UKR_the_national_idea_desc:0 "Not the shouting kind. A settled, unhurried account of who this country is, taught in schools and printed in textbooks, which after twenty years nobody bothers to argue about any more."
 UKR_local_self_government:0 "Local Self-Government"
 UKR_local_self_government_desc:0 "Budgets and appointments devolved to elected councils, which means the presidency gives away a great deal of power on purpose. Nobody in the building has ever done that before and several of them think it is madness."
 UKR_the_civil_service_reform:0 "The Civil Service Reform"
 UKR_the_civil_service_reform_desc:0 "Entry by examination, promotion by seniority, salaries that a competent person would accept, and dismissal only for cause. It is spectacularly boring and it is the whole project in miniature."
 UKR_the_churches_reconciled:0 "The Churches Reconciled"
 UKR_the_churches_reconciled_desc:0 "Three Orthodox jurisdictions and a Greek Catholic church that spent fifty years underground, all claiming the same parishes. He is devout, he is patient, and he is the only politician any of them will sit in a room with."
 UKR_a_state_of_laws:0 "A State of Laws"
 UKR_a_state_of_laws_desc:0 "Not the rule of law as a slogan but as an accumulation: a statute here, an independent inspectorate there, a court that ruled against a minister and was not punished for it."
 UKR_the_courts_reformed:0 "The Courts Reformed"
 UKR_the_courts_reformed_desc:0 "Judges appointed by a board he does not control, for terms that outlast him, with salaries high enough to make a bribe an insult. The first three years produce several rulings this government hates."
 UKR_gradual_decommunization:0 "Gradual Decommunization"
 UKR_gradual_decommunization_desc:0 "The archives opened, the files published, the street names changed when the district council votes for it and not before. Half the country will not notice it happening, which is precisely how it survives."
 UKR_recognize_the_holodomor:0 "Recognize the Holodomor"
 UKR_recognize_the_holodomor_desc:0 "A famine that killed something close to four million people and was denied for fifty years. The recognition is a law, a memorial and a chapter in every textbook, and it is the one thing on this list he will not compromise about."
 UKR_the_slow_work_of_institutions:0 "The Slow Work of Institutions"
 UKR_the_slow_work_of_institutions_desc:0 "Nothing announced here will win an election. Taken together, over a decade, it is the difference between a country and an arrangement."
 UKR_the_council_of_europe:0 "The Council of Europe"
 UKR_the_council_of_europe_desc:0 "The conventions signed, the monitoring accepted, the judgements of the court in Strasbourg made binding. It is an obligation rather than a prize, which is why so few governments here have wanted it."
 UKR_the_osce_chairmanship:0 "The OSCE Chairmanship"
 UKR_the_osce_chairmanship_desc:0 "A year of chairing a body that everyone considers toothless, spent mediating disputes that nobody else will touch. The reputation earned is small, specific and unusually durable."
 UKR_the_general_assembly:0 "The General Assembly"
 UKR_the_general_assembly_desc:0 "He presided over the fifty-second session in New York and is remembered there as a man who ran a difficult room fairly. In this profession that is worth more than any number of treaties."
 UKR_the_diplomats_republic:0 "The Diplomat's Republic"
 UKR_the_diplomats_republic_desc:0 "A country too useful to be worth attacking, too correct to be worth denouncing and too dull to appear on anyone's front page. It has taken a decade and it is the highest achievement available to a state this size."
 UKR_the_distinctive_partnership:0 "The Distinctive Partnership"
 UKR_the_distinctive_partnership_desc:0 "Exercises, a liaison office and a charter that stops carefully short of membership. He negotiated it once already in 1997 and knows to the word how far it can be pushed."
 UKR_the_friendship_treaty:0 "The Treaty of Friendship"
 UKR_the_friendship_treaty_desc:0 "Borders recognised, sovereignty affirmed, and a large neighbour committed on paper to both. Paper is not a defence and he has never claimed it was; it is, however, considerably better than nothing and it took four years to obtain."
 UKR_the_fleet_partition:0 "The Partition of the Fleet"
 UKR_the_fleet_partition_desc:0 "Ships divided, bases leased, debts offset. It is a bad agreement arrived at by exhausting every alternative, and the alternative to a bad agreement here was an open dispute with a nuclear power."
 UKR_no_enemies_on_any_border:0 "No Enemies on Any Border"
 UKR_no_enemies_on_any_border_desc:0 "Every frontier delimited, every treaty ratified, every neighbour given something they wanted. It is unglamorous to the point of invisibility and it is the reason nothing happens to this country for twenty years."
 UKR_the_quiet_decade:0 "The Quiet Decade"
 UKR_the_quiet_decade_desc:0 "No revolutions, no crises, no one memorable speech. Growth of four percent a year, an emigration rate that finally turns, and a generation that grows up assuming all of this is normal."
 UKR_the_generation_that_waits:0 "The Generation That Waits"
 UKR_the_generation_that_waits_desc:0 "The children in the reformed schools are now the civil servants in the reformed ministries. It took eighteen years, which is exactly how long everybody said it would take and why nobody else was willing to start."
 UKR_the_patient_republic:0 "The Patient Republic"
 UKR_the_patient_republic_desc:0 "It is not a triumph and it was never going to be. It is a country where the courts work, the border is settled, the language question is closed and nothing very interesting has happened for a very long time.\n\nThe men who built it are mostly dead. They would have considered that an acceptable price."
 UKR_the_populist_machine:0 "The Populist Machine"
 UKR_the_populist_machine_desc:0 "The braid is a costume and she knows it. It works anyway."
 UKR_the_populist_machine2:0 "The Prisoner Returns"
 UKR_the_populist_machine2_desc:0 "Six weeks converted a gas trader into a political prisoner on the evening news."
 UKR_the_populist_machine3:0 "Her Name on the Ballot"
 UKR_the_populist_machine3_desc:0 "The name polls better than any programme ever could."
 UKR_the_populist_machine4:0 "The Premiership"
 UKR_the_populist_machine4_desc:0 "A cabinet chosen for loyalty and a programme consisting of everything at once."
 UKR_the_populist_machine5:0 "Ukraine Is Yulia"
 UKR_the_populist_machine5_desc:0 "Half the country loves her, half hates her, and she has arranged for the first half to be larger."
 UKR_batkivshchyna_idea:0 "Batkivshchyna"
 UKR_batkivshchyna_idea_desc:0 "No ideology to speak of beyond her, and it needs none."
 UKR_the_energy_ministry_idea:0 "The Fuel and Energy Ministry"
 UKR_the_energy_ministry_idea_desc:0 "Every director expected business as usual."
 UKR_the_salvation_committee_idea:0 "The Salvation Committee"
 UKR_the_salvation_committee_idea_desc:0 "The one member willing to say impeachment out loud."
 UKR_the_street_idea:0 "The Street"
 UKR_the_street_idea_desc:0 "The chamber can be bought. A hundred thousand people cannot."
 UKR_the_gas_traders_broken:0 "The Gas Traders Broken"
 UKR_the_gas_traders_broken_desc:0 "Budget revenue from the sector triples in a year."
 UKR_the_arrest_warrant_idea:0 "The Arrest Warrant"
 UKR_the_arrest_warrant_idea_desc:0 "Charges that might even be true, on a timetable that has nothing to do with them."
 UKR_lukyanivska_idea:0 "Lukyanivska"
 UKR_lukyanivska_idea_desc:0 "The government believes this ends her."
 UKR_the_orange_ally_idea:0 "An Alliance of Convenience"
 UKR_the_orange_ally_idea_desc:0 "It holds exactly as long as they have a common enemy."
 UKR_reprivatization_idea:0 "Reprivatization"
 UKR_reprivatization_idea_desc:0 "Every investor in the country recalculates their risk overnight."
 UKR_the_thousand_hryvnia_idea:0 "The Thousand Hryvnia"
 UKR_the_thousand_hryvnia_idea_desc:0 "The economists explain why it is inflationary. Six million people receive the money."
 UKR_cheap_gas_idea:0 "Cheap Gas for the People"
 UKR_cheap_gas_idea_desc:0 "Any successor who raises the tariff will be destroyed. That is arguably the point."
 UKR_defend_the_land_moratorium_idea:0 "The Moratorium Defended"
 UKR_defend_the_land_moratorium_idea_desc:0 "The only thing between eleven million people and a man from Kyiv with a briefcase."
 UKR_the_war_with_the_oligarchs_idea:0 "The War with the Oligarchs"
 UKR_the_war_with_the_oligarchs_idea_desc:0 "Not to civilise them. To break them."
 UKR_the_social_budget_idea:0 "The Social Budget"
 UKR_the_social_budget_idea_desc:0 "Funded by revenue that has been projected rather than collected."
 UKR_the_referendum_idea:0 "The Referendum Weapon"
 UKR_the_referendum_idea_desc:0 "Why argue with the parliament when you can go over its head?"
 UKR_confront_the_president_idea:0 "Confrontation"
 UKR_confront_the_president_idea_desc:0 "Two allies destroying each other on live television."
 UKR_the_gas_contract_idea:0 "The Gas Contract"
 UKR_the_gas_contract_idea_desc:0 "It ended a shutoff in midwinter and it will be read out in a courtroom."
 UKR_the_coalition_collapses_idea:0 "The Coalition Collapses"
 UKR_the_coalition_collapses_idea_desc:0 "Chaos is the medium she swims in."
 UKR_the_plebiscitary_republic_idea:0 "The Plebiscitary Republic"
 UKR_the_plebiscitary_republic_idea_desc:0 "Entirely constitutional and entirely unaccountable."
 UKR_the_permanent_campaign_idea:0 "The Permanent Campaign"
 UKR_the_permanent_campaign_idea_desc:0 "There is no governing phase. There is only the next vote."
 UKR_the_enemies_list_idea:0 "The Enemies List"
 UKR_the_enemies_list_idea_desc:0 "Each removal is popular. The cumulative effect is that opposition becomes a crime."
 UKR_the_national_democrats:0 "The National Democrats"
 UKR_the_national_democrats_desc:0 "Dissidents in their sixties who have waited thirty years to govern properly."
 UKR_the_national_democrats2:0 "Rukh in Government"
 UKR_the_national_democrats2_desc:0 "A coherent view of the country and no experience of administering anything."
 UKR_the_national_democrats3:0 "The National Idea"
 UKR_the_national_democrats3_desc:0 "Settled, unhurried, and after twenty years not worth arguing about."
 UKR_the_national_democrats4:0 "The Slow Work of Institutions"
 UKR_the_national_democrats4_desc:0 "Nothing here will ever win an election."
 UKR_the_national_democrats5:0 "The Diplomat's Republic"
 UKR_the_national_democrats5_desc:0 "Too useful to attack, too correct to denounce, too dull for any front page."
 UKR_the_national_democrats6:0 "The Patient Republic"
 UKR_the_national_democrats6_desc:0 "Nothing very interesting has happened for a very long time."
 UKR_the_rukh_inheritance_idea:0 "The Rukh Inheritance"
 UKR_the_rukh_inheritance_idea_desc:0 "Everything won between 1989 and 1991, administered ever since by the same men as before."
 UKR_the_chornovil_legacy_idea:0 "The Chornovil Legacy"
 UKR_the_chornovil_legacy_idea_desc:0 "A road accident in March 1999 that many have never accepted as one."
 UKR_the_law_on_language_idea:0 "The Law on Language"
 UKR_the_law_on_language_idea_desc:0 "The founding demand, and votes lost in nine oblasts for a generation."
 UKR_the_school_curriculum_idea:0 "The School Curriculum"
 UKR_the_school_curriculum_idea_desc:0 "The slowest instrument available and the only one that works."
 UKR_the_diaspora_idea:0 "The Diaspora Returns"
 UKR_the_diaspora_idea_desc:0 "They kept the language alive in the places their grandparents fled to."
 UKR_local_self_government_idea:0 "Local Self-Government"
 UKR_local_self_government_idea_desc:0 "The presidency gives away power on purpose, which nobody here has done before."
 UKR_the_civil_service_idea:0 "The Civil Service"
 UKR_the_civil_service_idea_desc:0 "Spectacularly boring, and the whole project in miniature."
 UKR_the_churches_reconciled_idea:0 "The Churches Reconciled"
 UKR_the_churches_reconciled_idea_desc:0 "The only politician any of them will sit in a room with."
 UKR_a_state_of_laws_idea:0 "A State of Laws"
 UKR_a_state_of_laws_idea_desc:0 "A statute here, an inspectorate there, a court that ruled against a minister and survived."
 UKR_the_courts_reformed_idea:0 "The Courts Reformed"
 UKR_the_courts_reformed_idea_desc:0 "Salaries high enough to make a bribe an insult."
 UKR_gradual_decommunization_idea:0 "Gradual Decommunization"
 UKR_gradual_decommunization_idea_desc:0 "Half the country will not notice it happening, which is how it survives."
 UKR_the_holodomor_recognized:0 "The Holodomor Recognized"
 UKR_the_holodomor_recognized_desc:0 "The one thing on the list he will not compromise about."
 UKR_the_council_of_europe_idea:0 "The Council of Europe"
 UKR_the_council_of_europe_idea_desc:0 "An obligation rather than a prize, which is why so few here have wanted it."
 UKR_the_osce_idea:0 "The OSCE Chairmanship"
 UKR_the_osce_idea_desc:0 "A reputation that is small, specific and unusually durable."
 UKR_the_general_assembly_idea:0 "The General Assembly"
 UKR_the_general_assembly_idea_desc:0 "Remembered as a man who ran a difficult room fairly."
 UKR_the_diplomats_republic_idea:0 "The Diplomat's Republic"
 UKR_the_diplomats_republic_idea_desc:0 "The highest achievement available to a state this size."
 UKR_the_distinctive_partnership_idea:0 "The Distinctive Partnership"
 UKR_the_distinctive_partnership_idea_desc:0 "He negotiated it once already and knows how far it can be pushed."
 UKR_the_friendship_treaty_idea:0 "The Treaty of Friendship"
 UKR_the_friendship_treaty_idea_desc:0 "Paper is not a defence. It is considerably better than nothing."
 UKR_the_fleet_partition_idea:0 "The Partition of the Fleet"
 UKR_the_fleet_partition_idea_desc:0 "A bad agreement arrived at by exhausting every alternative."
 UKR_the_quiet_decade_idea:0 "The Quiet Decade"
 UKR_the_quiet_decade_idea_desc:0 "Four percent a year, and an emigration rate that finally turns."
 UKR_the_generation_that_waits_idea:0 "The Generation That Waits"
 UKR_the_generation_that_waits_idea_desc:0 "Eighteen years, which is why nobody else was willing to start."

 ### POLITICAL - ONOPENKO AND MOROZ ###
 UKR_the_social_democratic_party:0 "The Social Democratic Party"
 UKR_the_social_democratic_party_desc:0 "A justice minister, then a supreme court chairman, and in between a presidential candidate who finished eighth and took it well. He is a lawyer by training and by temperament, and the party he leads is the one that means social democracy in the ordinary European sense rather than as a brand on a football club.\n\nNobody is frightened of him and nobody is inspired by him. In a country that has spent a decade being governed by people who are one or the other, that may be the rarest qualification available."
 UKR_the_lawyers_party:0 "The Lawyers' Party"
 UKR_the_lawyers_party_desc:0 "Its membership is drawn from the bar, the bench and the faculties, which makes it the best-drafted and worst-attended political organisation in the country. Every bill it produces survives constitutional review, which is more than can be said for anyone else's."
 UKR_the_trade_union_base:0 "The Trade Union Base"
 UKR_the_trade_union_base_desc:0 "Not the inherited federation with its sanatoria, but the newer independent unions in the mines and the railways. Smaller, poorer and considerably more difficult to buy."
 UKR_the_third_way:0 "The Third Way"
 UKR_the_third_way_desc:0 "Neither the planners nor the auction house. A market with a floor under it, which every other party in the chamber regards as either surrender or sabotage depending on where they sit."
 UKR_the_social_democrats_take_power:0 "The Social Democrats Take Power"
 UKR_the_social_democrats_take_power_desc:0 "A coalition government under a leader nobody objects to strongly enough to block. It is assembled in eleven days, which is a record, largely because none of the participants expect it to achieve anything."
 UKR_the_labour_code:0 "The Labour Code"
 UKR_the_labour_code_desc:0 "A new code replacing the Soviet one, negotiated line by line with the unions and the employers in the same room. It takes two years and it is the founding document of everything that follows."
 UKR_the_minimum_wage:0 "The Minimum Wage"
 UKR_the_minimum_wage_desc:0 "Set at a level the economists call cautious and the unions call insulting, and indexed. The caution is deliberate: a floor that survives the next downturn is worth more than one that has to be abandoned."
 UKR_social_insurance:0 "Social Insurance"
 UKR_social_insurance_desc:0 "Contributions from employer and employee into funds the treasury cannot raid. Unemployment, sickness, industrial injury. Unglamorous, actuarial, and the first thing a country needs before it can call itself one."
 UKR_the_pension_system:0 "The Pension System"
 UKR_the_pension_system_desc:0 "Three pillars: a state minimum, a mandatory funded tier and voluntary saving on top. It will not pay out properly for twenty-five years, which is why no government before this one has been willing to legislate it."
 UKR_collective_bargaining:0 "Collective Bargaining"
 UKR_collective_bargaining_desc:0 "Sectoral agreements with legal force, arbitration where they fail, and a strike law that permits strikes. Productivity does not fall. Several ministers had privately bet that it would."
 UKR_the_family_allowance:0 "The Family Allowance"
 UKR_the_family_allowance_desc:0 "Paid per child, to the mother, monthly, without means testing, because means testing costs more to administer than it saves. The birth rate moves half a point, which is not nothing in a country losing people."
 UKR_the_housing_programme:0 "The Housing Programme"
 UKR_the_housing_programme_desc:0 "Mortgage guarantees for the young, repairs to the panel blocks for everyone else, and municipal building for the rest. It is the largest line in the budget and the least discussed."
 UKR_the_health_service:0 "The Health Service"
 UKR_the_health_service_desc:0 "Primary care funded properly so that the hospitals stop being the first point of contact. Informal payments do not disappear; they halve, which is the only honest target anybody set."
 UKR_the_school_places:0 "The School Places"
 UKR_the_school_places_desc:0 "Rural schools kept open, teachers paid on the first of the month, and a curriculum that survives a change of government. It shows up in no statistic for eighteen years."
 UKR_the_supreme_court:0 "The Supreme Court"
 UKR_the_supreme_court_desc:0 "He knows this institution from the inside and knows exactly which of its powers matter. Tenure secured, jurisdiction clarified, and the administrative courts given the authority to rule against a ministry."
 UKR_legal_aid:0 "Legal Aid"
 UKR_legal_aid_desc:0 "A defence for anyone who cannot pay, in a country where the conviction rate has run above ninety-nine percent for as long as anyone has counted. The rate falls. Prosecutors call this a crisis."
 UKR_the_labour_tribunals:0 "The Labour Tribunals"
 UKR_the_labour_tribunals_desc:0 "Somewhere for a dismissed worker to go that is not a criminal court and not a bribe. Cheap, quick and busy from the first week."
 UKR_regional_equalization:0 "Regional Equalization"
 UKR_regional_equalization_desc:0 "Transfers from the industrial east and the capital to the western oblasts, formula-driven so that nobody has to negotiate them annually. It defuses a grievance that every populist in the country has been living on."
 UKR_small_business_support:0 "Small Business Support"
 UKR_small_business_support_desc:0 "Registration in a day, a simplified tax, and inspectorates that require a warrant. Two hundred thousand new registrations in the first year, most of them businesses that already existed and were hiding."
 UKR_the_employment_service:0 "The Employment Service"
 UKR_the_employment_service_desc:0 "Retraining that leads to a job rather than a certificate, run by people who have met an employer. It is the most boring institution in this document and it moves more lives than any of the others."
 UKR_the_european_social_model:0 "The European Social Model"
 UKR_the_european_social_model_desc:0 "Not the treaties, not the accession queue: the working-time directive, the health and safety framework, the equal treatment rules. Adopted because they are sensible rather than because Brussels asked."
 UKR_join_the_international:0 "Join the International"
 UKR_join_the_international_desc:0 "Full membership of the Socialist International, applied for on the strength of an actual programme rather than a rose on a letterhead. It is granted without argument, which quietly settles a question about who the real social democrats here are."
 UKR_the_nordic_example:0 "The Nordic Example"
 UKR_the_nordic_example_desc:0 "Delegations to Helsinki and Stockholm that come back with binders instead of speeches. Most of what is in them cannot be afforded. About a third of it can."
 UKR_a_decent_society:0 "A Decent Society"
 UKR_a_decent_society_desc:0 "Not a prosperous one, not a powerful one, not a model for anybody. A place where the wage arrives, the clinic is open, the court is honest more often than not and nobody has to emigrate to be treated like an adult."
 UKR_consensus_politics:0 "Consensus Politics"
 UKR_consensus_politics_desc:0 "Every major law passed with votes from at least one opposition faction, on purpose, because a reform that can be reversed by the next government is not a reform. It takes twice as long. It survives."
 UKR_nothing_spectacular:0 "Nothing Spectacular"
 UKR_nothing_spectacular_desc:0 "No revolutions, no poisonings, no men in tents, no tapes. Twelve years in which the most dramatic political event is a coalition reshuffle. Historians will find this period almost impossible to write about."
 UKR_the_ordinary_republic:0 "The Ordinary Republic"
 UKR_the_ordinary_republic_desc:0 "It does not lead Europe in anything. It is not the fastest-growing, the freest, the strongest or the most admired, and no other country studies it.\n\nIt is, by every measure that applies to the people living in it, a completely unremarkable European country, which is the single most ambitious thing anyone in Ukrainian politics has ever managed to be."
 UKR_the_socialist_party_of_ukraine:0 "The Socialist Party"
 UKR_the_socialist_party_of_ukraine_desc:0 "He stood up in the chamber in November and played the recordings that ended a presidency, which makes him the only politician of this generation who can say he brought a government down with evidence rather than a crowd.\n\nHe is an agronomist from Kyiv oblast who has been saying the same things since 1991 and has never once been caught taking anything. The left in this country has produced exactly one man like that."
 UKR_the_melnychenko_tapes:0 "The Tapes"
 UKR_the_melnychenko_tapes_desc:0 "A major of the state guard put a recorder under a sofa and handed the results to the one opposition leader he believed would not sell them. On the twenty-eighth of November he plays them in the chamber.\n\nHe could have traded them. Everybody assumed he would. That he did not is the entire basis of everything that follows."
 UKR_the_kaniv_four:0 "The Kaniv Four"
 UKR_the_kaniv_four_desc:0 "An agreement between four candidates to withdraw in favour of whichever of them polls best. It collapsed in 1999 in recrimination and farce. Rebuilt properly, with the arithmetic agreed in advance, it is the only mechanism that has ever united this opposition."
 UKR_the_socialists_take_power:0 "The Socialists Take Power"
 UKR_the_socialists_take_power_desc:0 "Not the communists, whom half the country will never vote for, and not the liberals, whom the other half blames for the nineties. The party in between, which has spent a decade being told it is too small to matter."
 UKR_the_agrarian_question:0 "The Agrarian Question"
 UKR_the_agrarian_question_desc:0 "Fifteen million people live in villages that were collectivised, de-collectivised on paper and then abandoned. They hold share certificates for land they cannot farm alone and cannot legally sell. Every government since 1991 has called this temporary."
 UKR_the_workers_charter:0 "The Workers' Charter"
 UKR_the_workers_charter_desc:0 "The right to organise, to bargain and to strike, written into law rather than left to the courts. The directors who spent the nineties paying in cabbage are informed that the arrangement has ended."
 UKR_the_sovereignty_of_parliament:0 "The Sovereignty of Parliament"
 UKR_the_sovereignty_of_parliament_desc:0 "He was speaker of this chamber and believes, with some evidence, that it is the only institution in the country that has ever constrained anybody. Powers move back to it from the presidency, permanently."
 UKR_permanent_neutrality:0 "Permanent Neutrality"
 UKR_permanent_neutrality_desc:0 "Non-bloc status written into the constitution. No alliance, no foreign bases, no expeditionary commitments. It is the position a clear majority of the country has held throughout and which no government has been willing to state plainly."
 UKR_defend_the_collective_farms:0 "Defend the Collective Farms"
 UKR_defend_the_collective_farms_desc:0 "The successor cooperatives are given machinery, credit and a guaranteed purchase price rather than being broken up into plots nobody can work. Efficiency falls. Depopulation stops."
 UKR_the_right_to_strike:0 "The Right to Strike"
 UKR_the_right_to_strike_desc:0 "Legal, protected and used, for the first time since the miners walked to Kyiv in 1993. Three major disputes in the first year, all settled, none of them by police."
 UKR_elect_the_governors:0 "Elect the Governors"
 UKR_elect_the_governors_desc:0 "Oblast heads chosen by their populations rather than appointed from the capital. It dismantles the administrative resource at a stroke and it means several oblasts will elect people this government cannot stand."
 UKR_no_foreign_bases:0 "No Foreign Bases"
 UKR_no_foreign_bases_desc:0 "The lease is not renewed and the notice period begins. It is the most dangerous sentence in the programme and the one it was elected on."
 UKR_the_village_and_the_factory:0 "The Village and the Factory"
 UKR_the_village_and_the_factory_desc:0 "The old alliance, stated openly rather than assumed: grain prices that keep the villages alive and wages that let the towns buy the grain. Each half is useless without the other and both are expensive."
 UKR_the_peoples_mandate:0 "The People's Mandate"
 UKR_the_peoples_mandate_desc:0 "Elected governors, recallable deputies and a neutrality written into the constitution. Nothing in this government rests on anything but a vote, which is exactly the vulnerability its opponents intend to use."
 UKR_the_land_is_not_for_sale:0 "The Land Is Not for Sale"
 UKR_the_land_is_not_for_sale_desc:0 "The moratorium made permanent by referendum rather than statute, so that no parliament can quietly lift it at four in the morning. Eleven million certificate holders vote for it by a margin nobody in the capital predicted."
 UKR_the_state_enterprises:0 "The State Enterprises"
 UKR_the_state_enterprises_desc:0 "The strategic sector taken back into public ownership and run, at last, by managers appointed for competence with a mandate to break even rather than to extract. Several of them do."
 UKR_the_recall_of_deputies:0 "The Recall of Deputies"
 UKR_the_recall_of_deputies_desc:0 "Any deputy may be removed mid-term by the district that elected him. It is used four times in the first convocation and threatened a hundred, which is where the effect lies."
 UKR_the_territorial_army:0 "The Territorial Army"
 UKR_the_territorial_army_desc:0 "A neutral country cannot rely on anybody, so it relies on everybody: battalions raised by oblast, trained at weekends, armed from depots we already have. It is cheap and it is a great many rifles."
 UKR_the_grain_reserve:0 "The Grain Reserve"
 UKR_the_grain_reserve_desc:0 "Silos filled against a bad harvest and a worse year, at a cost the finance ministry itemises every budget. We are a country that starved inside living memory. The line stays in."
 UKR_the_eight_hour_day:0 "The Eight-Hour Day"
 UKR_the_eight_hour_day_desc:0 "Enforced, with overtime paid at a penalty rate and inspectors who arrive without telephoning first. It is a hundred-year-old demand and this is the first Ukrainian government to actually mean it."
 UKR_the_social_constitution:0 "The Social Constitution"
 UKR_the_social_constitution_desc:0 "Employment, housing, healthcare and education written in as obligations of the state rather than aspirations. The lawyers warn that unenforceable rights discredit all rights. They are voted down."
 UKR_the_citizen_soldier:0 "The Citizen Soldier"
 UKR_the_citizen_soldier_desc:0 "Universal short service, reservist obligations to forty-five and a rifle association in every district. The professional officers hate it. It produces an army no invader can calculate."
 UKR_bread_and_work:0 "Bread and Work"
 UKR_bread_and_work_desc:0 "Two words, and between them about forty percent of the budget. Nobody is rich. Nobody queues, nobody is unemployed for long, and nobody under sixty remembers the country being like this."
 UKR_the_armed_people:0 "The Armed People"
 UKR_the_armed_people_desc:0 "Neutral, unallied, and considerably more trouble to invade than to leave alone. It is the whole of the defence doctrine and it fits on a postcard."
 UKR_the_social_state:0 "The Social State"
 UKR_the_social_state_desc:0 "Not socialism as the Soviet Union practised it and not the welfare capitalism of the Germans. Something assembled locally out of what the villages and the factories would actually accept, and consequently rather hard to export."
 UKR_a_country_that_feeds_itself:0 "A Country That Feeds Itself"
 UKR_a_country_that_feeds_itself_desc:0 "Grain, sunflower, sugar, meat and dairy, all domestic, all surplus. We were the breadbasket of an empire that starved us. There is a certain satisfaction in the accounts."
 UKR_socialism_with_a_ukrainian_face:0 "Socialism with a Ukrainian Face"
 UKR_socialism_with_a_ukrainian_face_desc:0 "It is poorer than it might have been. The shops carry less, the factories are older and the growth figures are read out with a certain defensiveness.\n\nIt is also a country where nobody is hungry, nobody is conscripted into anybody else's war and the man who brought down a president did it with a tape recorder instead of a crowd. He considers the trade to have been worth making."
 UKR_the_social_democrats:0 "The Social Democrats"
 UKR_the_social_democrats_desc:0 "Nobody is frightened of them and nobody is inspired by them."
 UKR_the_social_democrats2:0 "In Government"
 UKR_the_social_democrats2_desc:0 "Assembled in eleven days, largely because nobody expects it to achieve anything."
 UKR_the_social_democrats3:0 "The European Model"
 UKR_the_social_democrats3_desc:0 "Adopted because it is sensible rather than because Brussels asked."
 UKR_the_social_democrats4:0 "A Decent Society"
 UKR_the_social_democrats4_desc:0 "Not prosperous, not powerful, not a model for anybody."
 UKR_the_social_democrats5:0 "The Ordinary Republic"
 UKR_the_social_democrats5_desc:0 "Completely unremarkable, which is the most ambitious thing anyone here has managed."
 UKR_the_lawyers_party_idea:0 "The Lawyers' Party"
 UKR_the_lawyers_party_idea_desc:0 "Every bill it produces survives constitutional review."
 UKR_the_trade_union_base_idea:0 "The Trade Union Base"
 UKR_the_trade_union_base_idea_desc:0 "Smaller, poorer and considerably harder to buy."
 UKR_the_third_way_idea:0 "The Third Way"
 UKR_the_third_way_idea_desc:0 "A market with a floor under it."
 UKR_the_welfare_settlement:0 "The Labour Code"
 UKR_the_welfare_settlement_desc:0 "Negotiated line by line with the unions and the employers in the same room."
 UKR_the_welfare_settlement2:0 "The Pension System"
 UKR_the_welfare_settlement2_desc:0 "It will not pay out properly for twenty-five years."
 UKR_the_welfare_settlement3:0 "The Welfare Settlement"
 UKR_the_welfare_settlement3_desc:0 "The largest line in the budget and the least discussed."
 UKR_the_minimum_wage_idea:0 "The Minimum Wage"
 UKR_the_minimum_wage_idea_desc:0 "A floor that survives the next downturn is worth more than one that is abandoned."
 UKR_social_insurance_idea:0 "Social Insurance"
 UKR_social_insurance_idea_desc:0 "Funds the treasury cannot raid."
 UKR_collective_bargaining_idea:0 "Collective Bargaining"
 UKR_collective_bargaining_idea_desc:0 "Productivity did not fall. Several ministers had bet that it would."
 UKR_the_family_allowance_idea:0 "The Family Allowance"
 UKR_the_family_allowance_idea_desc:0 "Means testing costs more to administer than it saves."
 UKR_the_health_service_idea:0 "The Health Service"
 UKR_the_health_service_idea_desc:0 "Informal payments halve, which is the only honest target anybody set."
 UKR_the_school_places_idea:0 "The School Places"
 UKR_the_school_places_idea_desc:0 "It shows up in no statistic for eighteen years."
 UKR_the_supreme_court_idea:0 "The Supreme Court"
 UKR_the_supreme_court_idea_desc:0 "He knows which of its powers matter."
 UKR_legal_aid_idea:0 "Legal Aid"
 UKR_legal_aid_idea_desc:0 "The conviction rate falls. Prosecutors call this a crisis."
 UKR_the_labour_tribunals_idea:0 "The Labour Tribunals"
 UKR_the_labour_tribunals_idea_desc:0 "Not a criminal court and not a bribe."
 UKR_regional_equalization_idea:0 "Regional Equalization"
 UKR_regional_equalization_idea_desc:0 "It defuses a grievance every populist has been living on."
 UKR_small_business_idea:0 "Small Business"
 UKR_small_business_idea_desc:0 "Most of the new registrations are businesses that already existed and were hiding."
 UKR_the_employment_service_idea:0 "The Employment Service"
 UKR_the_employment_service_idea_desc:0 "Retraining that leads to a job rather than a certificate."
 UKR_the_international_idea:0 "The International"
 UKR_the_international_idea_desc:0 "It quietly settles a question about who the real social democrats here are."
 UKR_the_nordic_example_idea:0 "The Nordic Example"
 UKR_the_nordic_example_idea_desc:0 "Binders instead of speeches. About a third of it is affordable."
 UKR_consensus_politics_idea:0 "Consensus Politics"
 UKR_consensus_politics_idea_desc:0 "Twice as long to pass, and it survives."
 UKR_nothing_spectacular_idea:0 "Nothing Spectacular"
 UKR_nothing_spectacular_idea_desc:0 "Historians will find this period almost impossible to write about."
 UKR_the_socialist_party_idea:0 "The Socialist Party"
 UKR_the_socialist_party_idea_desc:0 "He could have traded the tapes. Everybody assumed he would."
 UKR_the_socialist_party_idea2:0 "The Socialists in Power"
 UKR_the_socialist_party_idea2_desc:0 "The party in between, told for a decade it was too small to matter."
 UKR_the_socialist_party_idea3:0 "The Social Constitution"
 UKR_the_socialist_party_idea3_desc:0 "Unenforceable rights discredit all rights, said the lawyers. They were voted down."
 UKR_the_socialist_party_idea4:0 "The Social State"
 UKR_the_socialist_party_idea4_desc:0 "Assembled out of what the villages and the factories would actually accept."
 UKR_the_socialist_party_idea5:0 "Socialism with a Ukrainian Face"
 UKR_the_socialist_party_idea5_desc:0 "Poorer than it might have been, and nobody is hungry."
 UKR_the_melnychenko_tapes_idea:0 "The Tapes"
 UKR_the_melnychenko_tapes_idea_desc:0 "A recorder under a sofa, handed to the one man who would not sell it."
 UKR_the_kaniv_four_idea:0 "The Kaniv Four"
 UKR_the_kaniv_four_idea_desc:0 "The arithmetic agreed in advance this time."
 UKR_the_agrarian_settlement:0 "The Agrarian Question"
 UKR_the_agrarian_settlement_desc:0 "Every government since 1991 has called this temporary."
 UKR_the_agrarian_settlement2:0 "The Collective Farms Defended"
 UKR_the_agrarian_settlement2_desc:0 "Efficiency falls. Depopulation stops."
 UKR_the_agrarian_settlement3:0 "The Land Is Not for Sale"
 UKR_the_agrarian_settlement3_desc:0 "No parliament can lift it quietly at four in the morning."
 UKR_the_workers_charter_idea:0 "The Workers' Charter"
 UKR_the_workers_charter_idea_desc:0 "The directors who paid in cabbage are informed the arrangement has ended."
 UKR_the_workers_charter_idea2:0 "The Right to Strike"
 UKR_the_workers_charter_idea2_desc:0 "Three disputes, all settled, none of them by police."
 UKR_the_workers_charter_idea3:0 "The Eight-Hour Day"
 UKR_the_workers_charter_idea3_desc:0 "Inspectors who arrive without telephoning first."
 UKR_the_sovereign_parliament:0 "The Sovereignty of Parliament"
 UKR_the_sovereign_parliament_desc:0 "The only institution here that has ever constrained anybody."
 UKR_the_sovereign_parliament2:0 "Elected Governors"
 UKR_the_sovereign_parliament2_desc:0 "It dismantles the administrative resource at a stroke."
 UKR_the_sovereign_parliament3:0 "The Recall of Deputies"
 UKR_the_sovereign_parliament3_desc:0 "Used four times and threatened a hundred, which is where the effect lies."
 UKR_armed_neutrality:0 "Permanent Neutrality"
 UKR_armed_neutrality_desc:0 "The position most of the country holds and no government would state."
 UKR_armed_neutrality2:0 "No Foreign Bases"
 UKR_armed_neutrality2_desc:0 "The most dangerous sentence in the programme, and the one it was elected on."
 UKR_armed_neutrality3:0 "The Territorial Army"
 UKR_armed_neutrality3_desc:0 "Cheap, and a great many rifles."
 UKR_the_village_and_the_factory_idea:0 "The Village and the Factory"
 UKR_the_village_and_the_factory_idea_desc:0 "Each half is useless without the other and both are expensive."
 UKR_the_peoples_mandate_idea:0 "The People's Mandate"
 UKR_the_peoples_mandate_idea_desc:0 "Nothing here rests on anything but a vote."
 UKR_the_state_enterprises_idea:0 "The State Enterprises"
 UKR_the_state_enterprises_idea_desc:0 "A mandate to break even rather than to extract. Several of them do."
 UKR_the_grain_reserve_idea:0 "The Grain Reserve"
 UKR_the_grain_reserve_idea_desc:0 "We are a country that starved inside living memory. The line stays in."
 UKR_the_citizen_soldier_idea:0 "The Citizen Soldier"
 UKR_the_citizen_soldier_idea_desc:0 "An army no invader can calculate."
 UKR_bread_and_work_idea:0 "Bread and Work"
 UKR_bread_and_work_idea_desc:0 "Two words, and about forty percent of the budget."
 UKR_the_armed_people_idea:0 "The Armed People"
 UKR_the_armed_people_idea_desc:0 "The whole defence doctrine, and it fits on a postcard."
 UKR_feeds_itself_idea:0 "A Country That Feeds Itself"
 UKR_feeds_itself_idea_desc:0 "We were the breadbasket of an empire that starved us."

 ### POLITICAL - THE FAR RIGHT ###
 UKR_the_nationalist_convention:0 "The Nationalist Convention"
 UKR_the_nationalist_convention_desc:0 "The Second Republic was assembled from everything the tent city could agree on, and it turns out that was very little. In a rented hall in Lviv, four movements that have spent a decade denouncing one another's methods settle on the only sentence they share: the men in Kyiv will never do it, and somebody else will have to."
 UKR_the_veterans_of_unso:0 "The Veterans of UNSO"
 UKR_the_veterans_of_unso_desc:0 "Men who fought in Transnistria, in Abkhazia and in Chechnya, and came home with a great deal of experience and nothing to do with it. They are disciplined in the ways that matter and undisciplined in all the others, and they answer to a man called Shkil, who is not a parliamentarian and has never pretended to be."
 UKR_the_social_national_party:0 "The Social-National Party"
 UKR_the_social_national_party_desc:0 "The party is the one part of the movement that fills out forms. It holds seats on the Galician councils, prints its own newspaper and turns up to elections, which its street-fighting allies regard as a kind of weakness. Its chairman regards them as a kind of liability, and both are right."
 UKR_the_brotherhood:0 "The Brotherhood"
 UKR_the_brotherhood_desc:0 "Orthodox, angry and remarkably well read. The Brotherhood's founder writes most of the movement's pamphlets, nearly all of them unprintable, and has the rare gift of alienating Kyiv, Moscow, Warsaw and Rome in a single sentence."
 UKR_the_hetmanate_circle:0 "The Hetmanate Circle"
 UKR_the_hetmanate_circle_desc:0 "A historian named Tereshchenko has spent years arguing that Skoropadsky's Hetmanate of 1918 was the last legitimate Ukrainian state and that the republic is an accident. His circle numbers a few dozen professors and a great many enthusiasts, and it supplies what the street cannot: a theory of government, and somebody to write the proclamation."
 UKR_the_street_muscle:0 "The Street Muscle"
 UKR_the_street_muscle_desc:0 "Football terraces, boxing gyms and the doormen of a hundred Kyiv nightclubs. They are useful in a crowd and more useful in a fight, and they arrive knowing which of the two they are attending."
 UKR_the_galician_base:0 "The Galician Base"
 UKR_the_galician_base_desc:0 "Lviv, Ternopil and Ivano-Frankivsk return nationalist councillors by margins that embarrass the centre. The party can book a hall, pay a band and turn out ten thousand people west of the Zbruch without persuading any of them of anything."
 UKR_the_militant_faith:0 "The Militant Faith"
 UKR_the_militant_faith_desc:0 "Sermons in a number of eastern-rite parishes now end with the movement's slogans, and a banner blessed at Easter can be carried into a riot by Whitsun. The movement has acquired a liturgy, which is a considerable advantage in a country where half the population still believes in the church."
 UKR_the_historians_manifesto:0 "The Historians' Manifesto"
 UKR_the_historians_manifesto_desc:0 "Forty pages, footnoted, arguing that the republic is a Soviet leftover and that Ukrainian statehood was born in 1918 with a hetman on a horse. Nobody on the street has read it. Everyone who signed it holds a university chair."
 UKR_the_street_and_the_ballot:0 "The Street and the Ballot"
 UKR_the_street_and_the_ballot_desc:0 "Lviv's party men and Kyiv's street fighters agree a division of labour: one side fills the squares, the other fills the seats, and neither is allowed to disown the other's work afterwards."
 UKR_the_altar_and_the_mace:0 "The Altar and the Mace"
 UKR_the_altar_and_the_mace_desc:0 "The church and the crown, or at least the historians' idea of it. The Brotherhood contributes the faith, the Circle contributes the mace, and between them they possess every ceremonial requirement of a government except votes."
 UKR_the_lviv_pact:0 "The Lviv Pact"
 UKR_the_lviv_pact_desc:0 "They sign in a cellar under a bookshop on Rynok Square, which is atmospheric and also the only room that would take all four delegations. The text runs to two pages. It commits nobody to anything except not to denounce the others until Kyiv has fallen."
 UKR_the_terraces_and_the_ultras:0 "The Terraces and the Ultras"
 UKR_the_terraces_and_the_ultras_desc:0 "Every stadium in the country has a section that answers to somebody, and the movement now knows whom to telephone. It is not politics, exactly, but it fills the pavement on the day."
 UKR_the_officers_circle:0 "The Officers' Circle"
 UKR_the_officers_circle_desc:0 "The armed forces have not been paid properly in a decade and have opinions about it. A few colonels, a few majors and one general of the missile forces begin to meet on Sundays in a garrison library, and take no notes."
 UKR_the_diaspora_donors:0 "The Diaspora Donors"
 UKR_the_diaspora_donors_desc:0 "Winnipeg, Cleveland and Melbourne have kept the flame for two generations and are delighted to be asked to keep it in cash. The money arrives through churches and credit unions, in sums small enough to be legal and large enough to be useful."
 UKR_the_western_councils:0 "The Western Councils"
 UKR_the_western_councils_desc:0 "The councils of Galicia pass resolutions renaming streets, raising flags and declaring the local police answerable to the region. Kyiv complains. Nothing happens, which is the lesson."
 UKR_the_torchlit_marches:0 "The Torchlit Marches"
 UKR_the_torchlit_marches_desc:0 "Torches, red-and-black flags, columns in step and cameras waiting. The marches are meant to be seen on television in the east, where they frighten people, and in the west, where they reassure them, and they manage both."
 UKR_the_barracks_conspiracy:0 "The Barracks Conspiracy"
 UKR_the_barracks_conspiracy_desc:0 "Enough of the Lviv garrison would now sooner take an order from the colonels than from the ministry, and the colonels have a list. It is not yet a plan. It is the material a plan is made from."
 UKR_the_quiet_money:0 "The Quiet Money"
 UKR_the_quiet_money_desc:0 "A man from the Dnipropetrovsk banks wishes to be helpful and does not wish to be named. He is hedging against every outcome, which is a compliment of a kind, and his money does not ask about the flag."
 UKR_the_council_majorities:0 "The Council Majorities"
 UKR_the_council_majorities_desc:0 "Nationalist majorities in seven oblast councils and a regional budget that can be redirected to pay for a militia. Legality has stopped being a constraint and become an asset: everything the movement does in the west is technically permitted."
 UKR_the_street_meets_the_barracks:0 "The Street Meets the Barracks"
 UKR_the_street_meets_the_barracks_desc:0 "For the first time the men in the square and the men in the garrison are in the same room. It goes better than either side expected, which worries both."
 UKR_the_money_and_the_mandate:0 "The Money and the Mandate"
 UKR_the_money_and_the_mandate_desc:0 "Funds from abroad, funds from Dnipropetrovsk and majorities across half the west. It is enough to hire a hall in every oblast centre and a lawyer in every town, and enough to keep going if the first attempt fails."
 UKR_the_republic_cannot_hold:0 "The Republic Cannot Hold"
 UKR_the_republic_cannot_hold_desc:0 "The Second Republic is run by a coalition that agrees on nothing except the removal of one man, and has now done it. The prime minister issues statements. The ministers issue counter-statements. The interior minister is quietly reading the Lviv Pact."
 UKR_seize_the_arsenals:0 "Seize the Arsenals"
 UKR_seize_the_arsenals_desc:0 "The great depots of the west, at Stryi, at Chortkiv and at Kolomyia, are guarded by conscripts who have not been properly fed in a month. The colonels have keys, and where they do not have keys, they have friends who do."
 UKR_take_the_television_centre:0 "Take the Television Centre"
 UKR_take_the_television_centre_desc:0 "A revolution is over when the announcer reads the proclamation, and every organiser in the movement knows it. The tower in Kyiv is guarded by eleven men and a vending machine."
 UKR_neutralise_the_interior_ministry:0 "Neutralise the Interior Ministry"
 UKR_neutralise_the_interior_ministry_desc:0 "The Berkut are the only force in the capital that could stop the march. They can be paid, persuaded or pre-empted, and the movement intends to try all three, in that order."
 UKR_the_march_on_kyiv:0 "The March on Kyiv"
 UKR_the_march_on_kyiv_desc:0 "Four columns, one from each movement, converge on the capital in the small hours of a Sunday. Nobody is certain there are enough of them. That is what the television centre is for."
 UKR_the_coup:0 "The Coup"
 UKR_the_coup_desc:0 "By breakfast the Second Republic is a memory and the colonels are on the steps of the Rada. The announcer reads the proclamation. The coalition that removed one president did not think to ask who would remove the next. The loyalists do not take it quietly, and the country splits in two."
 UKR_the_insurgent_vanguard:0 "The Insurgent Vanguard"
 UKR_the_insurgent_vanguard_desc:0 "He never wanted to be a parliamentarian, and has never sat in a chamber without wishing for a door that locked. Andriy Shkil has been to Chechnya, to Abkhazia and to the cells of Kyiv, and he regards the state as one more organisation to be captured, reorganised and put to use. The republic he intends to build will not need a capital. It will need a great many men who know how to carry rifles."
 UKR_the_volunteer_battalions:0 "The Volunteer Battalions"
 UKR_the_volunteer_battalions_desc:0 "A battalion needs a commander, a flag and somewhere to eat. The commander is usually a veteran, the flag is always the same and the place to eat is whichever restaurant will accept the movement's bill."
 UKR_arms_for_the_east:0 "Arms for the East"
 UKR_arms_for_the_east_desc:0 "Rifles cross borders more easily than men do. The ledgers are false, the crates are marked as agricultural equipment and the customs post at Sumy has learned not to open them."
 UKR_the_training_camps:0 "The Training Camps"
 UKR_the_training_camps_desc:0 "A summer camp in the Carpathians for boys of sixteen, a range in Zhytomyr Oblast for men of forty. The instructors learned their trade in Grozny and take no interest in anything the ministry teaches."
 UKR_the_smuggling_routes:0 "The Smuggling Routes"
 UKR_the_smuggling_routes_desc:0 "Every border has a road that appears on no map, and every road has a man who is paid by both sides. The movement takes them over one at a time and discovers that trafficking in rifles and trafficking in cigarettes are administered by the same people."
 UKR_the_deniable_war:0 "The Deniable War"
 UKR_the_deniable_war_desc:0 "Nothing is declared and nothing is signed. A man is seen in a uniform without insignia, a shipment goes missing, a village asks for help. Kyiv's official position is that it knows nothing, and for once this is very nearly the truth."
 UKR_partisans_of_the_kuban:0 "Partisans of the Kuban"
 UKR_partisans_of_the_kuban_desc:0 "The Kuban Cossack Host spoke Ukrainian until Moscow decided otherwise, and a surprising number of families in Krasnodar still sing the old songs at weddings. Where there are songs there is an audience, and where there is an audience there is a recruiter."
 UKR_the_kuban_rada:0 "The Kuban Rada"
 UKR_the_kuban_rada_desc:0 "A parliament of the Kuban was a real institution in 1918, for about a year. It is reconvened in a Kyiv hotel by twenty-three delegates, none of whom lives within four hundred miles of Krasnodar, and it has more legitimacy than most of its neighbours."
 UKR_the_kuban_peoples_republic:0 "The Kuban People's Republic"
 UKR_the_kuban_peoples_republic_desc:0 "It has a flag, a parliament and a constitution drafted by a retired history teacher. It does not yet have territory, which the movement regards as a detail."
 UKR_the_free_cossack_hosts:0 "The Free Cossack Hosts"
 UKR_the_free_cossack_hosts_desc:0 "The Zaporozhian Sich is a legend every schoolchild can recite, and the movement sees no reason to leave it as one. The new hosts drill at weekends, elect their own atamans and take their oaths on a sword rather than a constitution."
 UKR_the_don_atamans:0 "The Don Atamans"
 UKR_the_don_atamans_desc:0 "The Don was never Ukrainian, exactly, but the atamans of the lower river speak a dialect a Poltava peasant would follow, and their grandfathers fought Moscow in 1918. They will not be told what to be. They will accept being told who the enemy is."
 UKR_the_don_host_republic:0 "The Republic of the Don Host"
 UKR_the_don_host_republic_desc:0 "The atamans proclaim a republic in a village hall outside Novocherkassk and draft a flag within the hour. It is generally agreed that this is the easy part."
 UKR_the_ural_underground:0 "The Ural Underground"
 UKR_the_ural_underground_desc:0 "The Urals are mines, foundries and closed towns where nobody was ever asked what they wanted. Tatars, Bashkirs and Udmurts work the same shifts as everyone else, and the movement arrives at the shift change."
 UKR_the_idel_ural_committees:0 "The Idel-Ural Committees"
 UKR_the_idel_ural_committees_desc:0 "Six peoples, six languages and one grievance. A cultural society is founded in every capital from Kazan to Izhevsk, and each is allowed to believe it was the first."
 UKR_the_idel_ural_state:0 "The Idel-Ural State"
 UKR_the_idel_ural_state_desc:0 "The state declared in 1918 lasted a few months. Its successor is declared in a Kazan flat, with a flag, a draft constitution and a guest list of eleven."
 UKR_the_caspian_resistance:0 "The Caspian Resistance"
 UKR_the_caspian_resistance_desc:0 "From the Terek delta to the Kalmyk steppe, the Caspian shore is fishermen, oil workers and clan elders with one thing in common: a long memory of Moscow. Committees are set up in the harbours, and the movement waits to be needed."
 UKR_the_caspian_battalions:0 "The Caspian Battalions"
 UKR_the_caspian_battalions_desc:0 "Men who are asked to hold a district rather than take one. They wear whatever they find, carry whatever they are issued and answer to whoever bought the last round."
 UKR_the_caspian_republics:0 "The Caspian Republics"
 UKR_the_caspian_republics_desc:0 "If the mountains and the steppe ever break with Moscow, the movement will be waiting with a flag prepared for each, and a militia already sworn to it."
 UKR_the_militarised_republics:0 "The Militarised Republics"
 UKR_the_militarised_republics_desc:0 "Two republics, two armies and one banner. The Kuban and the Don are declared allies in the same breath as they are declared states, and their guards exchange officers before their governments exchange ambassadors."
 UKR_the_borderland_republics:0 "The Borderland Republics"
 UKR_the_borderland_republics_desc:0 "Idel-Ural and the Caspian are the movement's flanks, which also makes them its weakest links, and its planners know it. A common staff is established in the basement of a Kharkiv sports club."
 UKR_the_insurgent_republic:0 "The Insurgent Republic"
 UKR_the_insurgent_republic_desc:0 "There is no capital to speak of and very little bureaucracy, but there is a chain of command that runs on trust and a web of debts that runs on nothing else. What the movement has built is not a state and does not want to be one. It is a way of doing without."
 UKR_the_call_for_protection:0 "The Call for Protection"
 UKR_the_call_for_protection_desc:0 "A republic declares itself, is threatened and appeals for help. The appeal is drafted in Kyiv and signed in the republic's own hand, and it is a masterpiece of the form: sincere, urgent and legally sufficient."
 UKR_the_militia_law:0 "The Militia Law"
 UKR_the_militia_law_desc:0 "A law that legalises what has been happening for years: the right of any registered host to bear arms, to elect its officers and to refuse orders it does not care for. The general staff objects on principle and is overruled on practicality."
 UKR_the_oath_of_the_brotherhoods:0 "The Oath of the Brotherhoods"
 UKR_the_oath_of_the_brotherhoods_desc:0 "No treaty binds the republics to Kyiv, and none is needed. Every commander swears the same oath on the same sword before the same flag. It is the only law the confederation recognises, and it is enforced by the only method the confederation trusts."
 UKR_a_confederation_of_hosts:0 "A Confederation of Hosts"
 UKR_a_confederation_of_hosts_desc:0 "The hosts, the battalions and the republics meet at Zaporizhzhia in a common assembly for the first time, and discover that they are a country. It is a country with no ministry of finance, and an army larger than its treasury."
 UKR_the_confederation_of_free_republics:0 "The Confederation of Free Republics"
 UKR_the_confederation_of_free_republics_desc:0 "There is no central state to speak of. There are the republics, the hosts and the men with rifles, and it all holds together because nobody has ever thought of a way to take it apart. The Insurgent Vanguard never meant to build an empire. It built a habit."
 UKR_the_party_of_the_nation:0 "The Party of the Nation"
 UKR_the_party_of_the_nation_desc:0 "Oleh Tyahnybok is a physician by training and an organiser by temperament, and he learned early that a movement is a set of forms filled in correctly. He has a membership list, a hall in every district and a programme that fits on one page. He does not want a militia. He wants an apparatus, and after the coup, the apparatus is finally free to do what it was built for."
 UKR_the_mass_party:0 "The Mass Party"
 UKR_the_mass_party_desc:0 "Membership is opened to anybody who will pay the dues, wear the badge and attend the rallies. Within a year the party has more members than the army has officers, and the organisation department has a great many more forms than it has staff."
 UKR_universal_service:0 "Universal Service"
 UKR_universal_service_desc:0 "Every man of eighteen serves, and every man who has served is a reservist until fifty-five. The generals had asked for a longer conscription for years and now have it, and are learning what it is like to be given exactly what they asked for."
 UKR_the_language_law:0 "The Language Law"
 UKR_the_language_law_desc:0 "One state language, and the others tolerated where they must be. It is the simplest law the party has ever drafted, and the one that will be hardest to enforce east of the Dnipro."
 UKR_the_party_press:0 "The Party Press"
 UKR_the_party_press_desc:0 "A national daily, forty regional weeklies and a radio station in Ivano-Frankivsk that can be heard in Slovakia. The party's line appears on every newsstand in the country by six each morning, and is repeated by the taxi drivers by seven."
 UKR_the_officer_schools:0 "The Officer Schools"
 UKR_the_officer_schools_desc:0 "A new academy in Lviv, a new course at every existing one and a new syllabus with a chapter on history and one on loyalty. The old instructors are retired on generous pensions, and the new ones have never been anywhere near a war."
 UKR_the_national_curriculum:0 "The National Curriculum"
 UKR_the_national_curriculum_desc:0 "Every child in the country now learns the same history, in the same language, from the same book. It begins with Kyiv Rus, skips lightly over the last three hundred years and ends at the party congress."
 UKR_the_summer_camps:0 "The Summer Camps"
 UKR_the_summer_camps_desc:0 "Boys of twelve to sixteen learn to march, to shoot and to sing. The parents are generally in favour, because the camps are cheap and the food is good, and because nobody has yet asked what it is all for."
 UKR_the_national_reserve:0 "The National Reserve"
 UKR_the_national_reserve_desc:0 "Two million men on a register, most of whom have not held a rifle in years. It is on paper an army and in practice an inventory, and the party's planners are determined to turn one into the other."
 UKR_the_cult_of_the_nation:0 "The Cult of the Nation"
 UKR_the_cult_of_the_nation_desc:0 "Parades on the anniversary of every battle Ukrainians ever fought, and on several that they lost. The party discovers that a defeat, properly commemorated, is worth more than a victory."
 UKR_the_party_and_the_army:0 "The Party and the Army"
 UKR_the_party_and_the_army_desc:0 "Every regiment gets a political officer, and every political officer gets a party card. The generals are told that this is for their protection, and are not in a position to check."
 UKR_the_army_and_the_nation:0 "The Army and the Nation"
 UKR_the_army_and_the_nation_desc:0 "The national curriculum now feeds the reserve, and the reserve feeds the parade ground. A boy who starts at six will be on the register at eighteen and in the party by twenty."
 UKR_the_national_army:0 "The National Army"
 UKR_the_national_army_desc:0 "Eight hundred thousand men under arms, in a country that cannot afford four hundred thousand. The treasury protests. The party points out that a state which cannot feed its army has all the more reason to use it."
 UKR_the_ukrainian_national_front:0 "The Ukrainian National Front"
 UKR_the_ukrainian_national_front_desc:0 "The party's foreign department has a list of every nationalist movement in eastern and central Europe that holds a seat or a ministry, and it has been writing to them for years. The Front is not an alliance, exactly. It is an invitation, and a declaration of what will happen to states that decline it."
 UKR_the_gathering_of_the_lands:0 "The Gathering of the Lands"
 UKR_the_gathering_of_the_lands_desc:0 "It is an old formula, borrowed from Moscow, and the party sees no reason to give it back. Every territory where Ukrainians live, or ever lived, or are said to have lived, is to be identified, surveyed and claimed, and the claims are to be presented in order."
 UKR_the_ruthenian_question:0 "The Ruthenian Question"
 UKR_the_ruthenian_question_desc:0 "Ukrainians on both sides of the Carpathians were once one people, and in the Presov region of Slovakia several tens of thousands still say so. The party opens an office in Uzhhorod, prints a map and writes a letter."
 UKR_the_lemko_lands:0 "The Lemko Lands"
 UKR_the_lemko_lands_desc:0 "The Lemkos were driven from their villages in 1947 and scattered across western Poland, and their descendants keep the memory alive in dozens of small associations. The party does not intend to ask them what they want; it intends to ask Warsaw where the border ought to run."
 UKR_the_western_ultimatum:0 "The Western Ultimatum"
 UKR_the_western_ultimatum_desc:0 "Two notes are delivered on the same afternoon, one to Bratislava and one to Warsaw. They are courteous, precise and impossible to accept."
 UKR_the_sloboda_claim:0 "The Sloboda Claim"
 UKR_the_sloboda_claim_desc:0 "Belgorod, Kursk and Voronezh were settled by Ukrainian colonists, and their oldest towns have Ukrainian names and Ukrainian churches. The party's historians produce a volume on the subject in eleven weeks."
 UKR_the_kuban_and_the_don:0 "The Kuban and the Don"
 UKR_the_kuban_and_the_don_desc:0 "The Black Sea Cossacks were moved to the Kuban by an empress and have been telling everyone they are Ukrainian ever since. The Don is less certain, but the party has never allowed uncertainty to interfere with a map."
 UKR_the_eastern_army_groups:0 "The Eastern Army Groups"
 UKR_the_eastern_army_groups_desc:0 "Three army groups take up positions along the border from Sumy to Luhansk. The exercises are described as routine, and are conducted with live ammunition."
 UKR_the_eastern_ultimatum:0 "The Eastern Ultimatum"
 UKR_the_eastern_ultimatum_desc:0 "The note runs to nine pages, and every one of them is about a different border. Moscow reads it as a joke until it reads the last page, which is about a date."
 UKR_the_buffer_states:0 "The Buffer States"
 UKR_the_buffer_states_desc:0 "A great power needs a belt of small states that owe it something. The party's planners look at Belarus and Moldova and see two of them, and cannot understand why the neighbours have not yet noticed."
 UKR_the_polesian_march:0 "The Polesian March"
 UKR_the_polesian_march_desc:0 "The marshes of Polesia have never had a frontier that made sense, and the party proposes to give them one. The delegation to Minsk is polite and well armed."
 UKR_the_bessarabian_march:0 "The Bessarabian March"
 UKR_the_bessarabian_march_desc:0 "The Budjak has a Ukrainian majority, the left bank a Russian garrison and the government of Moldova a great deal of worry. The party offers to relieve it of at least one of the three."
 UKR_greater_ukraine:0 "Greater Ukraine"
 UKR_greater_ukraine_desc:0 "The atlas in the party's headquarters is a masterpiece of the cartographer's art. It shows a country that reaches from the Vistula to the Don and from the Pripet to the Black Sea, and it hangs on the wall behind the chairman's desk where every visitor must look at it."
 UKR_one_language_one_people_one_state:0 "One Language, One People, One State"
 UKR_one_language_one_people_one_state_desc:0 "The slogan was on the first pamphlet the party ever printed, and it is on the last. Nobody remembers who wrote it. Everybody remembers the tenth anniversary, when it was chanted by four hundred thousand people in Independence Square and the chairman did not have to say a word."
 UKR_the_nationalist_convention_idea:0 "The Nationalist Convention"
 UKR_the_nationalist_convention_idea_desc:0 "Four movements, one hall and a shared resentment."
 UKR_the_street_muscle_idea:0 "Street Muscle"
 UKR_the_street_muscle_idea_desc:0 "Useful right up until the day they are not."
 UKR_the_historians_manifesto_idea:0 "The Historians' Manifesto"
 UKR_the_historians_manifesto_idea_desc:0 "Footnotes as a form of government."
 UKR_the_street_and_the_ballot_idea:0 "The Street and the Ballot"
 UKR_the_street_and_the_ballot_idea_desc:0 "One side fills the squares and the other fills the seats."
 UKR_the_united_right_idea:0 "The United Right"
 UKR_the_united_right_idea_desc:0 "They have agreed on a date and disagreed about everything after it."
 UKR_the_united_right_idea2:0 "The United Right"
 UKR_the_united_right_idea2_desc:0 "The pact holds, for exactly as long as the list of enemies does."
 UKR_the_united_right_idea3:0 "The United Right"
 UKR_the_united_right_idea3_desc:0 "Victory has made the alliance unnecessary, which is the most dangerous thing that can happen to one."
 UKR_the_terrace_networks_idea:0 "The Terrace Networks"
 UKR_the_terrace_networks_idea_desc:0 "Ten thousand men who can be on a street corner in an hour."
 UKR_the_officers_circle_idea:0 "The Officers' Circle"
 UKR_the_officers_circle_idea_desc:0 "They take no notes, and they remember everything."
 UKR_the_diaspora_money_idea:0 "The Diaspora Money"
 UKR_the_diaspora_money_idea_desc:0 "Sent by people who have never had to live with the result."
 UKR_the_quiet_money_idea:0 "The Quiet Money"
 UKR_the_quiet_money_idea_desc:0 "It will follow whoever wins."
 UKR_the_republic_paralysed:0 "The Paralysed Republic"
 UKR_the_republic_paralysed_desc:0 "A cabinet of eleven parties and a majority for nothing."
 UKR_the_arsenals_seized_idea:0 "The Seized Arsenals"
 UKR_the_arsenals_seized_idea_desc:0 "Soviet stockpiles, under new management."
 UKR_the_national_directory:0 "The National Directory"
 UKR_the_national_directory_desc:0 "Nobody voted for it, which is the whole point."
 UKR_the_insurgent_vanguard_idea:0 "The Insurgent Vanguard"
 UKR_the_insurgent_vanguard_idea_desc:0 "The state is one more organisation to be captured."
 UKR_the_insurgent_vanguard_idea2:0 "The Insurgent Vanguard"
 UKR_the_insurgent_vanguard_idea2_desc:0 "A movement that has learned to win without ever declaring anything."
 UKR_the_insurgent_vanguard_idea3:0 "The Insurgent Vanguard"
 UKR_the_insurgent_vanguard_idea3_desc:0 "It never became a government. It became a habit."
 UKR_the_volunteer_battalions_idea:0 "The Volunteer Battalions"
 UKR_the_volunteer_battalions_idea_desc:0 "They have their own flags, their own cooks and their own opinion of the general staff."
 UKR_arms_for_the_east_idea:0 "Arms for the East"
 UKR_arms_for_the_east_idea_desc:0 "The crates are marked as agricultural equipment."
 UKR_the_training_camps_idea:0 "The Training Camps"
 UKR_the_training_camps_idea_desc:0 "The instructors learned their trade in Grozny."
 UKR_the_smuggling_routes_idea:0 "The Smuggling Routes"
 UKR_the_smuggling_routes_idea_desc:0 "The same people carry the rifles and the cigarettes."
 UKR_the_deniable_war_idea:0 "The Deniable War"
 UKR_the_deniable_war_idea_desc:0 "Kyiv knows nothing, and for once it is nearly telling the truth."
 UKR_the_free_hosts_idea:0 "The Free Hosts"
 UKR_the_free_hosts_idea_desc:0 "Every ataman is elected, and every ataman may be replaced."
 UKR_the_militarised_republics_idea:0 "The Militarised Republics"
 UKR_the_militarised_republics_idea_desc:0 "Two armies and one banner."
 UKR_the_borderland_republics_idea:0 "The Borderland Republics"
 UKR_the_borderland_republics_idea_desc:0 "A common staff in the basement of a sports club."
 UKR_the_militia_law_idea:0 "The Militia Law"
 UKR_the_militia_law_idea_desc:0 "Any registered host may bear arms and elect its officers, and refuse the rest."
 UKR_the_oath_idea:0 "The Oath of the Brotherhoods"
 UKR_the_oath_idea_desc:0 "The only law the confederation recognises."
 UKR_republic_of_the_host_idea:0 "Republic of the Host"
 UKR_republic_of_the_host_idea_desc:0 "Sworn to the same sword as everybody else."
 UKR_the_confederation_idea:0 "The Confederation of Free Republics"
 UKR_the_confederation_idea_desc:0 "Nobody has ever found a way to take it apart."
 UKR_the_party_of_the_nation_idea:0 "The Party of the Nation"
 UKR_the_party_of_the_nation_idea_desc:0 "A hall in every district and a programme on a single page."
 UKR_the_party_of_the_nation_idea2:0 "The Party of the Nation"
 UKR_the_party_of_the_nation_idea2_desc:0 "The apparatus has learned to feed itself."
 UKR_the_party_of_the_nation_idea3:0 "The Party of the Nation"
 UKR_the_party_of_the_nation_idea3_desc:0 "It has become impossible to say where the party ends."
 UKR_the_mass_party_idea:0 "The Mass Party"
 UKR_the_mass_party_idea_desc:0 "More members than the army has officers."
 UKR_universal_service_idea:0 "Universal Service"
 UKR_universal_service_idea_desc:0 "Every man of eighteen, and every man who has served until fifty-five."
 UKR_the_language_law_idea:0 "The Language Law"
 UKR_the_language_law_idea_desc:0 "The simplest law the party has ever drafted."
 UKR_the_party_press_idea:0 "The Party Press"
 UKR_the_party_press_idea_desc:0 "The line is on every newsstand by six and in every taxi by seven."
 UKR_the_officer_schools_idea:0 "The Officer Schools"
 UKR_the_officer_schools_idea_desc:0 "A chapter on history and a chapter on loyalty."
 UKR_the_national_curriculum_idea:0 "The National Curriculum"
 UKR_the_national_curriculum_idea_desc:0 "One history, one language, one book."
 UKR_the_summer_camps_idea:0 "The Summer Camps"
 UKR_the_summer_camps_idea_desc:0 "The food is good and nobody asks what it is for."
 UKR_the_national_reserve_idea:0 "The National Reserve"
 UKR_the_national_reserve_idea_desc:0 "An army on paper and an inventory in practice."
 UKR_the_cult_of_the_nation_idea:0 "The Cult of the Nation"
 UKR_the_cult_of_the_nation_idea_desc:0 "A defeat, properly commemorated, is worth more than a victory."
 UKR_the_national_army_idea:0 "The National Army"
 UKR_the_national_army_idea_desc:0 "The treasury protests; the party points out that an army that cannot be fed must be used."
 UKR_the_national_front_idea:0 "The Ukrainian National Front"
 UKR_the_national_front_idea_desc:0 "Not an alliance so much as an invitation."
 UKR_the_gathering_idea:0 "The Gathering of the Lands"
 UKR_the_gathering_idea_desc:0 "Every claim to be presented, in order."
 UKR_the_eastern_army_groups_idea:0 "The Eastern Army Groups"
 UKR_the_eastern_army_groups_idea_desc:0 "The exercises are routine and are conducted with live ammunition."
 UKR_the_buffer_states_idea:0 "The Buffer States"
 UKR_the_buffer_states_idea_desc:0 "A belt of small states that owe us something."
 UKR_greater_ukraine_idea:0 "Greater Ukraine"
 UKR_greater_ukraine_idea_desc:0 "The atlas hangs behind the chairman's desk where every visitor must look at it."
 UKR_the_one_state_idea:0 "One Language, One People, One State"
 UKR_the_one_state_idea_desc:0 "The slogan on the first pamphlet, and on the last."
 UKR_andriy_shkil:0 "Andriy Shkil"
 UKR_oleh_tyahnybok:0 "Oleh Tyahnybok"
 UKR_send_volunteers_kuban:0 "Send Volunteers to the Kuban"
 UKR_send_volunteers_kuban_desc:0 "A dozen men with a rented minibus and a good reason to be in Krasnodar. They will be visitors, and then residents, and then a committee."
 UKR_fund_partisans_kuban:0 "Fund the Kuban Partisans"
 UKR_fund_partisans_kuban_desc:0 "Cash in envelopes, delivered by a man who does not stay for the receipt. It buys leaflets, a printing press and the loyalty of a few dozen men who are owed money."
 UKR_stir_separatism_kuban:0 "Stir Kuban Separatism"
 UKR_stir_separatism_kuban_desc:0 "The old grievances are dusted off: the abolition of the Host, the famine of 1932, the closed schools. All that is needed is a spokesman, and one has been found."
 UKR_proclaim_republic_kuban:0 "Proclaim the Kuban People's Republic"
 UKR_proclaim_republic_kuban_desc:0 "The republic is declared from a balcony in Krasnodar to a crowd of four hundred. Exactly one government recognises it at once."
 UKR_answer_the_call_kuban:0 "Answer the Kuban's Call"
 UKR_answer_the_call_kuban_desc:0 "The republic has asked for protection, and the request is in the proper form. It would be discourteous to refuse."
 UKR_ins_send_kuban_tt:0 "Insurgency in the Kuban rises by §G8§!."
 UKR_ins_fund_kuban_tt:0 "Insurgency in the Kuban rises by §G6§!. Russia loses §R0.5%§! stability."
 UKR_ins_stir_kuban_tt:0 "Insurgency in the Kuban rises by §G15§!, and a separatist movement takes shape."
 UKR_ins_proclaim_kuban_tt:0 "The Kuban People's Republic is created as a §Ypuppet§! of Ukraine, without a declaration of war."
 UKR_ins_answer_kuban_tt:0 "Ukraine gains a war goal against Russia."
 UKR_insurgency_25_tt_kuban:0 "Insurgency in the Kuban is at least §Y25§!."
 UKR_insurgency_60_tt_kuban:0 "Insurgency in the Kuban is at least §Y60§!."
 UKR_insurgency_75_tt_kuban:0 "Insurgency in the Kuban is at least §Y75§!."
 UKR_separatism_tt_kuban:0 "Separatism has been stirred in the Kuban."
 UKR_send_volunteers_don:0 "Send Volunteers to the Don"
 UKR_send_volunteers_don_desc:0 "Boys from Zaporizhzhia go north to visit their cousins on the Don, a story nobody expects the border guards to believe. They are not asked to."
 UKR_fund_partisans_don:0 "Fund the Don Partisans"
 UKR_fund_partisans_don_desc:0 "The atamans' treasury has never been fuller than it is this month, and nobody at the Host can quite explain why."
 UKR_stir_separatism_don:0 "Stir Don Separatism"
 UKR_stir_separatism_don_desc:0 "The Don has its own memory of 1918 and of the years that followed, and the men who were taught to forget it remember quickly when asked in the right accent."
 UKR_proclaim_republic_don:0 "Proclaim the Republic of the Don Host"
 UKR_proclaim_republic_don_desc:0 "The atamans assemble in a village hall outside Novocherkassk and proclaim a republic. The flag has been ready for a year."
 UKR_answer_the_call_don:0 "Answer the Don's Call"
 UKR_answer_the_call_don_desc:0 "The Host has asked for help against the men who would disband it. The appeal is signed by every ataman in the republic."
 UKR_ins_send_don_tt:0 "Insurgency in the Don rises by §G8§!."
 UKR_ins_fund_don_tt:0 "Insurgency in the Don rises by §G6§!. Russia loses §R0.5%§! stability."
 UKR_ins_stir_don_tt:0 "Insurgency in the Don rises by §G15§!, and a separatist movement takes shape."
 UKR_ins_proclaim_don_tt:0 "The Republic of the Don Host is created as a §Ypuppet§! of Ukraine, without a declaration of war."
 UKR_ins_answer_don_tt:0 "Ukraine gains a war goal against Russia."
 UKR_insurgency_25_tt_don:0 "Insurgency in the Don is at least §Y25§!."
 UKR_insurgency_60_tt_don:0 "Insurgency in the Don is at least §Y60§!."
 UKR_insurgency_75_tt_don:0 "Insurgency in the Don is at least §Y75§!."
 UKR_separatism_tt_don:0 "Separatism has been stirred in the Don."
 UKR_send_volunteers_idelural:0 "Send Volunteers to the Volga"
 UKR_send_volunteers_idelural_desc:0 "Students, engineers and a few retired officers take the night train to Kazan, each with a different reason and the same luggage."
 UKR_fund_partisans_idelural:0 "Fund the Idel-Ural Partisans"
 UKR_fund_partisans_idelural_desc:0 "Six peoples, six treasuries, one envelope each. The accountants are told never to add up the totals."
 UKR_stir_separatism_idelural:0 "Stir Idel-Ural Separatism"
 UKR_stir_separatism_idelural_desc:0 "The state of 1918 is remembered by historians, by exiles and, increasingly, by schoolteachers who have been sent the right pamphlets."
 UKR_proclaim_republic_idelural:0 "Proclaim the Idel-Ural State"
 UKR_proclaim_republic_idelural_desc:0 "The state is proclaimed a second time, in Kazan, before delegates of all six peoples and an agenda nobody expects to finish."
 UKR_answer_the_call_idelural:0 "Answer Idel-Ural's Call"
 UKR_answer_the_call_idelural_desc:0 "Six delegations have signed one appeal for protection. It is the first time they have agreed on anything, and it would be rude to waste it."
 UKR_ins_send_idelural_tt:0 "Insurgency in Idel-Ural rises by §G8§!."
 UKR_ins_fund_idelural_tt:0 "Insurgency in Idel-Ural rises by §G6§!. Russia loses §R0.5%§! stability."
 UKR_ins_stir_idelural_tt:0 "Insurgency in Idel-Ural rises by §G15§!, and a separatist movement takes shape."
 UKR_ins_proclaim_idelural_tt:0 "The Idel-Ural State is created as a §Ypuppet§! of Ukraine, without a declaration of war."
 UKR_ins_answer_idelural_tt:0 "Ukraine gains a war goal against Russia."
 UKR_insurgency_25_tt_idelural:0 "Insurgency in Idel-Ural is at least §Y25§!."
 UKR_insurgency_60_tt_idelural:0 "Insurgency in Idel-Ural is at least §Y60§!."
 UKR_insurgency_75_tt_idelural:0 "Insurgency in Idel-Ural is at least §Y75§!."
 UKR_separatism_tt_idelural:0 "Separatism has been stirred in Idel-Ural."
 UKR_send_volunteers_caucasus:0 "Send Volunteers to the Highlands"
 UKR_send_volunteers_caucasus_desc:0 "Veterans of the Chechen wars need no introduction in the mountains, only a guide. They arrive as shepherds, hunters and pilgrims, and none of them has a return ticket."
 UKR_fund_partisans_caucasus:0 "Fund the Highland Partisans"
 UKR_fund_partisans_caucasus_desc:0 "Every valley has a clan, every clan has a feud and every feud has a price. The movement pays for the ones that point north."
 UKR_stir_separatism_caucasus:0 "Stir Highland Separatism"
 UKR_stir_separatism_caucasus_desc:0 "The Mountainous Republic was proclaimed in 1918 and crushed within three years. Its anniversary is quietly declared a holiday in a dozen mountain villages."
 UKR_proclaim_republic_caucasus:0 "Proclaim the Mountainous Republic"
 UKR_proclaim_republic_caucasus_desc:0 "The republic is proclaimed for the second time in a century, in a village whose name the Russian maps spell differently. The old declaration is read aloud and nobody argues with the date."
 UKR_answer_the_call_caucasus:0 "Answer the Highlands' Call"
 UKR_answer_the_call_caucasus_desc:0 "The council of elders has asked for protection from the men who would disband it, in a letter that quotes the 1918 declaration at length."
 UKR_the_brotherhoods_hour:0 "The Brotherhood's Hour"
 UKR_the_brotherhoods_hour_desc:0 "The other three movements wanted a country. The Brotherhood wanted a Christendom, and has been patient enough to let them build the first one for it. The founder walks into the president's office, crosses himself, and asks, courteously, which of the portraits he is expected to remove."
 UKR_the_confessional_state:0 "The Confessional State"
 UKR_the_confessional_state_desc:0 "The constitution is revised to recognise the Orthodox faith as the foundation of the state, which takes about an afternoon. The harder part is deciding which of the three Orthodox churches in Ukraine the foundation is supposed to be, a question the Brotherhood answers by declining to consult any of them."
 UKR_the_parish_brigades:0 "The Parish Brigades"
 UKR_the_parish_brigades_desc:0 "Every parish with a priest who owns a loud voice and a list of young men raises a company. They drill in the churchyard after the liturgy, carry icons on their rucksacks and are, against all expectation, in very good order."
 UKR_the_monastery_schools:0 "The Monastery Schools"
 UKR_the_monastery_schools_desc:0 "The curriculum is returned to the monasteries, which have been waiting several centuries for the opportunity. Pupils learn Church Slavonic, the lives of the saints and arithmetic, in that order of importance and, regrettably, that order of quality."
 UKR_the_purge_of_the_rootless:0 "The Purge of the Rootless"
 UKR_the_purge_of_the_rootless_desc:0 "Sectarians, rationalists, an alarming number of Lutherans and one man who ran a yoga studio are invited to reconsider their positions. The invitations are delivered by the Parish Brigades in the early hours, and the Brotherhood's courts record every one of them as voluntary."
 UKR_the_law_of_the_fast:0 "The Law of the Fast"
 UKR_the_law_of_the_fast_desc:0 "Two hundred days of the year are now fasts, and the state canteens, the army and the tax office observe all of them. Output holds up surprisingly well. Nobody in the ministries has ever been so punctual, or so hungry."
 UKR_the_holy_censors:0 "The Holy Censors"
 UKR_the_holy_censors_desc:0 "A board of clergymen and retired schoolmasters reads everything printed in the republic, including, to their credit, the instructions on the tinned fish. A great deal is withdrawn, little is added, and the television schedule is now mostly bells."
 UKR_kyiv_not_moscow:0 "Kyiv, Not Moscow"
 UKR_kyiv_not_moscow_desc:0 "Moscow has called itself the Third Rome for five hundred years. The Brotherhood notes that Kyiv was baptised six hundred years before Moscow existed and that the claim of the older city is therefore, as a matter of simple chronology, better. The Patriarchate finds this tasteless. The Brotherhood finds the Patriarchate tasteless."
 UKR_the_one_church:0 "The One Church"
 UKR_the_one_church_desc:0 "The three Ukrainian Orthodox churches are summoned to Kyiv and given a very short time in which to become one. The result is a single, canonical, autocephalous Church of the Rus, unrecognised by Moscow, Constantinople and nearly all of the clergy it governs, but possessed of a very good building."
 UKR_the_brotherhood_courts:0 "The Brotherhood Courts"
 UKR_the_brotherhood_courts_desc:0 "Magistrates are replaced by elders, and the codes by a very old book. Sentences are swift, public and almost always accompanied by a lecture. Crime does fall, though the Brotherhood has not yet reached a view on whether this counts as a statistic or a miracle."
 UKR_the_sworn_brothers:0 "The Sworn Brothers"
 UKR_the_sworn_brothers_desc:0 "A volunteer who takes the oath is a brother for life and, in practical terms, for the duration of the war. They are not paid much, but they are fed, blessed and addressed by title, which turns out to be the most effective morale measure the army has ever tried."
 UKR_the_christ_loving_host:0 "The Christ-Loving Host"
 UKR_the_christ_loving_host_desc:0 "The title is borrowed from the old chronicles, and so is the army's idea of discipline. Regiments take the names of saints, officers wear a cross on the collar and the chaplain has a vote at the staff table, though nobody will say which kind."
 UKR_the_arsenal_of_the_faith:0 "The Arsenal of the Faith"
 UKR_the_arsenal_of_the_faith_desc:0 "Factories in Dnipro, Kharkiv and Mykolaiv have their shop floors consecrated, their directors confirmed and their output targets reissued as vows. The rifles are the same rifles as before. They are, however, now blessed, which the sergeants point out costs nothing."
 UKR_the_holy_war_doctrine:0 "The Holy War Doctrine"
 UKR_the_holy_war_doctrine_desc:0 "The general staff is informed that the war is holy, which shortens most of the planning. Attacks are to be pressed, retreats are to be called repositioning and the Chief Chaplain is to be consulted before any plan involving a river."
 UKR_the_banner_of_saint_michael:0 "The Banner of Saint Michael"
 UKR_the_banner_of_saint_michael_desc:0 "The archangel is the patron of Kyiv and of anyone who has ever been in a fight there, and his banner is carried through Independence Square at the head of the first parade. Foreign attachés, who have seen a good many parades, say that this is the first one they would not like to meet."
 UKR_the_idea_of_rus:0 "The Idea of Rus"
 UKR_the_idea_of_rus_desc:0 "Ukraine, Belarus and Russia were never three peoples, the Brotherhood argues, but one baptised people with three post offices, and Kyiv is where the first one stood. It is a kind of nationalism that does not stop at the border, because in its telling the border is the error."
 UKR_the_primary_chronicle:0 "The Primary Chronicle"
 UKR_the_primary_chronicle_desc:0 "Nestor's chronicle becomes the state's founding document and a compulsory text in every school. It is a pleasant surprise to the pupils to discover that the early history of their country contains so many sieges, and an equal surprise to the historians to discover that it is now a matter of policy."
 UKR_the_belarusian_brothers:0 "The Belarusian Brothers"
 UKR_the_belarusian_brothers_desc:0 "Delegations are sent to Minsk, Vitebsk and Polotsk with icons, greetings and a map. The Belarusians are polite and eat what is offered, and nobody on the Ukrainian side is certain whether this counts as consent."
 UKR_the_lost_principalities:0 "The Lost Principalities"
 UKR_the_lost_principalities_desc:0 "Polotsk, Turov, Smolensk, Chernihiv and Pereyaslavl are put on a map, in the colours of the Rus, beside the borders in force. The new map is sent to every school, ministry and embassy. The Belarusian lands are the first to be marked as ours, with the rest of the principalities to follow."
 UKR_the_veche:0 "The Veche"
 UKR_the_veche_desc:0 "Novgorod and Kyiv both had a bell that summoned the free men, and the Republic restores it. Once a month the elders of every guild, parish and host are called to the square to shout their opinions at the president. He is obliged to listen, and, in the better months, to be persuaded."
 UKR_the_princes_court:0 "The Prince's Court"
 UKR_the_princes_court_desc:0 "Under the throne a court is assembled in the old style, with a seneschal, a treasurer and a stolnik, who sets the table. None of them has any qualification except a fondness for the period, and they have all worn their costumes to the interview."
 UKR_the_conciliar_host:0 "The Conciliar Host"
 UKR_the_conciliar_host_desc:0 "The militia is raised by the Veche, in the old way, and every company elects its own captain. The captains are chosen on merit, with the occasional exception for a loud voice, and the resulting army is notable for the unusual ease with which it understands the orders it gives itself."
 UKR_the_druzhina:0 "The Druzhina"
 UKR_the_druzhina_desc:0 "The prince's retinue is revived as a standing guard, with a rank for the seniors and a hall for the juniors. They are paid in land and in honour, which in practice means they are paid very little. They have not noticed."
 UKR_the_western_marches:0 "The Western Marches"
 UKR_the_western_marches_desc:0 "The old land of the Rus did not stop at the present border, and neither does the new map. The marches of Bryansk, Kursk, Smolensk and Voronezh are surveyed in the Brotherhood's offices by men with rulers and are written, without comment, into the register of lands to be recovered."
 UKR_the_holy_mobilisation:0 "The Holy Mobilisation"
 UKR_the_holy_mobilisation_desc:0 "The Church calls and the whole republic answers, in the sense that those who do not answer are visited. The bells ring in every district on the same morning, and by evening the barracks are full, the churches are fuller and the recruiting offices have run out of forms."
 UKR_the_monastic_estates:0 "The Monastic Estates"
 UKR_the_monastic_estates_desc:0 "The Church is given back the land it held before 1917, which is considerable, and the state takes a generous share of the produce, which is considerable too. The monks are good farmers. Their abbots are better at balancing books than the Ministry of Finance."
 UKR_the_pilgrim_roads:0 "The Pilgrim Roads"
 UKR_the_pilgrim_roads_desc:0 "The roads to the Lavra, Pochaiv and Zarvanytsia are paved first, because pilgrims complain more than lorry drivers. It is only after the fifth surface that the engineers realise the road to Kyiv has, in the process, been rebuilt."
 UKR_the_chaplains_corps:0 "The Chaplains' Corps"
 UKR_the_chaplains_corps_desc:0 "Every battalion is issued with a priest, a field altar and a mule. The mule, according to the first reports, has been the most useful of the three, but the priests are not discouraged, and they stand with the men at the front."
 UKR_the_second_baptism:0 "The Second Baptism"
 UKR_the_second_baptism_desc:0 "A thousand years after Volodymyr's baptism, the Brotherhood proposes a second: a general renewal of the vows in the Dnieper, to be attended by the president, the army and as many of the people as can be fitted on the bank. The water is cold, and so is the reaction from Moscow."
 UKR_the_minsk_question:0 "The Minsk Question"
 UKR_the_minsk_question_desc:0 "A polite note is delivered to the government in Minsk. It reminds the government that Belarus is the heart of the old Rus, that the Brotherhood loves its people and that it is therefore very sorry to see the people so badly governed. The note requests a reply within a week."
 UKR_the_sword_of_saint_volodymyr:0 "The Sword of Saint Volodymyr"
 UKR_the_sword_of_saint_volodymyr_desc:0 "The prince who took baptism also took Cherson, Polotsk and a great many other places on the way, and the Brotherhood sees no reason that his example should go unfollowed. The sword is blessed at a service in St Sophia, and the chaplain says an extra prayer for the quartermasters."
 UKR_the_council_of_the_rus:0 "The Council of the Rus"
 UKR_the_council_of_the_rus_desc:0 "The princes, hetmans and mayors of the East Slav lands are invited to Kyiv, in the manner of the old councils of Liubech and Vytichev. Some come and some are brought, and all of them are seated according to a precedence that has been argued over for a week."
 UKR_the_appeal_to_the_east_slavs:0 "The Appeal to the East Slavs"
 UKR_the_appeal_to_the_east_slavs_desc:0 "A letter, drafted in the Brotherhood's most restrained prose, is read from every pulpit in Kyiv and broadcast on every wavelength that reaches Gomel, Pskov and Kursk. It asks the East Slavs to remember who they are, and it is read, in several districts, with great attention."
 UKR_the_principalities_of_the_rus:0 "The Principalities of the Rus"
 UKR_the_principalities_of_the_rus_desc:0 "The lands the Brotherhood cannot hold directly are to be held through men who will swear to it. Each is granted a title, a seat on the council and a promise of independence in domestic affairs. Their foreign and military affairs, the Brotherhood notes, are matters for the whole Rus."
 UKR_the_confederation_of_the_rus:0 "The Confederation of the Rus"
 UKR_the_confederation_of_the_rus_desc:0 "The Confederation has no common parliament and no common treasury, only a common faith, a common army and a common banner. The member states are free to govern themselves as they please, provided they please the Brotherhood."
 UKR_mother_of_rus_cities:0 "Mother of Rus Cities"
 UKR_mother_of_rus_cities_desc:0 "In the old chronicles Kyiv is called the mother of Rus cities. The title is now official, and the city is promptly rebuilt to deserve it: new walls, a restored Golden Gate and, behind them all, a Brotherhood Chancery that is, by some distance, the largest building on the hill."
 UKR_the_tithe_economy:0 "The Tithe Economy"
 UKR_the_tithe_economy_desc:0 "Every enterprise surrenders a tenth of its turnover to the Church, which passes a share of it back to the state. Economists are alarmed by the arrangement, and the Brotherhood is baffled by the alarm. They have never been audited before, and they recommend it as an experience."
 UKR_the_reliquary_armouries:0 "The Reliquary Armouries"
 UKR_the_reliquary_armouries_desc:0 "Stores are built in the crypts of the old monasteries, on the principle that the thickest walls in the country are the ones that have already survived the Mongols. The abbots complain about the smell of oil, and the quartermasters complain about the incense."
 UKR_the_wall_of_the_faith:0 "The Wall of the Faith"
 UKR_the_wall_of_the_faith_desc:0 "A belt of fortified monasteries is built along the western frontier, where the Poles are waiting, and along the northern frontier, where somebody else is. Each has a bell tower that doubles as an observation post, which is very convenient for a military that already likes bells."
 UKR_the_rus_restored:0 "The Rus Restored"
 UKR_the_rus_restored_desc:0 "A thousand years after Volodymyr, the lands of the Rus are once more under one banner, one Church and, in the Brotherhood's careful phrase, one understanding. The last bell is rung in St Sophia, the last chronicler writes the last entry, and somewhere in Moscow a map is turned to face the wall."
 UKR_the_question_of_the_crown:0 "The Question of the Crown"
 UKR_the_question_of_the_crown_desc:0 "If the Rus is to be restored, then the question the Brotherhood has so far avoided has to be answered: who sits on it? A council in the manner of Novgorod, or a throne in the manner of Kyiv? The two parties of the movement are not on speaking terms, and have agreed to meet in the same room."
 UKR_the_conciliar_republic:0 "The Conciliar Republic"
 UKR_the_conciliar_republic_desc:0 "The republic is retained, but it is reconsecrated as a conciliar republic: authority in the state belongs to the council of the faithful, and the president is only its first servant. It satisfies most of those who wanted a throne, on the grounds that there is still an extremely tall chair."
 UKR_the_restored_throne:0 "The Restored Throne"
 UKR_the_restored_throne_desc:0 "The Brotherhood announces that the Rus shall have a crown again. It has not announced whose, which has been noticed by every old family in Kyiv with a portrait of an ancestor and a lawyer. The chancery is instructed to prepare the ceremonial, and to leave the name blank until the question is quite settled."
 UKR_the_assembly_of_the_land:0 "The Assembly of the Land"
 UKR_the_assembly_of_the_land_desc:0 "The estates meet in the old manner: clergy, hosts, towns and the peasantry, each in a separate hall, each with a separate opinion, which are then reconciled by a committee that sits until it is finished. Nobody is certain the system works. It certainly does not hurry."
 UKR_the_monarchists_gather:0 "The Monarchists Gather"
 UKR_the_monarchists_gather_desc:0 "The throne gathers its supporters, and some of them gather rather more than was intended. In the back rooms of the capital, over very good tea, a number of old families begin to ask what a crown can do that a council cannot, and how much of it can be done without telling the Brotherhood."
 UKR_the_sacral_compact:0 "The Sacral Compact"
 UKR_the_sacral_compact_desc:0 "Whatever form the Rus takes, it will need an agreement between its altar and its authority, and the Brotherhood's lawyers are set to writing it. The text is short, grave and capable of being read as the republic's charter or the monarchy's, as the occasion requires."
 UKR_the_sworn_constitution:0 "The Sworn Constitution"
 UKR_the_sworn_constitution_desc:0 "The constitution of the Rus is sworn on the Gospel, in the Cathedral, in front of the Brotherhood, the council and as many foreign ambassadors as could be persuaded to attend. The ambassadors did not sign. They did, however, sit through all of it, and that, in the Brotherhood's view, is a form of recognition."
 UKR_the_brotherhoods_hour_idea:0 "The Brotherhood's Hour"
 UKR_the_brotherhoods_hour_idea_desc:0 "The faith has a government, and the government has a faith."
 UKR_the_confessional_state_idea:0 "The Confessional State"
 UKR_the_confessional_state_idea_desc:0 "Faith is not a private matter."
 UKR_the_parish_brigades_idea:0 "The Parish Brigades"
 UKR_the_parish_brigades_idea_desc:0 "Drill after the liturgy."
 UKR_the_monastery_schools_idea:0 "The Monastery Schools"
 UKR_the_monastery_schools_idea_desc:0 "Salvation first, then the sums."
 UKR_the_law_of_the_fast_idea:0 "The Law of the Fast"
 UKR_the_law_of_the_fast_idea_desc:0 "Two hundred days of Lent."
 UKR_the_holy_censors_idea:0 "The Holy Censors"
 UKR_the_holy_censors_idea_desc:0 "Imprimatur or nothing."
 UKR_kyiv_not_moscow_idea:0 "Kyiv, Not Moscow"
 UKR_kyiv_not_moscow_idea_desc:0 "The elder city has the elder claim."
 UKR_the_one_church_idea:0 "The One Church"
 UKR_the_one_church_idea_desc:0 "One altar, one throne, one telephone number."
 UKR_the_brotherhood_courts_idea:0 "The Brotherhood Courts"
 UKR_the_brotherhood_courts_idea_desc:0 "Elders, not advocates."
 UKR_the_sworn_brothers_idea:0 "The Sworn Brothers"
 UKR_the_sworn_brothers_idea_desc:0 "An oath in lieu of a salary."
 UKR_the_christ_loving_host_idea:0 "The Christ-Loving Host"
 UKR_the_christ_loving_host_idea_desc:0 "Regiments named after saints."
 UKR_the_arsenal_of_the_faith_idea:0 "The Arsenal of the Faith"
 UKR_the_arsenal_of_the_faith_idea_desc:0 "Blessed at the gate."
 UKR_the_holy_war_doctrine_idea:0 "The Holy War Doctrine"
 UKR_the_holy_war_doctrine_idea_desc:0 "A just cause is also a plan."
 UKR_the_banner_of_saint_michael_idea:0 "The Banner of Saint Michael"
 UKR_the_banner_of_saint_michael_idea_desc:0 "Patron of Kyiv and of its enemies' nightmares."
 UKR_the_idea_of_rus_idea:0 "The Idea of Rus"
 UKR_the_idea_of_rus_idea_desc:0 "One baptised people, three post offices."
 UKR_the_primary_chronicle_idea:0 "The Primary Chronicle"
 UKR_the_primary_chronicle_idea_desc:0 "The oldest document in the state."
 UKR_the_belarusian_brothers_idea:0 "The Belarusian Brothers"
 UKR_the_belarusian_brothers_idea_desc:0 "Fraternal greetings, with a map."
 UKR_the_veche_idea:0 "The Veche"
 UKR_the_veche_idea_desc:0 "The bell summons the free men."
 UKR_the_princes_court_idea:0 "The Prince's Court"
 UKR_the_princes_court_idea_desc:0 "A seneschal, a treasurer and a stolnik."
 UKR_the_conciliar_host_idea:0 "The Conciliar Host"
 UKR_the_conciliar_host_idea_desc:0 "Every company elects its captain."
 UKR_the_druzhina_idea:0 "The Druzhina"
 UKR_the_druzhina_idea_desc:0 "A retinue, not a conscript army."
 UKR_the_holy_mobilisation_idea:0 "The Holy Mobilisation"
 UKR_the_holy_mobilisation_idea_desc:0 "The bells ring in every district."
 UKR_the_monastic_estates_idea:0 "The Monastic Estates"
 UKR_the_monastic_estates_idea_desc:0 "The abbot keeps the books."
 UKR_the_pilgrim_roads_idea:0 "The Pilgrim Roads"
 UKR_the_pilgrim_roads_idea_desc:0 "The road to the Lavra, widened for tanks."
 UKR_the_chaplains_corps_idea:0 "The Chaplains' Corps"
 UKR_the_chaplains_corps_idea_desc:0 "A priest in every battalion."
 UKR_the_second_baptism_idea:0 "The Second Baptism"
 UKR_the_second_baptism_idea_desc:0 "The vows renewed in the Dnieper."
 UKR_the_council_of_the_rus_idea:0 "The Council of the Rus"
 UKR_the_council_of_the_rus_idea_desc:0 "Liubech, revived."
 UKR_the_appeal_to_the_east_slavs_idea:0 "The Appeal to the East Slavs"
 UKR_the_appeal_to_the_east_slavs_idea_desc:0 "Remember who you are."
 UKR_the_principalities_of_the_rus_idea:0 "The Principalities of the Rus"
 UKR_the_principalities_of_the_rus_idea_desc:0 "Titles in exchange for oaths."
 UKR_mother_of_rus_cities_idea:0 "Mother of Rus Cities"
 UKR_mother_of_rus_cities_idea_desc:0 "The city of the first baptism, rebuilt."
 UKR_the_tithe_economy_idea:0 "The Tithe Economy"
 UKR_the_tithe_economy_idea_desc:0 "A tenth to the altar."
 UKR_the_reliquary_armouries_idea:0 "The Reliquary Armouries"
 UKR_the_reliquary_armouries_idea_desc:0 "The crypts hold more than bones."
 UKR_the_wall_of_the_faith_idea:0 "The Wall of the Faith"
 UKR_the_wall_of_the_faith_idea_desc:0 "Bell towers with a view."
 UKR_the_rus_restored_idea:0 "The Rus Restored"
 UKR_the_rus_restored_idea_desc:0 "One banner, one Church, one understanding."
 UKR_the_conciliar_republic_idea:0 "The Conciliar Republic"
 UKR_the_conciliar_republic_idea_desc:0 "The president is the council's first servant."
 UKR_the_restored_throne_idea:0 "The Restored Throne"
 UKR_the_restored_throne_idea_desc:0 "The crown is promised. The wearer is not."
 UKR_the_assembly_of_the_land_idea:0 "The Assembly of the Land"
 UKR_the_assembly_of_the_land_idea_desc:0 "Clergy, hosts, towns and peasants."
 UKR_the_monarchists_gather_idea:0 "The Monarchists Gather"
 UKR_the_monarchists_gather_idea_desc:0 "Tea, rumour and old families."
 UKR_the_sacral_compact_idea:0 "The Sacral Compact"
 UKR_the_sacral_compact_idea_desc:0 "A charter for either form."
 UKR_the_sworn_constitution_idea:0 "The Sworn Constitution"
 UKR_the_sworn_constitution_idea_desc:0 "Sworn on the Gospel, before the ambassadors."
 UKR_the_senate_of_elders:0 "The Senate of Elders"
 UKR_the_senate_of_elders_desc:0 "The Assembly's committee, having sat for a month, recommends that it also be permitted to sit for the rest of the year. The elders of the great parishes and hosts are therefore constituted as an upper house, with a veto, a salary and, in the circumstances, a startlingly large quantity of tea."
 UKR_the_senate_of_elders_idea:0 "The Senate of Elders"
 UKR_the_senate_of_elders_idea_desc:0 "Greybeards with a veto."
 UKR_the_charter_of_free_cities:0 "The Charter of Free Cities"
 UKR_the_charter_of_free_cities_desc:0 "Lviv, Chernihiv, Kamianets and a dozen other towns are granted the old Magdeburg rights, which means a town hall, a market day and a court of their own. The mayors are grateful. The Brotherhood notes that a free city is a city that can be taxed with its own consent, which is much cheaper than without."
 UKR_the_charter_of_free_cities_idea:0 "The Charter of Free Cities"
 UKR_the_charter_of_free_cities_idea_desc:0 "Magdeburg rights, revived."
 UKR_the_royal_household:0 "The Royal Household"
 UKR_the_royal_household_desc:0 "A household is assembled before there is a king to put in it: a chamberlain, a master of ceremonies and an archivist whose job it is to find out which ancestors count. The salaries are paid from the Brotherhood's own treasury, and it is understood that this is not an investment in loyalty."
 UKR_the_royal_household_idea:0 "The Royal Household"
 UKR_the_royal_household_idea_desc:0 "Positions before the person."
 UKR_the_guarded_crown:0 "The Guarded Crown"
 UKR_the_guarded_crown_desc:0 "The Brotherhood's choice of monarch is Maria Montrezor, named by the Hetmanite movement as the heir to the claim of Hetman Skoropadsky's house. She had not expected the claim ever to be called in. She is crowned in St Sophia and the Brotherhood, with the greatest respect, remains to advise her, in every matter, at every hour."
 UKR_the_guarded_crown_idea:0 "The Guarded Crown"
 UKR_the_guarded_crown_idea_desc:0 "A monarch who reigns and is advised."
 UKR_the_regents_council:0 "The Regent's Council"
 UKR_the_regents_council_desc:0 "Since the queen cannot be expected to attend to the details, a council of Brotherhood elders is established to attend to them on her behalf. It sits in a pleasant room beside the throne room. The queen is invited to approve its minutes, and she does."
 UKR_the_regents_council_idea:0 "The Regent's Council"
 UKR_the_regents_council_idea_desc:0 "The crown signs. The Brotherhood decides."
 UKR_bratstvo_belarus_cores_tt:0 "Ukraine gains cores on all Belarusian states."
 UKR_bratstvo_russia_cores_tt:0 "Ukraine gains cores on the Russian states bordering Ukraine or Belarus."
 UKR_monarchist_plot_tt:0 "The monarchists begin to plot. (The plot continues in a later update.)"
 UKR_rus_confederation_faction:0 "Confederation of the Rus"
 UKR_ins_send_caucasus_tt:0 "Insurgency in the Northern Caucasus rises by §G8§!."
 UKR_ins_fund_caucasus_tt:0 "Insurgency in the Northern Caucasus rises by §G6§!. Russia loses §R0.5%§! stability."
 UKR_ins_stir_caucasus_tt:0 "Insurgency in the Northern Caucasus rises by §G15§!, and a separatist movement takes shape."
 UKR_ins_proclaim_caucasus_tt:0 "The Mountainous Republic of the Northern Caucasus is created as a §Ypuppet§! of Ukraine, without a declaration of war."
 UKR_ins_answer_caucasus_tt:0 "Ukraine gains a war goal against Russia."
 UKR_insurgency_25_tt_caucasus:0 "Insurgency in the Northern Caucasus is at least §Y25§!."
 UKR_insurgency_60_tt_caucasus:0 "Insurgency in the Northern Caucasus is at least §Y60§!."
 UKR_insurgency_75_tt_caucasus:0 "Insurgency in the Northern Caucasus is at least §Y75§!."
 UKR_separatism_tt_caucasus:0 "Separatism has been stirred in the Northern Caucasus."
 UKR_send_volunteers_kalmykia:0 "Send Volunteers to Kalmykia"
 UKR_send_volunteers_kalmykia_desc:0 "Elista has a chess city, an empty steppe and a very small police force. Visitors are conspicuous, and welcome."
 UKR_fund_partisans_kalmykia:0 "Fund the Kalmyk Partisans"
 UKR_fund_partisans_kalmykia_desc:0 "Herds, wells and pasture rights are the only currency that counts out here. The movement buys all three and asks the herdsmen to remember who paid."
 UKR_stir_separatism_kalmykia:0 "Stir Kalmyk Separatism"
 UKR_stir_separatism_kalmykia_desc:0 "The deportation of 1943 is not history where the oldest herdsmen were children on the trains. Nothing needs to be invented, only repeated, in the right place."
 UKR_proclaim_republic_kalmykia:0 "Proclaim the Republic of Kalmykia"
 UKR_proclaim_republic_kalmykia_desc:0 "The republic is proclaimed in a felt tent on the steppe outside Elista, with a lama to bless it and a single camera to record it."
 UKR_answer_the_call_kalmykia:0 "Answer Kalmykia's Call"
 UKR_answer_the_call_kalmykia_desc:0 "The steppe has asked for protection, in a petition signed by every elder between Elista and the Volga."
 UKR_ins_send_kalmykia_tt:0 "Insurgency in Kalmykia rises by §G8§!."
 UKR_ins_fund_kalmykia_tt:0 "Insurgency in Kalmykia rises by §G6§!. Russia loses §R0.5%§! stability."
 UKR_ins_stir_kalmykia_tt:0 "Insurgency in Kalmykia rises by §G15§!, and a separatist movement takes shape."
 UKR_ins_proclaim_kalmykia_tt:0 "The Republic of Kalmykia is created as a §Ypuppet§! of Ukraine, without a declaration of war."
 UKR_ins_answer_kalmykia_tt:0 "Ukraine gains a war goal against Russia."
 UKR_insurgency_25_tt_kalmykia:0 "Insurgency in Kalmykia is at least §Y25§!."
 UKR_insurgency_60_tt_kalmykia:0 "Insurgency in Kalmykia is at least §Y60§!."
 UKR_insurgency_75_tt_kalmykia:0 "Insurgency in Kalmykia is at least §Y75§!."
 UKR_separatism_tt_kalmykia:0 "Separatism has been stirred in Kalmykia."
 UKR_unlock_answer_the_call_tt:0 "Unlocks §YAnswer the Call§! decisions for every republic that exists."
 UKR_unlock_kuban_ops_tt:0 "Unlocks §YSend Volunteers§! and §YFund Partisans§! for the Kuban."
 UKR_unlock_kuban_separatism_tt:0 "Unlocks §YStir Separatism§! for the Kuban."
 UKR_unlock_kuban_republic_tt:0 "Unlocks §YProclaim the Republic§! for the Kuban."
 UKR_unlock_don_ops_tt:0 "Unlocks §YSend Volunteers§! and §YFund Partisans§! for the Don."
 UKR_unlock_don_separatism_tt:0 "Unlocks §YStir Separatism§! for the Don."
 UKR_unlock_don_republic_tt:0 "Unlocks §YProclaim the Republic§! for the Don."
 UKR_unlock_idelural_ops_tt:0 "Unlocks §YSend Volunteers§! and §YFund Partisans§! for Idel-Ural."
 UKR_unlock_idelural_separatism_tt:0 "Unlocks §YStir Separatism§! for Idel-Ural."
 UKR_unlock_idelural_republic_tt:0 "Unlocks §YProclaim the Republic§! for Idel-Ural."
 UKR_unlock_caspian_ops_tt:0 "Unlocks §YSend Volunteers§! and §YFund Partisans§! for the Northern Caucasus and Kalmykia."
 UKR_unlock_caspian_separatism_tt:0 "Unlocks §YStir Separatism§! for the Northern Caucasus and Kalmykia."
 UKR_unlock_caspian_republic_tt:0 "Unlocks §YProclaim the Republic§! for the Northern Caucasus and Kalmykia."
 UKR_the_ukrainian_national_front_faction:0 "The Ukrainian National Front"
 UKR_western_ultimatum_threat:0 "The Western Ultimatum"
 UKR_eastern_ultimatum_threat:0 "The Eastern Ultimatum"
 UKR_insurgency_threat:0 "The Deniable War"
 UKR_shkil_decisions_unlocked_tt:0 "Unlocks the §YInsurgency§! decisions."
 UKR_shkil_insurgency:0 "The Insurgency"
 UKR_shkil_insurgency_desc:0 "Nothing here is declared. Everything here is deniable, and none of it will be denied for long.[GetUKRSeparatismKuban][GetUKRSeparatismDon][GetUKRSeparatismIdelUral][GetUKRSeparatismCaucasus][GetUKRSeparatismKalmykia]"
 UKR_separatism_line_kuban:0 "\n[KBN.GetNameWithFlag]: Separatism §Y[?UKR.UKR_insurgency_kuban|0]§!/100"
 UKR_separatism_line_don:0 "\n[DON.GetNameWithFlag]: Separatism §Y[?UKR.UKR_insurgency_don|0]§!/100"
 UKR_separatism_line_idelural:0 "\n[IDL.GetNameWithFlag]: Separatism §Y[?UKR.UKR_insurgency_idelural|0]§!/100"
 UKR_separatism_line_caucasus:0 "\n[GOR.GetNameWithFlag]: Separatism §Y[?UKR.UKR_insurgency_caucasus|0]§!/100"
 UKR_separatism_line_kalmykia:0 "\n[KAL.GetNameWithFlag]: Separatism §Y[?UKR.UKR_insurgency_kalmykia|0]§!/100"
 UKR_separatism_line_hidden:0 ""
 UKR_shkil_path_chosen_tt:0 "The Directory has chosen §YShkil's§! path."
 UKR_tyahnybok_path_chosen_tt:0 "The Directory has chosen §YTyahnybok's§! path."
 UKR_unlock_shkil_path_tt:0 "Unlocks the focus §YThe Insurgent Vanguard§!."
 UKR_unlock_tyahnybok_path_tt:0 "Unlocks the focus §YThe Party of the Nation§!."
 UKR_front_invitations_tt:0 "Nationalist and fascist governments outside any faction will be §Yinvited§! to join the Front."
 ukraine.22.t:0 "The Night of the Colonels"
 ukraine.22.d:0 "It begins at two in the morning with a telephone call from a garrison in Lviv, and it is over before the ministries open. The television centre is held by eleven men and a vending machine. The Berkut stay in their barracks. By breakfast the tower is broadcasting the proclamation, read in a level voice by an announcer who has never been paid for anything so well.\n\nThe coalition that removed one president has not thought to ask who will remove the next."
 ukraine.22.a:0 "The Republic is dead."
 ukraine.23.t:0 "The Directory Divides"
 ukraine.23.d:0 "The four movements that marched together on Kyiv stop marching together on the fourth day. Shkil wants the country run by the men who took it, in the districts where they took it. Tyahnybok wants a party, a chairman and a plan. The professors want a hetman, and the priests want to know who will pay for the church.\n\nThe Directory sits for eleven hours and adjourns without a vote. It cannot go on like this. Somebody will be given the country, and the other will be given a grievance."
 ukraine.23.a:0 "Let Shkil keep what his men have taken."
 ukraine.23.b:0 "Give Tyahnybok his party and his plan."
 ukraine.24.t:0 "An Invitation from [FROM.GetName]"
 ukraine.24.d:0 "The letter is addressed to the foreign minister by name, which means somebody in Kyiv has been keeping a list. [FROM.GetLeader] writes that the movements of this continent have waited long enough for a table of their own, and that the Ukrainian National Front has set a place at it for [ROOT.GetName].\n\nThere is no deadline and no threat in the text. The invitation is courteous, specific and entirely sincere, and the cabinet is aware that this is more unusual than any ultimatum."
 ukraine.24.a:0 "We will take our seat."
 ukraine.24.b:0 "We thank them, and decline."
 ukraine.25.t:0 "[FROM.GetName] Joins the Front"
 ukraine.25.d:0 "The reply comes back within the day, on good paper, accepting without reservation. [FROM.GetLeader] has asked only that the Front's first communiqué be shown to them before it is published, and the foreign department has agreed, as it would have agreed to nearly anything.\n\nThe Front is no longer a Ukrainian project. It has a second flag now, and a second capital that can be embarrassed by it."
 ukraine.25.a:0 "The Front grows."
 ukraine.26.t:0 "[FROM.GetName] Declines the Invitation"
 ukraine.26.d:0 "The answer is polite and brief. [FROM.GetLeader] is grateful for the thought, shares many of the Front's concerns, and regrets that [FROM.GetName] must conduct its own affairs without foreign commitments.\n\nNobody in the foreign department is surprised, and nobody has struck the name from the list. The door was opened in good faith, and it can stay open."
 ukraine.26.a:0 "The invitation stands."
 ukraine.27.t:0 "The Day After the War"
 ukraine.27.desc:0 "The Rada's last garrison has been disarmed, and the Directory has nothing left to point at but itself. The four movements that took Kyiv together will not rule it together: one of them must sit in the president's office, and the three who do not will have to be persuaded that this was always the plan.\n\nThe ballot is a formality, and everyone in the chamber knows it. The only question is whose name goes on it."
 ukraine.27.a:0 "Shkil, and the men who took the districts."
 ukraine.27.b:0 "Tyahnybok, and the party with a plan."
 ukraine.27.c:0 "A Hetman, as the professors asked."
 ukraine.27.d:0 "Korchynsky, and the Brotherhood."
 UKR_reconstruction_boom:0 "Reconstruction Boom"
 UKR_reconstruction_boom_desc:0 "Cranes return to the skyline of Kyiv for the first time in ten years. Nobody is quite sure who ordered them, but nobody is willing to send them away."
 UKR_a_leaner_state:0 "A Leaner State"
 UKR_a_leaner_state_desc:0 "Eleven ministries become eight, and the missing three are found, after some searching, to have been doing the same job."
 UKR_debt_holiday:0 "Debt Holiday"
 UKR_debt_holiday_desc:0 "Creditors agree to a grace period, which is what creditors call a delay when they would prefer not to call it a default."
 UKR_privatisation_proceeds:0 "Privatisation Proceeds"
 UKR_privatisation_proceeds_desc:0 "The auctions are over, the buyers have been announced, and the receipts are, for once, larger than the rumours."
 UKR_clean_hands:0 "Clean Hands"
 UKR_clean_hands_desc:0 "A government that has audited its own predecessors can say, without much fear of contradiction, that it has audited its own predecessors."
 UKR_bumper_harvest:0 "Bumper Harvest"
 UKR_bumper_harvest_desc:0 "Farmers who own what they sow turn out to sow more of it. The silos on the black soil are, for the first time in memory, too small."
 UKR_the_premiers_mandate:0 "The Premier's Mandate"
 UKR_the_premiers_mandate_desc:0 "Having chosen a road, the premier is at last allowed to walk down it. The cabinet is invited to keep up."
 UKR_the_hetman_myth:0 "The Hetman Myth"
 UKR_the_hetman_myth_desc:0 "A lecture series, a reprinted map and a moustache are enough, in the right season, to make an accident of history feel like a destiny."
 UKR_holy_fervour:0 "Holy Fervour"
 UKR_holy_fervour_desc:0 "The faithful march faster than the unfaithful, and considerably more loudly. The police have noticed."
 UKR_throne_and_altar:0 "Throne and Altar"
 UKR_throne_and_altar_desc:0 "Between the liturgy and the regalia, the movement has at last found an aesthetic. It remains to find a country to apply it to."
 UKR_the_proclamation:0 "The Proclamation"
 UKR_the_proclamation_desc:0 "The announcer reads the text without stumbling. By the time anyone thinks to cut the signal, the signal belongs to someone else."
 UKR_the_ministry_captured:0 "The Ministry Captured"
 UKR_the_ministry_captured_desc:0 "The corridors are the same, the filing cabinets are the same, and the men who guard both have discovered a new loyalty."
 UKR_transit_royalties:0 "Transit Royalties"
 UKR_transit_royalties_desc:0 "The meter runs day and night, and a quiet percentage of every cubic metre finds its way to Kyiv."
 UKR_oligarch_financing:0 "Oligarch Financing"
 UKR_oligarch_financing_desc:0 "The club picks up the bill for a good many factories, in the sincere hope that somebody will remember it did."
 UKR_friendly_headlines:0 "Friendly Headlines"
 UKR_friendly_headlines_desc:0 "On any given morning, nine front pages agree. The tenth is the weather, and it also agrees."
 UKR_licensed_press:0 "Licensed Press"
 UKR_licensed_press_desc:0 "Every paper still on the newsstand has been inspected, advised and, on balance, encouraged."
 UKR_approved_weather:0 "Approved Weather"
 UKR_approved_weather_desc:0 "At six the bulletin begins, at six-fifteen it ends, and in between the country is told how it feels."
 UKR_subsidised_collieries:0 "Subsidised Collieries"
 UKR_subsidised_collieries_desc:0 "Every ton that comes out of the ground costs more than it fetches. Every shift that goes down remembers who signed the cheque."
 UKR_letterhead_and_fax:0 "Letterhead and Fax"
 UKR_letterhead_and_fax_desc:0 "Three hundred volunteers, one fax machine and a letterhead that looks very official indeed."
 UKR_organised_labour:0 "Organised Labour"
 UKR_organised_labour_desc:0 "A union that has remembered what it is for turns out to be quite good at getting a shop floor to meet its targets."
 UKR_a_hundredth_of_a_wage:0 "A Hundredth of a Wage"
 UKR_a_hundredth_of_a_wage_desc:0 "A small deduction from every pay packet buys a very large amount of solidarity."
 UKR_honest_figures:0 "Honest Figures"
 UKR_honest_figures_desc:0 "One set of books is cheaper to keep than two, and lenders, to nobody's great surprise, prefer it."
 UKR_the_martyr_at_the_gate:0 "The Martyr at the Gate"
 UKR_the_martyr_at_the_gate_desc:0 "Each day she refuses a meal, the crowd outside grows by a pavement."
 UKR_strasbourg_scrutiny:0 "Strasbourg Scrutiny"
 UKR_strasbourg_scrutiny_desc:0 "The resolution is not binding, but it is quoted in every conversation about the next loan."
 UKR_both_languages:0 "Both Languages"
 UKR_both_languages_desc:0 "A citizen can now complain in the language of their choice and receive a reply in the same. The postbag is somewhat lighter than expected."
 UKR_a_court_that_rules:0 "A Court That Rules"
 UKR_a_court_that_rules_desc:0 "Judges who owe their post to three masters tend, on the whole, to owe it to none."
 UKR_cooperative_bakeries:0 "Cooperative Bakeries"
 UKR_cooperative_bakeries_desc:0 "The bread is cheaper, the queues are shorter, and the board meetings are longer than anyone had been warned."
 UKR_credit_union_lending:0 "Credit Union Lending"
 UKR_credit_union_lending_desc:0 "A loan that a bank would not approve is approved by a neighbour who knows the borrower. It is repaid by the same neighbour's standards."
 UKR_inspectors_from_the_shop_floor:0 "Inspectors from the Shop Floor"
 UKR_inspectors_from_the_shop_floor_desc:0 "Officials who may soon be returning to the bench behave with a certain care."
 UKR_public_pay_scales:0 "Public Pay Scales"
 UKR_public_pay_scales_desc:0 "Everyone knows what everyone else earns, which turns out to be the quickest way to end a rumour."
 UKR_nation_of_smallholders:0 "A Nation of Smallholders"
 UKR_nation_of_smallholders_desc:0 "Ten million certificates, ten million small farms and ten million opinions on the price of wheat."
 UKR_donor_grants:0 "Donor Grants"
 UKR_cw_unso_cadres:0 "UNSO Cadres"
 UKR_cw_unso_cadres_desc:0 "Men who learned their trade in other people's wars now teach it, unpaid, to anyone who owns boots."
 UKR_cw_anointed_cause:0 "An Anointed Cause"
 UKR_cw_anointed_cause_desc:0 "The priests bless the banners, the historians bless the priests, and nobody in the movement has yet thought to ask who blesses the historians."
 UKR_cw_united_front:0 "The United Front"
 UKR_cw_united_front_desc:0 "The ballot box and the cobblestone, for once, are pointing in the same direction."
 UKR_cw_pact_of_lviv:0 "The Pact of Lviv"
 UKR_cw_pact_of_lviv_desc:0 "Two pages, four signatures and a promise not to denounce each other until the shooting stops. It is holding rather better than anyone had feared."
 UKR_cw_council_administration:0 "Council Administration"
 UKR_cw_council_administration_desc:0 "Where the councils are ours, the roads are mended, the bridges are guarded and the paperwork arrives at the right desk."
 UKR_cw_war_chest:0 "The Diaspora War Chest"
 UKR_cw_war_chest_desc:0 "Cheques from Toronto, Chicago and Melbourne arrive in envelopes marked "for the cause", which is how the accountants know not to ask."
 UKR_cw_popular_mandate:0 "A Popular Mandate"
 UKR_cw_popular_mandate_desc:0 "The movement won the councils before it won the capital, and it intends to remind everyone of the order."
 UKR_cw_defected_battalions:0 "Defected Battalions"
 UKR_cw_defected_battalions_desc:0 "Whole companies marched to the new colours with their sergeants, their kitchens and in one case their band."
 UKR_cw_lacking_popular_support:0 "Lacking Popular Support"
 UKR_cw_lacking_popular_support_desc:0 "The loyalists hold the ministries, the stamps and the telephone directory. They do not hold the street, and the street has noticed."
 UKR_cw_low_on_funds:0 "Low on Funds"
 UKR_cw_low_on_funds_desc:0 "The treasury is full of promissory notes from a government that no longer exists, and the quartermasters have started to read the small print."
 UKR_cw_disorganised_command:0 "Disorganised Command"
 UKR_cw_disorganised_command_desc:0 "Half the staff officers answer the telephone and the other half answer to someone else. Orders arrive on time and in contradictory pairs."
 UKR_cw_unsecured_rear:0 "Unsecured Rear"
 UKR_cw_unsecured_rear_desc:0 "The interior troops that were meant to hold the cities are holding a quite different opinion about whom they are meant to hold them for."
 UKR_cw_dead_air:0 "Dead Air"
 UKR_cw_dead_air_desc:0 "The loyalists cannot explain their side of the story because the tower that carries it now plays marches and weather."
 UKR_cw_harassed_garrisons:0 "Harassed Garrisons"
 UKR_cw_harassed_garrisons_desc:0 "Sentries who cannot sleep make poor sentries, and the neighbourhood boys have found a great many ways to keep them awake."
 UKR_cw_contested_legitimacy:0 "Contested Legitimacy"
 UKR_cw_contested_legitimacy_desc:0 "A lecture series has persuaded a fair proportion of the country that the republic is a clerical error. The republic has not yet been told."
 UKR_cw_demoralised_garrisons:0 "Demoralised Garrisons"
 UKR_cw_demoralised_garrisons_desc:0 "The sermons say the loyalists are fighting against heaven. The loyalists, who attend the same churches, have begun to wonder."
 UKR_cw_empty_depots:0 "Empty Depots"
 UKR_cw_empty_depots_desc:0 "The inventory says the arsenal holds forty thousand rifles. The arsenal says it holds a great deal of dust."
 UKR_cw_tt_b_unso:0 "When the civil war breaks out, your side gains §GUNSO Cadres§! for one year:\n  Organisation: §G+10%§!\n  Army experience gain: §G+15%§!"
 UKR_cw_tt_e_harassed:0 "When the civil war breaks out, the rebels suffer §RHarassed Garrisons§! for one year:\n  Army morale: §R-10%§!\n  Organisation: §R-5%§!"
 UKR_cw_tt_u_students:0 "When the civil war breaks out, you receive §G10000§! manpower and §G10§! army experience."
 UKR_cw_tt_nadvirna:0 "When the civil war breaks out, §YNadvirna§! will stay under your control."
 UKR_cw_tt_e_legit:0 "When the civil war breaks out, the rebels suffer §RContested Legitimacy§! for one year:\n  Stability: §R-5%§!\n  Political power gain: §R-10%§!\n  Stability from party popularity: §R-15%§!"
 UKR_cw_tt_hetmanate:0 "When the civil war breaks out, §YCherkasy, Kremenchuk and Shostka§! will stay under your control."
 UKR_cw_tt_uzhhorod:0 "When the civil war breaks out, §YUzhhorod§! will stay under your control."
 UKR_cw_tt_e_cursed:0 "When the civil war breaks out, the rebels suffer §RDemoralised Garrisons§! for one year:\n  War support: §R-15%§!\n  Surrender limit: §R-5%§!"
 UKR_cw_tt_b_anointed:0 "When the civil war breaks out, your side gains §GAn Anointed Cause§! for one year:\n  Stability: §G+10%§!\n  War support: §G+10%§!"
 UKR_cw_tt_b_front:0 "When the civil war breaks out, your side gains §GThe United Front§! for one year:\n  Daily political power: §G+0.10§!\n  Stability: §G+5%§!"
 UKR_cw_tt_b_pact:0 "When the civil war breaks out, your side gains §GThe Pact of Lviv§! for one year:\n  War support: §G+10%§!\n  Conscription: §G+10%§!"
 UKR_cw_tt_b_councils:0 "When the civil war breaks out, your side gains §GCouncil Administration§! for one year:\n  Political advisor cost: §G-20%§!\n  Stability: §G+5%§!\n  Construction speed: §G+10%§!"
 UKR_cw_tt_podillia:0 "When the civil war breaks out, §YZhytomyr and Vinnytsia§! will stay under your control."
 UKR_cw_tt_odesa:0 "When the civil war breaks out, §YOdesa§! will stay under your control."
 UKR_cw_tt_kharkiv:0 "When the civil war breaks out, §YKharkiv§! will stay under your control."
 UKR_cw_tt_e_command:0 "When the civil war breaks out, the rebels suffer §RDisorganised Command§! for one year:\n  Organisation: §R-10%§!\n  Army experience gain: §R-15%§!\n  Army training time: §R+15%§!"
 UKR_cw_tt_garrisons:0 "When the civil war breaks out, §YDnipro and Zaporizhzhia§! will stay under your control."
 UKR_cw_tt_b_defected:0 "When the civil war breaks out, your side gains §GDefected Battalions§! for one year:\n  Mobilization speed: §G+20%§!\n  Organisation: §G+5%§!"
 UKR_cw_tt_u_defectors:0 "When the civil war breaks out, you receive §G10000§! manpower and §G10§! army experience."
 UKR_cw_tt_mykolaiv:0 "When the civil war breaks out, §YMykolaiv§! will stay under your control."
 UKR_cw_tt_b_chest:0 "When the civil war breaks out, your side gains §GThe Diaspora War Chest§! for one year:\n  Military factory construction speed: §G+15%§!\n  Consumer goods: §G-5%§!"
 UKR_cw_tt_e_funds:0 "When the civil war breaks out, the rebels suffer §RLow on Funds§! for one year:\n  Political power gain: §R-20%§!\n  Military factory construction speed: §R-15%§!\n  Consumer goods: §R+10%§!"
 UKR_cw_tt_b_mandate:0 "When the civil war breaks out, your side gains §GA Popular Mandate§! for one year:\n  Stability from party popularity: §G+15%§!\n  Drift defence: §G+15%§!\n  Stability: §G+5%§!"
 UKR_cw_tt_e_support:0 "When the civil war breaks out, the rebels suffer §RLacking Popular Support§! for one year:\n  Stability: §R-10%§!\n  War support: §R-10%§!"
 UKR_cw_tt_u_arms:0 "When the civil war breaks out, you receive §G1000§! infantry equipment from the seized arsenals."
 UKR_cw_tt_e_depots:0 "When the civil war breaks out, the rebels suffer §REmpty Depots§! for one year:\n  Military factory construction speed: §R-15%§!\n  Factory starting efficiency: §R-10%§!"
 UKR_cw_tt_e_air:0 "When the civil war breaks out, the rebels suffer §RDead Air§! for one year:\n  War support: §R-10%§!\n  Stability from party popularity: §R-20%§!\n  Monthly opinion gain: §R-25%§!"
 UKR_cw_tt_e_rear:0 "When the civil war breaks out, the rebels suffer §RUnsecured Rear§! for one year:\n  Conscription: §R-10%§!\n  Mobilization speed: §R-20%§!"
 UKR_cw_tt_kyiv:0 "When the civil war breaks out, §YKyiv§! will stay under your control."
 UKR_cw_tt_convention:0 "§YThe road to civil war.§! Every focus between here and The Coup is optional. The revolution starts the war holding only §YLviv§!; the focuses that secure states, and the buffs they grant, are what let you hold more. The Coup can be launched as soon as The Nationalist Congress is done. §RThe movement will not wait: in three years the civil war starts whether you are ready or not.§!"
 UKR_cw_tt_coup:0 "§RThe country splits in two.§! The revolution holds only §YLviv§! and the states your preparations secured. Everything else follows the Verkhovna Rada, which also raises a fresh Rada Guard. The more of the road you have completed, the smaller the army the front starts with."
 UKR_cw_tt_gate2:0 "§YThe Coup§! can now be launched."
 UKR_cw_tt_gate:0 "The Coup can now be reached through §YThe Nationalist Congress§!."
 UKR_cw_forced_hand:0 "A Forced Hand"
 UKR_cw_forced_hand_desc:0 "The plan said spring. The colonels said now. The planners were not consulted, which is generally how one knows the colonels were right."
 UKR_the_movement_cannot_wait:0 "The Movement Cannot Wait"
 UKR_the_movement_cannot_wait_desc:0 "Four movements agreed to wait for the right moment. They did not agree on how long a right moment can take, and the younger men in each of them have started to count. If the Coup has not come when the clock runs out, the movement will rise on its own, whatever state it is in."
 UKR_cw_timeout_tt:0 "§RIf the time runs out, the movement is forced to rise:§! The Coup happens at once with whatever preparation is complete, and your side suffers §RA Forced Hand§! for one year:\n  Stability: §R-10%§!\n  Organisation: §R-5%§!"
 UKR_cw_party_cadres:0 "Party Cadres"
 UKR_cw_party_cadres_desc:0 "Every district has a man with a membership list, a typewriter and a very clear idea of whom to call. Revolutions are, among other things, a clerical achievement."
 UKR_cw_tt_b_cadres:0 "When the civil war breaks out, your side gains §GParty Cadres§! for one year:\n  Daily political power: §G+0.10§!\n  Stability from party popularity: §G+10%§!"
 UKR_far_right_coup_done:0 "The Coup has been launched."
 UKR_cw_over:0 "The Civil War is over."
 UKR_the_monarchist_conclave:0 "The Conclave of the Crown"
 UKR_the_monarchist_conclave_desc:0 "The Brotherhood is gone from the palace, and the people who removed it find, with some surprise, that they now have to agree with each other. The old families meet in the one room in Kyiv that nobody searched. There are two crowns on the table, and both have a respectable claim."
 UKR_the_house_across_the_carpathians:0 "The House Across the Carpathians"
 UKR_the_house_across_the_carpathians_desc:0 "Lviv was Lemberg for a hundred and forty years, and a surprising number of its families still keep the portrait in a drawer. Vienna is still there, and still has a House. A letter is drafted, redrafted, and sent by a courier who has been told it is about a wine order."
 UKR_vasyls_testament:0 "Vasyl's Testament"
 UKR_vasyls_testament_desc:0 "Archduke Wilhelm took the name Vasyl Vyshyvanyi, put on an embroidered shirt and led Sich Riflemen in 1918. In 1948 he died in a Soviet prison without ever having been asked what he wanted. The Brotherhood buried his story. The monarchists dig it up and read it aloud in every parish hall."
 UKR_the_riflemens_oath:0 "The Riflemen's Oath"
 UKR_the_riflemens_oath_desc:0 "The Sich Riflemen swore to the Emperor and, in the end, to Ukraine. Their heirs in the officer corps are invited to do both again, in a ceremony with a great many flags and a very small budget."
 UKR_the_galician_crown:0 "The Crown of Galicia and Lodomeria"
 UKR_the_galician_crown_desc:0 "The old crownland title is revived and, for the first time since 1918, attached to a government that exists. Lawyers in two capitals spend a pleasant year proving that this has never stopped being true."
 UKR_the_triple_monarchy:0 "The Triple Monarchy"
 UKR_the_triple_monarchy_desc:0 "Franz Ferdinand drew it on a napkin in 1906: Austria, Hungary and a third equal. He was shot before anyone could ask the third. Kyiv now asks, and Vienna and Budapest, having had a century to think about it, find that they are mostly relieved to be asked."
 UKR_the_pragmatic_sanction:0 "The New Pragmatic Sanction"
 UKR_the_pragmatic_sanction_desc:0 "The Pragmatic Sanction of 1713 declared the Habsburg lands indivisible. Its successor is shorter, firmer on the equality of the three realms, and signed with a pen the Ukrainian side brought themselves."
 UKR_the_common_ministries:0 "The Common Ministries"
 UKR_the_common_ministries_desc:0 "Foreign affairs, defence and the money that pays for them are shared by all three realms, as in 1867. The ministers meet in rotation, so each capital gets to be inconvenienced equally."
 UKR_austria_ukraine:0 "Austria-Ukraine"
 UKR_austria_ukraine_desc:0 "The double eagle gains a third head, or the third head gains a double eagle. Heraldists are still arguing. In the meantime a union exists that spans from the Tatra to the Dnipro, with Kyiv as an equal partner and not a province."
 UKR_the_hetmans_banner:0 "The Hetman's Banner"
 UKR_the_hetmans_banner_desc:0 "In April 1918, a congress of landowners in the Kyiv Circus proclaimed Pavlo Skoropadskyi Hetman of all Ukraine. They had chosen the venue for its seating. The banner comes down from the museum and goes up over the Cabinet, to the great discomfort of a number of people who thought the Circus was finished with."
 UKR_the_federal_charter:0 "The Federal Charter"
 UKR_the_federal_charter_desc:0 "On 14 November 1918 the Hetman announced a federation with a future non-Bolshevik Russia, a document that waited eighty years for its Russia. The text is taken from the archive, dusted off, and sent to every government that might wish to be consulted."
 UKR_the_hetmans_guard:0 "The Hetman's Guard"
 UKR_the_hetmans_guard_desc:0 "The Serdiuk Division was the best-equipped formation of the first Hetmanate, and it was still in the capital at the end. Its successors are better fed and have been told, in writing, to remain so."
 UKR_the_romanov_question:0 "The Romanov Question"
 UKR_the_romanov_question_desc:0 "The House of Romanov has been waiting in Paris, Madrid and Darmstadt for a century and a half of invitations. Kyiv sends one. It is not yet clear if the answer will come in the form of a letter, a delegation or an absurdly large number of relatives."
 UKR_the_boyar_duma:0 "The Boyar Duma"
 UKR_the_boyar_duma_desc:0 "An advisory body of the great families, summoned to advise. Its members have strong views on the matter, almost all of which concern their own estates."
 UKR_the_coronation_at_saint_sophia:0 "The Coronation at Saint Sophia"
 UKR_the_coronation_at_saint_sophia_desc:0 "The Tsars were crowned in Moscow because Moscow said so. Saint Sophia in Kyiv was standing when Moscow was a hunting lodge. The cathedral is cleaned, the bells are rehung, and the clergy are reminded that they are a tradition and not a constituency."
 UKR_kyiv_the_first_throne:0 "Kyiv, the First Throne"
 UKR_kyiv_the_first_throne_desc:0 "The Rus was baptised here before there was a Moscow to ask. The court draws up a genealogy that makes this plain. It runs to forty pages, and the footnotes are nearly as long as the text."
 UKR_the_sword_of_the_hetman:0 "The Sword of the Hetman"
 UKR_the_sword_of_the_hetman_desc:0 "The army swears to the crown, the crown swears to the army, and the quartermasters swear at both. A restoration is not cheap, and it is not subtle either."
 UKR_the_tsardom_restored:0 "The Tsardom Restored"
 UKR_the_tsardom_restored_desc:0 "There will be a Tsar again, and a Tsardom, and a Duma, and it will meet in Kyiv. Moscow is invited to be a province of it, and has until the end of the week to reply."
 UKR_the_monarchist_conclave_idea:0 "The Conclave of the Crown"
 UKR_the_monarchist_conclave_idea_desc:0 "Two crowns, one table."
 UKR_the_house_across_the_carpathians_idea:0 "The House Across the Carpathians"
 UKR_the_house_across_the_carpathians_idea_desc:0 "Letters to Vienna."
 UKR_vasyls_testament_idea:0 "Vasyl's Testament"
 UKR_vasyls_testament_idea_desc:0 "A Habsburg in an embroidered shirt."
 UKR_the_riflemens_oath_idea:0 "The Riflemen's Oath"
 UKR_the_riflemens_oath_idea_desc:0 "Sworn to the Emperor and to Ukraine."
 UKR_the_triple_monarchy_idea:0 "The Triple Monarchy"
 UKR_the_triple_monarchy_idea_desc:0 "Three crowns, three capitals, one dinner."
 UKR_the_common_ministries_idea:0 "The Common Ministries"
 UKR_the_common_ministries_idea_desc:0 "Shared, and shared out."
 UKR_austria_ukraine_idea:0 "Austria-Ukraine"
 UKR_austria_ukraine_idea_desc:0 "Three realms, one eagle (the heraldists are still working on it)."
 UKR_the_hetmans_banner_idea:0 "The Hetman's Banner"
 UKR_the_hetmans_banner_idea_desc:0 "The Circus, once more."
 UKR_the_federal_charter_idea:0 "The Federal Charter"
 UKR_the_federal_charter_idea_desc:0 "A federation waiting for a partner."
 UKR_the_hetmans_guard_idea:0 "The Hetman's Guard"
 UKR_the_hetmans_guard_idea_desc:0 "Loyal to the person, not the post."
 UKR_the_boyar_duma_idea:0 "The Boyar Duma"
 UKR_the_boyar_duma_idea_desc:0 "Consulted, and expecting to be."
 UKR_the_coronation_idea:0 "The Coronation at Saint Sophia"
 UKR_the_coronation_idea_desc:0 "Crowned where it all began."
 UKR_the_tsardom_restored_idea:0 "The Tsardom Restored"
 UKR_the_tsardom_restored_idea_desc:0 "The throne has moved west."
 UKR_the_crown_seized_idea:0 "The Crown Seized"
 UKR_the_crown_seized_idea_desc:0 "Every coup leaves a year of paperwork behind it."
 UKR_austria_ukraine_faction:0 "Austria-Ukraine"
 UKR_austria_ukraine_tt:0 "§YAustria-Ukraine§! is founded as a faction. Austria and Hungary can be invited to the §YDonaupakt§! from the decision menu, and the §YDanube Federation§! can be proclaimed later."
 UKR_tsardom_restored_tt:0 "We gain a §Rpuppet war goal§! against §YRussia§!, and the §YImperial Claims§! decisions unlock."
 ukraine.28.t:0 "The Brotherhood Is Retired"
 ukraine.28.desc:0 "The morning after the vote that was not a vote, the Brotherhood's guards find the palace doors locked from the other side. Behind them, in a hall hung with banners no one has seen in decades, the old families are signing something. They are very polite about it, and have brought their own pens."
 ukraine.28.a:0 "The Crown is ours."
 UKR_monarchist_coup_tt:0 "The §Ymonarchists§! seize the state and the §RBrotherhood§! loses power. A new branch of the focus tree opens below §YThe Monarchists Gather§!."
 UKR_aus_monarchist_agitation_idea:0 "Royalist Agitation"
 UKR_aus_monarchist_agitation_idea_desc:0 "Pamphlets, lectures, and an unusual number of cravats."
 UKR_aus_royalist_tide_idea:0 "The Royalist Tide"
 UKR_aus_royalist_tide_idea_desc:0 "Every cafe in Vienna has an opinion about the Emperor, and none of them are Republican."
 UKR_aus_loyalist_officers_idea:0 "The Loyalist Officers"
 UKR_aus_loyalist_officers_idea_desc:0 "The army remembers the oath it swore to the House, and has never been formally released from it."
 UKR_hun_monarchist_agitation_idea:0 "Royalist Agitation"
 UKR_hun_monarchist_agitation_idea_desc:0 "Pamphlets, lectures, and a surprising number of old uniforms."
 UKR_hun_royalist_tide_idea:0 "The Royalist Tide"
 UKR_hun_royalist_tide_idea_desc:0 "Hungary has been a kingdom for a thousand years, apart from the brief interruptions."
 UKR_hun_regency_nostalgia_idea:0 "A Kingdom Without a King"
 UKR_hun_regency_nostalgia_idea_desc:0 "There was a regent, and then there was not. The Crown of Saint Stephen is in a vault and the vault is, in some sense, the government."
 UKR_danube_federation_idea:0 "The Danube Federation"
 UKR_danube_federation_idea_desc:0 "One river, one capital, and one very long constitution."
 UKR_imperial_ambition_idea:0 "Imperial Ambition"
 UKR_imperial_ambition_idea_desc:0 "The map on the wall of the war office has had its border moved. Nobody has said anything."
 UKR_fund_royalist_circles_aus:0 "Fund Royalist Circles in Austria"
 UKR_fund_royalist_circles_aus_desc:0 "Money has always done more for a crown than a coronation has."
 UKR_print_royalist_pamphlets_aus:0 "Print Royalist Pamphlets for Austria"
 UKR_print_royalist_pamphlets_aus_desc:0 "They are excellent pamphlets, and very well bound."
 UKR_court_the_old_aristocracy_aus:0 "Court the Old Aristocracy of Austria"
 UKR_court_the_old_aristocracy_aus_desc:0 "The old families have kept their titles in a drawer for eighty years and are delighted to be asked about them."
 UKR_royalist_funding_tt_aus:0 "§YAustria§! gains §Gmonarchist§! party popularity and a national spirit that pushes it toward §Ymonarchism§!."
 UKR_royalist_support_tt_aus:0 "The §Ymonarchist§! party in Austria has more than §Y25%§! popularity."
 UKR_sponsor_the_royalist_coup_aus:0 "Sponsor a Royalist Coup in Austria"
 UKR_sponsor_the_royalist_coup_aus_desc:0 "We do not choose the day. We only make sure the guards are looking elsewhere when it arrives."
 UKR_royalist_coup_tt_aus:0 "The royalists in §YAustria§! attempt a §Rcoup§!. The government can §Yyield§! to the crown, or §Rresist§! and cause a §Rcivil war§!."
 UKR_invite_aus_to_the_donaupakt:0 "Invite Austria to the Donaupakt"
 UKR_invite_aus_to_the_donaupakt_desc:0 "The invitation is written on very good paper, which is how everyone will know it is not a threat."
 UKR_donaupakt_offer_tt_aus:0 "§YAustria§! is invited to join the Donaupakt as a §Ypuppet§!. If it refuses, we gain a §Rpuppet war goal§! against it."
 UKR_fund_royalist_circles_hun:0 "Fund Royalist Circles in Hungary"
 UKR_fund_royalist_circles_hun_desc:0 "Money has always done more for a crown than a coronation has."
 UKR_print_royalist_pamphlets_hun:0 "Print Royalist Pamphlets for Hungary"
 UKR_print_royalist_pamphlets_hun_desc:0 "They are excellent pamphlets, and very well bound."
 UKR_court_the_old_aristocracy_hun:0 "Court the Old Aristocracy of Hungary"
 UKR_court_the_old_aristocracy_hun_desc:0 "The old families have kept their titles in a drawer for eighty years and are delighted to be asked about them."
 UKR_royalist_funding_tt_hun:0 "§YHungary§! gains §Gmonarchist§! party popularity and a national spirit that pushes it toward §Ymonarchism§!."
 UKR_royalist_support_tt_hun:0 "The §Ymonarchist§! party in Hungary has more than §Y25%§! popularity."
 UKR_sponsor_the_royalist_coup_hun:0 "Sponsor a Royalist Coup in Hungary"
 UKR_sponsor_the_royalist_coup_hun_desc:0 "We do not choose the day. We only make sure the guards are looking elsewhere when it arrives."
 UKR_royalist_coup_tt_hun:0 "The royalists in §YHungary§! attempt a §Rcoup§!. The government can §Yyield§! to the crown, or §Rresist§! and cause a §Rcivil war§!."
 UKR_invite_hun_to_the_donaupakt:0 "Invite Hungary to the Donaupakt"
 UKR_invite_hun_to_the_donaupakt_desc:0 "The invitation is written on very good paper, which is how everyone will know it is not a threat."
 UKR_donaupakt_offer_tt_hun:0 "§YHungary§! is invited to join the Donaupakt as a §Ypuppet§!. If it refuses, we gain a §Rpuppet war goal§! against it."
 UKR_donaupakt_condition_tt:0 "The civil war is over, or the target is already §Ymonarchist§!."
 UKR_reclaim_transylvania:0 "Reclaim Transylvania"
 UKR_reclaim_transylvania_desc:0 "The Crown of Saint Stephen was not made to be divided, and it has not forgotten."
 UKR_reclaim_transylvania_tt:0 "We claim §YTransylvania§! and §YBanat§!, and gain a §Rwar goal§! against §YRomania§!."
 UKR_reclaim_polish_galicia:0 "Reclaim Polish Galicia"
 UKR_reclaim_polish_galicia_desc:0 "Kraków was a Habsburg city for longer than Poland was a state. The archives are quite clear."
 UKR_reclaim_polish_galicia_tt:0 "We claim §YKraków§! and the Ukrainian-cored lands in §YPoland§!, and gain a §Rwar goal§! against it."
 UKR_reclaim_bohemia_and_slovakia:0 "Reclaim Bohemia and Slovakia"
 UKR_reclaim_bohemia_and_slovakia_desc:0 "The crown of Saint Wenceslas has the same shape as every other crown in this alliance."
 UKR_reclaim_bohemia_and_slovakia_tt:0 "We claim every state owned by §YCzechia§! and §YSlovakia§!, and gain §Rpuppet war goals§! against both."
 UKR_reclaim_illyria:0 "Reclaim Illyria"
 UKR_reclaim_illyria_desc:0 "The Adriatic coast belonged to Vienna for centuries. Everyone agrees. Nobody on the Adriatic coast has been consulted."
 UKR_reclaim_illyria_tt:0 "We claim §YDalmatia§!, §YCroatia§!, §YVojvodina§! and §YBanat§!, and gain §Rpuppet war goals§! against §YSlovenia§! and §YCroatia§!."
 UKR_reclaim_bosnia:0 "Reclaim Bosnia"
 UKR_reclaim_bosnia_desc:0 "Austria-Hungary annexed Bosnia in 1908 and governed it with, by the standards of the age, an unusually good postal service."
 UKR_reclaim_bosnia_tt:0 "We claim every state owned by §YBosnia§!, and gain a §Rpuppet war goal§! against it."
 UKR_danube_threat:0 "Danubian Reclamation"
 UKR_proclaim_the_danube_federation:0 "Proclaim the Danube Federation"
 UKR_proclaim_the_danube_federation_desc:0 "The pact becomes a state. The border posts are quietly taken down, and a surprising number of them are found to have been holding up the roof."
 UKR_federation_condition_tt:0 "§YAustria§!, §YHungary§!, §YCzechia§!, §YSlovakia§!, §YSlovenia§!, §YCroatia§! and §YBosnia§! are all our §Ypuppets§!."
 UKR_proclaim_the_danube_federation_tt:0 "We §Yannex§! every Danubian state that is our §Ypuppet§!: Austria, Hungary, Czechia, Slovakia, Slovenia, Croatia and Bosnia."
 UKR_reclaim_central_asia:0 "Reclaim Central Asia"
 UKR_reclaim_central_asia_desc:0 "The Russian Empire reached the Pamirs, so the Tsardom does as well. The surveyors are told to expect resistance, and a number of silk carpets."
 UKR_reclaim_central_asia_tt:0 "We gain §Rwar goals§! against the states of §YCentral Asia§!. We also gain §YImperial Ambition§!."
 UKR_reclaim_poland:0 "Reclaim Poland"
 UKR_reclaim_poland_desc:0 "Congress Poland was a Russian province for a century and has had a very long time to think about it."
 UKR_reclaim_poland_tt:0 "We gain a §Rwar goal§! against §YPoland§!."
 UKR_reclaim_belarus_and_the_baltics:0 "Reclaim Belarus and the Baltics"
 UKR_reclaim_belarus_and_the_baltics_desc:0 "The Pale, Livonia, Courland and Estland. The Tsardom has a list, and the list is long."
 UKR_reclaim_belarus_and_the_baltics_tt:0 "We gain §Rwar goals§! against §YBelarus§!, §YEstonia§!, §YLatvia§! and §YLithuania§!."
 UKR_reclaim_finland:0 "Reclaim Finland"
 UKR_reclaim_finland_desc:0 "The Grand Duchy of Finland had its own parliament, its own money and its own postage stamps, and was loyal until it was not."
 UKR_reclaim_finland_tt:0 "We gain a §Rwar goal§! against §YFinland§!."
 UKR_conquer_afghanistan:0 "Conquer Afghanistan"
 UKR_conquer_afghanistan_desc:0 "The Great Game was never concluded. The Tsardom has decided to be the one who does not fold the board."
 UKR_conquer_afghanistan_tt:0 "We gain a §Rwar goal§! against §YAfghanistan§!."
 UKR_the_far_eastern_marches:0 "The Far Eastern Marches"
 UKR_the_far_eastern_marches_desc:0 "The Trans-Siberian ran to Harbin once, and so, the Tsardom reasons, did the empire."
 UKR_the_far_eastern_marches_tt:0 "We gain a §Rwar goal§! against §YMongolia§!, and claim §YHeilungkiang§! and §YLiaoning§! (Manchuria), with a §Rwar goal§! against whoever holds them."
 UKR_the_alaskan_question:0 "The Alaskan Question"
 UKR_the_alaskan_question_desc:0 "Sold in 1867 for seven million dollars, which was a bargain for exactly one of the two parties."
 UKR_the_alaskan_question_tt:0 "We claim §YAlaska§!, and gain a §Rwar goal§! against whoever holds it."
 UKR_tsardom_threat:0 "Imperial Restoration"
 UKR_danube_monarchy_category:0 "The Donaupakt"
 UKR_danube_monarchy_category_desc:0 "Austria, Hungary and Ukraine, in the order they will have to be persuaded."
 UKR_tsardom_category:0 "The Imperial Claims"
 UKR_tsardom_category_desc:0 "Every border the Empire ever had, in order of how embarrassing it will be to bring up."
 ukraine.30.t:0 "The Invitation from Kyiv"
 ukraine.30.desc:0 "A courier from Kyiv has arrived at the Hofburg with an invitation to the Donaupakt. It is a very beautiful document and the terms are, on reading, those of a protectorate. The ambassador is waiting in the antechamber, and has been told to look hopeful."
 ukraine.30.a:0 "Austria joins the Donaupakt."
 ukraine.30.b:0 "Vienna is not a province of Kyiv."
 ukraine.31.t:0 "The Invitation from Kyiv"
 ukraine.31.desc:0 "A courier from Kyiv has arrived in Budapest with an invitation to the Donaupakt. It praises the Crown of Saint Stephen at length and then describes, in the final paragraph, the limits on Hungarian foreign policy. The ambassador is waiting in the antechamber, and has been told to look hopeful."
 ukraine.31.a:0 "Hungary joins the Donaupakt."
 ukraine.31.b:0 "Budapest is not a province of Kyiv."
 ukraine.32.t:0 "The Royalists Move"
 ukraine.32.desc:0 "A group of officers, aristocrats and one very elderly archduchess has presented the cabinet with a signed document. It is courteous and clearly states that the Republic has until sundown to reconsider. The Hofburg lights are on, and the guards have been given the afternoon off."
 ukraine.32.a:0 "The Republic yields to the Crown."
 ukraine.32.b:0 "Resist. Let the loyalists defend the Republic."
 ukraine.33.t:0 "The Royalists Move"
 ukraine.33.desc:0 "The Regent's old guards have appeared in Budapest in uniforms last seen in 1944, and with them a document that is both a demand and, by their reading, a formality. The Crown of Saint Stephen has been taken out of its vault and is, for the first time in decades, being looked at by people in the same room."
 ukraine.33.a:0 "The government yields to the Crown."
 ukraine.33.b:0 "Resist. Hungary will not be a throne room."
