 ### POLITICAL ###
 UKR_kuchmagate:0 "Kuchmagate"
 UKR_kuchmagate_desc:0 "On the twenty-eighth of November, Oleksandr Moroz rises in the Verkhovna Rada and plays a recording made in the president's own office. The tapes, smuggled out by a major of the state guard, appear to capture Leonid Kuchma discussing the troublesome journalist Heorhiy Gongadze with his interior minister, weeks before Gongadze vanished and a headless body was found in a forest outside Kyiv. Whether the recordings are genuine will be argued over for years. What is certain is that the presidency will never look the same again."
 UKR_stand_with_the_president:0 "Stand with the President"
 UKR_stand_with_the_president_desc:0 "The recordings are a fabrication, assembled abroad by enemies who could not defeat the president at the ballot box. The state has institutions, and those institutions have loyalties. The prosecutor general, the tax administration, the governors and the television channels all understand what is being asked of them."
 UKR_ukraine_without_kuchma:0 "Ukraine without Kuchma"
 UKR_ukraine_without_kuchma_desc:0 "A tent city rises on Khreshchatyk and refuses to come down. Socialists march beside Rukh, and the men of UNA-UNSO guard the tents at night. The demands are simple: dismiss the interior minister, find out what happened to Gongadze, and let the president go."
 UKR_bury_the_cassette_scandal:0 "Bury the Cassette Scandal"
 UKR_bury_the_cassette_scandal_desc:0 "The tapes must be ruled inadmissible, the technical experts must find splices, and the major who made them must be discredited as a fantasist in foreign pay. None of this will convince the people on Khreshchatyk. It only needs to convince the deputies who would have to vote for impeachment."
 UKR_the_administrative_resource:0 "The Administrative Resource"
 UKR_the_administrative_resource_desc:0 "Every oblast has a governor appointed by the president. Every enterprise has a tax inspection it would rather avoid. Every broadcaster has a licence that comes up for renewal. Applied methodically this can deliver a parliament, a referendum or an election without a single ballot being miscounted."
 UKR_buy_the_rada_majority:0 "Buy the Rada Majority"
 UKR_buy_the_rada_majority_desc:0 "Impeachment requires votes, and votes can be arranged. The business factions want their privatisations confirmed, the communists want the reformist prime minister gone, and neither has any love for the national democrats camped outside."
 UKR_the_president_endures:0 "The President Endures"
 UKR_the_president_endures_desc:0 "The tents come down and less than one Ukrainian in a hundred was ever willing to stand in the cold for this. He has survived, but as a man everyone now knows the worst about, and the question of what comes after him has become the only question in Ukrainian politics."
 UKR_the_multi_vector_state:0 "The Multi-Vector State"
 UKR_the_multi_vector_state_desc:0 "Ukraine will not choose. It will sign association agreements in Brussels and energy deals in Moscow, send peacekeepers where the Americans ask and sell what the Russians want to buy, and remain permanently three years away from deciding."
 UKR_balance_the_clans:0 "Balance the Clans"
 UKR_balance_the_clans_desc:0 "Donetsk has the coal and the steel, Dnipropetrovsk the missiles and the pipelines, Kyiv the banks and the broadcasters. None may swallow the others, and all must need the president more than they need each other."
 UKR_ukraine_is_not_russia:0 "Ukraine Is Not Russia"
 UKR_ukraine_is_not_russia_desc:0 "A president who speaks Russian at home must still explain, to his own country and to the Kremlin, that the two states parted in 1991. Sovereignty is the one asset the presidency cannot trade away."
 UKR_the_kolchuga_affair:0 "The Kolchuga Affair"
 UKR_the_kolchuga_affair_desc:0 "The same recordings appear to capture the president approving the sale of a passive radar system to Baghdad. Washington freezes assistance and stops returning calls."
 UKR_the_single_economic_space:0 "The Single Economic Space"
 UKR_the_single_economic_space_desc:0 "Russia, Belarus, Kazakhstan and Ukraine agree a common economic area. Our negotiators insist it is free trade and nothing more. The Kremlin believes it has the beginning of a union."
 UKR_the_oligarch_republic:0 "The Oligarch Republic"
 UKR_the_oligarch_republic_desc:0 "The clans are balanced, the parliament is bought, the press knows its limits and the economy grows handsomely for the several hundred families that own it. Nobody is satisfied and nobody can do anything about it."
 UKR_the_social_democratic_turn:0 "The Social Democratic Turn"
 UKR_the_social_democratic_turn_desc:0 "The united social democrats are the most powerful party in the country and the least socialist thing in it: a Kyiv machine of lawyers, bankers and football club owners flying a red rose. Their leader has understood that oligarchy is far more durable when it pays pensions."
 UKR_the_temnyky:0 "The Temnyky"
 UKR_the_temnyky_desc:0 "Each week the administration sends the channels a set of themes: what is covered, in what order, in whose words, and what does not exist. The country simply stops being told certain things."
 UKR_the_socialist_international:0 "The Socialist International"
 UKR_the_socialist_international_desc:0 "Application is made to join the family of European social democracy. Respectability abroad is cheaper than reform at home and considerably more useful."
 UKR_the_kyiv_clan:0 "The Kyiv Clan Ascendant"
 UKR_the_kyiv_clan_desc:0 "Administration, courts, broadcasters and energy traders in a single pair of hands. The president is still the president. He is no longer the man who decides."
 UKR_pensions_and_arrears:0 "Pensions and Arrears"
 UKR_pensions_and_arrears_desc:0 "Raise the minimum pension, clear what is owed to the teachers and the miners, and make certain every recipient knows which party arranged it."
 UKR_the_political_reform:0 "The Political Reform"
 UKR_the_political_reform_desc:0 "A constitutional amendment will transfer the powers of the presidency to the parliament. Presented as democratisation, it is nothing of the kind."
 UKR_a_social_oligarchy:0 "A Social Oligarchy"
 UKR_a_social_oligarchy_desc:0 "The state is captured, and the capture is popular. It is not social democracy and it is not quite a dictatorship. It is something new, and it works."
 UKR_join_the_godfather:0 "Join the Godfather"
 UKR_join_the_godfather_desc:0 "Vladimir Putin, the godfather of our president's daughter, is a man that understands power. He has made it clear that he will not tolerate a Ukraine that is not his friend. We will join the godfather and be his friend, and we will be rewarded for it."

 ### POLITICAL IDEAS ###
 UKR_the_cassette_scandal:0 "The Cassette Scandal"
 UKR_the_cassette_scandal_desc:0 "Recordings from the president's office have been played in parliament. Authority is bleeding away by the week."
 UKR_the_scandal_contained:0 "The Scandal Contained"
 UKR_the_scandal_contained_desc:0 "The tapes are inadmissible and the courts have moved on. The country has not forgotten, but it has stopped expecting consequences."
 UKR_administrative_resource:0 "The Administrative Resource"
 UKR_administrative_resource_desc:0 "Governors, tax inspectors and licensing boards understand what is expected without being told in writing."
 UKR_balancing_east_and_west2:0 "Multi-Vector Diplomacy"
 UKR_balancing_east_and_west2_desc:0 "Every capital assured that the other is getting nothing of substance."
 UKR_balance_of_the_clans:0 "Balance of the Clans"
 UKR_balance_of_the_clans_desc:0 "Donetsk, Dnipropetrovsk and Kyiv are held in permanent rivalry, and the presidency is the only place where their disputes can be settled."
 UKR_the_kolchuga_affair_idea:0 "The Kolchuga Affair"
 UKR_the_kolchuga_affair_idea_desc:0 "Washington believes we sold radar to Baghdad. Assistance is frozen and our calls go unreturned."
 UKR_the_single_economic_space_idea:0 "The Single Economic Space"
 UKR_the_single_economic_space_idea_desc:0 "A common economic area with Russia, Belarus and Kazakhstan: free trade to us, the beginning of a union to them."
 UKR_the_oligarch_republic_idea:0 "The Oligarch Republic"
 UKR_the_oligarch_republic_idea_desc:0 "The clans are balanced, the parliament is bought and the arrangement governs itself. Nobody is satisfied and nobody can change it."
 UKR_the_temnyky_idea:0 "The Temnyky"
 UKR_the_temnyky_idea_desc:0 "Weekly instructions on what exists, what does not, and in whose words it is described."
 UKR_the_socialist_international_idea:0 "A European Sister Party"
 UKR_the_socialist_international_idea_desc:0 "Received in Brussels as fellow social democrats, which is worth a great deal and costs nothing."
 UKR_the_kyiv_clan_idea:0 "The Kyiv Clan"
 UKR_the_kyiv_clan_idea_desc:0 "Administration, courts, broadcasters and energy traders in a single pair of hands."
 UKR_pensions_and_arrears_idea:0 "Pensions Paid on Time"
 UKR_pensions_and_arrears_idea_desc:0 "The minimum pension has risen and the arrears are cleared, and every recipient knows exactly whom to thank."
 UKR_the_political_reform_idea:0 "The Political Reform"
 UKR_the_political_reform_idea_desc:0 "An amendment to move the powers, presented as democratisation."
 UKR_social_oligarchy:0 "Social Oligarchy"
 UKR_social_oligarchy_desc:0 "A captured state that pays its pensions on time. The same dozen men own everything, and the country is broadly content."

 ### POLITICAL - FOCUSES ###
 UKR_neither_east_nor_west:0 "Neither East nor West"
 UKR_neither_east_nor_west_desc:0 "Choosing is what small countries do. Our delegations will nod in Brussels on Monday and sign in Moscow on Thursday, and both capitals will be assured the other is receiving nothing of substance."
 UKR_the_2000_referendum:0 "The April Referendum"
 UKR_the_2000_referendum_desc:0 "Four questions are put to the people: a second chamber, fewer deputies, an end to parliamentary immunity, and the right to dissolve a parliament that cannot form a majority. All pass overwhelmingly. Whether they are ever implemented matters less than the standing threat that they might be."
 UKR_the_dnipropetrovsk_family:0 "The Dnipropetrovsk Family"
 UKR_the_dnipropetrovsk_family_desc:0 "The president came from there and so did half the government. The rocket plant, the pipe mills and the banks of the lower Dnipro form the oldest of the clans, and its loyalty is assumed rather than purchased."
 UKR_a_tame_parliament:0 "A Tame Parliament"
 UKR_a_tame_parliament_desc:0 "A majority assembled from business factions, regional machines and deputies whose enterprises depend on decisions not yet taken. It will not obey, exactly. It will simply never be able to agree on disobedience."
 UKR_the_moscow_channel:0 "The Moscow Channel"
 UKR_the_moscow_channel_desc:0 "Gas arrives, debts accumulate, and the arrangements that settle them are made between a handful of men in two capitals. Formal treaties matter less than the understanding that the heating will stay on through the winter."
 UKR_the_donetsk_bosses:0 "The Donetsk Bosses"
 UKR_the_donetsk_bosses_desc:0 "The coal and steel of the east are being consolidated by a generation younger and harder than the men of Dnipropetrovsk. They are becoming too large to exclude, and they will expect a price."
 UKR_the_2002_elections:0 "The 2002 Elections"
 UKR_the_2002_elections_desc:0 "The opposition wins the party-list vote and loses the parliament. Half the seats are elected in districts where governors and grateful directors can be brought to bear. The administrative resource has passed its examination."
 UKR_the_nato_partnership:0 "The NATO Partnership"
 UKR_the_nato_partnership_desc:0 "Ukrainian battalions train with Poles at Yavoriv and officers go to Western staff colleges. None of it commits us to membership and all of it reminds Moscow that we have alternatives."
 UKR_the_energy_traders:0 "The Energy Traders"
 UKR_the_energy_traders_desc:0 "Between the Russian pipeline and the Ukrainian consumer sit intermediary companies of uncertain ownership and extraordinary profit. They are the true treasury of the system, and nobody inside it wants the question clarified."
 UKR_the_iraq_contingent:0 "The Iraq Contingent"
 UKR_the_iraq_contingent_desc:0 "A mechanised brigade to southern Iraq under Polish command. The country does not want this and the army can barely afford it, but a president under sanction needs something to offer Washington."
 UKR_the_gas_transit_monopoly:0 "The Gas Transit Monopoly"
 UKR_the_gas_transit_monopoly_desc:0 "Four fifths of Russian gas bound for Europe crosses our territory. So long as the valve is ours, neither east nor west can afford to let us fail."
 UKR_the_arms_export_boom:0 "The Arms Export Boom"
 UKR_the_arms_export_boom_desc:0 "The Soviet Union left us tanks, transport aircraft and warehouses nobody inventoried. Buyers exist in places that cannot be named in the annual report."
 UKR_privatize_to_friends:0 "Privatize to Friends"
 UKR_privatize_to_friends_desc:0 "The largest steelworks in the country is sold far below what foreign bidders offered, to a consortium of the president's son-in-law and the leading man of Donetsk. This is not a failure of the privatisation programme. It is the programme."
 UKR_the_black_sea_fleet_lease:0 "The Sevastopol Lease"
 UKR_the_black_sea_fleet_lease_desc:0 "The Russian fleet stays until 2017 and the rent is paid in gas debt written off. Every year of the lease is a year in which Crimea remains a Russian question rather than a Ukrainian one."
 UKR_choose_a_successor:0 "Choose a Successor"
 UKR_choose_a_successor_desc:0 "The term ends in 2004 and the constitution is explicit. The question is who arrives, and the answer must be a man who owes his position entirely to us."
 UKR_guarantee_our_immunity:0 "Guarantee Our Immunity"
 UKR_guarantee_our_immunity_desc:0 "Whatever is on those recordings, no court must ever rule on it. A retirement is only comfortable if it is also permanent."
 UKR_the_system_outlives_the_man:0 "The System Outlives the Man"
 UKR_the_system_outlives_the_man_desc:0 "The president goes and nothing changes. It was never really about one man, which is why removing him was never going to be enough."
 UKR_the_united_social_democrats:0 "The United Social Democrats"
 UKR_the_united_social_democrats_desc:0 "A programme borrowed wholesale from Western Europe and a membership drawn entirely from people who own things. The best-organised machine in the country, precisely because nobody in it mistakes it for a movement."
 UKR_the_rose_and_the_bank:0 "The Rose and the Bank"
 UKR_the_rose_and_the_bank_desc:0 "Behind the party stand the energy traders, the football club and a bank that handles accounts no one else will touch. Social democracy is an expensive product to manufacture."
 UKR_take_the_administration:0 "Take the Administration"
 UKR_take_the_administration_desc:0 "Our man becomes head of the presidential administration, and within a year the appointments, the briefings and the access all pass through him. The president has not been deposed. He has been surrounded."
 UKR_capture_the_courts:0 "Capture the Courts"
 UKR_capture_the_courts_desc:0 "Judges are appointed for life, so appointing the right ones now settles a great many questions later. Nothing illegal will ever be necessary again."
 UKR_the_inter_channel:0 "The Inter Channel"
 UKR_the_inter_channel_desc:0 "The most watched station in the country passes into friendly hands. Its coverage of the opposition is scrupulously fair, in the sense that the opposition is scrupulously never shown."
 UKR_the_party_of_power:0 "The Party of Power"
 UKR_the_party_of_power_desc:0 "Governors, mayors, rectors and directors are invited to join, and those who decline hear the invitation repeated in less agreeable terms. The party needs only to be the organisation everyone with something to lose already belongs to."
 UKR_the_european_choice:0 "The European Choice"
 UKR_the_european_choice_desc:0 "Association with the Union is declared a strategic priority and written into every programme document. Europe is not a destination. It is an excellent thing to be travelling towards."
 UKR_the_social_contract:0 "The Social Contract"
 UKR_the_social_contract_desc:0 "The bargain is stated plainly enough to be understood without being said. The state will pay your pension, keep the heating on and leave you alone. You will not ask who owns the refinery."
 UKR_the_new_labour_code:0 "The New Labour Code"
 UKR_the_new_labour_code_desc:0 "A modern code drafted with European sister parties, guaranteeing rights that sound magnificent read aloud in Strasbourg. Enforcement is left to secondary legislation."
 UKR_subsidize_the_utilities:0 "Subsidize the Utilities"
 UKR_subsidize_the_utilities_desc:0 "Household gas and heating sold far below import cost, the difference absorbed by the budget. Ruinous economics and unbeatable politics."
 UKR_a_parliamentary_republic:0 "A Parliamentary Republic"
 UKR_a_parliamentary_republic_desc:0 "Whoever controls the largest faction controls the country, and our party intends to control the largest faction long after the current president has retired to write his memoirs."
 UKR_buy_the_unions:0 "Buy the Unions"
 UKR_buy_the_unions_desc:0 "The federation inherited the sanatoria, the holiday vouchers and millions who never chose to join. Ukraine will not have a labour movement, but it will have very well-appointed labour officials."
 UKR_the_godfather_in_moscow:0 "The Godfather in Moscow"
 UKR_the_godfather_in_moscow_desc:0 "The Russian president stands as godfather to our leader's daughter. Gas contracts and campaign advice become easier to arrange, and so does the suspicion about where the party's real headquarters is."
 UKR_the_permanent_coalition:0 "The Permanent Coalition"
 UKR_the_permanent_coalition_desc:0 "Government becomes a matter of arithmetic, and the arithmetic is ours. The coalition is renewed after each election by the same men in the same room."
 UKR_manage_the_succession:0 "Manage the Succession"
 UKR_manage_the_succession_desc:0 "The old president retires with his immunity and his memoirs. The transition is smooth because there is nothing left to transition."
 UKR_solidarity_incorporated:0 "Solidarity Incorporated"
 UKR_solidarity_incorporated_desc:0 "Pensions arrive on the first of the month, the television is calm, and the same dozen men own everything worth owning. The country is not oppressed and it is not free."
 UKR_the_interior_ministry:0 "The Interior Ministry"
 UKR_the_interior_ministry_desc:0 "There is a voice on those recordings besides the president's, and it belongs to the man who commands three hundred thousand armed people. He can be sacrificed to the scandal or he can be given the state."
 UKR_shield_the_minister:0 "Shield the Minister"
 UKR_shield_the_minister_desc:0 "No investigation will touch him and no prosecutor will name him. A minister who cannot be prosecuted is a minister who owes everything to the man protecting him."
 UKR_expand_the_berkut:0 "Expand the Berkut"
 UKR_expand_the_berkut_desc:0 "The special units are doubled, re-equipped and paid on time, which distinguishes them from every other institution in the country. They train for crowd dispersal rather than for anything a soldier would recognise."
 UKR_a_state_of_order:0 "A State of Order"
 UKR_a_state_of_order_desc:0 "The interior ministry ceases to be a department and becomes the central organ of the state. The men who ran the country through arrangements discover that arrangements require someone willing to enforce them."
 UKR_the_internal_troops:0 "The Internal Troops"
 UKR_the_internal_troops_desc:0 "Tens of thousands of conscripts under the ministry rather than the general staff, armed for use inside our own borders. The army may keep its tanks, two hundred kilometres from anywhere that matters."
 UKR_purge_the_security_service:0 "Purge the Security Service"
 UKR_purge_the_security_service_desc:0 "Its leadership is replaced with ministry men, its counter-intelligence is pointed inward, and the officers who ask what happened to Gongadze are transferred to the Carpathians."
 UKR_rule_by_decree:0 "Rule by Decree"
 UKR_rule_by_decree_desc:0 "The parliament is not dissolved, which would attract attention. It is bypassed. Decrees acquire the force of law in every matter touching security, and security is defined by us."
 UKR_militarize_the_militsiya:0 "Militarize the Militsiya"
 UKR_militarize_the_militsiya_desc:0 "The ordinary policeman, underpaid and previously despised, is given rank, a bonus and the certainty that nobody will investigate him. He becomes the most enthusiastic supporter the government has."
 UKR_files_on_everyone:0 "Files on Everyone"
 UKR_files_on_everyone_desc:0 "Every deputy, editor, businessman and bishop acquires a folder. Most contain nothing worse than a tax irregularity, and that is sufficient."
 UKR_govern_by_emergency:0 "Govern by Emergency"
 UKR_govern_by_emergency_desc:0 "A permanent state of heightened alert, renewed quarterly by a parliament that has learned not to ask what the threat is."
 UKR_break_the_opposition:0 "Break the Opposition"
 UKR_break_the_opposition_desc:0 "The camps are cleared before dawn and the organisers charged with offences carrying real sentences. There will be an opposition. It will be small, elderly and permitted."
 UKR_the_loyal_press:0 "The Loyal Press"
 UKR_the_loyal_press_desc:0 "Newspapers are not closed. Their printing houses are inspected and their owners offered a fair price by a consortium nobody can identify."
 UKR_the_disappearances:0 "The Disappearances"
 UKR_the_disappearances_desc:0 "It begins with the ones who cannot be charged and does not stay there. No order is written down, which is precisely why it cannot be stopped."
 UKR_the_border_troops:0 "The Border Troops"
 UKR_the_border_troops_desc:0 "The frontier service is brought under the ministry and turned inward as much as outward. A man who cannot obtain an exit stamp must make his peace with the government."
 UKR_the_tax_police:0 "The Tax Police"
 UKR_the_tax_police_desc:0 "An armed inspectorate with powers of arrest and a revenue target. Every enterprise is guilty of something, because the tax code was written to ensure it."
 UKR_the_officer_class:0 "The Officer Class"
 UKR_the_officer_class_desc:0 "The army must be reconciled to a state run by policemen. A general with a pension and a dacha has little appetite for constitutional questions."
 UKR_weather_the_sanctions:0 "Weather the Sanctions"
 UKR_weather_the_sanctions_desc:0 "Visa bans, frozen assets and principled language from capitals that continue to buy our steel. Nothing consolidates a siege mentality like an actual siege."
 UKR_a_garrison_economy:0 "A Garrison Economy"
 UKR_a_garrison_economy_desc:0 "If the West will not trade with us, the state will produce what the state requires. The defence plants receive orders they have not seen since 1989."
 UKR_the_eastern_guarantee:0 "The Eastern Guarantee"
 UKR_the_eastern_guarantee_desc:0 "Exactly one great power does not object to how we govern, and its objections were never about methods. The price is that we are no longer entirely our own."
 UKR_the_police_state:0 "The Police State"
 UKR_the_police_state_desc:0 "No ideology and no programme beyond continuation. The population has learned that the surest way to be left alone is to want nothing."
 UKR_no_more_elections:0 "No More Elections"
 UKR_no_more_elections_desc:0 "The vote is postponed on grounds of security, and the postponement renewed. A date is simply moved, and then moved again, until nobody remembers what it was for."
 UKR_the_ministry_is_the_state:0 "The Ministry Is the State"
 UKR_the_ministry_is_the_state_desc:0 "Appointments to every ministry, oblast and state enterprise pass through the ministry's personnel directorate. The government has not been abolished. It has been staffed."
 UKR_order_above_all:0 "Order Above All"
 UKR_order_above_all_desc:0 "Ukraine is quiet. Nobody says anything in a stairwell they would not say in a police station. Whether this is a country or a territory under administration can no longer be asked aloud."
 UKR_the_donbas_ascendant:0 "The Donbas Ascendant"
 UKR_the_donbas_ascendant_desc:0 "The coal and steel of the east have finished consolidating and want their turn. Their man is a governor with a conviction record, a builder's vocabulary and the absolute loyalty of every director between Donetsk and Luhansk."
 UKR_the_party_of_regions:0 "The Party of Regions"
 UKR_the_party_of_regions_desc:0 "Not a party in any sense a political scientist would recognise but a machine of mining directors, city bosses and football clubs. It does not need members. It needs oblasts, and it has eight of them entirely."
 UKR_the_red_directors:0 "The Red Directors"
 UKR_the_red_directors_desc:0 "The men who ran the Soviet combines never left, they merely acquired the shares. They are hostile to competition and they employ a third of the working population of the east."
 UKR_the_premiership:0 "The Premiership"
 UKR_the_premiership_desc:0 "The capital's press spends a fortnight on his grammar. Meanwhile the ministries fill with people from Donetsk and the question of who governs is settled well before anyone votes on it."
 UKR_the_political_technologists:0 "The Political Technologists"
 UKR_the_political_technologists_desc:0 "Advisers arrive from Moscow with a theory of how electorates are assembled rather than persuaded. The campaign they design will divide the country along a line that never quite goes away."
 UKR_double_the_pensions:0 "Double the Pensions"
 UKR_double_the_pensions_desc:0 "The minimum pension doubled in a single budget, months before the vote, with no explanation of where the money comes from. The economists are appalled and the pensioners are not."
 UKR_the_language_question:0 "The Language Question"
 UKR_the_language_question_desc:0 "Half the country speaks Russian at home and has been told for a decade that this is a temporary condition to be corrected. Raising it costs nothing in the east and everything in the west."
 UKR_the_industrial_east:0 "The Industrial East"
 UKR_the_industrial_east_desc:0 "Budget transfers, subsidised coal and state orders flow to the oblasts that vote correctly. The east has watched Kyiv take its taxes and return contempt, and has found a government that returns money instead."
 UKR_the_canonical_church:0 "The Canonical Church"
 UKR_the_canonical_church_desc:0 "The Moscow Patriarchate has more parishes than any other body in the country and a clergy with opinions about which candidate represents Orthodox civilisation."
 UKR_two_state_languages:0 "Two State Languages"
 UKR_two_state_languages_desc:0 "Russian is proposed as a second state language and the country divides along the line the pollsters drew. This is not a failure of the policy. This is the policy."
 UKR_the_tuzla_crisis:0 "The Tuzla Crisis"
 UKR_the_tuzla_crisis_desc:0 "Our great friend begins building a causeway across the Kerch Strait towards an island that is indisputably ours, and does not answer the telephone while doing it."
 UKR_the_gas_price_bargain:0 "The Gas Price Bargain"
 UKR_the_gas_price_bargain_desc:0 "A price no market could produce, fixed for years, in exchange for arrangements never published. Industry becomes profitable overnight and the country acquires a tap somebody else can turn."
 UKR_the_2004_campaign:0 "The 2004 Campaign"
 UKR_the_2004_campaign_desc:0 "Everything rests on a single vote. The television is ours, the pensions are paid and the advisers have mapped every district. It will still be close, because half the country would rather have anyone else."
 UKR_the_administrative_count:0 "The Administrative Count"
 UKR_the_administrative_count_desc:0 "Absentee ballots, mobile urns and turnout figures in certain eastern districts that would embarrass a Soviet statistician. Whether the result is believed is a separate question."
 UKR_the_eastern_bloc_vote:0 "The Eastern Bloc Vote"
 UKR_the_eastern_bloc_vote_desc:0 "Nine oblasts deliver majorities no campaign could have earned and every director could have arranged. The foremen count the ballots, because they always have."
 UKR_the_kremlin_endorsement:0 "The Kremlin Endorsement"
 UKR_the_kremlin_endorsement_desc:0 "The Russian president visits twice and congratulates us on our victory before the count is finished. Worth several points in the east and rather more than that to the other side in the west."
 UKR_the_federalization_question:0 "The Federalization Question"
 UKR_the_federalization_question_desc:0 "If the capital cannot be relied upon, the regions must be given powers the capital cannot revoke. A country that cannot be governed from Kyiv can still be governed from Donetsk."
 UKR_suppress_the_squares:0 "Suppress the Squares"
 UKR_suppress_the_squares_desc:0 "They come out anyway, in the cold, in numbers nobody forecast. Whatever happens next, the pretence that this is a normal election does not survive the night."
 UKR_join_the_single_economic_space:0 "Join the Single Economic Space"
 UKR_join_the_single_economic_space_desc:0 "The customs union is signed without the reservations our predecessors insisted upon. Sovereignty is not surrendered in a treaty. It is subcontracted."
 UKR_the_satellite_state:0 "The Satellite State"
 UKR_the_satellite_state_desc:0 "A flag, an anthem, a parliament and a seat at the United Nations. Also a gas price set elsewhere, a fleet in our principal port and a foreign policy that has never once diverged. Nobody has annexed anything."
 UKR_the_fleet_stays_forever:0 "The Fleet Stays Forever"
 UKR_the_fleet_stays_forever_desc:0 "The lease is extended indefinitely in exchange for a discount. Crimea becomes a question Ukraine has agreed not to ask."
 UKR_abandon_the_european_course:0 "Abandon the European Course"
 UKR_abandon_the_european_course_desc:0 "The negotiations are suspended and the word Europe disappears from official documents. We have not been rejected by the West. We have stopped pretending we were going there."
 UKR_the_junior_partner:0 "The Junior Partner"
 UKR_the_junior_partner_desc:0 "Ukraine remains a state and has ceased to be a subject. The arrangement is stable for exactly as long as the larger partner finds it useful."

 ### POLITICAL - NATIONAL SPIRITS ###
 UKR_the_movement_on_the_streets:0 "The Movement on the Streets"
 UKR_the_movement_on_the_streets_desc:0 "A tent city on Khreshchatyk and a coalition of everyone who wants the president gone."
 UKR_administrative_resource_kuchma:0 "The Resource in Balance"
 UKR_administrative_resource_kuchma_desc:0 "Applied by an arbiter who needs every clan to keep needing him."
 UKR_administrative_resource_courts:0 "The Resource in Chambers"
 UKR_administrative_resource_courts_desc:0 "Judges appointed for life, and appointments that pass through one office."
 UKR_administrative_resource_decree:0 "The Resource Under Decree"
 UKR_administrative_resource_decree_desc:0 "The ministry no longer asks the governors. It instructs them."
 UKR_administrative_resource_count:0 "The Resource at the Count"
 UKR_administrative_resource_count_desc:0 "Directors, foremen and mobile urns, all pointing the same way."
 UKR_balancing_east_and_west3:0 "Multi-Vector Diplomacy Refined"
 UKR_balancing_east_and_west3_desc:0 "Association in Brussels, customs union in Moscow, signature on neither."
 UKR_balancing_east_and_west4:0 "Perfected Multi-Vector Diplomacy"
 UKR_balancing_east_and_west4_desc:0 "A country nobody trusts entirely is a country nobody can take for granted."
 UKR_the_arrangement:0 "The Arrangement"
 UKR_the_arrangement_desc:0 "Three clans in permanent rivalry and one place where their disputes can be settled."
 UKR_the_arrangement2:0 "The Arrangement Consolidated"
 UKR_the_arrangement2_desc:0 "The parliament is bought and the count is whatever the governors say it is."
 UKR_the_arrangement3:0 "The Oligarch Republic"
 UKR_the_arrangement3_desc:0 "Nobody is satisfied and nobody can change it. A state that has become an arrangement rather than a project."
 UKR_the_clans:0 "The Dnipro Machine"
 UKR_the_clans_desc:0 "Rocket plants, pipe mills and banks whose loyalty is assumed rather than bought."
 UKR_the_clans2:0 "Dnipro and Donetsk"
 UKR_the_clans2_desc:0 "Coal and steel brought inside the arrangement, at their price."
 UKR_the_clans3:0 "The Clans Enriched"
 UKR_the_clans3_desc:0 "The steelworks sold below value to the men who were always going to get it."
 UKR_the_april_referendum:0 "The April Mandate"
 UKR_the_april_referendum_desc:0 "Four questions carried overwhelmingly, and a standing threat that they might one day be implemented."
 UKR_neither_east_nor_west_idea:0 "Neither East nor West"
 UKR_neither_east_nor_west_idea_desc:0 "Committing to nobody and extracting concessions from everybody."
 UKR_sovereignty_is_the_asset:0 "Sovereignty Is the Asset"
 UKR_sovereignty_is_the_asset_desc:0 "The one thing the presidency cannot trade away, because without it there is nothing to bargain with."
 UKR_the_moscow_channel_idea:0 "The Moscow Channel"
 UKR_the_moscow_channel_idea_desc:0 "Arrangements between a handful of men in two capitals, which keep the heating on."
 UKR_the_nato_partnership_idea:0 "The NATO Partnership"
 UKR_the_nato_partnership_idea_desc:0 "Yavoriv, staff colleges and an action plan committing us to nothing at all."
 UKR_the_energy_complex:0 "The Energy Traders"
 UKR_the_energy_complex_desc:0 "Intermediaries of uncertain ownership and extraordinary profit. The true treasury of the system."
 UKR_the_energy_complex2:0 "The Transit Monopoly"
 UKR_the_energy_complex2_desc:0 "Four fifths of Europe's Russian gas crosses our soil. Nobody can afford to let us fail."
 UKR_the_arms_export_boom_idea:0 "The Arms Export Boom"
 UKR_the_arms_export_boom_idea_desc:0 "Soviet stockpiles, willing buyers and the occasional embarrassment in front of the Americans."
 UKR_the_sevastopol_lease:0 "The Sevastopol Lease"
 UKR_the_sevastopol_lease_desc:0 "The Russian fleet stays until 2017 and the rent is paid in forgiven debt."
 UKR_the_chosen_successor:0 "The Chosen Successor"
 UKR_the_chosen_successor_desc:0 "A candidate who owes us everything and knows precisely what is expected in return."
 UKR_guaranteed_immunity:0 "Guaranteed Immunity"
 UKR_guaranteed_immunity_desc:0 "No court will ever rule on what is on those recordings."
 UKR_the_party_of_power_idea:0 "The United Social Democrats"
 UKR_the_party_of_power_idea_desc:0 "A red rose over a machine of lawyers, bankers and football club owners."
 UKR_the_party_of_power_idea2:0 "The Party of Power"
 UKR_the_party_of_power_idea2_desc:0 "The organisation to which everyone with something to lose already belongs."
 UKR_the_party_of_power_idea3:0 "The Permanent Coalition"
 UKR_the_party_of_power_idea3_desc:0 "Government by arithmetic, and the arithmetic is ours."
 UKR_the_social_contract_idea:0 "Pensions Paid on Time"
 UKR_the_social_contract_idea_desc:0 "The arrears are cleared and every recipient knows exactly whom to thank."
 UKR_the_social_contract_idea2:0 "The Social Contract"
 UKR_the_social_contract_idea2_desc:0 "Pensions on time, the heating subsidised, and nobody asking who owns the refinery."
 UKR_the_social_contract_idea3:0 "Solidarity Incorporated"
 UKR_the_social_contract_idea3_desc:0 "Not oppressed and not free. Comfortable, and comfort has turned out to be enough."
 UKR_the_temnyky_idea2:0 "The Broadcasters Aligned"
 UKR_the_temnyky_idea2_desc:0 "Ukrainians are not lied to. They are simply not informed."
 UKR_a_parliamentary_republic_idea:0 "A Parliamentary Republic"
 UKR_a_parliamentary_republic_idea_desc:0 "The office we could not hold has been abolished in favour of a majority we can always assemble."
 UKR_solidarity_incorporated_idea:0 "The Party Is the State"
 UKR_solidarity_incorporated_idea_desc:0 "Ministries distributed among factions and an opposition given committees that decide nothing."
 UKR_the_rose_and_the_bank_idea:0 "The Rose and the Bank"
 UKR_the_rose_and_the_bank_idea_desc:0 "Energy traders, a football club and a bank that handles what others will not."
 UKR_the_european_choice_idea:0 "The European Choice"
 UKR_the_european_choice_idea_desc:0 "Europe is not a destination. It is an excellent thing to be travelling towards."
 UKR_the_pensioners_vote:0 "The Pensioners' Vote"
 UKR_the_pensioners_vote_desc:0 "Eleven million people with a standing reason to be grateful and a reliable habit of voting."
 UKR_the_new_labour_code_idea:0 "The New Labour Code"
 UKR_the_new_labour_code_idea_desc:0 "Rights that sound magnificent in Strasbourg, with enforcement left to secondary legislation."
 UKR_tame_unions:0 "Tame Unions"
 UKR_tame_unions_desc:0 "No labour movement, but very well-appointed labour officials."
 UKR_the_godfather_in_moscow_idea:0 "The Godfather in Moscow"
 UKR_the_godfather_in_moscow_idea_desc:0 "A christening worth more than any treaty, and a suspicion that never quite goes away."
 UKR_the_permanent_coalition_idea:0 "The Coalition Renewed"
 UKR_the_permanent_coalition_idea_desc:0 "The same men in the same room after every election."
 UKR_the_managed_succession:0 "The Managed Succession"
 UKR_the_managed_succession_desc:0 "A smooth transition, because there is nothing left to transition."
 UKR_the_interior_ministry_idea:0 "The Interior Ministry"
 UKR_the_interior_ministry_idea_desc:0 "Three hundred thousand armed men and one minister who cannot be sacked."
 UKR_a_state_of_order_idea:0 "A State of Order"
 UKR_a_state_of_order_idea_desc:0 "The ministry is no longer a department of the state. It is the state."
 UKR_the_police_state_idea:0 "The Police State"
 UKR_the_police_state_idea_desc:0 "No ideology and no programme beyond continuation. It is not popular and was never meant to be."
 UKR_the_police_state_idea2:0 "Order Above All"
 UKR_the_police_state_idea2_desc:0 "Nobody says anything in a stairwell they would not say in a police station."
 UKR_the_apparatus:0 "The Apparatus"
 UKR_the_apparatus_desc:0 "Counter-intelligence pointed inward, and the awkward officers sent to the Carpathians."
 UKR_the_apparatus2:0 "The Apparatus Extended"
 UKR_the_apparatus2_desc:0 "The point of a file is not to be used. It is to be known to exist."
 UKR_the_apparatus3:0 "The Apparatus Entrenched"
 UKR_the_apparatus3_desc:0 "Nothing is organised in this country without the ministry knowing who organised it."
 UKR_the_apparatus4:0 "The Apparatus Triumphant"
 UKR_the_apparatus4_desc:0 "There will be an opposition. It will be small, elderly and permitted."
 UKR_the_riot_police:0 "The Berkut"
 UKR_the_riot_police_desc:0 "Special units paid on time, which distinguishes them from everyone else."
 UKR_the_riot_police2:0 "The Internal Troops"
 UKR_the_riot_police2_desc:0 "Conscripts armed for use inside our own borders, near the cities that need watching."
 UKR_the_riot_police3:0 "The Militarized Militsiya"
 UKR_the_riot_police3_desc:0 "Automatic weapons, armoured transport and a quota in every district station."
 UKR_government_by_emergency:0 "Government by Emergency"
 UKR_government_by_emergency_desc:0 "Powers renewed indefinitely become the ordinary condition of the state."
 UKR_the_loyal_press_idea:0 "The Loyal Press"
 UKR_the_loyal_press_idea_desc:0 "Uniformly professional, uniformly supportive and uniformly uninformative."
 UKR_the_disappearances_idea:0 "The Disappearances"
 UKR_the_disappearances_idea_desc:0 "No order was written down, which is precisely why it cannot be stopped."
 UKR_the_border_troops_idea:0 "The Border Troops"
 UKR_the_border_troops_idea_desc:0 "Who leaves matters as much as who enters."
 UKR_the_tax_police_idea:0 "The Tax Police"
 UKR_the_tax_police_idea_desc:0 "Compliance is a matter of political standing rather than accountancy."
 UKR_the_officer_class_idea:0 "The Officer Class"
 UKR_the_officer_class_idea_desc:0 "A general with a pension and a dacha has little appetite for constitutional questions."
 UKR_weathered_sanctions:0 "Under Sanction"
 UKR_weathered_sanctions_desc:0 "Poorer and stronger. Nothing consolidates a siege mentality like an actual siege."
 UKR_a_garrison_economy_idea:0 "A Garrison Economy"
 UKR_a_garrison_economy_idea_desc:0 "The defence plants have orders they have not seen since 1989. The consumer has patience."
 UKR_the_eastern_guarantee_idea:0 "The Eastern Guarantee"
 UKR_the_eastern_guarantee_idea_desc:0 "One great power that has never objected to our methods, and no awkward questions."
 UKR_no_more_elections_idea:0 "No More Elections"
 UKR_no_more_elections_idea_desc:0 "A date moved, and then moved again, until nobody remembers what it was for."
 UKR_the_ministry_is_the_state_idea:0 "The Ministry Is the State"
 UKR_the_ministry_is_the_state_idea_desc:0 "The government has not been abolished. It has been staffed."
 UKR_the_donbas_machine:0 "The Donbas Machine"
 UKR_the_donbas_machine_desc:0 "The east has finished consolidating and wants its turn."
 UKR_the_donbas_machine2:0 "The Donbas in Government"
 UKR_the_donbas_machine2_desc:0 "The ministries fill with people from Donetsk and the budget acquires an eastern accent."
 UKR_the_donbas_machine3:0 "The Donbas Triumphant"
 UKR_the_donbas_machine3_desc:0 "Decisions of consequence are taken in Donetsk and announced in Kyiv."
 UKR_the_party_of_regions_idea:0 "The Party of Regions"
 UKR_the_party_of_regions_idea_desc:0 "It does not need members. It needs oblasts, and it has eight of them entirely."
 UKR_the_party_of_regions_idea2:0 "The Regions Mobilised"
 UKR_the_party_of_regions_idea2_desc:0 "Advisers, television and eleven million pensioners, all pointed at a single date."
 UKR_the_party_of_regions_idea3:0 "The Regions Deliver"
 UKR_the_party_of_regions_idea3_desc:0 "Majorities no campaign could have earned and every director could have arranged."
 UKR_the_eastern_alignment:0 "The Eastern Alignment"
 UKR_the_eastern_alignment_desc:0 "Congratulations on a victory announced before the count was finished."
 UKR_the_eastern_alignment2:0 "The Alignment Deepened"
 UKR_the_eastern_alignment2_desc:0 "Customs union, military access and a gas price no market could produce."
 UKR_the_eastern_alignment3:0 "The Junior Partner"
 UKR_the_eastern_alignment3_desc:0 "Still a state, no longer a subject. Stable for as long as the larger partner finds it useful."
 UKR_the_red_directors_idea:0 "The Red Directors"
 UKR_the_red_directors_idea_desc:0 "They never left the combines, they merely acquired the shares."
 UKR_the_red_directors_idea2:0 "The Combines Restarted"
 UKR_the_red_directors_idea2_desc:0 "State orders, subsidised coal and furnaces lit that have been cold for a decade."
 UKR_the_political_technologists_idea:0 "The Political Technologists"
 UKR_the_political_technologists_idea_desc:0 "Electorates are not persuaded. They are assembled."
 UKR_the_double_pension:0 "The Double Pension"
 UKR_the_double_pension_desc:0 "Doubled in a single budget with no explanation of where the money comes from."
 UKR_the_language_question_idea:0 "The Language Question"
 UKR_the_language_question_idea_desc:0 "A divided country is easier to win than a united one."
 UKR_two_state_languages_idea:0 "Two State Languages"
 UKR_two_state_languages_idea_desc:0 "The west is outraged, the east is mobilised, and the centre is made to choose."
 UKR_the_canonical_church_idea:0 "The Canonical Church"
 UKR_the_canonical_church_idea_desc:0 "Not bought, exactly. Aligned, which is cheaper and more durable."
 UKR_the_tuzla_crisis_idea:0 "The Tuzla Crisis"
 UKR_the_tuzla_crisis_idea_desc:0 "An instructive demonstration of what the friendship is actually worth."
 UKR_the_gas_price_bargain_idea:0 "The Gas Price Bargain"
 UKR_the_gas_price_bargain_idea_desc:0 "Industry profitable overnight, and somebody else now owns the tap."
 UKR_the_federalization_idea:0 "Federalization"
 UKR_the_federalization_idea_desc:0 "A country that cannot be governed from Kyiv can still be governed from Donetsk."
 UKR_suppressed_squares:0 "The Squares Suppressed"
 UKR_suppressed_squares_desc:0 "The pretence that this is a normal country holding a normal election did not survive the night."
 UKR_the_fleet_forever:0 "The Fleet Stays Forever"
 UKR_the_fleet_forever_desc:0 "Crimea becomes a question Ukraine has agreed not to ask."
 UKR_abandon_europe:0 "The European Course Abandoned"
 UKR_abandon_europe_desc:0 "We have not been rejected by the West. We have stopped pretending we were going there."

 ### POLITICAL - THE GREENS AND THE COMMUNISTS ###
 UKR_the_party_of_greens:0 "The Party of Greens"
 UKR_the_party_of_greens_desc:0 "Nineteen deputies elected in 1998 on a party most of the country took for a business project with a good logo. Half of it was. The other half spent the nineties measuring caesium in milk, sat quietly in the president's majority, and has been waiting a very long time for somebody to ask what the readings said."
 UKR_the_green_faction:0 "The Green Faction"
 UKR_the_green_faction_desc:0 "The businessmen who bought their way onto the list are invited to find another vehicle. What remains is small, unfashionable and in possession of twelve years of data nobody else has bothered to collect."
 UKR_the_greens_take_power:0 "The Greens Take Power"
 UKR_the_greens_take_power_desc:0 "A government formed around the proposition that the state should stop poisoning the people who live in it. Every ministry with a budget regards this as a temporary aberration and intends to outlast it."
 UKR_the_nuclear_question:0 "The Nuclear Question"
 UKR_the_nuclear_question_desc:0 "Fifteen Soviet-designed units supply half our electricity, several of them the same generation as the one that exploded. Everything this government does will be measured against how it answers this."
 UKR_close_chornobyl:0 "Close Chornobyl"
 UKR_close_chornobyl_desc:0 "Reactor Three shuts down on the fifteenth of December and the station stops generating for the first time in twenty-three years. It costs us six percent of our power and something considerably harder to price."
 UKR_the_zone_of_alienation:0 "The Zone of Alienation"
 UKR_the_zone_of_alienation_desc:0 "Two and a half thousand square kilometres of forest, empty villages and a river system nobody has properly surveyed since 1986. The largest accidental wilderness in Europe and the most carefully fenced."
 UKR_the_new_safe_confinement:0 "The New Safe Confinement"
 UKR_the_new_safe_confinement_desc:0 "The sarcophagus was poured in 1986 by men working in ninety-second shifts and was never meant to last this long. The replacement is an arch the size of a cathedral, assembled at a distance and rolled into place."
 UKR_phase_out_the_reactors:0 "Phase Out the Reactors"
 UKR_phase_out_the_reactors_desc:0 "The party was founded to close them and will not now discover reasons to keep them. Half our generating capacity goes, the lights dim, and no parent has to ask a doctor about a thyroid again."
 UKR_the_atom_is_green:0 "The Atom Is Green"
 UKR_the_atom_is_green_desc:0 "A split the party has avoided since it was founded. Nuclear power emits nothing, the alternative here is Donbas coal, and the coal kills more people every year than Chornobyl did. The founders call this a betrayal. It is also correct."
 UKR_the_energy_transition:0 "The Energy Transition"
 UKR_the_energy_transition_desc:0 "Whatever was decided about the reactors, the grid must be rebuilt: the losses cut, the district heating repaired, and the small hydro and biomass that this country has and has never used."
 UKR_dispose_of_the_melange:0 "Dispose of the Melange"
 UKR_dispose_of_the_melange_desc:0 "Sixteen thousand tonnes of rocket oxidiser in corroding tanks at half a dozen depots, any one of which could take a town with it. Expensive, unglamorous, and the most useful thing this government will do."
 UKR_resettle_the_zone:0 "Resettle the Zone"
 UKR_resettle_the_zone_desc:0 "The old women who walked back to their villages in 1987 have outlived every prediction made about them. The outer districts are surveyed, the safe land mapped, and some of it opened."
 UKR_a_country_without_fallout:0 "A Country Without Fallout"
 UKR_a_country_without_fallout_desc:0 "The reactors are accounted for, the oxidiser is gone, the zone is measured rather than feared. It took twenty years and two governments that nobody thanked."
 UKR_the_ministry_of_ecology:0 "The Ministry of Ecology"
 UKR_the_ministry_of_ecology_desc:0 "A ministry that has existed on paper since 1991 with no enforcement powers and a budget that would embarrass a district council. It is given inspectors, a laboratory service and the right to stop a production line."
 UKR_environmental_impact_law:0 "Environmental Impact Law"
 UKR_environmental_impact_law_desc:0 "No enterprise may be built, expanded or restarted without an assessment the ministry can reject. Every industrial director understands immediately what this means for the balance of power."
 UKR_the_chornobyl_generation:0 "The Chornobyl Generation"
 UKR_the_chornobyl_generation_desc:0 "Everyone under twenty-five was born into it: the tablets, the evacuated relatives, the adults who would not say what the reading was. The one political fact in this country that does not divide east from west."
 UKR_ratify_kyoto:0 "Ratify Kyoto"
 UKR_ratify_kyoto_desc:0 "Our emissions collapsed with our industry, so we are in surplus against a 1990 baseline through no virtue of our own. The protocol costs nothing and buys a seat at a table we would never otherwise be invited to."
 UKR_sell_the_emission_quotas:0 "Sell the Emission Quotas"
 UKR_sell_the_emission_quotas_desc:0 "Japan and the Europeans need permits and we have a mountain of them. The money is booked against green investment schemes, and most of it will even end up there."
 UKR_the_green_courts:0 "The Green Courts"
 UKR_the_green_courts_desc:0 "A specialised bench with the power to halt construction, void a licence and fine a ministry. Judges who understand a dispersion model are rarer than judges who can be bought, which is the point."
 UKR_the_right_to_a_clean_environment:0 "The Right to a Clean Environment"
 UKR_the_right_to_a_clean_environment_desc:0 "Written into the constitution and made justiciable, which is the part that matters. Any citizen may sue any ministry, and within three years several of them will have won."
 UKR_the_danube_reserve:0 "The Danube Reserve"
 UKR_the_danube_reserve_desc:0 "The shipping canal cut through the biosphere reserve was approved by people who assumed nobody would check. UNESCO checked. The channel is closed and an alternative surveyed outside the reserve."
 UKR_the_carpathian_convention:0 "The Carpathian Convention"
 UKR_the_carpathian_convention_desc:0 "Seven countries, one mountain range, and a timber trade that has been stripping the western slopes bare since the customs posts went up. Cross-border inspection is the only thing that has ever slowed it."
 UKR_a_law_abiding_landscape:0 "A Law-Abiding Landscape"
 UKR_a_law_abiding_landscape_desc:0 "The remarkable discovery that environmental law works exactly as well as the willingness to enforce it, and not one degree better."
 UKR_ecological_modernization:0 "Ecological Modernization"
 UKR_ecological_modernization_desc:0 "Not less industry but different industry: filters, closed water cycles, recovered heat, and machinery from this decade rather than the Brezhnev era. The least wasteful plant is usually the most profitable one."
 UKR_clean_the_air_of_the_east:0 "Clean the Air of the East"
 UKR_clean_the_air_of_the_east_desc:0 "Mariupol, Kryvyi Rih, Zaporizhzhia and Donetsk: four cities where life expectancy runs five years below the national figure and everyone knows exactly why."
 UKR_the_dnipro_cascade:0 "The Dnipro Cascade"
 UKR_the_dnipro_cascade_desc:0 "Six reservoirs that drowned a hundred thousand hectares and turned a river into a chain of ponds. The dams stay, because the country needs them, but the fish passes are built and the shallows dredged."
 UKR_the_black_earth_protected:0 "The Black Earth Protected"
 UKR_the_black_earth_protected_desc:0 "A quarter of the planet's chernozem lies inside our borders and it is being mined rather than farmed. Rotation is mandated, shelter belts replanted, and the sale of topsoil made a criminal offence."
 UKR_the_green_economy:0 "The Green Economy"
 UKR_the_green_economy_desc:0 "Efficiency standards, waste as an input, and a construction sector that builds things meant to outlast the loan. The country is not rich, but it has stopped being expensive to run."
 UKR_organic_agriculture:0 "Organic Agriculture"
 UKR_organic_agriculture_desc:0 "Our farms could not afford fertiliser for a decade, which turns out to be a certification rather than a failure. The premium in Munich is considerable and the paperwork is the only hard part."
 UKR_the_waste_question:0 "The Waste Question"
 UKR_the_waste_question_desc:0 "Thirty-six billion tonnes of accumulated industrial spoil, tailings ponds above towns, and a household system that consists of a hole outside every village. Sorting, recovery, and closing the worst of the dumps."
 UKR_the_forest_belt:0 "The Forest Belt"
 UKR_the_forest_belt_desc:0 "The shelter belts planted against the steppe winds were felled for firewood in the hungry years and the topsoil has been leaving ever since. Replant them, which is slow, cheap and irreversibly good."
 UKR_the_azov_and_the_black_sea:0 "The Azov and the Black Sea"
 UKR_the_azov_and_the_black_sea_desc:0 "The northwestern shelf is the largest dead zone in the world outside the Gulf of Mexico, fed by our own rivers. Nutrient limits upstream, and a fishery that might come back within a decade."
 UKR_an_economy_that_lasts:0 "An Economy That Lasts"
 UKR_an_economy_that_lasts_desc:0 "Industry that does not consume the country it stands on. It grows more slowly than the alternative and it will still be here in fifty years."
 UKR_a_green_ukraine:0 "A Green Ukraine"
 UKR_a_green_ukraine_desc:0 "The air in the east is breathable, the reactors are accounted for, the rivers have fish and the soil is being farmed rather than spent. It is not a revolution and nobody will write songs about it."
 UKR_the_garden_republic:0 "The Garden Republic"
 UKR_the_garden_republic_desc:0 "A small, careful, unfashionable country that decided its principal asset was the ground it stood on. Its neighbours find this faintly ridiculous and quietly send delegations to look at the water treatment."
 UKR_the_communist_party:0 "The Communist Party"
 UKR_the_communist_party_desc:0 "The largest party in the parliament, with half a million members, a newspaper in every oblast and an electorate that remembers when the pension arrived. It stayed off the square, voted the reformers out of office and collected its price quietly."
 UKR_the_red_belt:0 "The Red Belt"
 UKR_the_red_belt_desc:0 "From Sumy through Poltava to Kherson the party has never lost a local election. The collective farms were broken up on paper and not in practice, and the district chairman is the same man he was in 1989."
 UKR_the_veterans_and_the_pensioners:0 "The Veterans and the Pensioners"
 UKR_the_veterans_and_the_pensioners_desc:0 "Eleven million people whose savings were annihilated in 1993 and who have been told for a decade that this was the price of freedom. They vote, they are organised, and they need persuading of nothing."
 UKR_the_party_cells:0 "The Party Cells"
 UKR_the_party_cells_desc:0 "Not an electoral machine but a nervous system: a secretary in every depot, every hospital and every institute, who knows who is owed wages and who has been talking to the prosecutor."
 UKR_the_workers_councils:0 "The Workers' Councils"
 UKR_the_workers_councils_desc:0 "Every enterprise elects a council with the right to inspect the books and remove the director. The red directors find it an inconvenience. The ministries find it an extremely effective intelligence service."
 UKR_the_collective_farm_chairmen:0 "The Collective Farm Chairmen"
 UKR_the_collective_farm_chairmen_desc:0 "The land was privatised into share certificates that nobody could farm alone, so the chairmen went on chairing. Five thousand men who control the harvest and have never once been consulted about it."
 UKR_the_left_bloc:0 "The Left Bloc"
 UKR_the_left_bloc_desc:0 "The party, the pensioners' associations and the rural districts brought under one discipline. It is not a coalition, which implies negotiation. It is a merger."
 UKR_the_shop_floor:0 "The Shop Floor"
 UKR_the_shop_floor_desc:0 "The councils and the chairmen discover they want the same thing, which surprises everyone including them. Between them they hold the steel, the coal and the grain."
 UKR_the_communists_take_power:0 "The Communists Take Power"
 UKR_the_communists_take_power_desc:0 "A red flag over the Verkhovna Rada for the first time since 1991. The West issues statements, the oligarchs move their money, and eleven million pensioners wait to see whether anything actually changes."
 UKR_renationalize_the_commanding_heights:0 "Renationalize the Commanding Heights"
 UKR_renationalize_the_commanding_heights_desc:0 "The steelworks, the pipelines, the refineries and the banks return to the state at the valuation the state chooses. The men who bought them for a fraction of their worth learn that the transaction reverses on the same terms."
 UKR_the_supreme_soviet_restored:0 "The Supreme Soviet Restored"
 UKR_the_supreme_soviet_restored_desc:0 "The Rada is reorganised on the old model: standing committees, a presidium, and deputies who are workers and farm chairmen rather than lawyers. It meets less often and decides more."
 UKR_the_party_consolidates:0 "The Party Consolidates"
 UKR_the_party_consolidates_desc:0 "The revolution is over and the administration begins. Congress is convened, the programme adopted, and the question of what socialism in Ukraine actually means can no longer be postponed."
 UKR_vitrenko_rises:0 "Vitrenko Rises"
 UKR_vitrenko_rises_desc:0 "Expelled from the Socialists in 1996 for saying their programme had abandoned socialism, she has spent every year since being proved right in public. The leadership deals with the oligarchs, sits on its majority and calls it tactics. She calls it what it is, and the members are listening."
 UKR_purge_the_revisionists:0 "Purge the Revisionists"
 UKR_purge_the_revisionists_desc:0 "The deputies who voted with the business factions, the editors who softened the line, the secretaries who kept two sets of loyalties. None are shot. All are expelled, and expulsion is the end of a career in the new state."
 UKR_the_five_year_plan:0 "The Five-Year Plan"
 UKR_the_five_year_plan_desc:0 "Output targets by sector, allocation by ministry, prices by decree. It will work better than the critics expect and considerably worse than the planners promise."
 UKR_the_central_committee:0 "The Central Committee"
 UKR_the_central_committee_desc:0 "A hundred and fifty men who meet four times a year and decide everything between meetings. The government exists to carry out what this room has already agreed."
 UKR_the_party_congress:0 "The Party Congress"
 UKR_the_party_congress_desc:0 "Five thousand delegates, a general report lasting six hours, and a unanimous vote. The theatre matters: what is ratified here cannot afterwards be questioned by anyone."
 UKR_gosplan_reborn:0 "Gosplan Reborn"
 UKR_gosplan_reborn_desc:0 "The planning institute is reconstituted with the same graduates doing the same arithmetic on considerably better computers. Whether that helps is the great unanswered question of the century."
 UKR_the_party_is_the_state:0 "The Party Is the State"
 UKR_the_party_is_the_state_desc:0 "Article Six in all but name. Every ministry has a party committee, every committee reports upward, and the distinction between a government decision and a party decision stops being made."
 UKR_socialism_in_one_country:0 "Socialism in One Country"
 UKR_socialism_in_one_country_desc:0 "The Union is not coming back, and a revolution that waits for the world will be strangled while it waits. Build it here, behind a closed border, with what we have and nobody's permission."
 UKR_the_world_revolution:0 "The World Revolution"
 UKR_the_world_revolution_desc:0 "A socialist Ukraine alone is a besieged province, not a state. The republics were torn apart by men in a hunting lodge who asked nobody, and what fifteen signatures undid can be undone again."
 UKR_autarky_and_the_plan:0 "Autarky and the Plan"
 UKR_autarky_and_the_plan_desc:0 "If the world market is a mechanism for transferring our value to Frankfurt, then leaving it is not a sacrifice. Everything we need we will make, badly at first, and the shortages will be explained."
 UKR_the_iron_curtain:0 "The Iron Curtain"
 UKR_the_iron_curtain_desc:0 "Exit visas, currency controls, jammed broadcasts and a border service that faces inward. Indefensible in a newspaper, and it makes the government effectively impossible to overthrow."
 UKR_the_command_economy:0 "The Command Economy"
 UKR_the_command_economy_desc:0 "Prices, wages, allocation and investment all set in one building. The queues are real, the unemployment is zero, and both facts are true at once."
 UKR_the_internal_passport:0 "The Internal Passport"
 UKR_the_internal_passport_desc:0 "Residence permits for the cities, a work book that follows you, and a militia that may ask for both. Labour goes where the plan requires rather than where the wages are."
 UKR_the_second_five_year_plan:0 "The Second Five-Year Plan"
 UKR_the_second_five_year_plan_desc:0 "The first one taught us what the institutes got wrong. This one is more ambitious for exactly that reason, which is how these things always go."
 UKR_collectivize_the_black_earth:0 "Collectivize the Black Earth"
 UKR_collectivize_the_black_earth_desc:0 "The land reverts to collective ownership, and in this country that sentence carries a weight no policy document can dispel. The party insists this is not the 1930s, and is required to insist rather a lot."
 UKR_the_cult_of_the_general_secretary:0 "The Cult of the General Secretary"
 UKR_the_cult_of_the_general_secretary_desc:0 "Portraits in every office, quotations at the head of every plan, a biography in an edition of four million. Nobody planned this and nobody can now stop it."
 UKR_the_machine_tractor_stations:0 "The Machine Tractor Stations"
 UKR_the_machine_tractor_stations_desc:0 "Equipment held centrally and allocated by the district, which is presented as efficiency and understood as leverage. A farm that displeases the station does not get a combine in August."
 UKR_the_young_pioneers:0 "The Young Pioneers"
 UKR_the_young_pioneers_desc:0 "Camps, brass bands, scrap drives and a red scarf. A generation raised inside the thing rather than told about it afterwards, which is the only way any of this lasts."
 UKR_the_ukrainian_ssr_reborn:0 "The Ukrainian SSR Reborn"
 UKR_the_ukrainian_ssr_reborn_desc:0 "The old arms, the old anthem, the old conscription classes and a standing army the republic has not seen since the Group of Forces went home. A Soviet republic with no Union above it, which has never existed before."
 UKR_heavy_industry_first:0 "Heavy Industry First"
 UKR_heavy_industry_first_desc:0 "Steel before shoes, turbines before televisions, and an argument about consumer goods that is postponed to the next plan and the one after that."
 UKR_the_iron_discipline:0 "The Iron Discipline"
 UKR_the_iron_discipline_desc:0 "Absenteeism as a criminal matter, quotas enforced by the works committee, and an army that trains the way the plan says rather than the way the budget allows."
 UKR_the_fortress_republic:0 "The Fortress Republic"
 UKR_the_fortress_republic_desc:0 "Stockpiles, dispersed plant, buried command posts and a civil defence organisation that actually functions. We expect to be attacked, and we intend the attempt to be unprofitable."
 UKR_the_new_soviet_man:0 "The New Soviet Man"
 UKR_the_new_soviet_man_desc:0 "Not a slogan by this point but an administrative programme: schooling, service, allocation, housing. A citizen produced the way the plan produces everything else."
 UKR_socialism_achieved:0 "Socialism Achieved"
 UKR_socialism_achieved_desc:0 "Declared complete, which is different from being complete. Poor, closed, orderly and entirely unlike anywhere else on the continent, and the men who built it are certain history will vindicate them."
 UKR_the_new_union_treaty:0 "The New Union Treaty"
 UKR_the_new_union_treaty_desc:0 "The document Gorbachev never got signed, revived and circulated: a confederation of sovereign socialist republics with a common defence and a common currency. The addressees are Minsk, the Baltic capitals, Chisinau and whoever in Moscow will take the call."
 UKR_the_red_army_reborn:0 "The Red Army Reborn"
 UKR_the_red_army_reborn_desc:0 "Political officers return to the brigades, the conscription classes are enlarged, and the general staff is told to plan for something other than a purely defensive war for the first time since independence."
 UKR_the_call_to_the_republics:0 "The Call to the Republics"
 UKR_the_call_to_the_republics_desc:0 "Broadcast in six languages to every former republic: the dissolution was illegal, the referendum of March 1991 was never repealed, and the Union exists in law for anyone willing to act on it."
 UKR_the_comintern_reborn:0 "The International Reborn"
 UKR_the_comintern_reborn_desc:0 "A congress in Kyiv of communist parties from Lisbon to Vladivostok, most of them tiny, several of them serious. Funds, printing and passports flow outward."
 UKR_the_volunteer_brigades:0 "The Volunteer Brigades"
 UKR_the_volunteer_brigades_desc:0 "Men who want to fight somebody else's revolution, given a depot, a uniform without insignia and a train ticket. Deniability is thin and nobody is trying very hard."
 UKR_minsk_answers:0 "Baltics Answers"
 UKR_minsk_answers_desc:0 "Minsk never dismantled any of it, and its president has wanted a union for a decade provided he leads it. Tallinn, Riga and Vilnius are a harder sell, but they have read the same note and know the size of the army that sent it."
 UKR_chisinau_answers:0 "Chisinau Answers"
 UKR_chisinau_answers_desc:0 "A country cut in half since 1992, with a Russian garrison on one bank and a communist majority on the other. It is the easiest of the calls to place and the hardest to explain afterwards."
 UKR_the_caucasus_stirs:0 "The Caucasus Stirs"
 UKR_the_caucasus_stirs_desc:0 "Four unrecognised statelets, three frozen wars and a great many people who remember when there was a budget for all of it. Sympathy is cheap here and useful out of all proportion."
 UKR_central_asia_watches:0 "Central Asia Watches"
 UKR_central_asia_watches_desc:0 "Presidents who were first secretaries and never stopped behaving like it, watching to see whether this works before committing to anything. They will be last and they will be decisive."
 UKR_the_union_of_soviet_republics:0 "The Union of Soviet Republics"
 UKR_the_union_of_soviet_republics_desc:0 "A name, a treaty text, a flag and a secretariat in Kyiv. Three members at first, which is two more than anyone predicted."
 UKR_liberate_the_near_abroad:0 "Liberate the Near Abroad"
 UKR_liberate_the_near_abroad_desc:0 "Governments are informed that a fraternal request for assistance would be received sympathetically, and that one will be expected. The formalities matter, and the formalities are all that matter."
 UKR_the_second_october:0 "The Second October"
 UKR_the_second_october_desc:0 "The largest of them is not asked. Whether what follows is a revolution or an invasion will depend entirely on who is writing about it, and on whether it works."
 UKR_the_permanent_revolution:0 "The Permanent Revolution"
 UKR_the_permanent_revolution_desc:0 "The doctrine that the thing cannot stop where it is without rotting, argued by men who have read very carefully what happened the last time somebody decided that it could."
 UKR_the_world_soviet:0 "The World Soviet"
 UKR_the_world_soviet_desc:0 "Delegations from four continents, simultaneous translation in nine languages, and resolutions that nobody can enforce. It is still the largest gathering of its kind since 1943."
 UKR_the_union_restored:0 "The Union Restored"
 UKR_tt_union_restored_annex:0 "§YThe Union is restored.§! Every republic of the former Union that is still independent is annexed: Belarus, Estonia, Latvia, Lithuania, Moldova, Transnistria, Chechnya, South Ossetia, Abkhazia, Georgia, Armenia, Azerbaijan, Nagorno-Karabakh, Kazakhstan, Uzbekistan, Tajikistan, Turkmenistan and Kyrgyzstan."
 UKR_the_union_restored_desc:0 "Whatever it is called and whoever sits at the head of the table, the thing dissolved in December 1991 exists again, and it was assembled from Kyiv rather than Moscow. Nobody involved expected that."
 UKR_the_red_banner_over_eurasia:0 "The Red Banner over Eurasia"
 UKR_the_red_banner_over_eurasia_desc:0 "From the Bug to wherever it stops. The men who signed at Belovezha are still alive, and they are watching this on television."
 UKR_the_progressive_socialist_party:0 "The Progressive Socialists"
 UKR_the_progressive_socialist_party_desc:0 "Loud, unembarrassed, and the only force on the left that never once voted with a bank. It was built out of everybody who agreed that the Socialists had stopped being socialist, and it has been waiting for this."
 UKR_the_kpu_discredited:0 "The Party Discredited"
 UKR_the_kpu_discredited_desc:0 "Every deal the leadership cut with the oligarchs is published, with dates and names. The membership does not leave the party. It changes who leads it."
 UKR_vitrenko_takes_the_left:0 "Vitrenko Takes the Left"
 UKR_vitrenko_takes_the_left_desc:0 "The parties merge on her terms, which are not negotiable. What emerges is neither the old communism nor anything the West has a comfortable name for: Marxism welded to Orthodoxy, Slavic brotherhood and the borders the republic was promised in 1918."
 UKR_the_orthodox_left:0 "The Orthodox Left"
 UKR_the_orthodox_left_desc:0 "The canonical church and the party discover they want the same things: the family, the nation, the land, and the humiliation of everyone who spent the nineties explaining that we were a backward province."
 UKR_the_brest_litovsk_borders:0 "The Brest-Litovsk Borders"
 UKR_the_brest_litovsk_borders_desc:0 "In February 1918 the Central Powers recognised a Ukrainian state including Kholm and Podlachia, with a secret protocol on Eastern Galicia and Bukovina. It was signed, it was ratified, and it was never renounced by anyone with the standing to renounce it."
 UKR_the_national_question:0 "The National Question"
 UKR_the_national_question_desc:0 "Lenin wrote that the right of nations to self-determination was a weapon, and the party takes him at his word. Socialism is to be built in a national form, by a nation, inside the borders that nation was promised."
 UKR_the_kuban_question:0 "The Kuban Question"
 UKR_the_kuban_question_desc:0 "The Kuban voted to join Ukraine in 1918 and was told otherwise. Starodub, the Don shore, the Slobozhanshchyna beyond Belgorod: a million people who still fill in the census the same way."
 UKR_the_anti_nato_front:0 "The Anti-NATO Front"
 UKR_the_anti_nato_front_desc:0 "Every partnership programme is cancelled, every liaison officer is sent home, and the Black Sea exercises are refused a port. It is the one policy on which nine of our oblasts are unanimous."
 UKR_the_carpathian_ruthenia:0 "Carpathian Ruthenia"
 UKR_the_carpathian_ruthenia_desc:0 "Transcarpathia was a republic for one day in March 1939 and has been somebody else's province before and since. Beyond the ridge there are Ruthenian villages in three other countries."
 UKR_co_opt_nestor_makhnos_legacy:0 "Co-opt Nestor Makhno's Legacy"
 UKR_co_opt_nestor_makhnos_legacy_desc:0 "The anarchist who fought the Bolsheviks and the Whites is remembered in the villages of his old army, and the party invites them to join the republic. They are not asked to change their minds about anything else."
 UKR_the_ukrainian_peoples_republic:0 "The Ukrainian People's Republic"
 UKR_the_ukrainian_peoples_republic_desc:0 "The name is taken deliberately from 1918, and so is the map. A People's Republic in the socialist sense and the older national sense at once, claiming every hectare any Ukrainian government was ever promised by anybody."
 UKR_the_peoples_militia:0 "The People's Militia"
 UKR_the_peoples_militia_desc:0 "Every district raises and arms its own battalion under the party committee rather than the general staff. It is a poor way to fight a war and an excellent way to make one irreversible."
 UKR_the_transnistrian_corridor:0 "The Transnistrian Corridor"
 UKR_the_transnistrian_corridor_desc:0 "A strip of land along the left bank with a Soviet flag still flying over it, a Russian arms dump and a population that has been asking to be absorbed by somebody since 1992."
 UKR_the_new_soviet_patriotism:0 "The New Soviet Patriotism"
 UKR_the_new_soviet_patriotism_desc:0 "Red banners carried beside the trident, the Great Patriotic War and the Cossack host invoked in the same speech, and an ideology that no library in Europe knows where to shelve."
 UKR_the_map_of_1918:0 "The Map of 1918"
 UKR_the_map_of_1918_desc:0 "Printed in the millions, hung in every school, and drawn from the treaty texts rather than from sentiment. Every claim on it has a document behind it, which is exactly what makes it dangerous."
 UKR_the_socialist_crusade:0 "The Socialist Crusade"
 UKR_the_socialist_crusade_desc:0 "The word is the church's and the party uses it without apology. Liberation of the workers and restoration of the nation are declared the same undertaking, and the men who believe one will fight for the other."
 UKR_the_red_west:0 "The Red West"
 UKR_the_red_west_desc:0 "Kholm, Podlachia and the lands beyond the San. Warsaw is offered a people's government, and the offer is not really addressed to Warsaw."
 UKR_the_red_east:0 "The Red East"
 UKR_the_red_east_desc:0 "The Kuban, the Don shore and Slobozhanshchyna. The larger neighbour is informed that the republic is reclaiming what was taken, in the name of the workers of both countries."
 UKR_the_peoples_commissariats:0 "The People's Commissariats"
 UKR_the_peoples_commissariats_desc:0 "The ministries are renamed and restaffed from the militia and the party committees. It is not efficient and it is entirely loyal, which is the trade being made."
 UKR_the_workers_state:0 "The Workers' State"
 UKR_the_workers_state_desc:0 "The plants run on three shifts under the councils, and output is measured against the map rather than against the budget."
 UKR_the_peoples_republic_triumphant:0 "The People's Republic Triumphant"
 UKR_the_peoples_republic_triumphant_desc:0 "Red banners with the trident, a state that calls itself socialist and behaves like a nation in arms, and borders no cartographer in Europe is willing to print. Whatever this is, there has never been one before."
 UKR_the_green_movement:0 "The Green Movement"
 UKR_the_green_movement_desc:0 "The half of the party that joined for the environment rather than the logo."
 UKR_the_green_movement2:0 "The Green Faction"
 UKR_the_green_movement2_desc:0 "Twelve years of readings nobody else bothered to collect."
 UKR_the_green_movement3:0 "The Greens in Government"
 UKR_the_green_movement3_desc:0 "Every ministry with a budget regards this as a temporary aberration."
 UKR_the_green_movement4:0 "A Green Ukraine"
 UKR_the_green_movement4_desc:0 "Breathable air, accounted-for reactors, rivers with fish in them."
 UKR_the_green_movement5:0 "The Garden Republic"
 UKR_the_green_movement5_desc:0 "A country that decided its principal asset was the ground it stood on."
 UKR_the_nuclear_legacy:0 "The Nuclear Legacy"
 UKR_the_nuclear_legacy_desc:0 "Fifteen Soviet units, several of them the same generation as the one that exploded."
 UKR_the_nuclear_legacy2:0 "Chornobyl Closed"
 UKR_the_nuclear_legacy2_desc:0 "Six percent of our power, and something considerably harder to price."
 UKR_the_nuclear_legacy3:0 "The New Safe Confinement"
 UKR_the_nuclear_legacy3_desc:0 "An arch the size of a cathedral, rolled into place from a safe distance."
 UKR_the_nuclear_legacy4:0 "Without Fallout"
 UKR_the_nuclear_legacy4_desc:0 "Twenty years and two governments that nobody thanked."
 UKR_the_zone_of_alienation_idea:0 "The Zone of Alienation"
 UKR_the_zone_of_alienation_idea_desc:0 "The largest accidental wilderness in Europe and the most carefully fenced."
 UKR_the_zone_of_alienation_idea2:0 "The Zone Resettled"
 UKR_the_zone_of_alienation_idea2_desc:0 "The outer districts surveyed, the safe land mapped, some of it opened."
 UKR_the_reactors_closed:0 "The Reactors Closed"
 UKR_the_reactors_closed_desc:0 "The lights dim, and no parent has to ask a doctor about a thyroid again."
 UKR_the_peaceful_atom:0 "The Peaceful Atom"
 UKR_the_peaceful_atom_desc:0 "The alternative here is Donbas coal, which kills more people every year."
 UKR_the_energy_transition_idea:0 "The Energy Transition"
 UKR_the_energy_transition_idea_desc:0 "Losses cut, district heating repaired, and the small hydro we never used."
 UKR_the_melange_disposed:0 "The Melange Disposed"
 UKR_the_melange_disposed_desc:0 "Sixteen thousand tonnes of oxidiser that could each have taken a town."
 UKR_the_ecological_code:0 "The Ecological Code"
 UKR_the_ecological_code_desc:0 "Inspectors, a laboratory service, and the right to stop a production line."
 UKR_the_ecological_code2:0 "Impact Assessment"
 UKR_the_ecological_code2_desc:0 "No enterprise built or restarted without a paper the ministry can refuse."
 UKR_the_ecological_code3:0 "The Green Courts"
 UKR_the_ecological_code3_desc:0 "Judges who understand a dispersion model are rarer than judges who can be bought."
 UKR_the_ecological_code4:0 "The Right to a Clean Environment"
 UKR_the_ecological_code4_desc:0 "Justiciable, which is the part that matters."
 UKR_the_chornobyl_generation_idea:0 "The Chornobyl Generation"
 UKR_the_chornobyl_generation_idea_desc:0 "The one political fact that does not divide east from west."
 UKR_kyoto_ratified:0 "Kyoto Ratified"
 UKR_kyoto_ratified_desc:0 "In surplus against a 1990 baseline through no virtue of our own."
 UKR_kyoto_ratified2:0 "The Quota Market"
 UKR_kyoto_ratified2_desc:0 "Japan and the Europeans need permits and we have a mountain of them."
 UKR_the_danube_reserve_idea:0 "The Danube Reserve"
 UKR_the_danube_reserve_idea_desc:0 "UNESCO checked. The channel is closed."
 UKR_the_carpathian_convention_idea:0 "The Carpathian Convention"
 UKR_the_carpathian_convention_idea_desc:0 "Seven countries, one mountain range, and a timber trade that inspection can slow."
 UKR_a_law_abiding_landscape_idea:0 "A Law-Abiding Landscape"
 UKR_a_law_abiding_landscape_idea_desc:0 "Environmental law works exactly as well as the willingness to enforce it."
 UKR_ecological_modernization_idea:0 "Ecological Modernization"
 UKR_ecological_modernization_idea_desc:0 "The least wasteful plant is usually the most profitable one."
 UKR_ecological_modernization_idea2:0 "The Green Economy"
 UKR_ecological_modernization_idea2_desc:0 "Waste as an input, and buildings meant to outlast the loan."
 UKR_ecological_modernization_idea3:0 "An Economy That Lasts"
 UKR_ecological_modernization_idea3_desc:0 "Slower than the alternative, and still here in fifty years."
 UKR_the_air_of_the_east:0 "The Air of the East"
 UKR_the_air_of_the_east_desc:0 "Five years of life expectancy, and everyone knew exactly why."
 UKR_the_dnipro_cascade_idea:0 "The Dnipro Cascade"
 UKR_the_dnipro_cascade_idea_desc:0 "The dams stay, but the fish passes are built and the shallows dredged."
 UKR_the_black_earth_idea:0 "The Black Earth Protected"
 UKR_the_black_earth_idea_desc:0 "A quarter of the planet's chernozem, farmed rather than mined."
 UKR_the_black_earth_idea2:0 "Organic by Default"
 UKR_the_black_earth_idea2_desc:0 "We could not afford fertiliser for a decade, which turns out to be a certification."
 UKR_the_waste_question_idea:0 "The Waste Question"
 UKR_the_waste_question_idea_desc:0 "Thirty-six billion tonnes of spoil, and tailings ponds above towns."
 UKR_the_forest_belt_idea:0 "The Forest Belt"
 UKR_the_forest_belt_idea_desc:0 "Slow, cheap and irreversibly good."
 UKR_the_seas_protected:0 "The Seas Protected"
 UKR_the_seas_protected_desc:0 "The largest dead zone outside the Gulf of Mexico, fed by our own rivers."
 UKR_the_kpu_machine:0 "The Party Machine"
 UKR_the_kpu_machine_desc:0 "Half a million members, a newspaper in every oblast, and an electorate that remembers."
 UKR_the_kpu_machine2:0 "The Left Bloc"
 UKR_the_kpu_machine2_desc:0 "Not a coalition, which implies negotiation. A merger."
 UKR_the_kpu_machine3:0 "The Party in Power"
 UKR_the_kpu_machine3_desc:0 "A red flag over the Rada for the first time since 1991."
 UKR_the_kpu_machine4:0 "The Party Consolidated"
 UKR_the_kpu_machine4_desc:0 "The revolution is over and the administration has begun."
 UKR_the_kpu_machine5:0 "The Party Supreme"
 UKR_the_kpu_machine5_desc:0 "What the congress ratifies cannot afterwards be questioned by anyone."
 UKR_the_red_belt_idea:0 "The Red Belt"
 UKR_the_red_belt_idea_desc:0 "From Sumy to Kherson the district chairman is the same man he was in 1989."
 UKR_the_veterans_and_the_pensioners_idea:0 "The Veterans and the Pensioners"
 UKR_the_veterans_and_the_pensioners_idea_desc:0 "Eleven million people who need persuading of nothing."
 UKR_the_party_cells_idea:0 "The Party Cells"
 UKR_the_party_cells_idea_desc:0 "A secretary in every depot who knows who is owed wages."
 UKR_the_workers_councils_idea:0 "The Workers' Councils"
 UKR_the_workers_councils_idea_desc:0 "The right to inspect the books and remove the director."
 UKR_the_collective_farm_chairmen_idea:0 "The Farm Chairmen"
 UKR_the_collective_farm_chairmen_idea_desc:0 "Five thousand men who control the harvest and were never consulted about it."
 UKR_the_shop_floor_idea:0 "The Shop Floor"
 UKR_the_shop_floor_idea_desc:0 "Between them they hold the steel, the coal and the grain."
 UKR_the_planned_economy:0 "The Planned Economy"
 UKR_the_planned_economy_desc:0 "Targets by sector, allocation by ministry, prices by decree."
 UKR_the_planned_economy2:0 "The Five-Year Plan"
 UKR_the_planned_economy2_desc:0 "Better than the critics expect and worse than the planners promise."
 UKR_the_planned_economy3:0 "Gosplan Reborn"
 UKR_the_planned_economy3_desc:0 "The same arithmetic on considerably better computers."
 UKR_the_planned_economy4:0 "Autarky and the Plan"
 UKR_the_planned_economy4_desc:0 "Everything we need we will make, badly at first."
 UKR_the_planned_economy5:0 "The Command Economy"
 UKR_the_planned_economy5_desc:0 "The queues are real, the unemployment is zero, and both are true at once."
 UKR_the_soviets_restored:0 "The Supreme Soviet"
 UKR_the_soviets_restored_desc:0 "It meets less often and decides more."
 UKR_the_revisionists_purged:0 "The Revisionists Purged"
 UKR_the_revisionists_purged_desc:0 "None are shot. All are expelled, which ends a career in the new state."
 UKR_the_central_committee_idea:0 "The Central Committee"
 UKR_the_central_committee_idea_desc:0 "A hundred and fifty men who decide everything between meetings."
 UKR_the_party_is_the_state_idea:0 "The Party Is the State"
 UKR_the_party_is_the_state_idea_desc:0 "The distinction between a government decision and a party decision is no longer made."
 UKR_socialism_in_one_country_idea:0 "Socialism in One Country"
 UKR_socialism_in_one_country_idea_desc:0 "A revolution that waits for the world will be strangled while it waits."
 UKR_socialism_in_one_country_idea2:0 "Behind the Curtain"
 UKR_socialism_in_one_country_idea2_desc:0 "Exit visas, currency controls and a border service that faces inward."
 UKR_socialism_in_one_country_idea3:0 "The Republic Sealed"
 UKR_socialism_in_one_country_idea3_desc:0 "A Soviet republic with no Union above it, which has never existed before."
 UKR_socialism_in_one_country_idea4:0 "Socialism Achieved"
 UKR_socialism_in_one_country_idea4_desc:0 "Poor, closed, orderly and entirely unlike anywhere else on the continent."
 UKR_the_internal_passport_idea:0 "The Internal Passport"
 UKR_the_internal_passport_idea_desc:0 "Labour goes where the plan requires rather than where the wages are."
 UKR_the_second_five_year_plan_idea:0 "The Second Five-Year Plan"
 UKR_the_second_five_year_plan_idea_desc:0 "More ambitious precisely because the first one taught us what was wrong."
 UKR_the_collective_farms:0 "The Collective Farms"
 UKR_the_collective_farms_desc:0 "The party insists this is not the 1930s, and is required to insist rather a lot."
 UKR_the_collective_farms2:0 "The Machine Tractor Stations"
 UKR_the_collective_farms2_desc:0 "A farm that displeases the station does not get a combine in August."
 UKR_the_cult_of_the_general_secretary_idea:0 "The Cult of the General Secretary"
 UKR_the_cult_of_the_general_secretary_idea_desc:0 "Nobody planned this and nobody can now stop it."
 UKR_the_young_pioneers_idea:0 "The Young Pioneers"
 UKR_the_young_pioneers_idea_desc:0 "A generation raised inside the thing rather than told about it afterwards."
 UKR_heavy_industry_first_idea:0 "Heavy Industry First"
 UKR_heavy_industry_first_idea_desc:0 "Steel before shoes, and the argument postponed to the next plan."
 UKR_the_iron_discipline_idea:0 "The Iron Discipline"
 UKR_the_iron_discipline_idea_desc:0 "Absenteeism as a criminal matter, and quotas enforced by the works committee."
 UKR_the_fortress_republic_idea:0 "The Fortress Republic"
 UKR_the_fortress_republic_idea_desc:0 "We expect to be attacked, and we intend the attempt to be unprofitable."
 UKR_the_new_soviet_man_idea:0 "The New Soviet Man"
 UKR_the_new_soviet_man_idea_desc:0 "A citizen produced the way the plan produces everything else."
 UKR_the_world_revolution_idea:0 "The World Revolution"
 UKR_the_world_revolution_idea_desc:0 "A socialist Ukraine alone is a besieged province, not a state."
 UKR_the_world_revolution_idea2:0 "The Call to the Republics"
 UKR_the_world_revolution_idea2_desc:0 "The dissolution was illegal and the referendum of March 1991 was never repealed."
 UKR_the_world_revolution_idea3:0 "The Union of Soviet Republics"
 UKR_the_world_revolution_idea3_desc:0 "Three members at first, which is two more than anyone predicted."
 UKR_the_world_revolution_idea4:0 "The Union Restored"
 UKR_the_world_revolution_idea4_desc:0 "Assembled from Kyiv rather than Moscow. Nobody involved expected that."
 UKR_the_world_revolution_idea5:0 "The Red Banner over Eurasia"
 UKR_the_world_revolution_idea5_desc:0 "The men who signed at Belovezha are watching this on television."
 UKR_the_union_treaty_idea:0 "The New Union Treaty"
 UKR_the_union_treaty_idea_desc:0 "The document Gorbachev never got signed, revived and circulated."
 UKR_the_red_army_reborn_idea:0 "The Red Army Reborn"
 UKR_the_red_army_reborn_idea_desc:0 "A staff told to plan for something other than defence."
 UKR_the_comintern_reborn_idea:0 "The International Reborn"
 UKR_the_comintern_reborn_idea_desc:0 "Funds, printing and passports flowing outward from a congress in Kyiv."
 UKR_the_volunteer_brigades_idea:0 "The Volunteer Brigades"
 UKR_the_volunteer_brigades_idea_desc:0 "Uniforms without insignia, and nobody trying very hard at deniability."
 UKR_minsk_answers_idea:0 "Baltics Answers"
 UKR_minsk_answers_idea_desc:0 "A union for a decade, provided he leads it, and a note to three capitals that did not ask for one."
 UKR_chisinau_answers_idea:0 "Chisinau Answers"
 UKR_chisinau_answers_idea_desc:0 "The easiest of the calls to place and the hardest to explain afterwards."
 UKR_the_caucasus_stirs_idea:0 "The Caucasus Stirs"
 UKR_the_caucasus_stirs_idea_desc:0 "Sympathy is cheap here and useful out of all proportion."
 UKR_central_asia_watches_idea:0 "Central Asia Watches"
 UKR_central_asia_watches_idea_desc:0 "They will be last and they will be decisive."
 UKR_the_liberation_doctrine:0 "The Liberation Doctrine"
 UKR_the_liberation_doctrine_desc:0 "A fraternal request would be received sympathetically, and one is expected."
 UKR_the_second_october_idea:0 "The Second October"
 UKR_the_second_october_idea_desc:0 "Revolution or invasion, depending on who writes about it and whether it works."
 UKR_the_permanent_revolution_idea:0 "The Permanent Revolution"
 UKR_the_permanent_revolution_idea_desc:0 "It cannot stop where it is without rotting."
 UKR_the_world_soviet_idea:0 "The World Soviet"
 UKR_the_world_soviet_idea_desc:0 "Resolutions nobody can enforce, and the largest gathering of its kind since 1943."
 UKR_the_progressive_socialists:0 "The Progressive Socialists"
 UKR_the_progressive_socialists_desc:0 "The only force on the left that never once voted with a bank."
 UKR_the_progressive_socialists2:0 "The Left United"
 UKR_the_progressive_socialists2_desc:0 "Merged on her terms, which are not negotiable."
 UKR_the_progressive_socialists3:0 "National Bolshevism"
 UKR_the_progressive_socialists3_desc:0 "Marxism welded to Orthodoxy, Slavic brotherhood and the borders of 1918."
 UKR_the_kpu_discredited_idea:0 "The Party Discredited"
 UKR_the_kpu_discredited_idea_desc:0 "Every deal published with dates and names."
 UKR_the_orthodox_left_idea:0 "The Orthodox Left"
 UKR_the_orthodox_left_idea_desc:0 "Nobody can decide whether this is a contradiction."
 UKR_the_national_question_idea:0 "The National Question"
 UKR_the_national_question_idea_desc:0 "Socialism built in a national form, by a nation, inside promised borders."
 UKR_the_anti_nato_front_idea:0 "The Anti-NATO Front"
 UKR_the_anti_nato_front_idea_desc:0 "The one policy on which nine of our oblasts are unanimous."
 UKR_the_peoples_republic:0 "The People's Republic"
 UKR_the_peoples_republic_desc:0 "Socialist in the new sense and national in the older one at once."
 UKR_the_peoples_republic2:0 "The Republic in Arms"
 UKR_the_peoples_republic2_desc:0 "Liberation of the workers and restoration of the nation, declared one undertaking."
 UKR_the_peoples_republic3:0 "The Crusade"
 UKR_the_peoples_republic3_desc:0 "The men who believe one of them will fight for the other."
 UKR_the_peoples_republic4:0 "The Republic Triumphant"
 UKR_the_peoples_republic4_desc:0 "Red banners with the trident, and borders no cartographer will print."
 UKR_the_brest_litovsk_claim:0 "The Brest-Litovsk Claim"
 UKR_the_brest_litovsk_claim_desc:0 "Signed, ratified, and never renounced by anyone with the standing to do so."
 UKR_the_kuban_claim:0 "The Kuban Claim"
 UKR_the_kuban_claim_desc:0 "A million people who still fill in the census the same way."
 UKR_the_ruthenian_claim:0 "The Ruthenian Claim"
 UKR_the_ruthenian_claim_desc:0 "A republic for one day in March 1939, and villages in three other countries."
 UKR_the_transnistrian_claim:0 "The Transnistrian Claim"
 UKR_the_transnistrian_claim_desc:0 "A Soviet flag still flying, an arms dump, and a population asking to be absorbed."
 UKR_the_peoples_militia_idea:0 "The People's Militia"
 UKR_the_peoples_militia_idea_desc:0 "A poor way to fight a war and an excellent way to make one irreversible."
 UKR_the_map_of_1918_idea:0 "The Map of 1918"
 UKR_the_map_of_1918_idea_desc:0 "Every claim on it has a document behind it, which is what makes it dangerous."
 UKR_the_peoples_commissariats_idea:0 "The People's Commissariats"
 UKR_the_peoples_commissariats_idea_desc:0 "Not efficient and entirely loyal, which is the trade being made."
 UKR_the_workers_state_idea:0 "The Workers' State"
 UKR_the_workers_state_idea_desc:0 "Output measured against the map rather than against the budget."


 ### EVENTS ###
 ukraine.1.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.1.d:0 "The note was delivered at four in the morning, which is not an accident, and it does not use the word ultimatum, which is also not an accident. [FROM.GetLeader] writes of fraternal peoples, of a common destiny and of the historical necessity that [ROOT.GetAdjective] policy be conducted in accordance with the interests of the union. Stripped of the grammar, it asks for our army, our borders and our foreign ministry.\n\nThe cabinet has read it four times looking for a clause that leaves us something. There is one deadline and there are no conditions. Refusal is not forbidden anywhere in the text — it is simply not provided for."
 ukraine.1.a:0 "We are not in a position to refuse."
 ukraine.1.b:0 "Let them come and take it."
 ukraine.2.t:0 "[FROM.GetName] Submits"
 ukraine.2.d:0 "The reply arrives inside the deadline and is almost embarrassingly correct in its wording: the government of [FROM.GetName] accepts the proposals in their entirety and looks forward to the closest cooperation. Nobody in the room believes a line of it, and nobody needs to.\n\nTheir foreign ministry will be staffed by our people within the month. Their general staff will receive our planning documents and return their own. What was a state this morning is an arrangement this evening, and the transition cost us nothing but paper."
 ukraine.2.a:0 "Bring them into the fold."
 ukraine.3.t:0 "[FROM.GetName] Refuses"
 ukraine.3.d:0 "The reply is three sentences long and contains no fraternal language whatsoever. [FROM.GetLeader] regrets that the proposals are incompatible with the sovereignty of [FROM.GetName] and considers the matter closed.\n\nIt is not closed. We made the demand in public and the answer came in public, and every other capital that received a note from us this year is now reading the transcript. Either the ultimatum meant something or it did not, and whichever we decide today, the rest of the continent will file it away as precedent."
 ukraine.3.b:0 "Let the matter rest. We gained nothing and we lost nothing."
 ukraine.3.a:0 "Then it will be settled by other means."

 ### UKRAINE ULTIMATUMS ###
 ukraine.4.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.4.d:0 "There is no pretence of negotiation in it. The note observes that the left bank has flown a Soviet flag since 1990, that its population is in no sense Moldovan, and that the republic it belongs to has never been recognised by a single government on earth. It concludes that the anomaly will now be resolved.\n\nThere is no offer of autonomy, no transitional arrangement and no second paragraph. Tiraspol is invited to acknowledge that it has been part of Ukraine since the morning the note was written."
 ukraine.4.a:0 "We were never going to hold this alone."
 ukraine.4.b:0 "Tiraspol does not surrender."
 ukraine.5.t:0 "Tiraspol Submits"
 ukraine.5.d:0 "The answer comes back within the day and reads less like a capitulation than an administrative handover, which in a sense it is. The Supreme Soviet votes itself out of existence, the border guards are told to stand aside, and the arms depot at Cobasna is inventoried by our officers before the week is out.\n\nThere are people on that bank who have waited thirty years for somebody to end the ambiguity, and a great many more who simply want to know who issues the pensions now."
 ukraine.5.a:0 "Raise our flag over Tiraspol."
 ukraine.6.t:0 "Tiraspol Refuses"
 ukraine.6.d:0 "The reply is signed by men who have spent three decades preparing for precisely this conversation and have an arms dump behind them that could equip a small army twice over. They remind us that they did not yield to Chisinau in 1992 and see no reason to yield to Kyiv now.\n\nIt is a strip of land sixty kilometres wide with a few hundred thousand people on it. It is also the first time anyone has told us no."
 ukraine.6.a:0 "Leave them their flag. It costs us nothing."
 ukraine.6.b:0 "Then we take the left bank."
 ukraine.7.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.7.d:0 "The note arrives with a photocopy attached, and the photocopy is the point: Article Two of the treaty signed at Brest-Litovsk on the ninth of February 1918, in which the Central Powers fixed the Ukrainian frontier along the line from Tarnogrod through Bilgoraj, Krasnystaw and Radzyn Podlaski. Kholm and Podlachia, the document says, were conceded to Ukraine and never lawfully taken back.\n\nWarsaw is invited to note that the treaty was signed, ratified and never renounced by anyone with the standing to renounce it, and to hand over the districts within the week."
 ukraine.7.a:0 "Sign it. The alternative is worse."
 ukraine.7.b:0 "Poland does not cede territory to anybody."
 ukraine.8.t:0 "Poland Yields the Kholm Region"
 ukraine.8.d:0 "The signature is obtained, and everyone in the room understands what it cost. The administration transfers within the month, the Polish officials leave with what they can carry, and a border that has moved four times in a century moves a fifth.\n\nWhat we have gained is a region that has been Polish in every practical sense since 1947. What we have demonstrated is that a document from 1918 is worth exactly as much force as stands behind it."
 ukraine.8.a:0 "The Kholm region comes home."
 ukraine.9.t:0 "Poland Refuses"
 ukraine.9.d:0 "The reply is one paragraph and does not engage with the treaty at all. Warsaw observes that the Ukrainian People's Republic ceased to exist in 1921, that the Central Powers who guaranteed its frontiers lost the war that year, and that Poland regards the matter as having been settled by the Treaty of Riga and by everything since.\n\nThey are not wrong about any of that. They are also, at this moment, reading our troop dispositions with considerable attention."
 ukraine.9.a:0 "Withdraw the note. We have made our point badly."
 ukraine.9.b:0 "Then Warsaw will be given a government that signs."
 ukraine.10.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.10.d:0 "The demand is put to Minsk in the language of fraternal clarification, which fools nobody and is not intended to. The treaty line of February 1918 ran from Kamyanyets through Pruzhany to Lake Vyhonivske, placing Brest and the whole southern Polesian marsh inside the Ukrainian republic, and Kyiv now proposes to restore it.\n\nThe note is careful to describe this as a correction between brothers. It is also careful to state a deadline."
 ukraine.10.a:0 "We cannot fight them and we know it."
 ukraine.10.b:0 "Minsk will not be corrected."
 ukraine.11.t:0 "Belarus Yields Brest"
 ukraine.11.d:0 "The transfer is arranged with a minimum of ceremony and no public statement worth reading. Brest is a city that has been Lithuanian, Polish, Russian, German, Soviet and Belarusian inside three hundred years, and the inhabitants have long since learned to file the paperwork and wait.\n\nThe fortress on the Bug is ours, along with the marshes behind it and a border that now touches Poland along the whole of its length."
 ukraine.11.a:0 "Take Brest and the Polesian districts."
 ukraine.12.t:0 "Belarus Refuses"
 ukraine.12.d:0 "The answer is furious out of all proportion to the territory involved, which tells us something. Minsk points out that it was Belarusian delegates who were not invited to Brest-Litovsk in 1918, that the treaty was signed over their heads in their own city, and that they have spent eighty years being partitioned by people quoting documents at them.\n\nIt is the most coherent objection anybody has raised, and it changes nothing about the arithmetic on the border."
 ukraine.12.a:0 "Let it go. They are the last friends we have."
 ukraine.12.b:0 "Then the correction will be made without their signature."
 ukraine.13.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.13.d:0 "The note is comparatively modest and rests on a census rather than a treaty. Some tens of thousands of Rusyns and Ukrainians live in the northeastern districts, the region was discussed for transfer in 1945 and kept, and there was a Ukrainian National Council at Presov asking to join the Soviet Union when the question was last open.\n\nKyiv proposes to reopen it. Bratislava is given a fortnight."
 ukraine.13.a:0 "It is a handful of districts. We cannot fight over them."
 ukraine.13.b:0 "Not one village."
 ukraine.14.t:0 "Slovakia Yields Pryashivshchyna"
 ukraine.14.d:0 "The handover is quiet, correct and conducted almost entirely by lawyers, which makes it the least disgraceful thing this government has done all year. The Rusyn associations in the transferred districts are divided about it, which nobody in Kyiv had expected and nobody had asked.\n\nWe have gained a mountain region, a few tens of thousands of people and a permanent argument with a neighbour who had done us no harm."
 ukraine.14.a:0 "The Presov region joins the republic."
 ukraine.15.t:0 "Slovakia Refuses"
 ukraine.15.d:0 "Bratislava replies that the question was settled in 1945 by governments with rather more standing than ours, that its Rusyn citizens have minority protections we have never offered anybody, and that it is a member of institutions that take a view on this sort of thing.\n\nThat last clause is the one the general staff keeps rereading."
 ukraine.15.a:0 "Drop it. The prize is not worth the enemy."
 ukraine.15.b:0 "Then we take what the census says is ours."
 ukraine.16.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.16.d:0 "The claim is the strangest of the set, because it rests on a secret protocol that Austria-Hungary annulled on the fourth of July 1918 for non-delivery of grain. Vienna had promised to merge the Ukrainian districts of Eastern Galicia and Bukovina into a single crownland by the thirty-first of July, and Kyiv now argues that the annulment was invalid and the obligation passed to the successor states.\n\nBucharest is invited to transfer southern Bukovina on the strength of a document neither party has ever seen in the original."
 ukraine.16.a:0 "The argument is absurd. Their army is not."
 ukraine.16.b:0 "Let them produce the document."
 ukraine.17.t:0 "Romania Yields Southern Bukovina"
 ukraine.17.d:0 "They sign, under protest, with a formal reservation lodged at every international body that will accept one. The reservation will outlive all of us and will be cited in a courtroom one day.\n\nBukovina is whole for the first time since 1940, which is an achievement of a sort, and it was obtained by threatening a neighbour with a treaty clause that expired before our grandparents were born."
 ukraine.17.a:0 "Bukovina is whole again."
 ukraine.18.t:0 "Romania Refuses"
 ukraine.18.d:0 "Bucharest's reply is unexpectedly detailed. It notes that the protocol was conditional on a grain delivery that never arrived, that Austria-Hungary formally repudiated it within five months, and that no Ukrainian government has raised the matter in eighty-two years.\n\nThe foreign ministry has read the reply three times and can find nothing in it that is untrue."
 ukraine.18.a:0 "Withdraw it before somebody publishes their reply."
 ukraine.18.b:0 "Then we will take Bukovina and argue about it afterwards."
 ukraine.19.t:0 "An Ultimatum from [FROM.GetName]"
 ukraine.19.d:0 "This is the one that was always coming, and the note does not pretend otherwise. Starodub, the Sloboda lands beyond Belgorod, the Don shore around Taganrog that was handed across in 1924, the Kuban whose rada voted for union in 1918 and was told to be quiet, and Crimea. Not a treaty claim, this: a bill presented for eighty years of frontier drawing done in Moscow by people who never asked.\n\nThe deadline is seven days. Nobody in the building believes it will be met, and the note was written to be refused."
 ukraine.19.a:0 "We cannot fight for the Kuban."
 ukraine.19.b:0 "Ukraine will be answered in kind."
 ukraine.20.t:0 "Russia Yields the Eastern Lands"
 ukraine.20.d:0 "They sign. The cabinet has been sitting for three hours and has not yet worked out why.\n\nWhether this is exhaustion, a calculation about what comes after, or the opening move in something we have not seen yet, the maps are being redrawn tonight. Starodub, Belgorod, Taganrog, the Kuban and Crimea pass to Kyiv, and a border that has not moved in our favour since 1954 moves four hundred kilometres east."
 ukraine.20.a:0 "Redraw the map before they reconsider."
 ukraine.21.t:0 "Russia Refuses"
 ukraine.21.d:0 "The answer is two sentences and neither of them addresses the territory. It observes that the government of Ukraine appears to have misjudged its position, and suggests that the misjudgement be corrected before it becomes expensive.\n\nThe general staff has been waiting for this since the note went out. They have plans for it. They would prefer not to use them."
 ukraine.21.a:0 "Let the note stand as a statement of principle and nothing more."
 ukraine.21.b:0 "Then it will be settled the way these things are always settled."

 ### POLITICAL - THE OPPOSITION AND YUSHCHENKO ###
 UKR_the_tent_city:0 "The Tent City"
 UKR_the_tent_city_desc:0 "Khreshchatyk is occupied and will not be vacated. Socialists share a stove with Rukh students, and the men of UNA-UNSO patrol the perimeter at night. Nobody in the camp agrees with anybody else about what should replace the president, and everybody agrees that he must go first."
 UKR_the_strike_committees:0 "The Strike Committees"
 UKR_the_strike_committees_desc:0 "The miners of the Donbas have not been paid in months and have walked to Kyiv before. If the pits stop the steel stops, and if the steel stops the men who fund the presidency begin asking whether it is worth funding. It is the only pressure this regime has ever understood."
 UKR_the_forum_for_national_salvation:0 "The Forum for National Salvation"
 UKR_the_forum_for_national_salvation_desc:0 "A coordinating body for a coalition that agrees on one sentence. It issues demands, drafts an impeachment motion and quarrels furiously in private about everything else. For a few months this winter it is the closest thing Ukraine has to an alternative government."
 UKR_the_president_falls:0 "The President Falls"
 UKR_the_president_falls_desc:0 "By impeachment, by resignation or by an aircraft to a country with no extradition treaty, he is gone. The tents come down, and the coalition that removed him discovers it must now govern together, which it has never once discussed."
 UKR_the_reform_premier:0 "The Reform Premier"
 UKR_the_reform_premier_desc:0 "He ran the National Bank through the worst of it, killed an inflation running at ten thousand percent and gave the country a currency that held. Then they made him prime minister, which everyone involved understood as either a promotion or a trap.\n\nHe is the only man in the government who is neither owned by a clan nor frightened of one, and he is about to find out what that is worth."
 UKR_pay_the_arrears:0 "Pay the Arrears"
 UKR_pay_the_arrears_desc:0 "Teachers, miners and pensioners are owed months of wages that the budget says were paid. The money went somewhere. Finding out where is a separate project; getting it to them by winter is this one."
 UKR_settle_in_cash:0 "End the Barter Economy"
 UKR_settle_in_cash_desc:0 "Half the economy settles its accounts in coal, steel billets and promissory notes, because barter cannot be taxed and cash can. Ending it will make a great many people visible to the revenue service for the first time since 1991."
 UKR_the_year_of_growth:0 "The Year of Growth"
 UKR_the_year_of_growth_desc:0 "The first year since independence in which the economy grows rather than shrinks. Five point nine percent, after nine straight years of contraction that took a third of everything.\n\nThe government is not popular for this, because nobody feels five percent. It is, however, the first argument this cabinet has that cannot be answered."
 UKR_clean_the_energy_sector:0 "Clean the Energy Sector"
 UKR_clean_the_energy_sector_desc:0 "Between the pipeline and the consumer sit intermediary companies whose owners cannot be established and whose profits could fund the state. The deputy prime minister for energy wants them gone, and she is not a woman who negotiates."
 UKR_the_hryvnia_holds:0 "The Hryvnia Holds"
 UKR_the_hryvnia_holds_desc:0 "A currency introduced in 1996 into a country that had lost two in five years. It survives the Russian default, the reserves rebuild, and Ukrainians begin, cautiously, to keep money in banks again."
 UKR_a_government_of_technocrats:0 "A Government of Technocrats"
 UKR_a_government_of_technocrats_desc:0 "Economists, bankers and engineers, appointed for competence and therefore owing nothing to anyone. Every faction in the Rada regards this as an intolerable provocation and is entirely correct to."
 UKR_out_of_the_shadows:0 "Out of the Shadows"
 UKR_out_of_the_shadows_desc:0 "Somewhere between forty and sixty percent of economic activity happens off the books. It is not hidden from the state so much as arranged with it, one inspector at a time. Registering it is worth more than any tax rise."
 UKR_open_the_books:0 "Open the Books"
 UKR_open_the_books_desc:0 "Published budgets, audited state enterprises and a procurement register anybody can read. It is the least dramatic reform available and the one the clans fight hardest, which tells you everything about which reforms matter."
 UKR_the_parting_of_the_ways:0 "The Parting of the Ways"
 UKR_the_parting_of_the_ways_desc:0 "The reforms have gone as far as they can go without answering a question the premier has spent two years avoiding: whether this system can be repaired from a ministry, or whether it has to be broken from outside.\n\nBoth answers have been given by serious people. Only one of them can be tried."
 UKR_our_ukraine:0 "Our Ukraine"
 UKR_our_ukraine_desc:0 "Dismissed by a parliament that assembled communists and oligarchs into the same division lobby, he does not retire. He builds a bloc out of the national democrats, the reformers and everyone the nineties left behind, and its name is a claim rather than a programme."
 UKR_our_ukraine_bloc:0 "The Bloc Takes the List"
 UKR_our_ukraine_bloc_desc:0 "First place in the party vote, and second place in the parliament, because half the seats are decided in districts where a governor can be leaned on. The lesson is filed away for later."
 UKR_the_pora_movement:0 "Pora"
 UKR_the_pora_movement_desc:0 "Students with stencils and a clock logo, trained by people who did this in Belgrade and Tbilisi first. The authorities arrest a few hundred of them, which is precisely the response the training anticipated."
 UKR_the_poisoning:0 "The Poisoning"
 UKR_the_poisoning_desc:0 "He goes to dinner with the head of the security service and is in a Vienna clinic within days, his face destroyed by a dose of dioxin that should have killed him. No prosecution will ever be brought.\n\nHe returns to the campaign looking like a different man, which turns out to be the most effective piece of political theatre in the country's history, and none of it was theatre."
 UKR_the_student_strike:0 "The Student Strike"
 UKR_the_student_strike_desc:0 "The universities of the west and centre empty into the trains, and the trains go to Kyiv. Somebody has arranged food, tents and generators for a hundred thousand people in a northern winter, which does not happen by accident."
 UKR_the_orange_revolution:0 "The Orange Revolution"
 UKR_the_orange_revolution_desc:0 "The count is announced and it is a lie that nobody is willing to pretend about. The square fills and does not empty, in November, for seventeen days, while the courts decide whether the law means anything.\n\nNo shots are fired, which afterwards seems the least likely part of it."
 UKR_the_third_round:0 "The Third Round"
 UKR_the_third_round_desc:0 "The supreme court annuls the run-off and orders it held again, which no court in this region has ever done. This time the count matches the ballots."
 UKR_the_constitutional_compromise:0 "The Constitutional Compromise"
 UKR_the_constitutional_compromise_desc:0 "The price of the third round is the reform the other side wanted all along: presidential powers transferred to parliament, effective the following year. He wins the office and signs away half of what it contains."
 UKR_the_orange_government:0 "The Orange Government"
 UKR_the_orange_government_desc:0 "Sworn in on the square rather than in the chamber, before half a million people who believe something has actually changed. The coalition that put him there contains at least three people who intend to have his job."
 UKR_europe_is_our_choice:0 "Europe Is Our Choice"
 UKR_europe_is_our_choice_desc:0 "Association, visa liberalisation, the acquis, and a queue that has no stated length. Brussels is enthusiastic in public and non-committal in every document, which is its way of saying not yet and possibly not ever."
 UKR_the_membership_action_plan:0 "The Membership Action Plan"
 UKR_the_membership_action_plan_desc:0 "The application goes in. It is the single act most certain to make an enemy of our largest neighbour, and it is put forward by a government that has just been carried into office by a crowd."
 UKR_the_promise_of_the_maidan:0 "The Promise of the Maidan"
 UKR_the_promise_of_the_maidan_desc:0 "A country where the count matches the ballots, the courts occasionally rule against the government and nobody is poisoned for standing in an election. Measured against what was promised on the square it is a disappointment. Measured against 1999 it is another country."
 UKR_reform_from_within:0 "Reform from Within"
 UKR_reform_from_within_desc:0 "He does not resign and he does not go to the square. The calculation is coldly stated in private: the crowd will disperse, the president will not, and a reformer inside the ministry can do more in a year than a martyr can do in ten.\n\nHalf the people who trusted him will never forgive it. He may still be right."
 UKR_the_letter_of_three:0 "The Letter of Three"
 UKR_the_letter_of_three_desc:0 "He signs it alongside the president and the speaker, denouncing the protesters as a threat to the state. It is the price of remaining in office, it is paid in the only currency he has, and he will be asked about it for the rest of his life."
 UKR_the_bargain_with_the_clans:0 "The Bargain with the Clans"
 UKR_the_bargain_with_the_clans_desc:0 "They keep what they took. In exchange, everything from this point forward is done by tender, on the record, at a price. It is not justice and nobody pretends it is; it is the only offer that does not end with him dismissed by Thursday."
 UKR_transparent_privatization:0 "Transparent Privatization"
 UKR_transparent_privatization_desc:0 "Open tenders, published valuations, foreign bidders admitted. The first sale under the new rules raises six times what the previous method would have, and the number is printed on the front page of every newspaper in the country."
 UKR_break_the_intermediaries:0 "Break the Intermediaries"
 UKR_break_the_intermediaries_desc:0 "The gas trading companies are stripped of their licences and the contracts are moved to the state. It is the single most dangerous thing anyone in this government will attempt, and two of the men affected have killed people over less."
 UKR_a_regulated_oligarchy:0 "A Regulated Oligarchy"
 UKR_a_regulated_oligarchy_desc:0 "The same dozen families still own the country. They now do so through audited companies, paying tax at a rate they negotiated but do pay, under a regulator they cannot dismiss.\n\nIt is a squalid compromise and it works. The economy grows, the budget balances, and nobody has to stand in a square in the snow."
 UKR_the_independent_central_bank:0 "The Independent Central Bank"
 UKR_the_independent_central_bank_desc:0 "Statutory independence, a fixed governor's term and a legal bar on lending to the treasury. He built this institution once already and knows exactly which clause the politicians will come for first."
 UKR_the_rule_of_law_agenda:0 "The Rule of Law Agenda"
 UKR_the_rule_of_law_agenda_desc:0 "Judicial appointments taken out of the presidential administration, a prosecutor who can be removed only by the courts, and a commercial bench that foreign investors are willing to sign contracts under."
 UKR_the_european_association:0 "The European Association"
 UKR_the_european_association_desc:0 "No membership talk, no action plan, no flags on the square. A technical association agreement negotiated clause by clause by people in grey suits, which is how this was always going to be achieved if it was going to be achieved at all."
 UKR_the_middle_class:0 "The Middle Class"
 UKR_the_middle_class_desc:0 "Small business registration made cheap, the inspectorates leashed, and mortgage lending made possible. A constituency that has never existed here before and that, once it does, will be very difficult for anyone to govern against."
 UKR_capitalism_with_rules:0 "Capitalism with Rules"
 UKR_capitalism_with_rules_desc:0 "There was no revolution. There was a decade of committee work, a great many compromises that looked like surrender at the time, and a country that is now boring, functional and considerably richer.\n\nThe men who stood on the square in 2000 do not regard this as a victory. Their children, who can get a mortgage, are less certain."
 UKR_the_tent_city_idea:0 "The Tent City"
 UKR_the_tent_city_idea_desc:0 "Khreshchatyk occupied, and a coalition that agrees on one sentence."
 UKR_the_strike_committees_idea:0 "The Strike Committees"
 UKR_the_strike_committees_idea_desc:0 "If the pits stop, the steel stops, and the men who fund the presidency start asking questions."
 UKR_the_national_salvation_forum:0 "The Forum for National Salvation"
 UKR_the_national_salvation_forum_desc:0 "The closest thing to an alternative government, quarrelling furiously in private."
 UKR_the_second_republic:0 "The Second Republic"
 UKR_the_second_republic_desc:0 "He is gone, and the coalition that removed him must now govern together."
 UKR_the_reform_premier_idea:0 "The Reform Premier"
 UKR_the_reform_premier_idea_desc:0 "Neither owned by a clan nor frightened of one."
 UKR_the_reform_premier_idea2:0 "The Year of Growth"
 UKR_the_reform_premier_idea2_desc:0 "Five point nine percent, after nine straight years of contraction."
 UKR_the_reform_premier_idea3:0 "A Government of Technocrats"
 UKR_the_reform_premier_idea3_desc:0 "Appointed for competence and therefore owing nothing to anyone."
 UKR_the_arrears_paid:0 "The Arrears Paid"
 UKR_the_arrears_paid_desc:0 "The money went somewhere. Getting it to them by winter came first."
 UKR_the_barter_economy_ended:0 "The Barter Economy Ended"
 UKR_the_barter_economy_ended_desc:0 "Barter cannot be taxed and cash can."
 UKR_the_energy_sector_cleaned:0 "The Energy Sector Cleaned"
 UKR_the_energy_sector_cleaned_desc:0 "Intermediaries whose owners could not be established and whose profits could fund the state."
 UKR_the_hryvnia_holds_idea:0 "The Hryvnia Holds"
 UKR_the_hryvnia_holds_idea_desc:0 "Ukrainians begin, cautiously, to keep money in banks again."
 UKR_out_of_the_shadows_idea:0 "Out of the Shadows"
 UKR_out_of_the_shadows_idea_desc:0 "Not hidden from the state so much as arranged with it, one inspector at a time."
 UKR_open_the_books_idea:0 "Open the Books"
 UKR_open_the_books_idea_desc:0 "The least dramatic reform available and the one the clans fight hardest."
 UKR_our_ukraine_idea:0 "Our Ukraine"
 UKR_our_ukraine_idea_desc:0 "A name that is a claim rather than a programme."
 UKR_our_ukraine_idea2:0 "The Bloc"
 UKR_our_ukraine_idea2_desc:0 "First in the vote, second in the parliament. The lesson is filed away."
 UKR_our_ukraine_idea3:0 "The Orange Revolution"
 UKR_our_ukraine_idea3_desc:0 "Seventeen days in November, and no shots fired."
 UKR_our_ukraine_idea4:0 "The Orange Government"
 UKR_our_ukraine_idea4_desc:0 "Sworn in on the square, before half a million people."
 UKR_our_ukraine_idea5:0 "The Promise of the Maidan"
 UKR_our_ukraine_idea5_desc:0 "A disappointment against the promise, another country against 1999."
 UKR_the_pora_movement_idea:0 "Pora"
 UKR_the_pora_movement_idea_desc:0 "Students with stencils, trained by people who did this in Belgrade first."
 UKR_the_poisoning_idea:0 "The Poisoning"
 UKR_the_poisoning_idea_desc:0 "He returned looking like a different man, and no prosecution was ever brought."
 UKR_the_student_strike_idea:0 "The Student Strike"
 UKR_the_student_strike_idea_desc:0 "Food, tents and generators for a hundred thousand people in a northern winter."
 UKR_the_third_round_idea:0 "The Third Round"
 UKR_the_third_round_idea_desc:0 "No court in this region had ever done it. This time the count matched the ballots."
 UKR_the_constitutional_compromise_idea:0 "The Constitutional Compromise"
 UKR_the_constitutional_compromise_idea_desc:0 "He won the office and signed away half of what it contained."
 UKR_europe_is_our_choice_idea:0 "Europe Is Our Choice"
 UKR_europe_is_our_choice_idea_desc:0 "Enthusiastic in public, non-committal in every document."
 UKR_the_membership_action_plan_idea:0 "The Membership Action Plan"
 UKR_the_membership_action_plan_idea_desc:0 "The single act most certain to make an enemy of our largest neighbour."
 UKR_reform_from_within_idea:0 "Reform from Within"
 UKR_reform_from_within_idea_desc:0 "The crowd will disperse. The president will not."
 UKR_reform_from_within_idea2:0 "Transparent Privatization"
 UKR_reform_from_within_idea2_desc:0 "Six times what the previous method would have raised, printed on every front page."
 UKR_reform_from_within_idea3:0 "A Regulated Oligarchy"
 UKR_reform_from_within_idea3_desc:0 "A squalid compromise, and it works."
 UKR_reform_from_within_idea4:0 "Capitalism with Rules"
 UKR_reform_from_within_idea4_desc:0 "Boring, functional and considerably richer."
 UKR_the_letter_of_three_idea:0 "The Letter of Three"
 UKR_the_letter_of_three_idea_desc:0 "The price of remaining in office, paid in the only currency he has."
 UKR_the_bargain_with_the_clans_idea:0 "The Bargain with the Clans"
 UKR_the_bargain_with_the_clans_idea_desc:0 "They keep what they took. Everything after this is done at a price."
 UKR_the_intermediaries_broken:0 "The Intermediaries Broken"
 UKR_the_intermediaries_broken_desc:0 "Two of the men affected have killed people over less."
 UKR_the_independent_central_bank_idea:0 "The Independent Central Bank"
 UKR_the_independent_central_bank_idea_desc:0 "He built it once and knows which clause they will come for first."
