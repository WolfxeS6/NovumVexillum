 ### MILITARY: NATIONAL SPIRITS ###
 UKR_contract_army:0 "Contract Army"
 UKR_contract_army_desc:0 "Ukraine is gradually replacing conscripts with professional contract soldiers."
 UKR_universal_conscription:0 "Universal Conscription"
 UKR_universal_conscription_desc:0 "Every young Ukrainian man is expected to serve, providing the nation with a vast pool of trained reservists."
 UKR_ukroboronprom:0 "Ukroboronprom"
 UKR_ukroboronprom_desc:0 "The state defence concern coordinates the management, finances and exports of Ukraine's defence enterprises."
 UKR_the_arsenal_of_the_east_idea:0 "The Arsenal of the East"
 UKR_the_arsenal_of_the_east_idea_desc:0 "Ukraine's defence industry is among the most capable in the world, arming both its own forces and its partners abroad."
 UKR_propaganda_campaigns:0 "Propaganda Campaigns"
 UKR_propaganda_campaigns_desc:0 "The Ukrainian government has launched a series of propaganda campaigns to boost morale and support for the armed forces."

 ### MILITARY: POVITRYANI SYLY & VIISKOVO-MORSKI SYLY ###
 UKR_povitryani_syly:0 "Povitryani Syly"
 UKR_povitryani_syly_desc:0 "Ukraine's Air Force inherited hundreds of modern Soviet combat aircraft, but lacks the fuel, spare parts and money to keep them flying. Restoring basic maintenance and safety standards must come before anything else."
 UKR_more_flight_hours:0 "More Flight Hours"
 UKR_more_flight_hours_desc:0 "Ukrainian pilots fly only a fraction of the hours their Western counterparts do, and their skills are wasting away. Funding fuel and training flights is the only way to keep a competent cadre of combat pilots."
 UKR_the_kharkiv_air_force_university:0 "The Kharkiv Air Force University"
 UKR_the_kharkiv_air_force_university_desc:0 "Kharkiv has trained military pilots since the Soviet era. Concentrating our flight schools there into a single modern university will give the next generation of pilots the education they need."
 UKR_flight_safety_programme:0 "Flight Safety Programme"
 UKR_flight_safety_programme_desc:0 "Worn-out aircraft and inexperienced crews are a recipe for disaster. Strict maintenance standards and safety procedures will keep our pilots, and the public, alive."
 UKR_modernize_the_fighter_fleet:0 "Modernize the Fighter Fleet"
 UKR_modernize_the_fighter_fleet_desc:0 "Control of the skies is the first duty of any air force. Our MiG-29 and Su-27 fighters remain capable aircraft, and modernising them will be the Air Force's first priority."
 UKR_upgrade_the_mig_29:0 "Upgrade the MiG-29"
 UKR_upgrade_the_mig_29_desc:0 "The aircraft repair plant in Lviv can equip our MiG-29s with new avionics, radar and weapons, keeping the backbone of our fighter force competitive for years to come."
 UKR_the_su_27_interceptors:0 "The Su-27 Interceptors"
 UKR_the_su_27_interceptors_desc:0 "With its long range and powerful radar, the Su-27 is the ideal aircraft to guard Ukraine's vast airspace. Keeping our interceptor regiments at full readiness will deter any intruder."
 UKR_the_strike_aviation:0 "The Strike Aviation"
 UKR_the_strike_aviation_desc:0 "In any war on the plains of Eastern Europe, the decisive battles will be fought on the ground. Our Air Force will focus first on supporting the army and striking the enemy's forces."
 UKR_upgrade_the_su_25:0 "Upgrade the Su-25"
 UKR_upgrade_the_su_25_desc:0 "The rugged Su-25 is one of the best close-support aircraft in the world. Modernising its navigation and targeting systems will make it deadlier still."
 UKR_the_su_24_bomber_regiments:0 "The Su-24 Bomber Regiments"
 UKR_the_su_24_bomber_regiments_desc:0 "The Su-24 can strike targets deep behind enemy lines, by day or by night. Keeping our bomber regiments trained and equipped gives Ukraine a long-range punch few of its neighbours can match."
 UKR_merge_the_air_defence_forces:0 "Merge the Air Defence Forces"
 UKR_merge_the_air_defence_forces_desc:0 "Ukraine maintains a separate Air Force and Air Defence Force, each with its own command, bases and bureaucracy. Merging them into a single service will eliminate duplication and create an integrated defence of Ukrainian airspace."
 UKR_the_s_300_batteries:0 "The S-300 Batteries"
 UKR_the_s_300_batteries_desc:0 "The S-300 surface-to-air missile systems we inherited are among the most capable in the world. Restoring them to full readiness will make our skies dangerous for any intruder."
 UKR_the_radar_network:0 "The Radar Network"
 UKR_the_radar_network_desc:0 "Many of the radar stations that once guarded the Soviet Union's western border now stand idle. Reactivating and modernising them will give us early warning of any threat."
 UKR_unified_air_defence_command:0 "Unified Air Defence Command"
 UKR_unified_air_defence_command_desc:0 "A single command, linking our radars, missile batteries and fighters into one network, will allow us to detect, track and destroy any threat to Ukrainian airspace."
 UKR_restore_the_airfields:0 "Restore the Airfields"
 UKR_restore_the_airfields_desc:0 "Many of Ukraine's military airfields have fallen into disrepair, their runways cracked and their facilities abandoned. Restoring the key air bases will allow the Air Force to operate effectively once more."
 UKR_military_transport_aviation:0 "Military Transport Aviation"
 UKR_military_transport_aviation_desc:0 "Our Il-76 and An-26 transports give the armed forces the ability to move troops and supplies quickly across the country, and to support our peacekeepers abroad."
 UKR_a_modern_air_force:0 "A Modern Air Force"
 UKR_a_modern_air_force_desc:0 "With experienced pilots, modernised aircraft, an integrated air defence and restored bases, Ukraine's Air Force is once again a force to be reckoned with in the skies over Eastern Europe."
 UKR_viiskovo_morski_syly:0 "Viiskovo-Morski Syly"
 UKR_viiskovo_morski_syly_desc:0 "The Ukrainian Navy was born from the partition of the Soviet Black Sea Fleet and received its smallest and oldest share. Before it can grow, it must first learn to keep its existing ships seaworthy."
 UKR_repair_the_fleet:0 "Repair the Fleet"
 UKR_repair_the_fleet_desc:0 "Many of the ships Ukraine received in the partition of the Black Sea Fleet cannot leave port. A serious repair programme will return the most valuable of them to service."
 UKR_the_sevastopol_dockyards:0 "The Sevastopol Dockyards"
 UKR_the_sevastopol_dockyards_desc:0 "The dockyards of Sevastopol have serviced warships for two centuries. Investing in them will give the navy the facilities it needs to maintain and refit its ships at home."
 UKR_decommission_the_hulks:0 "Decommission the Hulks"
 UKR_decommission_the_hulks_desc:0 "Many of the ships we inherited will never sail again, yet they still consume crews and money. Scrapping them will free up sailors and funds for the ships that matter."
 UKR_the_hetman_sahaidachny:0 "The Hetman Sahaidachny"
 UKR_the_hetman_sahaidachny_desc:0 "The frigate Hetman Sahaidachny, flagship of the Ukrainian Navy, is one of the few Ukrainian warships fit for operations far from home. Keeping her at sea will build the experience and pride of our young navy."
 UKR_show_the_flag:0 "Show the Flag"
 UKR_show_the_flag_desc:0 "Port visits, joint exercises and long-distance voyages will give our crews experience at sea and show the world that Ukraine is a maritime nation."
 UKR_the_naval_academy:0 "The Naval Academy"
 UKR_the_naval_academy_desc:0 "The Sevastopol Naval Institute will train a new generation of Ukrainian naval officers, schooled in modern tactics and ready to lead the fleet of the future."
 UKR_a_blue_water_navy:0 "A Blue-Water Navy"
 UKR_a_blue_water_navy_desc:0 "A nation with Ukraine's coastline and trade must be able to protect its interests on the open sea. The navy will be built around ocean-going frigates capable of operating far from home."
 UKR_the_frigate_squadron:0 "The Frigate Squadron"
 UKR_the_frigate_squadron_desc:0 "A squadron of modern frigates, led by the Hetman Sahaidachny, will form the core of a navy able to escort convoys and operate alongside our partners."
 UKR_patrol_the_black_sea:0 "Patrol the Black Sea"
 UKR_patrol_the_black_sea_desc:0 "Regular patrols across the Black Sea will keep our crews trained, protect our shipping lanes and hunt for any submarine lurking in our waters."
 UKR_a_mosquito_fleet:0 "A Mosquito Fleet"
 UKR_a_mosquito_fleet_desc:0 "Ukraine cannot afford a fleet of great warships, nor does it need one. Swarms of fast, missile-armed boats and coastal batteries can make the Black Sea a deathtrap for any larger navy."
 UKR_missile_boats:0 "Missile Boats"
 UKR_missile_boats_desc:0 "Small, fast and heavily armed, missile boats built at Feodosia can strike enemy warships many times their size before disappearing back into coastal waters."
 UKR_coastal_defence:0 "Coastal Defence"
 UKR_coastal_defence_desc:0 "With only a small fleet, Ukraine must rely on coastal missile batteries, minefields and fast attack craft to defend its long coastline. Strengthening these defences will make any hostile landing a costly affair."
 UKR_naval_aviation:0 "Naval Aviation"
 UKR_naval_aviation_desc:0 "Maritime patrol aircraft and anti-submarine helicopters extend the navy's eyes far beyond the horizon, finding the enemy long before he finds us."
 UKR_the_naval_infantry:0 "The Naval Infantry"
 UKR_the_naval_infantry_desc:0 "The marines based at Feodosia are among the best-trained units in the armed forces. Expanding them will give the navy a force able to seize and hold ground from the sea."
 UKR_the_southern_naval_base:0 "The Southern Naval Base"
 UKR_the_southern_naval_base_desc:0 "The Ukrainian Navy shares Sevastopol with the Russian Black Sea Fleet under the terms of the partition agreement. Developing our own facilities in Odesa and at Novoozerne will give the navy the bases it needs to grow."
 UKR_a_modern_navy:0 "A Modern Navy"
 UKR_a_modern_navy_desc:0 "Though still small, the Ukrainian Navy has become a capable and professional force, ready to defend the nation's coastline and its interests on the Black Sea."

