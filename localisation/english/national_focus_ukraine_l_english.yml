 ### MILITARY ###
 UKR_the_armed_forces_of_ukraine:0 "Zbroini Syly Ukrainy"
 UKR_the_armed_forces_of_ukraine_desc:0 "In 1991 Ukraine inherited one of the largest military forces in Europe: hundreds of thousands of soldiers, thousands of tanks and aircraft, and a share of the Black Sea Fleet. A decade later, that force exists largely on paper. Soldiers go unpaid, equipment rusts in depots and pilots barely fly. The armed forces must be rebuilt as the army of an independent nation."
 UKR_sukhoputni_viiska:0 "Sukhoputni Viiska"
 UKR_sukhoputni_viiska_desc:0 "The Ground Forces are the backbone of Ukraine's defence and the service that has fared least badly since independence. Restoring discipline and basic readiness in the existing units is the first step towards a capable army."
 UKR_pay_the_soldiers:0 "Pay the Soldiers"
 UKR_pay_the_soldiers_desc:0 "Officers and contract soldiers are routinely left without pay for months, and tens of thousands of them have no permanent home for their families. Paying them on time and building housing for servicemen is expensive, but no army can be expected to fight for a state that does not honour its obligations to it."
 UKR_the_yavoriv_training_centre:0 "The Yavoriv Training Centre"
 UKR_the_yavoriv_training_centre_desc:0 "The training ground at Yavoriv, near Lviv, has become a centre for peacekeeping training and joint exercises with foreign partners. Expanding it will give Ukrainian soldiers the realistic, modern training they have lacked since independence."
 UKR_mechanized_brigades:0 "Mechanized Brigades"
 UKR_mechanized_brigades_desc:0 "The rigid Soviet divisional structure is ill-suited to a smaller, more mobile army. Reorganizing the Ground Forces into self-sufficient mechanized brigades will make them more flexible and easier to command."
 UKR_peacekeeping_missions:0 "Peacekeeping Missions"
 UKR_peacekeeping_missions_desc:0 "From Lebanon to Kosovo and Sierra Leone, Ukrainian peacekeepers have served under the UN flag across the world. Expanding these missions, and operating alongside foreign armies in international coalitions, will give our brigades real experience of modern operations while raising Ukraine's international standing."
 UKR_modernize_the_tank_fleet:0 "Modernize the Tank Fleet"
 UKR_modernize_the_tank_fleet_desc:0 "Ukraine owns thousands of Soviet-era tanks, most of them obsolete. Upgrading the best of them with modern fire control, armour and engines at our own plants will give the army a capable tank force at a fraction of the cost of new vehicles."
 UKR_a_modern_army:0 "A Modern Army"
 UKR_a_modern_army_desc:0 "Paid, trained and reorganized, the Ground Forces of Ukraine are no longer a hollow remnant of the Soviet army, but a modern force capable of defending the nation."
 UKR_the_manpower_question:0 "The Manpower Question"
 UKR_the_manpower_question_desc:0 "Every year hundreds of thousands of young men are called up for service, but the army has neither the money nor the instructors to train them properly. Ukraine must decide what kind of army it wants: a smaller professional force, or a mass army built on universal conscription."
 UKR_towards_a_professional_army:0 "Towards a Professional Army"
 UKR_towards_a_professional_army_desc:0 "A small army of well-paid, well-trained volunteers is worth more than a large army of reluctant conscripts. Ukraine will gradually replace conscription with contract service, following the example of its Western partners."
 UKR_preserve_universal_conscription:0 "Preserve Universal Conscription"
 UKR_preserve_universal_conscription_desc:0 "In a country as large as Ukraine, with neighbours as powerful as ours, only a mass reserve of trained citizens can guarantee our security. Universal conscription will remain the foundation of national defence."
 UKR_a_professional_nco_corps:0 "A Professional NCO Corps"
 UKR_a_professional_nco_corps_desc:0 "The Soviet army relied on officers to do everything, leaving sergeants with little authority or training. Building a corps of professional non-commissioned officers will provide the experienced junior leadership that a modern army depends on."
 UKR_territorial_defence:0 "Territorial Defence"
 UKR_territorial_defence_desc:0 "Organising former conscripts into regional territorial defence units will give Ukraine a large, locally based reserve that can be mobilised quickly in a crisis."
 UKR_consolidate_the_defence_industry:0 "Consolidate the Defence Industry"
 UKR_consolidate_the_defence_industry_desc:0 "Hundreds of defence enterprises, from tank plants to missile design bureaus, are scattered across different ministries with no common strategy. Only a coordinated effort between the economy and the armed forces can turn this inheritance into a modern defence industry."
 UKR_create_ukroboronprom:0 "Create Ukroboronprom"
 UKR_create_ukroboronprom_desc:0 "All state-owned defence enterprises will be brought together in a single state concern, Ukroboronprom. Unifying their management, finances and exports will allow the defence industry to plan for the long term and compete on world markets."
 UKR_fund_the_air_industry:0 "Fund the Air Industry"
 UKR_fund_the_air_industry_desc:0 "Ukraine is one of only a handful of nations able to design and build aircraft and aircraft engines from start to finish. Steady state funding will keep Antonov, Motor Sich and our repair plants alive and innovating."
 UKR_the_an_70_programme:0 "The An-70 Programme"
 UKR_the_an_70_programme_desc:0 "The An-70 military transport is the most advanced aircraft ever designed in Ukraine. Bringing it into production, for our own air force and for export, would be a triumph for the Ukrainian aviation industry."
 UKR_motor_sich_engines:0 "Motor Sich Engines"
 UKR_motor_sich_engines_desc:0 "The engines built by Motor Sich in Zaporizhzhia power aircraft and helicopters around the world. Investing in new engine designs will secure Ukraine's position as one of the world's leading aero-engine makers."
 UKR_the_oplot_programme:0 "The Oplot Programme"
 UKR_the_oplot_programme_desc:0 "The T-84 Oplot, developed in Kharkiv from the T-80UD, is among the most modern tanks in the world. Putting it into series production will equip our army and give Ukraine a flagship product for the international arms market."
 UKR_guided_weapons_programme:0 "Guided Weapons Programme"
 UKR_guided_weapons_programme_desc:0 "The Luch design bureau and other Kyiv enterprises have the expertise to develop modern anti-tank and guided missiles. Funding these programmes will give our army precision weapons of its own design."
 UKR_standardize_small_arms:0 "Standardize Small Arms"
 UKR_standardize_small_arms_desc:0 "Our soldiers still carry the rifles and pistols of the Soviet army, while domestic producers like Fort in Vinnytsia are ready to supply modern designs. Standardizing on Ukrainian-made small arms will support our own industry and simplify logistics."
 UKR_the_mykolaiv_shipyards:0 "The Mykolaiv Shipyards"
 UKR_the_mykolaiv_shipyards_desc:0 "The shipyards of Mykolaiv built the Soviet Union's aircraft carriers and cruisers. Returning them to military work will give Ukraine the capacity to build and maintain its own warships."
 UKR_zorya_mashproekt_turbines:0 "Zorya-Mashproekt Turbines"
 UKR_zorya_mashproekt_turbines_desc:0 "The gas turbines made by Zorya-Mashproekt in Mykolaiv power warships around the world. Keeping this unique capability at home will allow Ukraine to build modern warships without relying on foreign suppliers."
 UKR_the_corvette_programme:0 "The Corvette Programme"
 UKR_the_corvette_programme_desc:0 "A class of modern multi-purpose corvettes, designed and built entirely in Ukraine, would be the ideal backbone for a navy of our size and give our shipbuilders a reason to modernise."
 UKR_international_arms_contracts:0 "International Arms Contracts"
 UKR_international_arms_contracts_desc:0 "From T-80UD tanks for Pakistan to aircraft upgrades across Africa and Asia, Ukrainian arms are in demand wherever customers want capable equipment at a reasonable price. Every contract won brings in foreign currency and keeps our factories working."
 UKR_joint_ventures_abroad:0 "Joint Ventures Abroad"
 UKR_joint_ventures_abroad_desc:0 "Partnering with foreign manufacturers on joint projects will give our defence enterprises access to new technology, new capital and new markets."
 UKR_the_defence_export_boom:0 "The Defence Export Boom"
 UKR_the_defence_export_boom_desc:0 "Ukraine has become one of the largest arms exporters in the world. The revenue from our defence exports now funds the modernisation of our own armed forces and a wider revival of Ukrainian industry."
 UKR_the_arsenal_of_the_east:0 "The Arsenal of the East"
 UKR_the_arsenal_of_the_east_desc:0 "Tanks from Kharkiv, aircraft from Kyiv, engines from Zaporizhzhia and warships from Mykolaiv: Ukraine's defence industry is once again among the most capable in the world, able to arm both its own forces and its partners abroad."

 ### MILITARY: SUKHOPUTNI VIISKA ###
 UKR_end_dedovshchyna:0 "End Dedovshchyna"
 UKR_end_dedovshchyna_desc:0 "The brutal hazing of young conscripts by older soldiers, inherited from the Soviet army, drives desertion and destroys trust between ranks. Stamping it out will make the barracks a place where soldiers are trained, not abused, and turn military service into a career worth having."
 UKR_adopt_nato_standards:0 "Adopt NATO Standards"
 UKR_adopt_nato_standards_desc:0 "Through the Partnership for Peace, Ukraine has already begun working alongside NATO armies. Adopting their procedures, communications and command structures will make our forces more flexible and able to operate with Western partners."
 UKR_soviet_operational_art:0 "Soviet Operational Art"
 UKR_soviet_operational_art_desc:0 "The Soviet school of operational art, with its massed artillery and deep offensives, was built for exactly the kind of war Ukraine might one day have to fight. Our officers were trained in it, and we should build on that inheritance rather than discard it."
 UKR_multinational_exercises:0 "Multinational Exercises"
 UKR_multinational_exercises_desc:0 "Hosting joint exercises with foreign armies on Ukrainian soil will expose our officers and soldiers to new tactics and equipment, and show the world that Ukraine is a reliable security partner."
 UKR_interoperable_brigades:0 "Interoperable Brigades"
 UKR_interoperable_brigades_desc:0 "A number of our brigades will be fully reorganized along NATO lines, able to operate seamlessly with allied forces and serve as a model for the rest of the army."
 UKR_massed_fires:0 "Massed Fires"
 UKR_massed_fires_desc:0 "Artillery has always been the god of war on the plains of Eastern Europe. Concentrating our guns and rocket launchers into powerful artillery groups will allow us to crush any attacker with overwhelming firepower."
 UKR_deep_operations:0 "Deep Operations"
 UKR_deep_operations_desc:0 "Rather than meeting the enemy only at the front, our forces will be trained to strike deep into his rear, breaking through his lines and destroying his reserves before they can be committed."
 UKR_the_national_defence_university:0 "The National Defence University"
 UKR_the_national_defence_university_desc:0 "The National Defence Academy in Kyiv will be expanded into a modern university for the education of Ukraine's senior officers, combining the best of our own traditions with the lessons learned from our partners."
 UKR_state_programme_for_reform:0 "The State Programme for Reform"
 UKR_state_programme_for_reform_desc:0 "A comprehensive State Programme for the Reform and Development of the Armed Forces will set out, for the first time since independence, a clear plan for the size, structure and funding of the army. Its first step is painful but necessary: disbanding the hollow units Ukraine can no longer afford to maintain."
 UKR_operational_commands:0 "Operational Commands"
 UKR_operational_commands_desc:0 "The Soviet military districts on Ukrainian soil will be replaced by operational commands, each responsible for the defence of its own region and able to direct the forces within it in wartime."
 UKR_joint_rapid_reaction_forces:0 "Joint Rapid Reaction Forces"
 UKR_joint_rapid_reaction_forces_desc:0 "The best-equipped and best-trained units will be formed into Joint Rapid Reaction Forces, kept at full strength and ready to deploy anywhere in the country, or abroad, at short notice."
 UKR_main_defence_forces:0 "Main Defence Forces"
 UKR_main_defence_forces_desc:0 "The bulk of the army will form the Main Defence Forces, responsible for holding the country's borders and territory in a major war and able to absorb and repel any invasion."
 UKR_airmobile_brigades:0 "Airmobile Brigades"
 UKR_airmobile_brigades_desc:0 "Ukraine's airborne and airmobile brigades are among the most capable units in the army. Expanding them will give the rapid reaction forces a light, fast and hard-hitting spearhead."
 UKR_special_purpose_regiments:0 "Special Purpose Regiments"
 UKR_special_purpose_regiments_desc:0 "Small units of highly trained special forces, able to operate behind enemy lines, conduct reconnaissance and carry out raids, are a force multiplier out of all proportion to their size."
 UKR_defence_in_depth:0 "Defence in Depth"
 UKR_defence_in_depth_desc:0 "Successive prepared lines of defence, backed by engineers and artillery, will ensure that any invader faces a costly battle for every kilometre of Ukrainian soil."
 UKR_strategic_reserves:0 "Strategic Reserves"
 UKR_strategic_reserves_desc:0 "Well-organised reserve formations and mobilisation depots will allow Ukraine to rapidly expand its army in a crisis and replace losses on the front."
 UKR_contract_service_incentives:0 "Contract Service Incentives"
 UKR_contract_service_incentives_desc:0 "Better pay, housing and education benefits for contract soldiers will attract the motivated volunteers a professional army needs, and persuade the best of them to stay."
 UKR_reservist_training:0 "Reservist Training"
 UKR_reservist_training_desc:0 "Regular refresher training for former conscripts will ensure that Ukraine's vast reserve is a genuine military asset rather than a list of names."
 UKR_a_trained_force:0 "A Trained Force"
 UKR_a_trained_force_desc:0 "Whether volunteers or conscripts, Ukraine's soldiers now receive proper training before they are sent to their units. The days of untrained recruits guarding empty depots are over."
 UKR_the_ukrainian_soldier:0 "The Ukrainian Soldier"
 UKR_the_ukrainian_soldier_desc:0 "Trained, motivated and led by a new generation of younger, more flexible officers, the Ukrainian soldier is the true strength of the army and the foundation on which everything else is built."
 UKR_modernize_army_equipment:0 "Modernize Army Equipment"
 UKR_modernize_army_equipment_desc:0 "The army still fights with the equipment it inherited in 1991, much of it worn out or obsolete. A long-term modernisation programme, supplied by our own industry, will gradually bring it up to date."
 UKR_new_armoured_personnel_carriers:0 "New Armoured Personnel Carriers"
 UKR_new_armoured_personnel_carriers_desc:0 "Ukrainian designers in Kharkiv and Kyiv have developed a new generation of wheeled armoured personnel carriers. Equipping our mechanized infantry with them will make it faster and better protected."
 UKR_modernize_the_artillery:0 "Modernize the Artillery"
 UKR_modernize_the_artillery_desc:0 "New fire-control systems, ammunition and communications will allow our artillery to fire faster and more accurately, while the Soviet-built surface-to-air missile systems we inherited will be kept operational to shield our ground forces from enemy aircraft."
 UKR_the_armoured_fist:0 "The Armoured Fist"
 UKR_the_armoured_fist_desc:0 "Tanks remain the decisive weapon of land warfare. Concentrating our modernised tank fleet into powerful armoured formations will give the army the striking power it needs."
 UKR_precision_firepower:0 "Precision Firepower"
 UKR_precision_firepower_desc:0 "Rather than relying on massed armour, the army will emphasise long-range, precise firepower, striking the enemy before he can close with our forces."
 UKR_tank_brigades:0 "Tank Brigades"
 UKR_tank_brigades_desc:0 "Dedicated tank brigades, equipped with our best modernised tanks and supported by mechanized infantry, will form the core of the army's offensive power."
 UKR_combined_arms_battalions:0 "Combined Arms Battalions"
 UKR_combined_arms_battalions_desc:0 "Mixing tanks, infantry and artillery at battalion level will allow our armoured formations to fight as self-sufficient teams on a fast-moving battlefield."
 UKR_rocket_artillery_brigades:0 "Rocket Artillery Brigades"
 UKR_rocket_artillery_brigades_desc:0 "The Smerch and Uragan multiple rocket launchers can devastate entire areas at long range. Organising them into dedicated brigades will give the army a formidable deep-strike capability."
 UKR_reconnaissance_and_targeting:0 "Reconnaissance and Targeting"
 UKR_reconnaissance_and_targeting_desc:0 "Long-range fires are only as good as the information that guides them. Modern reconnaissance units, radars and drones will find the enemy and direct our artillery onto him."
 UKR_army_aviation:0 "Army Aviation"
 UKR_army_aviation_desc:0 "The army's attack and transport helicopters give our ground forces mobility and firepower no vehicle can match, and a modern supply system with reliable transport and well-stocked depots will keep them, and the rest of the army, fighting wherever they are needed."
 UKR_create_propaganda_campaigns:0 "Create Propaganda Campaigns"
 UKR_create_propaganda_campaigns_desc:0 "The army is a national institution, and the public must be made aware of its role in defending the country. A series of campaigns will highlight the army's achievements and encourage young men to serve."

