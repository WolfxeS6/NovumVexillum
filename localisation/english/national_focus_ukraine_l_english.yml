l_english:
# Ukrainian Focus Tree

 UKR_the_pipeline_consortium:0 "The Pipeline Consortium"
 UKR_the_pipeline_consortium_desc:0 "A joint venture between a Russian monopoly, a Ukrainian ministry and two men nobody can quite name will own the Druzhba spurs, the gas storage and the right to be consulted. The prospectus is forty pages long, and the only page that matters is the one with the signatures."
 UKR_the_transit_tariff:0 "The Transit Tariff"
 UKR_the_transit_tariff_desc:0 "Everything that crosses the country now pays, and the figure on the invoice is set in Kyiv. Moscow complains, Brussels complains, and the treasury notes with some surprise that the complaints are denominated in euros."
 UKR_the_state_television:0 "The State Television Hour"
 UKR_the_state_television_desc:0 "There is one evening bulletin that matters and it has one editor, who telephones the ministry at six to ask whether the weather has been approved. The weather is generally approved."
 UKR_the_press_inspectorate:0 "The Press Inspectorate"
 UKR_the_press_inspectorate_desc:0 "Nobody calls it censorship. Editors are advised, printers are inspected, and a licence that was renewed for years without comment is found to contain an irregularity. The papers learn quickly what the irregularity was."
 UKR_the_oligarchs_club:0 "The Oligarchs' Club"
 UKR_the_oligarchs_club_desc:0 "Once a month a dozen men who between them own most of the economy dine in a restaurant with no menu. The party's role is to pay, and to agree."
 UKR_the_media_holdings:0 "The Media Holdings"
 UKR_the_media_holdings_desc:0 "Three channels, two newspapers and a news agency are bought through a company in Cyprus, and thereafter agree with one another very persuasively."
 UKR_the_coal_subsidies:0 "The Coal Subsidies"
 UKR_the_coal_subsidies_desc:0 "Every mine in the Donbas runs at a loss, and the loss is the point. The subsidy keeps a quarter of a million miners employed, loyal and aware of whom to thank."
 UKR_the_miners_vote:0 "The Miners' Vote"
 UKR_the_miners_vote_desc:0 "Shift managers read the party list aloud in the canteens, and the ballot box goes down in the cage with the first shift. The result from the shaft is, by a wide margin, the most reliable in the country."
 UKR_the_ngo_network:0 "The NGO Network"
 UKR_the_ngo_network_desc:0 "A ministry, a foundation and a mailing list. The movement's real strength has always been the three hundred people who answer the telephone, and the network gives them a letterhead and a fax machine."
 UKR_the_international_donors:0 "The International Donors"
 UKR_the_international_donors_desc:0 "Brussels, Washington and Stockholm each want to fund something with a measurable outcome, and the movement has a long list of outcomes that can be measured."
 UKR_the_local_chapters:0 "The Local Chapters"
 UKR_the_local_chapters_desc:0 "Forty towns, forty rented rooms and one photocopier shared between them. A chapter is three friends and a stamp, and the movement discovers that three friends and a stamp are enough to be registered with the council."
 UKR_the_trade_union_federation:0 "The Trade Union Federation"
 UKR_the_trade_union_federation_desc:0 "The old official unions have eleven million members, a building on Khreshchatyk and no memory of ever having called a strike. The party proposes to remind them."
 UKR_the_strike_fund:0 "The Strike Fund"
 UKR_the_strike_fund_desc:0 "A hundredth of every member's wage, paid into an account the prosecutor's office has not yet found. In a bad year it feeds a town."
 UKR_the_workers_militia:0 "The Workers' Militia"
 UKR_the_workers_militia_desc:0 "Every shop carries a rota of volunteers, a locked cupboard and a sergeant from the old territorial defence who is happy to be consulted. The party says they exist to protect the strike fund. The strike fund is less sure."
 UKR_the_central_bank_governor:0 "The Central Bank Governor"
 UKR_the_central_bank_governor_desc:0 "The new governor keeps one copy of the inflation figures in his drawer and one on his desk, and the two are the same. The market is startled by the habit."
 UKR_the_hunger_strike:0 "The Hunger Strike"
 UKR_the_hunger_strike_desc:0 "She stops eating on the fourth day of the sentence, and the cameras at the gate stop leaving on the fifth. The authorities, who had prepared for a trial, are not prepared for a martyr."
 UKR_the_european_resolution:0 "The European Resolution"
 UKR_the_european_resolution_desc:0 "A paragraph in a Strasbourg communique, the word 'selective' in front of the word 'justice', and a minister who has never looked so much like a man being measured for a suit."
 UKR_the_language_ombudsman:0 "The Language Ombudsman"
 UKR_the_language_ombudsman_desc:0 "A small office with a large postbag. Citizens write to complain that a clerk answered in the wrong language, and the ombudsman answers, tirelessly, in both."
 UKR_the_constitutional_court:0 "The Constitutional Court"
 UKR_the_constitutional_court_desc:0 "Judges are appointed by three bodies instead of one, which none of the three has ever done before. The first ruling against the government arrives in nine weeks and is regarded as a triumph by everyone except the government."
 UKR_the_cooperative_movement:0 "The Cooperative Movement"
 UKR_the_cooperative_movement_desc:0 "Housing co-operatives, consumer co-operatives, a co-operative bakery in Chernihiv that has outlived four governments. The party gives them a statute and a tax code that finally notices them."
 UKR_the_credit_unions:0 "The Credit Unions"
 UKR_the_credit_unions_desc:0 "A teacher in Poltava can borrow against a salary that no bank has ever taken seriously. The unions lend at a reasonable rate and are repaid at an unreasonable one: nearly always."
 UKR_the_peoples_control:0 "The People's Control"
 UKR_the_peoples_control_desc:0 "Inspectors drawn from the factories themselves visit the offices, the depots and the district committees, and are received with the courtesy people keep for those who may go back to the shop floor and say what they saw."
 UKR_the_wage_commissions:0 "The Wage Commissions"
 UKR_the_wage_commissions_desc:0 "Pay scales are drawn up in public, by a commission on which the workers hold the casting vote. The first scale takes eleven months and the second takes eleven days, which is the better measure of the first."
 UKR_the_student_brotherhoods:0 "The Student Brotherhoods"
 UKR_the_student_brotherhoods_desc:0 "School-leavers in Lviv, Ivano-Frankivsk and Ternopil are recruited in the dormitories with a reading list, a membership card and a second-hand tracksuit. By the second term they can recite the programme, and by the third they can organise."
 UKR_the_nationalist_congress:0 "The Nationalist Congress"
 UKR_the_nationalist_congress_desc:0 "Four hundred delegates in a rented hall agree on the date of the next congress and on nothing else. The Brotherhood, the Convention and the veterans each leave convinced that they won."


 ### ECONOMY ###
 UKR_economic_reconstruction:0 "Economic Reconstruction"
 UKR_economic_reconstruction_desc:0 "Ukraine enters the new millennium after almost a decade of uninterrupted economic contraction. Since independence the economy has lost more than half of its output, factories stand idle, wages go unpaid for months and much of the country trades in goods rather than money. Before any grand reform can begin, the goal is simple: to get the Ukrainian economy functioning normally again."
 UKR_clear_the_wage_arrears:0 "Clear the Wage Arrears"
 UKR_clear_the_wage_arrears_desc:0 "Teachers, doctors, miners and pensioners are owed months of back pay by the state and by insolvent enterprises. Paying off these arrears will cost the budget dearly, but nothing would do more to restore faith that the Ukrainian state can keep its word."
 UKR_end_the_barter_economy:0 "End the Barter Economy"
 UKR_end_the_barter_economy_desc:0 "Across the 1990s Ukrainian enterprises stopped paying one another in money. Coal is traded for steel, steel for gas, and gas bills go unpaid for years. Insisting on cash settlements, above all in the energy sector, will force the economy back onto a monetary footing and expose which enterprises are truly viable."
 UKR_return_to_growth:0 "Return to Growth"
 UKR_return_to_growth_desc:0 "With wages being paid and money circulating once more, the long decline has finally come to an end. For the first time since independence, Ukraine's economy is growing, and the post-Soviet recession can at last be consigned to the past."
 UKR_reform_the_state:0 "Reform the State"
 UKR_reform_the_state_desc:0 "The Ukrainian state inherited the institutions of a Soviet republic, not those of an independent country. A modern economy needs a modern state behind it, beginning with a currency that people are willing to hold."
 UKR_independent_national_bank:0 "An Independent National Bank"
 UKR_independent_national_bank_desc:0 "The National Bank of Ukraine must be free to pursue price stability rather than print money to cover the government's deficits. Securing its independence in law will give the hryvnia a guardian that politicians cannot easily overrule."
 UKR_stabilize_the_hryvnia:0 "Stabilize the Hryvnia"
 UKR_stabilize_the_hryvnia_desc:0 "Introduced only in 1996, the hryvnia lost much of its value in the wake of the 1998 financial crisis. Keeping the exchange rate stable against the dollar will reassure savers and traders alike that the national currency is here to stay."
 UKR_tame_inflation:0 "Tame Inflation"
 UKR_tame_inflation_desc:0 "Prices are still rising by around a quarter each year. Tight monetary policy and an end to the monetisation of deficits should bring inflation down to single digits, allowing Ukrainians to plan for the future again."
 UKR_restructure_the_foreign_debt:0 "Restructure the Foreign Debt"
 UKR_restructure_the_foreign_debt_desc:0 "The debts accumulated during the 1990s leave Ukraine on the edge of default. Exchanging our maturing bonds for new, longer-term obligations will relieve the pressure on the budget and restore our standing with foreign creditors."
 UKR_sound_money:0 "Sound Money"
 UKR_sound_money_desc:0 "A stable currency, low inflation and a manageable debt burden: the hryvnia is now a currency Ukrainians can trust. Monetary stability will be the bedrock on which the rest of our economic reforms are built."
 UKR_tax_and_banking_reform:0 "Tax and Banking Reform"
 UKR_tax_and_banking_reform_desc:0 "Ukraine's tax system is a maze of overlapping levies that most businesses simply evade, while its banks are too small and too weak to finance investment. A series of technical reforms can address both problems."
 UKR_single_tax_for_small_business:0 "The Single Tax for Small Business"
 UKR_single_tax_for_small_business_desc:0 "A simplified single tax will allow small entrepreneurs to pay one modest levy instead of dozens, encouraging them to leave the shadow economy and operate in the open."
 UKR_recapitalize_the_banks:0 "Recapitalize the Banks"
 UKR_recapitalize_the_banks_desc:0 "Raising minimum capital requirements and cleaning up bad loans will leave Ukraine with fewer but stronger banks, capable of lending to industry rather than merely surviving."
 UKR_flat_income_tax:0 "A Flat Income Tax"
 UKR_flat_income_tax_desc:0 "Replacing the progressive income tax with a single low rate will simplify collection, reduce evasion and bring more income into the official economy. Lower rates, paradoxically, may well mean higher revenues."
 UKR_privatization_underway:0 "Privatization Underway"
 UKR_privatization_underway_desc:0 "Privatization did not begin with the new millennium. Through the mass voucher programme of the 1990s, tens of thousands of small and medium enterprises have already passed into private hands. The question now is what becomes of the great industrial enterprises that remain in state ownership."
 UKR_the_state_property_fund:0 "The State Property Fund"
 UKR_the_state_property_fund_desc:0 "The State Property Fund of Ukraine manages everything the state still owns and oversees its sale. Whoever controls the Fund's direction will determine the future shape of Ukrainian capitalism, and the time has come to decide what that direction will be."
 UKR_full_privatization:0 "Full Privatization"
 UKR_full_privatization_desc:0 "The state has proven a poor owner of industry. Selling off the remaining state enterprises, openly and to the highest bidder, is the fastest way to bring in capital, modern management and efficiency."
 UKR_large_scale_auctions:0 "Large-Scale Auctions"
 UKR_large_scale_auctions_desc:0 "Transparent, competitive auctions for our largest enterprises will raise real money for the budget and prevent the most valuable assets from being sold off cheaply behind closed doors."
 UKR_welcome_foreign_investors:0 "Welcome Foreign Investors"
 UKR_welcome_foreign_investors_desc:0 "Foreign investors bring what Ukraine lacks most: capital, technology and experience of competitive markets. Opening privatization tenders to them will raise prices and break the monopoly of domestic insiders."
 UKR_sell_the_oblenergos:0 "Sell the Oblenergos"
 UKR_sell_the_oblenergos_desc:0 "The regional power distribution companies are chronically underfunded and plagued by unpaid bills. Selling them to strategic investors will bring in the money needed to modernise Ukraine's electricity grid."
 UKR_a_market_economy:0 "A Market Economy"
 UKR_a_market_economy_desc:0 "With the great state enterprises in private hands and open to competition, the grip of the few on Ukraine's economy has been broken. Ukraine is now, in substance as well as in name, a market economy."
 UKR_partial_privatization:0 "Partial Privatization"
 UKR_partial_privatization_desc:0 "Not everything should be for sale. Ukraine will continue to privatize, but the enterprises vital to the nation's security and prosperity will remain under state control."
 UKR_the_strategic_enterprises_list:0 "The Strategic Enterprises List"
 UKR_the_strategic_enterprises_list_desc:0 "A legally binding list of enterprises that may not be privatized will protect our arms manufacturers, energy companies and transport networks from falling into the wrong hands."
 UKR_sell_minority_stakes:0 "Sell Minority Stakes"
 UKR_sell_minority_stakes_desc:0 "Rather than selling our strategic enterprises outright, we can sell minority stakes to private investors, raising funds and introducing private discipline while the state keeps control."
 UKR_state_holding_companies:0 "State Holding Companies"
 UKR_state_holding_companies_desc:0 "Consolidating the scattered state enterprises of each sector into national holding companies, as has already been done with Naftogaz, will make them easier to manage, modernise and hold to account."
 UKR_a_mixed_economy:0 "A Mixed Economy"
 UKR_a_mixed_economy_desc:0 "A dynamic private sector alongside strong state enterprises in the strategic industries: Ukraine has found its own path between the market and the state."
 UKR_cancel_privatization:0 "Cancel Privatization"
 UKR_cancel_privatization_desc:0 "Privatization has not created a nation of property owners. It has created a handful of billionaires. The sale of state property must stop until the people can be sure it is being done in their interest."
 UKR_review_the_sales:0 "Review the Sales"
 UKR_review_the_sales_desc:0 "Many of the privatization deals of the 1990s were concluded at a fraction of the enterprises' real value. A full review of past sales will expose those that were fraudulent and restore the rule of law."
 UKR_seize_the_oligarchs_assets:0 "Seize the Oligarchs' Assets"
 UKR_seize_the_oligarchs_assets_desc:0 "Those who acquired the nation's wealth through fraud and insider deals have no legitimate claim to it. Their ill-gotten enterprises will be returned to the state."
 UKR_renationalize_strategic_industry:0 "Renationalize Strategic Industry"
 UKR_renationalize_strategic_industry_desc:0 "The enterprises that form the backbone of Ukrainian industry, from the steelworks of Kryvyi Rih to the plants of Kharkiv, will once again be owned and directed by the state."
 UKR_the_peoples_property:0 "The People's Property"
 UKR_the_peoples_property_desc:0 "The wealth of Ukraine belongs to the Ukrainian people, not to a narrow circle of oligarchs. With the great enterprises back in public hands, the state can direct them toward the national interest."
 UKR_industrial_restructuring:0 "Industrial Restructuring"
 UKR_industrial_restructuring_desc:0 "Ukraine inherited a vast share of the Soviet Union's industry, but much of it was built for a planned economy that no longer exists. To survive in a competitive world, Ukrainian industry must be restructured from top to bottom."
 UKR_inventory_of_soviet_industry:0 "An Inventory of Soviet Industry"
 UKR_inventory_of_soviet_industry_desc:0 "Before deciding what to modernise and what to close, we must first know what we have. A comprehensive review of the country's enterprises will separate the viable from the hopeless."
 UKR_modernize_heavy_industry:0 "Modernize Heavy Industry"
 UKR_modernize_heavy_industry_desc:0 "Metallurgy, mining, machinery and chemicals have been the foundation of the Ukrainian economy for generations. Rather than abandon them, we will modernise them and make them competitive on world markets."
 UKR_the_metallurgical_giants:0 "The Metallurgical Giants"
 UKR_the_metallurgical_giants_desc:0 "The steelworks of Kryvyi Rih, Mariupol, Zaporizhzhia and Dnipropetrovsk already earn a large share of Ukraine's export revenue. Investing in modern furnaces and casting technology will keep them competitive for decades to come."
 UKR_modernize_the_donbas_mines:0 "Modernize the Donbas Mines"
 UKR_modernize_the_donbas_mines_desc:0 "The coal mines of the Donbas and the iron ore of Kryvbas are some of Ukraine's greatest natural assets, but decades of underinvestment have made the mines dangerous and unprofitable. Closing the worst pits and modernising the rest will be painful, but necessary."
 UKR_heavy_machine_building:0 "Heavy Machine Building"
 UKR_heavy_machine_building_desc:0 "From turbines in Kharkiv to tractors and locomotives, Ukraine's machine-building plants once supplied the whole Soviet Union. With new investment, they can compete for customers across Eurasia once more."
 UKR_the_chemical_industry:0 "The Chemical Industry"
 UKR_the_chemical_industry_desc:0 "Ukraine's chemical plants in Horlivka, Cherkasy and Sievierodonetsk produce fertilisers and industrial chemicals for markets around the world. Modernising them will reduce their heavy dependence on imported gas and make them more profitable."
 UKR_the_industrial_heartland:0 "The Industrial Heartland"
 UKR_the_industrial_heartland_desc:0 "Modernised, efficient and competitive, Ukraine's heavy industry is once again the pride of the nation. The industrial heartland of the old Soviet Union has become an industrial heartland of Europe."
 UKR_diversify_ukrainian_industry:0 "Diversify Ukrainian Industry"
 UKR_diversify_ukrainian_industry_desc:0 "An economy that lives by selling steel and chemicals is at the mercy of world commodity prices. Ukraine's future lies in the industries of the new century, where our engineers and scientists can compete with the best."
 UKR_engineering_bureaus:0 "The Engineering Bureaus"
 UKR_engineering_bureaus_desc:0 "The design bureaus of the Soviet era left Ukraine with thousands of highly skilled engineers. Reorganising these bureaus around commercial projects will put their talent to productive use."
 UKR_the_electronics_industry:0 "The Electronics Industry"
 UKR_the_electronics_industry_desc:0 "Kyiv was once a centre of Soviet computing and electronics research. With the right investment, and the talent of a new generation of programmers, Ukraine can build a modern electronics and information technology sector."
 UKR_the_aerospace_industry:0 "The Aerospace Industry"
 UKR_the_aerospace_industry_desc:0 "Antonov's aircraft, Motor Sich's engines and the rockets of Dnipropetrovsk are world-class products. Supporting these enterprises will secure Ukraine's place among the world's aerospace powers."
 UKR_high_value_manufacturing:0 "High-Value Manufacturing"
 UKR_high_value_manufacturing_desc:0 "Rather than exporting raw steel, Ukraine should export the finished goods made from it. Encouraging manufacturers to move up the value chain will bring higher wages and greater prosperity."
 UKR_a_knowledge_economy:0 "A Knowledge Economy"
 UKR_a_knowledge_economy_desc:0 "Engineering, electronics and aerospace: Ukraine's economy is now built on the skill of its people rather than the weight of its steel. The foundations of a modern knowledge economy have been laid."
 UKR_modernize_the_blast_furnaces:0 "Modernize the Blast Furnaces"
 UKR_modernize_the_blast_furnaces_desc:0 "Many of Ukraine's steelworks still rely on open-hearth furnaces that the rest of the world abandoned decades ago. Replacing them with modern converters and continuous casting will cut costs and waste, and let the mills of Kryvyi Rih make the most of the iron ore on their doorstep."
 UKR_armor_plate_production:0 "Armor Plate Production"
 UKR_armor_plate_production_desc:0 "The steelworks of Mariupol and Zaporizhzhia once supplied armor plate to the entire Soviet defence industry. Reviving that production will give our tank and shipbuilding plants a secure domestic source of their most important material."
 UKR_coal_for_the_power_plants:0 "Coal for the Power Plants"
 UKR_coal_for_the_power_plants_desc:0 "Ukraine's thermal power stations burn Donbas coal, and both have been starved of investment. Modernising the mines together with the plants they feed will secure the electricity that heavy industry depends on."
 UKR_the_donbas_arsenal:0 "The Donbas Arsenal"
 UKR_the_donbas_arsenal_desc:0 "The industrial cities of Donetsk and Luhansk have the steel, the coal and the skilled workers to build weapons. Converting idle plants to defence production will make the Donbas the arsenal of the Ukrainian army."
 UKR_the_tank_factories:0 "The Tank Factories"
 UKR_the_tank_factories_desc:0 "The Malyshev Plant in Kharkiv is one of the few factories in the world that can design and build a modern main battle tank from scratch. With new orders and investment, together with the Kyiv Armored Plant, it can equip our own army and compete for export contracts abroad."
 UKR_missile_and_rocket_plants:0 "Missile and Rocket Plants"
 UKR_missile_and_rocket_plants_desc:0 "The missile plants of Dnipropetrovsk and Pavlohrad once built the Soviet Union's most powerful strategic rockets. Their expertise in rocket motors and guidance systems is a national asset that must not be allowed to wither away."
 UKR_expand_the_refineries:0 "Expand the Refineries"
 UKR_expand_the_refineries_desc:0 "Ukraine's refineries at Kremenchuk and Lysychansk run far below capacity for lack of crude and investment. Upgrading them will reduce our dependence on imported fuel and supply the chemical and defence industries alike."
 UKR_the_carpathian_refineries:0 "The Carpathian Refineries"
 UKR_the_carpathian_refineries_desc:0 "The old refineries of Drohobych and Nadvirna in the Carpathian foothills process oil from Europe's oldest oilfields. Modernising them will give western Ukraine a fuel industry of its own."
 UKR_the_defence_industrial_complex:0 "The Defence-Industrial Complex"
 UKR_the_defence_industrial_complex_desc:0 "Steelworks, tank plants, missile factories and ammunition works across the country will be brought together under a single coordinated programme, turning the scattered remnants of the Soviet defence industry into a genuine Ukrainian defence-industrial complex."
 UKR_ukrspetsexport:0 "Ukrspetsexport"
 UKR_ukrspetsexport_desc:0 "The state arms exporter Ukrspetsexport has already found customers across Asia and Africa for Ukrainian tanks, aircraft and munitions. Expanding its reach will turn our defence industry into one of the country's most valuable sources of foreign currency."
 UKR_software_and_it_services:0 "Software and IT Services"
 UKR_software_and_it_services_desc:0 "Ukraine's universities produce tens of thousands of engineers and mathematicians every year. Encouraging software development and outsourcing in Kyiv, Kharkiv and Lviv will keep this talent at home instead of watching it emigrate."
 UKR_commercial_space_launches:0 "Commercial Space Launches"
 UKR_commercial_space_launches_desc:0 "The Zenit and Dnepr rockets built in Dnipropetrovsk are already launching satellites for foreign customers. Expanding our commercial launch business will turn a Cold War legacy into a profitable high-technology industry."
 UKR_rebuild_the_infrastructure:0 "Rebuild the Infrastructure"
 UKR_rebuild_the_infrastructure_desc:0 "Ukraine's roads, bridges and power lines have hardly been maintained since the collapse of the Soviet Union. No modern economy can function on crumbling infrastructure, and rebuilding it must begin with our largest cities."
 UKR_the_national_highway_programme:0 "The National Highway Programme"
 UKR_the_national_highway_programme_desc:0 "A network of modern highways linking Kyiv to Odesa, Kharkiv and the western border will cut transport costs, connect our regions to one another and open the country to trade."
 UKR_electrify_the_railways:0 "Electrify the Railways"
 UKR_electrify_the_railways_desc:0 "Ukraine has one of the densest railway networks in Europe, but many of its lines still rely on diesel locomotives. Electrifying the main lines will make our railways faster, cheaper and less dependent on imported fuel."
 UKR_the_transit_corridor:0 "The Transit Corridor"
 UKR_the_transit_corridor_desc:0 "Ukraine lies on the shortest route between the European Union and the markets of Russia, the Caucasus and Central Asia. Modernising our border crossings and trunk lines will make Ukraine the transit corridor between East and West."
 UKR_the_black_sea_ports:0 "The Black Sea Ports"
 UKR_the_black_sea_ports_desc:0 "Odesa has been Ukraine's window on the world for two centuries. Modernising its harbour and terminals is the first step towards turning our coastline into a gateway for trade between Europe and Asia."
 UKR_the_port_of_pivdennyi:0 "The Port of Pivdennyi"
 UKR_the_port_of_pivdennyi_desc:0 "The deep-water port of Pivdennyi, together with Illichivsk, can handle the largest bulk carriers on the Black Sea. Expanding their terminals will allow Ukraine to ship its grain, ore and steel to the world in ever greater quantities."
 UKR_the_danube_ports:0 "The Danube Ports"
 UKR_the_danube_ports_desc:0 "Izmail and Reni give Ukraine direct access to the Danube, the great waterway that runs into the heart of Central Europe. Reviving river shipping will open a new trade route to the European market."
 UKR_mykolaiv_and_kherson:0 "Mykolaiv and Kherson"
 UKR_mykolaiv_and_kherson_desc:0 "The shipbuilding cities of Mykolaiv and Kherson are also important ports in their own right. Investing in both their harbours and their shipyards will revive one of Ukraine's proudest industries."
 UKR_the_azov_and_crimean_ports:0 "The Azov and Crimean Ports"
 UKR_the_azov_and_crimean_ports_desc:0 "Mariupol and Berdiansk export the steel of the east, while Kerch commands the strait between the Black Sea and the Sea of Azov. Modernising these ports will bind the south and east of the country more closely to world markets."
 UKR_gateway_to_the_black_sea:0 "Gateway to the Black Sea"
 UKR_gateway_to_the_black_sea_desc:0 "With modern ports along its entire coastline, Ukraine has become the leading trading nation of the Black Sea, the natural gateway between Europe, the Caucasus and the Middle East."
 UKR_special_economic_zones:0 "Special Economic Zones"
 UKR_special_economic_zones_desc:0 "Tax breaks and simplified customs rules in designated special economic zones will attract the investment Ukraine needs to build new industries, beginning with Slavutych, the town built for the workers of Chornobyl."
 UKR_the_western_zones:0 "The Western Zones"
 UKR_the_western_zones_desc:0 "Transcarpathia and the Lviv region lie on the border of Central Europe, where labour costs are rising fast. Special economic zones there can attract European manufacturers looking for skilled workers close to their markets."
 UKR_the_eastern_zones:0 "The Eastern Zones"
 UKR_the_eastern_zones_desc:0 "Special economic zones in Donetsk, Mykolaiv and Crimea will help the industrial regions of the south and east attract new investors and new industries beyond coal and steel."
 UKR_attract_foreign_manufacturers:0 "Attract Foreign Manufacturers"
 UKR_attract_foreign_manufacturers_desc:0 "From car parts to consumer electronics, foreign manufacturers are looking for new places to build their factories. With a skilled workforce, low costs and access to both East and West, Ukraine can offer them everything they need."
 UKR_an_economic_powerhouse:0 "An Economic Powerhouse"
 UKR_an_economic_powerhouse_desc:0 "High technology, modern infrastructure, busy ports and a thriving manufacturing sector: Ukraine has finally realised the economic potential it inherited in 1991. The second-largest country in Europe has become one of its economic powerhouses."
 UKR_agricultural_reform:0 "Agricultural Reform"
 UKR_agricultural_reform_desc:0 "Ukraine's famous black soil is among the most fertile on Earth, yet its agriculture remains trapped in the collective farms of the Soviet era. Reforming the countryside is essential if Ukraine is to become the breadbasket of Europe once again."
 UKR_dissolve_the_kolkhozes:0 "Dissolve the Kolkhozes"
 UKR_dissolve_the_kolkhozes_desc:0 "The collective farms will be dissolved and reorganised into private agricultural enterprises. The transition will be disruptive, but it will finally give those who work the land a stake in its success."
 UKR_distribute_the_land_shares:0 "Distribute the Land Shares"
 UKR_distribute_the_land_shares_desc:0 "Millions of former collective farm workers are entitled to a share of the land they worked. Issuing them title to their plots will turn a nation of farm workers into a nation of landowners."
 UKR_the_land_code:0 "The Land Code"
 UKR_the_land_code_desc:0 "A new Land Code will set out, once and for all, who owns Ukraine's farmland and on what terms it can be used, leased and inherited, giving farmers the legal security they need to invest."
 UKR_open_the_land_market:0 "Open the Land Market"
 UKR_open_the_land_market_desc:0 "Land that cannot be bought or sold cannot be used as collateral, nor can it pass to those best able to farm it. Allowing the free sale of farmland will unlock investment in Ukrainian agriculture."
 UKR_modernize_farm_machinery:0 "Modernize Farm Machinery"
 UKR_modernize_farm_machinery_desc:0 "Much of the machinery in Ukraine's fields dates from the Soviet era. Credit for new tractors and combine harvesters will dramatically increase yields and cut losses at harvest time."
 UKR_the_land_moratorium:0 "The Land Moratorium"
 UKR_the_land_moratorium_desc:0 "Many fear that, if farmland can be freely sold, villagers will be pressured into selling their plots for a pittance. A moratorium on the sale of agricultural land will protect them until a fair and transparent market can be established."
 UKR_the_agroholdings:0 "The Agroholdings"
 UKR_the_agroholdings_desc:0 "Large agricultural companies, farming hundreds of thousands of hectares with modern methods, are emerging as the new giants of the Ukrainian countryside. Supporting them will make Ukraine one of the most productive agricultural nations in the world."
 UKR_grain_export_terminals:0 "Grain Export Terminals"
 UKR_grain_export_terminals_desc:0 "Ukraine's harvests are worth little if they cannot reach world markets. New grain terminals in our Black Sea ports will allow us to ship wheat, corn and sunflower oil around the globe."
 UKR_support_family_farms:0 "Support Family Farms"
 UKR_support_family_farms_desc:0 "The backbone of rural Ukraine is the family farm. Cheap credit, cooperatives and technical assistance will help small farmers modernise without having to sell their land."
 UKR_breadbasket_restored:0 "The Breadbasket Restored"
 UKR_breadbasket_restored_desc:0 "From the fields of Poltava to the ports of Odesa, Ukrainian agriculture has been transformed. Ukraine has reclaimed its historic role as the breadbasket of Europe."

 ### ECONOMY: NATIONAL SPIRITS ###
 UKR_post_soviet_recession:0 "Post-Soviet Recession"
 UKR_post_soviet_recession_desc:0 "The Ukrainian economy is slowly recovering from the collapse of the 1990s, but the scars of that decade remain."
 UKR_oligarchic_economy:0 "Oligarchic Economy"
 UKR_oligarchic_economy_desc:0 "A handful of oligarchs control the Ukrainian economy, and their influence over politics is a threat to democracy."
 UKR_breadbasket_of_europe:0 "Breadbasket of Europe"
 UKR_breadbasket_of_europe_desc:0 "Ukraine's fertile black soil is the foundation of its agricultural wealth, and the country a major exporter of grain."
 UKR_balancing_east_and_west:0 "Balancing East and West"
 UKR_balancing_east_and_west_desc:0 "Ukraine's economy and diplomacy is closely tied to both Europe and Russia, and the country must balance its trade and investment between the two."
 UKR_post_soviet_recession2:0 "Post-Soviet Recession"
 UKR_post_soviet_recession2_desc:0 "The worst of the crisis has passed, but the Ukrainian economy remains deeply scarred by the collapse of the 1990s."
 UKR_post_soviet_recession3:0 "Post-Soviet Recession"
 UKR_post_soviet_recession3_desc:0 "The economy is slowly recovering, though the legacy of a decade of decline is still felt across the country."
 UKR_monetary_stabilization:0 "Monetary Stabilization"
 UKR_monetary_stabilization_desc:0 "The first steps toward a stable national currency have been taken."
 UKR_monetary_stabilization2:0 "Monetary Stabilization"
 UKR_monetary_stabilization2_desc:0 "With an independent National Bank and a stable exchange rate, confidence in the hryvnia is growing."
 UKR_monetary_stabilization3:0 "Monetary Stabilization"
 UKR_monetary_stabilization3_desc:0 "Inflation is falling and Ukrainians are once again willing to save in their own currency."
 UKR_sound_hryvnia:0 "A Sound Hryvnia"
 UKR_sound_hryvnia_desc:0 "The hryvnia has become a stable and trusted currency, the foundation of Ukraine's economic recovery."
 UKR_single_tax:0 "The Single Tax"
 UKR_single_tax_desc:0 "A simplified tax regime is drawing small businesses out of the shadow economy."
 UKR_flat_tax:0 "The Flat Tax"
 UKR_flat_tax_desc:0 "A single low rate of income tax has simplified collection and broadened the tax base."
 UKR_privatization_drive:0 "Privatization Drive"
 UKR_privatization_drive_desc:0 "The state is selling off its remaining enterprises as quickly as buyers can be found."
 UKR_open_market_economy:0 "Open Market Economy"
 UKR_open_market_economy_desc:0 "Competition, rather than connections, now determines who succeeds in the Ukrainian economy."
 UKR_strategic_state_ownership:0 "Strategic State Ownership"
 UKR_strategic_state_ownership_desc:0 "The state retains control of the enterprises vital to national security."
 UKR_mixed_ownership_economy:0 "Mixed Ownership Economy"
 UKR_mixed_ownership_economy_desc:0 "A dynamic private sector coexists with strong state-owned enterprises in the strategic industries."
 UKR_privatization_halted:0 "Privatization Halted"
 UKR_privatization_halted_desc:0 "The sale of state property has been suspended, to the delight of the public and the alarm of investors."
 UKR_state_directed_economy:0 "State-Directed Economy"
 UKR_state_directed_economy_desc:0 "The commanding heights of the Ukrainian economy are once again in public hands."
 UKR_heavy_industry_modernization:0 "Heavy Industry Modernization"
 UKR_heavy_industry_modernization_desc:0 "Ukraine's steelworks, mines and machine-building plants are being modernised."
 UKR_heavy_industry_modernization2:0 "The Industrial Heartland"
 UKR_heavy_industry_modernization2_desc:0 "Ukraine's heavy industry is modern, efficient and competitive on world markets."
 UKR_diversified_industry:0 "Industrial Diversification"
 UKR_diversified_industry_desc:0 "New industries are emerging alongside Ukraine's traditional heavy industry."
 UKR_diversified_industry2:0 "Knowledge Economy"
 UKR_diversified_industry2_desc:0 "Ukraine's economy now rests on engineering, electronics and aerospace as much as on steel."
 UKR_open_land_market:0 "Open Land Market"
 UKR_open_land_market_desc:0 "Farmland can be freely bought and sold, drawing investment into the countryside."
 UKR_land_moratorium:0 "Land Moratorium"
 UKR_land_moratorium_desc:0 "The sale of agricultural land is forbidden, protecting villagers from being pressured into selling their plots."
 UKR_breadbasket_of_europe2:0 "Breadbasket of Europe"
 UKR_breadbasket_of_europe2_desc:0 "Reform of the countryside is unlocking the potential of Ukraine's black soil."
 UKR_breadbasket_of_europe3:0 "Breadbasket of Europe"
 UKR_breadbasket_of_europe3_desc:0 "Ukraine has reclaimed its place as one of the world's great agricultural exporters."

 ### ARMED FORCES: DYNAMIC MODIFIERS ###
 UKR_army_modifier:0 "Sukhoputni Viiska Zbroinykh"
 UKR_army_modifier_desc:0 "Ukraine inherited one of the largest armies in Europe from the Soviet Union, but not the means to pay for it. Wages go unpaid, conscripts spend more time on farm work and guard duty than on training, and most of the equipment has not been serviced since 1991. Of all the services, however, the army has fared the least badly."
 UKR_airforce_modifier:0 "Povitryani Syly"
 UKR_airforce_modifier_desc:0 "On paper, Ukraine fields a formidable air force of Soviet-built fighters and bombers. In reality, fuel shortages leave pilots with only a handful of flight hours each year, spare parts are cannibalised from grounded aircraft, and much of the fleet is no longer airworthy."
 UKR_navy_modifier:0 "Viiskovo-Morski Syly"
 UKR_navy_modifier_desc:0 "Born from the bitter partition of the Soviet Black Sea Fleet, the Ukrainian Navy received the smallest and oldest share of its ships. Starved of funding and forced to share Sevastopol with the Russian fleet, its vessels rarely leave port and many are slowly rusting at their moorings."

 UKR_black_sea_trade_hub:0 "Black Sea Trade Hub"
 UKR_black_sea_trade_hub_desc:0 "Ukraine's modern ports have made it the leading trading nation of the Black Sea."
 UKR_special_economic_zones_idea:0 "Special Economic Zones"
 UKR_special_economic_zones_idea_desc:0 "Tax breaks and simplified customs rules are drawing foreign investment into Ukraine's special economic zones."

 ### COMPANIES: MIOs (Arms Against Tyranny) ###
