l_english:
# Generic Latin American Focus Tree

 # Economy
 LATAM_national_development_plan:0 "National Development Plan"
 LATAM_national_development_plan_desc:0 "The nation needs a plan, not another press conference. We shall have one costed by the planning ministry, published in full and tied to five budgets rather than to the next election. The roads and power lines it builds will still stand when we are gone."
 LATAM_highway_investment_initiative:0 "Highway Investment Initiative"
 LATAM_highway_investment_initiative_desc:0 "Past the last tollbooth the asphalt gives out and the country continues on dirt. Trucks lose days to the mud each winter and the harvest waits in the yard. We shall pave the trunk routes and bridge the rivers, and the provinces will reach the ports at last."
 LATAM_railway_modernization_program:0 "Railway Modernization Program"
 LATAM_railway_modernization_program_desc:0 "Our railways carry ore to the coast on track a century old, and half the network lies abandoned. We shall rebuild the trunk lines, take freight off our ruined roads and give the interior a way to reach the world."
 LATAM_expanding_the_merchant_fleet:0 "Expanding the Merchant Fleet"
 LATAM_expanding_the_merchant_fleet_desc:0 "Nine tenths of what we sell leaves under a foreign flag, and the freight is paid in hard currency we cannot spare. We shall build a merchant marine to carry our own grain and ore, and the money will stay in [ROOT.GetName]."
 LATAM_digital_infrastructure_initiative:0 "Digital Infrastructure Initiative"
 LATAM_digital_infrastructure_initiative_desc:0 "Ministries in the capital still run on fax machines and there are provinces where a telephone line belongs to the mayor. We shall lay fiber to every departmental capital and build a national backbone. It costs a fortune this decade and will look cheap in the next."
 LATAM_subsidize_resource_industry:0 "Subsidize the Resource Industry"
 LATAM_subsidize_resource_industry_desc:0 "Mining and drilling pay for this country, and some of the equipment in our pits is nearly as old as the mines. Duty-free machinery and targeted subsidies will let our producers modernize. The world is buying; we ought to be selling."
 LATAM_industrial_investments:0 "Industrial Investments"
 LATAM_industrial_investments_desc:0 "Private capital will not build a factory in a country it expects to devalue. So the state shall build them first, in the provinces that need the work, and hold them until the private sector recovers its nerve."
 LATAM_expand_the_capital_university:0 "Expand the [ROOT.capital.GetCapitalVictoryPointName] University"
 LATAM_expand_the_capital_university_desc:0 "The University of [ROOT.capital.GetCapitalVictoryPointName] enrolls three times the students its buildings can hold, and it educates our engineers, our ministers and our exiles alike. New faculties, laboratories and lecture halls will let it train the generation this decade demands."
 LATAM_subsidize_domestic_industry:0 "Subsidize Domestic Industry"
 LATAM_subsidize_domestic_industry_desc:0 "Our manufacturers compete against imports made where wages are a tenth of ours, and they are losing. Cheap credit and preferential procurement will buy them the years they need to become competitive. Or the years they need to grow comfortable."
 LATAM_expand_recycling_plants:0 "Expand Recycling Plants"
 LATAM_expand_recycling_plants_desc:0 "We import scrap metal and paper while our own cities bury theirs, sorted by hand by families who live on the dumps. Municipal collection and new processing plants will recover those materials, and give that work a wage and a contract."
 LATAM_import_substitution_policies:0 "Import Substitution Policies"
 LATAM_import_substitution_policies_desc:0 "Why should we buy abroad what we can make at home? Tariffs, licences and a protected internal market will let our factories supply what the containers now bring. Every economist in Washington will explain why this is a mistake."
 LATAM_made_in_nation:0 "Made in [ROOT.GetName]"
 LATAM_made_in_nation_desc:0 "A label reading Made in [ROOT.GetName] is a warning at home and a curiosity abroad. Quality standards, an export agency and a campaign our own people might believe will change that, though not quickly."
 LATAM_heavy_industry_development:0 "Heavy Industry Development"
 LATAM_heavy_industry_development_desc:0 "Steel, cement, chemicals and machine tools are what every other industry stands on, and no foreign investor will ever build them for us. The state shall fund them, and within a decade we import less of everything."
 LATAM_industrial_self_suficiency:0 "Industrial Self-Sufficiency"
 LATAM_industrial_self_suficiency_desc:0 "When our credit vanishes, so do the spare parts, the fertilizer and the fuel. An economy that makes its own essentials cannot be closed down by a decision taken in another hemisphere. Self-sufficiency is expensive; dependence is more so."
 LATAM_industrial_subsidizing:0 "Industrial Subsidizing"
 LATAM_industrial_subsidizing_desc:0 "The subsidies are meant to be temporary and the sector cannot yet stand without them. They continue, with production targets attached this time."
 LATAM_create_the_national_industrial_park:0 "Create the [ROOT.capital.GetCapitalVictoryPointName] Industrial Park"
 LATAM_create_the_national_industrial_park_desc:0 "Scattered workshops cannot share a substation, a rail spur or a customs office. We shall concentrate industry in one planned park outside [ROOT.capital.GetCapitalVictoryPointName], with serviced land and a tax holiday, and our factories will be cheaper to run and easier to expand."
 LATAM_increase_education_funding:0 "Increase Education Funding"
 LATAM_increase_education_funding_desc:0 "Our teachers earn less than bus drivers and strike most years, with reason. Better salaries, new schools in the barrios and textbooks that arrive before the term ends will not show in this year's growth figures. They will show in the ones our successors inherit."
 LATAM_resource_based_economy:0 "Resource-Based Economy"
 LATAM_resource_based_economy_desc:0 "We are lectured on diversification by countries that grew rich digging things out of the ground. Our mines, fields and wells are what we have and the world wants them. We shall invest in them without apology and take the revenue while it is there."
 LATAM_expand_the_iron_mines:0 "Expand the Iron Mines"
 LATAM_expand_the_iron_mines_desc:0 "Asian demand is pushing ore prices to levels our geologists never expected to see. New shafts, a dedicated line to the coast and a second loading terminal will let us sell everything we can dig, for as long as the buying lasts."
 LATAM_divert_steel_to_arms_industry:0 "Divert Steel to the Arms Industry"
 LATAM_divert_steel_to_arms_industry_desc:0 "Every rifle and shell we import is paid for in hard currency and delivered at the seller's convenience. A fixed share of national steel shall go to the military factories on contracts the treasury guarantees. The steel men are not complaining."
 LATAM_invest_in_refineries:0 "Invest in Refineries"
 LATAM_invest_in_refineries_desc:0 "We ship crude at the going rate and buy it back as diesel at three times the price, a trade that enriches everyone except ourselves. New refining capacity ends the absurdity, assuming construction finishes nearer to schedule than is customary."
 LATAM_agricultural_subsidies:0 "Agricultural Subsidies"
 LATAM_agricultural_subsidies_desc:0 "Our farmers feed the cities and earn the exchange that pays for everything else, and most of them borrow at rates that would embarrass a casino. Price supports, subsidized credit and fuel at cost will keep the countryside solvent and, with luck, quiet."
 LATAM_land_redistribution:0 "Land Redistribution"
 LATAM_land_redistribution_desc:0 "A few hundred families hold most of the arable land in this country, much of it unplanted and kept only as collateral. We shall expropriate the idle estates with compensation and title them to the people already working them, and settle a grievance four centuries old."
 LATAM_invest_in_the_gold_industry:0 "Invest in the Gold Industry"
 LATAM_invest_in_the_gold_industry_desc:0 "Gold is the one commodity that rises when everything else collapses, which in our history is often. Industrial mining, a state refinery and licences for the wildcat miners tearing up our rivers will turn our deposits into steady revenue."
 LATAM_resource_export_boom:0 "Resource Export Boom"
 LATAM_resource_export_boom_desc:0 "Prices for everything we sell are climbing at once and the ships cannot load fast enough. We shall expand the ports, the rolling stock and the export credit to take full advantage. Every boom ends; this one will fund something permanent first."
 LATAM_national_century:0 "The [ROOT.GetAdjective] Century"
 LATAM_national_century_desc:0 "The last century left us three constitutions, two dictatorships and an inflation nobody forgives. This one opens with full reserves, a growing economy and a generation that remembers none of it. It shall be ours."
 LATAM_debate_the_economic_model:0 "Debate the Economic Model"
 LATAM_debate_the_economic_model_desc:0 "The country is split between those who lost a state job in the nineties and those who finally got a telephone line. Cabinet, congress and the newspapers have argued it to exhaustion. The government must now choose a direction and defend it."
 LATAM_mixed_market:0 "Mixed Market"
 LATAM_mixed_market_desc:0 "The state cannot run a factory and the market will not build a road. We shall do both: public planning where returns are long, private capital where it is impatient. Ideologues on either side will be disappointed, which is usually a good sign."
 LATAM_public_private_partnership:0 "Public-Private Partnerships"
 LATAM_public_private_partnership_desc:0 "The treasury cannot fund a new port; a consortium can, in exchange for thirty years of tolls. Concessions for highways, terminals and power plants get them built now and paid for slowly, provided our lawyers read the contracts more carefully than last time."
 LATAM_strategic_industrial_investments:0 "Strategic Industrial Investments"
 LATAM_strategic_industrial_investments_desc:0 "The development bank shall stop lending to whoever asks loudest and start sending capital where the planning ministry points: components, chemicals, capital goods. Picking winners is deeply unfashionable. Somebody picks them regardless."
 LATAM_balanced_economic_regulations:0 "Balanced Economic Regulations"
 LATAM_balanced_economic_regulations_desc:0 "Labour inspectors who actually visit, environmental rules with penalties attached, and a licence granted in weeks rather than years. Enterprise need not be strangled in order to be supervised."
 LATAM_sustainable_economic_growth:0 "Sustainable Economic Growth"
 LATAM_sustainable_economic_growth_desc:0 "Growth built on one commodity and a decade of luck is not growth, as our grandparents can explain at length. Diversified output, a stabilization fund and investment in the next industry before this one peaks will let the expansion survive its own boom."
 LATAM_state_market:0 "State-Led Economy"
 LATAM_state_market_desc:0 "Copper, oil, power and the banks decide whether this country eats, and they answer to shareholders in cities we have never governed. The state shall take the commanding heights and direct them itself. Somebody will run this economy; it may as well be us."
 LATAM_automotive_manufacturing:0 "Automotive Manufacturing"
 LATAM_automotive_manufacturing_desc:0 "An assembly plant brings a hundred supplier workshops, a trained workforce and a generation of engineers with it. The state shall finance the first line, protect it with tariffs and buy its output for every ministry fleet in the country."
 LATAM_fund_electronics_industry:0 "Fund the Electronics Industry"
 LATAM_fund_electronics_industry_desc:0 "Everything in this country with a circuit board inside it arrives in a container. State laboratories, a components plant and scholarships for engineers who agree to come home will build the sector out of nothing. Fifteen years, and worth every peso."
 LATAM_modern_industrial_economy:0 "Modern Industrial Economy"
 LATAM_modern_industrial_economy_desc:0 "The plants the state built are running, exporting and training the workers who will replace their founders. We are no longer a country that sells raw material and buys back the machinery made from it."
 LATAM_national_industrial_powerhouse:0 "National Industrial Powerhouse"
 LATAM_national_industrial_powerhouse_desc:0 "Our factories supply the region and compete in markets that used to dismiss us. [ROOT.GetName] builds vehicles, machinery and electronics of its own design, and the argument over whether it could ever be done is closed."
 LATAM_free_market:0 "Free Market"
 LATAM_free_market_desc:0 "Every attempt to plan this economy ends in a shortage, an inflation rate and a queue. We shall free prices, open trade and take the state out of the business of business. Let people buy, sell and hire as they see fit."
 LATAM_market_liberalization_reforms:0 "Market Liberalization Reforms"
 LATAM_market_liberalization_reforms_desc:0 "Tariffs come down, price controls go and the licensing offices close, all in one package and all at once, because reform done gradually dies in committee. The first year will be painful. So is every year of the alternative."
 LATAM_privatize_state_industries:0 "Privatize State Industries"
 LATAM_privatize_state_industries_desc:0 "The state companies employ four men for every job, lose money inside a monopoly and answer to their unions rather than their customers. We shall value them, tender them internationally and sell. The unions have already announced the strike."
 LATAM_competitive_private_sector:0 "Competitive Private Sector"
 LATAM_competitive_private_sector_desc:0 "With protection gone our firms must choose between improving and disappearing, and more of them are choosing the former than the pessimists predicted. Antitrust rules and open tenders will keep the pressure where it belongs."
 LATAM_financial_hub_of_the_americas:0 "Financial Hub of the Americas"
 LATAM_financial_hub_of_the_americas_desc:0 "Stable money, enforceable contracts and a court that decides a commercial case within the decade are rarer in this hemisphere than they should be. Offer all three and the region's banking, insurance and arbitration will come to [ROOT.capital.GetCapitalVictoryPointName]."
 LATAM_economic_miracle:0 "Economic Miracle"
 LATAM_economic_miracle_desc:0 "Growth in double digits, inflation in single, and a currency nobody is fleeing. The foreign press calls it the [ROOT.GetAdjective] miracle, which is generous. It is policy, and we chose it."

 # Army
 LATAM_modernize_the_armed_forces:0 "Modernize the Armed Forces"
 LATAM_modernize_the_armed_forces_desc:0 "Our order of battle is written to fight the neighbors and police our own citizens, and the equipment belongs to the same era. Doctrine, structure and kit all need replacing at once. The generals agree in principle and will disagree about every particular."
 LATAM_professionalize_the_officer_corps:0 "Professionalize the Officer Corps"
 LATAM_professionalize_the_officer_corps_desc:0 "The officer corps of this continent has a long habit of deciding that it knows better than the government. Competitive promotion, staff colleges abroad and the constitution taught in the first year will give us officers loyal to the institution rather than to a faction inside it."
 LATAM_the_national_armed_forces:0 "[LATAM_army_key]"
 LATAM_the_national_armed_forces_desc:0 "Reform has reached the point where it requires a direction. The question is what our army is for: deterring a neighbor, holding our own interior, or deploying anywhere within a week. The answer decides everything we buy for twenty years."
 LATAM_modernize_our_command_structure:0 "Modernize Our Command Structure"
 LATAM_modernize_our_command_structure_desc:0 "An order from the capital passes through five headquarters before it reaches a battalion, and arrives contradicted. We shall flatten the chain and give brigade commanders real authority, and react in hours rather than days."
 LATAM_expand_training_programs:0 "Expand Training Programs"
 LATAM_expand_training_programs_desc:0 "Our conscripts fire a handful of rounds a year and our reservists fire none. Longer cycles, live-fire ranges and exchanges with foreign armies cost less than a squadron of aircraft and do far more for our combat power."
 LATAM_logistics_modernization:0 "Logistics Modernization"
 LATAM_logistics_modernization_desc:0 "We can put a division on the border and starve it there inside a fortnight. New transport, forward depots and an inventory that knows what is in them will mean our troops arrive with fuel, rations and the right ammunition."
 LATAM_joint_operations_command:0 "Joint Operations Command"
 LATAM_joint_operations_command_desc:0 "Our three services share a budget, a country and almost nothing else, including radio frequencies. A joint command with a single staff will make them plan together, whatever the admirals have to say about the arrangement."
 LATAM_conventional_warfare_doctrine:0 "Conventional Warfare Doctrine"
 LATAM_conventional_warfare_doctrine_desc:0 "The border treaties settled the maps and nothing else, and every general staff in this region keeps its plans current. Armor, artillery and the ability to concentrate them quickly remain the most persuasive argument a foreign ministry can hold in reserve."
 LATAM_armored_spearheads:0 "Armored Spearheads"
 LATAM_armored_spearheads_desc:0 "Modern tanks, or tanks modern enough, bought where the sellers are shedding Cold War stocks at something near scrap prices. Concentrated into two armored brigades they give us a fist where our neighbors have fingers."
 LATAM_combined_arms_integrations:0 "Combined Arms Integration"
 LATAM_combined_arms_integrations_desc:0 "Tanks without infantry are ambushed and infantry without artillery are ground down. We shall rebuild our formations around battle groups that train together all year, which is more a cultural revolution than an organizational one."
 LATAM_mechanized_warfare_training:0 "Mechanized Warfare Training"
 LATAM_mechanized_warfare_training_desc:0 "An armored carrier is useless if the infantry inside it fight as though they had walked. Our units shall learn to dismount under fire, keep pace with armor and treat the vehicle as a weapon rather than a bus."
 LATAM_fire_superiority:0 "Fire Superiority"
 LATAM_fire_superiority_desc:0 "Artillery decides every battle this continent has fought and every one it is likely to fight. Modern tubes, counter-battery radar and forward observers with working radios will let us win that exchange rather than endure it."
 LATAM_modern_battlefield_coordination:0 "Modern Battlefield Coordination"
 LATAM_modern_battlefield_coordination_desc:0 "Reconnaissance that reports in real time, encrypted radios that reach across a division, and air support that arrives at the right grid square. None of it is glamorous and all of it decides battles."
 LATAM_regional_military_powerhouse:0 "Regional Military Powerhouse"
 LATAM_regional_military_powerhouse_desc:0 "Our army is the best equipped and best trained in the neighborhood, and the attaches who visit report it accurately. No border dispute in this region will be settled without consulting us first."
 LATAM_asymmetric_warfare_doctrine:0 "Asymmetric Warfare Doctrine"
 LATAM_asymmetric_warfare_doctrine_desc:0 "We will never buy enough tanks to fight a great power, and pretending otherwise bankrupts better armies than ours. Instead we shall make our own territory expensive: dispersed units, prepared ground, and a population that knows what is expected of it."
 LATAM_decentralized_command_structure:0 "Decentralized Command Structure"
 LATAM_decentralized_command_structure_desc:0 "A patrol three days from the nearest road cannot wait for permission from the capital. Junior officers shall be trained and trusted to act on intent rather than orders, which means first giving them an intent worth acting on."
 LATAM_counterinsurgency_operations:0 "Counterinsurgency Operations"
 LATAM_counterinsurgency_operations_desc:0 "There are districts where the state exists only as a payroll and armed groups collect the taxes. Our forces shall be trained to clear them, hold them and hand them to a civil administration that actually turns up."
 LATAM_jungle_and_riverine_units:0 "Jungle and Riverine Units"
 LATAM_jungle_and_riverine_units_desc:0 "The insurgent camps are where the roads end, which is most of this country. Units trained for jungle, mountain and river work, resupplied by air and boat, will follow them there and remain."
 LATAM_guerilla_warfare_training:0 "Guerrilla Warfare Training"
 LATAM_guerilla_warfare_training_desc:0 "If an invader reaches our interior the war does not end, it changes shape. Caches, cells and officers trained to fight after the front collapses will make any occupation a permanent expense."
 LATAM_protracted_warfare_doctrine:0 "Protracted Warfare Doctrine"
 LATAM_protracted_warfare_doctrine_desc:0 "Cities can be taken and governments exiled, but a war ends when one side decides it has had enough. We shall build an army, and a country, able to outlast the enemy's patience."
 LATAM_rapid_response_doctrine:0 "Rapid Response Doctrine"
 LATAM_rapid_response_doctrine_desc:0 "The crises of this decade arrive with days of warning: a coup next door, a hurricane, a seizure in the interior. A small force at permanent readiness is worth more than three divisions that need a month to move."
 LATAM_air_mobile_operations:0 "Air Mobile Operations"
 LATAM_air_mobile_operations_desc:0 "A helicopter crosses in ninety minutes what costs a battalion a week. Transport squadrons, trained air assault infantry and enough spare parts to keep them flying will give us a reach the map otherwise denies."
 LATAM_integrated_support_units:0 "Integrated Support Units"
 LATAM_integrated_support_units_desc:0 "A force that moves in two days cannot rely on support that follows in two weeks. Engineers, medics and supply sections shall be built into the maneuver units themselves, permanently attached and exercising with them."
 LATAM_rapid_reaction_forces:0 "Rapid Reaction Forces"
 LATAM_rapid_reaction_forces_desc:0 "Two brigades held at permanent readiness, equipped, briefed and airborne within seventy-two hours of the telephone ringing, for anything from a border incident to an earthquake."
 LATAM_elite_commando_units:0 "Elite Commando Units"
 LATAM_elite_commando_units_desc:0 "A dozen men who have trained together for years do quietly what a battalion cannot do at all. Proper selection, real funding and careers that do not punish specialists will give us special forces worth the name."
 LATAM_precision_strike_coordination:0 "Precision Strike Coordination"
 LATAM_precision_strike_coordination_desc:0 "A forward controller with a laser designator turns a small unit into an artillery battalion. Our teams shall be trained and equipped to call in fire accurate enough to use near our own people."
 LATAM_modern_armed_forces:0 "Modern Armed Forces"
 LATAM_modern_armed_forces_desc:0 "Professional officers, trained soldiers, equipment from this century and a command that functions. The army our successors inherit is the finest this country has ever put in the field."

 # Air Force
 LATAM_modernize_the_air_force:0 "Modernize the Air Force"
 LATAM_modernize_the_air_force_desc:0 "Our fighters are older than the pilots who fly them, and the spare parts come from cannibalizing the airframes that no longer fly at all. Under half the fleet is serviceable on any morning. Replacement is no longer a question of prestige."
 LATAM_air_force_academy_reform:0 "Air Force Academy Reform"
 LATAM_air_force_academy_reform_desc:0 "A pilot needs two hundred hours a year and ours get sixty, which shows in the accident reports. A reformed academy, simulators and a fuel budget that survives the fiscal year will give us aviators able to use whatever we buy them."
 LATAM_american_aircraft_suppliers:0 "American Aircraft Suppliers"
 LATAM_american_aircraft_suppliers_desc:0 "Washington sells the finest aircraft in the world and finances them generously for governments it approves of. The contract comes with training, spares and an end-user agreement naming whom we may not fight and who may inspect the hangars."
 LATAM_european_aircraft_suppliers:0 "European Aircraft Suppliers"
 LATAM_european_aircraft_suppliers_desc:0 "French, Swedish and Israeli manufacturers are competitive, capable and markedly less interested in our domestic politics. The offsets are better, the deliveries slower, and nobody telephones from an embassy about how we use them."
 LATAM_russian_aircraft_suppliers:0 "Russian Aircraft Suppliers"
 LATAM_russian_aircraft_suppliers_desc:0 "Moscow offers more airframe per dollar than anyone alive, takes payment in commodities and asks nothing about our internal affairs. The maintenance is demanding, the manuals are badly translated, and the ambassador from the north will request a meeting within the week."
 LATAM_domestic_aviation_industry:0 "Domestic Aviation Industry"
 LATAM_domestic_aviation_industry_desc:0 "An aircraft industry grows out of a state institute and a stubborn government, as others in this region can attest. Our workshops already overhaul airframes; from maintenance to assembly to design is a road of twenty years, and it has been walked before."
 LATAM_air_force_procurement_plan:0 "Air Force Procurement Plan"
 LATAM_air_force_procurement_plan_desc:0 "With the supplier chosen, the argument turns to numbers, basing and what gets cut to pay for it. A published ten-year plan will commit the air force and, far more importantly, the finance ministry."
 LATAM_multirole_fighters:0 "Multirole Fighters"
 LATAM_multirole_fighters_desc:0 "We cannot afford one aircraft to intercept, a second to strike and a third to patrol. A single multirole type, bought in one batch with one training pipeline, does all three adequately and none of them brilliantly."
 LATAM_beyond_visual_range_missiles:0 "Beyond Visual Range Missiles"
 LATAM_beyond_visual_range_missiles_desc:0 "Modern air combat is decided at forty kilometers by whoever fires first. Radar-guided missiles, and the fire control to use them properly, mean our pilots never meet an enemy they have not already engaged."
 LATAM_aerial_refueling:0 "Aerial Refueling"
 LATAM_aerial_refueling_desc:0 "Our territory is larger than our fighters' fuel, and the map has always dictated our air strategy. Two tankers will let a squadron reach any border and return, and let us deploy beyond them at all."
 LATAM_light_attack_aircraft:0 "Light Attack Aircraft"
 LATAM_light_attack_aircraft_desc:0 "A turboprop costs less per hour than a jet costs per minute, flies from a dirt strip and loiters for hours over country where nothing shoots back. For the war we are actually fighting it is the correct aircraft."
 LATAM_air_bridge_denial:0 "Air Bridge Denial"
 LATAM_air_bridge_denial_desc:0 "Unregistered flights cross our airspace nightly, land on strips cut out of the bush and are gone before dawn. Radar coverage, interceptors on alert and a law permitting us to force them down will close the corridor, and start an argument about firing on civil aircraft."
 LATAM_close_air_support_integration:0 "Close Air Support Integration"
 LATAM_close_air_support_integration_desc:0 "Pilots who have never met the infantry they support will eventually kill some of them. Joint exercises, forward air controllers and a common radio net will make air support something a ground commander relies on rather than dreads."
 LATAM_integrated_air_defense:0 "Integrated Air Defense"
 LATAM_integrated_air_defense_desc:0 "Fighters, radars and missile batteries reporting to three headquarters are three separate ways of missing the same aircraft. One network with a single operations centre leaves no seam for an intruder to fly through."
 LATAM_airspace_surveillance_network:0 "Airspace Surveillance Network"
 LATAM_airspace_surveillance_network_desc:0 "Most of our sky is unwatched, and everyone who wishes to use it knows precisely which stretches. A chain of ground radars tied into a national centre will finally tell us what flies over our own country."
 LATAM_airborne_early_warning:0 "Airborne Early Warning"
 LATAM_airborne_early_warning_desc:0 "Ground radar cannot see past the mountains and neither, therefore, can we. A radar aircraft on station gives our interceptors thirty minutes of warning instead of three, which is the difference between defending and merely reacting."
 LATAM_unmanned_aerial_vehicles:0 "Unmanned Aerial Vehicles"
 LATAM_unmanned_aerial_vehicles_desc:0 "A drone watches a border crossing for twenty hours without a pilot, a pension or a funeral. The technology is immature and its enthusiasts oversell it, but this is where military aviation is going and we intend to arrive on time."
 LATAM_strategic_airlift:0 "Strategic Airlift"
 LATAM_strategic_airlift_desc:0 "Troops, relief supplies and the occasional government minister all need to cross this country faster than the roads permit. A squadron of transports turns a three-day deployment into an afternoon."
 LATAM_humanitarian_air_operations:0 "Humanitarian Air Operations"
 LATAM_humanitarian_air_operations_desc:0 "Earthquakes, floods and hurricanes visit this region on something close to a schedule, and the first aircraft over the wreckage is remembered for a generation. Dedicated crews, pre-packed loads and standing plans will save lives and do more for the air force than any parade."
 LATAM_maritime_patrol:0 "Maritime Patrol"
 LATAM_maritime_patrol_desc:0 "Foreign trawlers work our fishing grounds openly, confident that nobody is looking, and they are correct. Patrol aircraft over the economic zone will photograph, identify and report them, and give the navy something to intercept."
 LATAM_guardians_of_the_skies:0 "Guardians of the Skies"
 LATAM_guardians_of_the_skies_desc:0 "Modern aircraft, current pilots, a radar picture covering the whole country and enough fuel to fly it. Our air force can do what it has claimed to do for fifty years."

 # National Spirits (keys shared with a focus of the same name use that focus' localisation)
 LATAM_education_funding:0 "Education Funding"
 LATAM_education_funding_desc:0 "More teachers, better paid, in schools that no longer leak. The results arrive in fifteen years; the bill arrives this quarter."
 LATAM_oil_boom:0 "Oil Boom"
 LATAM_oil_boom_desc:0 "Every well brings in more than the last and the treasury is counting less carefully than it should. Booms end, as our own records show."
 LATAM_gold_trade:0 "Gold Trade"
 LATAM_gold_trade_desc:0 "Gold leaves the country refined and stamped, and the revenue arrives without argument or delay."
 LATAM_resource_based_economy2:0 "Resource-Based Economy"
 LATAM_resource_based_economy2_desc:0 "Mines, wells and harvests carry the economy, as they have since the colony, with rather better machinery."
 LATAM_mixed_market2:0 "Mixed Market"
 LATAM_mixed_market2_desc:0 "Private consortia are building what the treasury cannot afford, on concessions our lawyers spent a year over."
 LATAM_mixed_market3:0 "Mixed Market"
 LATAM_mixed_market3_desc:0 "The development bank lends where the planning ministry points rather than where the queue is loudest."
 LATAM_mixed_market4:0 "Mixed Market"
 LATAM_mixed_market4_desc:0 "Inspectors visit, penalties are collected, and firms still open. Both sides call the balance wrong, which suggests it is close."
 LATAM_mixed_market5:0 "Mixed Market"
 LATAM_mixed_market5_desc:0 "Steady growth, no crisis and nothing dramatic to report. In this country that is an achievement."
 LATAM_subsidized_electronics_sector:0 "Subsidized Electronics Sector"
 LATAM_subsidized_electronics_sector_desc:0 "State money keeps the component plants and their laboratories running, and the engineers are staying."
 LATAM_state_market1:0 "State-Led Economy"
 LATAM_state_market1_desc:0 "The first assembly lines are running, with a hundred supplier workshops growing up around them."
 LATAM_state_market2:0 "State-Led Economy"
 LATAM_state_market2_desc:0 "The state has built the industry everyone says cannot be built. It also owns every unprofitable piece of it."
 LATAM_free_market1:0 "Free Market"
 LATAM_free_market1_desc:0 "Tariffs are gone, capital moves freely, and the firms that cannot survive that do not."
 LATAM_free_market2:0 "Free Market"
 LATAM_free_market2_desc:0 "The region's banks, insurers and arbitrators do their business in our capital."
 LATAM_modern_officer_corps:0 "Modern Officer Corps"
 LATAM_modern_officer_corps_desc:0 "Our officers are promoted on merit and taught the constitution before the manual. The old guard retires slowly."
 LATAM_modern_officer_corps2:0 "Modern Officer Corps"
 LATAM_modern_officer_corps2_desc:0 "Orders reach the battalions in hours, and arrive meaning what they mean when they are written."
 LATAM_modern_officer_corps3:0 "Joint Command"
 LATAM_modern_officer_corps3_desc:0 "The three services plan from one headquarters and share a radio net. They share very little else."
 LATAM_armed_forces_modernization:0 "Armed Forces Modernization"
 LATAM_armed_forces_modernization_desc:0 "New equipment arrives faster than the training to use it, but both are arriving."
 LATAM_armed_forces_modernization2:0 "Modernized Armed Forces"
 LATAM_armed_forces_modernization2_desc:0 "Professional, equipped and exercised. The attaches who report on us are revising their assessments."
 LATAM_expanded_training_programs:0 "Expanded Training Programs"
 LATAM_expanded_training_programs_desc:0 "Our soldiers shoot, drive and maneuver often enough to be good at it."
 LATAM_modern_logistics:0 "Modern Logistics"
 LATAM_modern_logistics_desc:0 "Fuel, rations and ammunition reach the units that ask for them, in the quantities requested."
 LATAM_conventional_doctrine:0 "Conventional Doctrine"
 LATAM_conventional_doctrine_desc:0 "Our army is built to win a short war against a neighbor through firepower and concentration."
 LATAM_conventional_doctrine2:0 "Combined Arms Doctrine"
 LATAM_conventional_doctrine2_desc:0 "Armor, infantry and guns train as one battle group and fight the same way."
 LATAM_conventional_doctrine3:0 "Regional Military Power"
 LATAM_conventional_doctrine3_desc:0 "No army in this region can meet ours in the field, and the foreign ministries have noticed."
 LATAM_asymmetric_doctrine:0 "Asymmetric Doctrine"
 LATAM_asymmetric_doctrine_desc:0 "We trade ground for time, and make every valley of it expensive."
 LATAM_asymmetric_doctrine2:0 "Decentralized Command"
 LATAM_asymmetric_doctrine2_desc:0 "Cut off from headquarters, our units keep fighting. Occasionally they keep fighting the wrong thing."
 LATAM_counterinsurgency_doctrine:0 "Counterinsurgency Doctrine"
 LATAM_counterinsurgency_doctrine_desc:0 "Our troops clear the armed groups and stay long enough for the schools to reopen."
 LATAM_counterinsurgency_doctrine2:0 "Jungle Warfare Specialists"
 LATAM_counterinsurgency_doctrine2_desc:0 "Our jungle units go where the roads end and the insurgents assume nobody will follow."
 LATAM_peoples_war_doctrine:0 "People's War"
 LATAM_peoples_war_doctrine_desc:0 "Every village has a cache, a plan and somebody who knows how to use both."
 LATAM_peoples_war_doctrine2:0 "Protracted People's War"
 LATAM_peoples_war_doctrine2_desc:0 "Whoever takes our cities will spend a generation holding the ground between them."
 LATAM_rapid_response_doctrine2:0 "Rapid Reaction Forces"
 LATAM_rapid_response_doctrine2_desc:0 "Two brigades are packed, briefed and airborne within three days of the telephone ringing."
 LATAM_elite_commandos:0 "Elite Commandos"
 LATAM_elite_commandos_desc:0 "Our special forces train with the best in the hemisphere and are quietly rated alongside them."
 LATAM_precision_strike_doctrine:0 "Precision Strike Doctrine"
 LATAM_precision_strike_doctrine_desc:0 "Our forward teams call in fire accurate enough to use within a hundred meters of our own."

 # Air Force Spirits
 LATAM_air_force_modernization:0 "Air Force Modernization"
 LATAM_air_force_modernization_desc:0 "New airframes and new pilots, arriving faster than the hangars can be rebuilt for them."
 LATAM_air_force_modernization2:0 "Guardians of the Skies"
 LATAM_air_force_modernization2_desc:0 "Modern squadrons, current pilots and radar over the whole country. The sky is covered."
 LATAM_pilot_training_program:0 "Pilot Training Program"
 LATAM_pilot_training_program_desc:0 "Our aviators fly enough hours to be dangerous to somebody other than themselves."
 LATAM_american_aircraft:0 "American Aircraft"
 LATAM_american_aircraft_desc:0 "We fly American jets, with American training, spares and opinions about their use."
 LATAM_european_aircraft:0 "European Aircraft"
 LATAM_european_aircraft_desc:0 "Capable European aircraft, delivered slowly, and nobody telephones from an embassy about them."
 LATAM_russian_aircraft:0 "Russian Aircraft"
 LATAM_russian_aircraft_desc:0 "Powerful Russian fighters in our colors, demanding maintenance and a much thicker manual."
 LATAM_national_aviation_industry:0 "National Aviation Industry"
 LATAM_national_aviation_industry_desc:0 "Our own factories build aircraft for our own air force, at a price nobody examines closely."
 LATAM_air_superiority_doctrine:0 "Air Superiority Doctrine"
 LATAM_air_superiority_doctrine_desc:0 "Our fighters are trained and armed to own the air above the battlefield."
 LATAM_air_superiority_doctrine2:0 "Air Superiority Doctrine"
 LATAM_air_superiority_doctrine2_desc:0 "With tankers aloft, our squadrons reach any border and come home again."
 LATAM_light_attack_squadrons:0 "Light Attack Squadrons"
 LATAM_light_attack_squadrons_desc:0 "Cheap turboprops fly from dirt strips and loiter where a jet could not stay ten minutes."
 LATAM_light_attack_squadrons2:0 "Light Attack Squadrons"
 LATAM_light_attack_squadrons2_desc:0 "Our controllers and our pilots speak the same language, on the same frequency."
 LATAM_air_defense_network:0 "Air Defense Network"
 LATAM_air_defense_network_desc:0 "Fighters, radars and batteries report to one centre and cover one another's gaps."

 # Navy
 LATAM_modernize_the_navy:0 "Modernize the Navy"
 LATAM_modernize_the_navy_desc:0 "Our fleet is a museum of other navies' surplus, kept running by machinists who improvise the parts on a lathe. Half of it cannot sail a week without a tug in attendance. Rebuilding it is the work of a decade and must begin now."
 LATAM_expand_the_national_shipyards:0 "Expand the National Shipyards"
 LATAM_expand_the_national_shipyards_desc:0 "A navy refitted abroad can be immobilized by a foreign customs official in a bad mood. We shall expand our own yards, overhaul our own ships, build our own patrol craft and keep several thousand skilled men employed between contracts."
 LATAM_guard_our_waters:0 "Guard Our Waters"
 LATAM_guard_our_waters_desc:0 "Before anyone speaks of distant oceans there are smugglers in our estuaries, foreign trawlers on our grounds and traffickers using our coast as a highway. The navy's first duty is to make our own waters ours."
 LATAM_exclusive_economic_zone_patrols:0 "Exclusive Economic Zone Patrols"
 LATAM_exclusive_economic_zone_patrols_desc:0 "Our economic zone holds fisheries and seabed rights worth more each year than several ministries spend, and nobody polices it. Regular patrols, boarding teams and a fisheries court will collect what is owed and deter the rest."
 LATAM_riverine_flotillas:0 "Riverine Flotillas"
 LATAM_riverine_flotillas_desc:0 "Our rivers are the only roads into the interior and they carry cargo the state has never inspected. Armed flotillas of shallow-draft boats with their own supply barges will bring the authority of the state where it has never been seen."
 LATAM_maritime_drug_interdiction:0 "Maritime Drug Interdiction"
 LATAM_maritime_drug_interdiction_desc:0 "Go-fast boats and semi-submersibles built in mangrove yards carry more value off our coast in a night than our ports handle in a week. Interceptors, aerial cueing and crews trained to board at sea will make that trade expensive."
 LATAM_naval_infantry:0 "Naval Infantry"
 LATAM_naval_infantry_desc:0 "Marines are the most useful troops a poor navy can own: they land from a ship, patrol a river, retake a platform and garrison an island. We shall raise, equip and train a corps worth deploying."
 LATAM_coastal_defense_navy:0 "Coastal Defense Navy"
 LATAM_coastal_defense_navy_desc:0 "No fleet we could build would survive a great power at sea, and none of our likely enemies can afford one either. A navy designed to make our own coast lethal deters everyone who matters, at a price we can meet."
 LATAM_submarine_force:0 "Submarine Force"
 LATAM_submarine_force_desc:0 "A single submarine that may or may not be at sea alters every plan an opposing admiral makes. Modern diesel-electric boats, quiet and patient, are the cheapest deterrent available to a country in our position."
 LATAM_fast_attack_craft:0 "Fast Attack Craft"
 LATAM_fast_attack_craft_desc:0 "Missile boats working out of coves and inlets strike a warship many times their size and tie up at a fishing pier before the retaliation arrives. Cheap, numerous and entirely unsuited to the open sea."
 LATAM_sea_denial_doctrine:0 "Sea Denial Doctrine"
 LATAM_sea_denial_doctrine_desc:0 "Submarines, missile craft and minefields, coordinated from shore and supported by aircraft, turn our waters into a problem no staff wants to be handed. We need not command the sea, only deny it."
 LATAM_blue_water_ambitions:0 "Blue Water Ambitions"
 LATAM_blue_water_ambitions_desc:0 "Our trade, our fishing fleet and our nationals abroad do not stop at the twelve-mile limit. Frigates able to stay at sea for weeks will let us escort, patrol and show the flag where our interests actually are."
 LATAM_acquire_surplus_frigates:0 "Acquire Surplus Frigates"
 LATAM_acquire_surplus_frigates_desc:0 "The European navies are shrinking and selling serviceable frigates for a fraction of what they cost to build. Bought now, refitted in our own yards and properly crewed, they give us a real fleet a decade early."
 LATAM_amphibious_capability:0 "Amphibious Capability"
 LATAM_amphibious_capability_desc:0 "Landing ships are how a government reaches a disputed island, a flooded province or a neighbor who has asked for help. Hulls, landing craft and marines who have practiced together give us the option of arriving."
 LATAM_naval_aviation:0 "Naval Aviation"
 LATAM_naval_aviation_desc:0 "A helicopter aboard extends a frigate's horizon from twenty miles to a hundred and lets it search, board and rescue. The aircraft cost nearly as much as the ship and are still worth it."
 LATAM_masters_of_our_seas:0 "Masters of Our Seas"
 LATAM_masters_of_our_seas_desc:0 "From the river ports of the interior to the outer edge of the economic zone, our navy patrols waters it can actually control. The fleet of [ROOT.GetName] is no longer a coast guard with ambitions."

 # Navy Spirits
 LATAM_navy_modernization:0 "Navy Modernization"
 LATAM_navy_modernization_desc:0 "New hulls and new training, arriving at last, and the old ships are towed away."
 LATAM_navy_modernization2:0 "Masters of Our Seas"
 LATAM_navy_modernization2_desc:0 "Our fleet is modern, crewed and at sea, from the river ports to the economic zone."
 LATAM_maritime_security:0 "Maritime Security"
 LATAM_maritime_security_desc:0 "Smugglers, traffickers and foreign trawlers plan their routes around our patrols."
 LATAM_coastal_defense_doctrine:0 "Coastal Defense Doctrine"
 LATAM_coastal_defense_doctrine_desc:0 "Our navy is built to make our own coast expensive rather than to sail anywhere else."
 LATAM_coastal_defense_doctrine2:0 "Sea Denial Doctrine"
 LATAM_coastal_defense_doctrine2_desc:0 "Submarines, missile boats and mines make our waters a problem no admiral wants."
 LATAM_blue_water_doctrine:0 "Blue Water Doctrine"
 LATAM_blue_water_doctrine_desc:0 "Our crews are learning the open ocean, with all the breakdowns that implies."
 LATAM_blue_water_doctrine2:0 "Expeditionary Navy"
 LATAM_blue_water_doctrine2_desc:0 "Our fleet can carry a brigade across the sea and put it ashore at the other end."


 # Tooltips
 LATAM_air_bridge_denial_tt:0 "§YCompleting this focus after dealing with§! §Rnaval drug traffickers§! §Ywill grant the government additional§! §Gpolitical power§! §Ydue to our tough on crime stance.§!"
