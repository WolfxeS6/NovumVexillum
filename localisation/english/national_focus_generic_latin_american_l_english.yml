 # Political
 LATAM_a_new_millennium:0 "A New Millennium"
 LATAM_a_new_millennium_desc:0 "A new century opens on a country that has survived two dictatorships, three currencies and a decade it would rather not discuss. We hold a functioning democracy, a treasury that is almost solvent and a people with no patience left. What we do with the next four years is our answer to all of it."
 LATAM_restore_public_trust:0 "Restore Public Trust"
 LATAM_restore_public_trust_desc:0 "Our people watch presidents promise probity and leave the country afterward, and the polls record more confidence in the weather service than in the congress. Nothing this government attempts survives contact with that cynicism until some of it is repaired."
 LATAM_strengthen_the_institutions:0 "Strengthen the Institutions"
 LATAM_strengthen_the_institutions_desc:0 "A court that rules as the palace prefers, a statistics office that publishes what it is told and an electoral authority staffed by the governing party are the machinery of the next crisis. We shall take tenure, budgets and appointments out of political hands, beginning with our own."
 LATAM_a_crossroads_for_the_nation:0 "A Crossroads for the Nation"
 LATAM_a_crossroads_for_the_nation_desc:0 "Two arguments fill every newspaper and every dinner table in the country. One holds that our future lies in education, technology and the world as it is; the other that we lost ourselves somewhere in the last fifty years and must go back for what we left. The government must take a side."
 LATAM_look_to_the_future:0 "Look to the Future"
 LATAM_look_to_the_future_desc:0 "The nation is young, connected and impatient with the quarrels of its parents. We shall stake everything on that: schools, universities, technology and open borders for goods and ideas alike. The grandchildren of this generation will judge whether the bet is sound."
 LATAM_pivot_to_the_past:0 "Pivot to the Past"
 LATAM_pivot_to_the_past_desc:0 "We import foreign models, foreign fashions and foreign advice, and we receive inflation, crime and a generation that recognizes nothing of its own country. Order, faith, family and discipline built this republic once. They shall restore it."

 # Political Spirits
 LATAM_strong_institutions:0 "Strong Institutions"
 LATAM_strong_institutions_desc:0 "Courts, ministries and the electoral authority do their work without waiting for a telephone call."
 LATAM_eyes_on_the_future:0 "Eyes on the Future"
 LATAM_eyes_on_the_future_desc:0 "The country is betting on schooling, technology and the world outside, and is watching the returns."
 LATAM_return_to_the_old_order:0 "Return to the Old Order"
 LATAM_return_to_the_old_order_desc:0 "Tradition, discipline and the old hierarchies are respectable again, and enforced again."

 # Political: Look to the Future
 LATAM_central_bank_independence:0 "Central Bank Independence"
 LATAM_central_bank_independence_desc:0 "Every deficit is settled at the printing press and paid for by whoever holds our currency on a Friday afternoon. We shall give the central bank a fixed mandate, protected terms for its board and the legal right to refuse the treasury. Future finance ministers will curse us for it."
 LATAM_tax_simplification:0 "Tax Simplification"
 LATAM_tax_simplification_desc:0 "Our tax code runs to several thousand pages, exempts whoever lobbied most recently and is enforced against the salaried alone. Fewer rates, fewer exemptions and a revenue service with computers will collect more money from more people, which is the entire purpose."
 LATAM_free_trade_agreements:0 "Free Trade Agreements"
 LATAM_free_trade_agreements_desc:0 "Our exporters meet a tariff in every market they care about, while our own protected firms grow old and slow behind ours. Agreements with the neighbors, with Washington and with Brussels will open those markets and expose this one. Some of our industries will not survive it."
 LATAM_labour_market_flexibility:0 "Labour Market Flexibility"
 LATAM_labour_market_flexibility_desc:0 "Half our workforce has no contract, no pension and no recourse, because hiring a man formally costs more than most firms will risk. Simpler contracts and lower severance will bring those workers into the light, at the cost of some protection for those already standing in it."
 LATAM_adopt_the_dollar:0 "Adopt the Dollar"
 LATAM_adopt_the_dollar_desc:0 "There is no monetary discipline quite like the physical impossibility of printing money. Adopting the dollar ends inflation, devaluation and currency crises for good, and hands our monetary policy to a committee in Washington that has never heard of us. Desperate, irreversible, and it works."
 LATAM_inflation_targeting:0 "Inflation Targeting"
 LATAM_inflation_targeting_desc:0 "We shall keep our currency and earn its credibility instead: a published target, an independent board and the willingness to raise rates in an election year. It demands more discipline than dollarization and returns what dollarization cannot, which is a central bank of our own."
 LATAM_private_pension_funds:0 "Private Pension Funds"
 LATAM_private_pension_funds_desc:0 "The state pension pays badly and will be insolvent before its youngest contributors retire. Individual accounts, privately managed and legally the worker's own property, fix that and incidentally create the deepest pool of domestic investment capital this country has ever had."
 LATAM_property_rights_for_all:0 "Property Rights for All"
 LATAM_property_rights_for_all_desc:0 "Millions of our citizens live in houses they built on land they cannot prove is theirs, which is exactly why no bank will lend them a peso. Mass titling turns those dwellings into collateral, and their owners into people with something to lose."
 LATAM_school_choice:0 "School Choice"
 LATAM_school_choice_desc:0 "Our public schools cannot be closed, cannot be reformed and cannot be escaped by anyone without money. Funding that follows the student, and schools that lose it when families walk away, introduces the one incentive the system has never had."
 LATAM_the_liberal_republic:0 "The Liberal Republic"
 LATAM_the_liberal_republic_desc:0 "Stable money, open markets, enforceable contracts and a state that no longer tries to run what it cannot manage. The reforms are harsh, detested in their first year, and already being copied by our neighbors."
 LATAM_conditional_cash_transfers:0 "Conditional Cash Transfers"
 LATAM_conditional_cash_transfers_desc:0 "A monthly payment to the poorest households, made to the mother, conditional on the children attending school and the clinic. It costs a fraction of our fuel subsidy, is very hard to steal, and the evidence from across this region is by now unambiguous."
 LATAM_universal_health_coverage:0 "Universal Health Coverage"
 LATAM_universal_health_coverage_desc:0 "A family here is one illness away from ruin, and the corridors of the public hospitals show it. A guaranteed package of treatment for every citizen, funded from general taxation, ends that. The medical association has already scheduled its protest."
 LATAM_expand_public_education:0 "Expand Public Education"
 LATAM_expand_public_education_desc:0 "The parents of this generation left school at eleven and their children leave at fourteen. New classrooms in the barrios and the countryside, a longer school day and teachers paid enough to remain teachers will break the pattern within a generation."
 LATAM_labour_rights_and_the_minimum_wage:0 "Labour Rights and the Minimum Wage"
 LATAM_labour_rights_and_the_minimum_wage_desc:0 "The economy grows and the wage figures do not notice. A rising floor, enforceable contracts and inspectors willing to leave the capital will make certain the expansion reaches the people producing it."
 LATAM_public_transport_revolution:0 "Public Transport Revolution"
 LATAM_public_transport_revolution_desc:0 "The hillside neighborhoods are four kilometers and two hours from the work in the centre. Dedicated bus corridors, cable cars over the ravines and a fare the poorest can pay will give a million people their mornings back."
 LATAM_anti_corruption_commission:0 "Anti-Corruption Commission"
 LATAM_anti_corruption_commission_desc:0 "Every citizen can name the contractors who win every tender, and nobody can prosecute them. An independent commission with subpoena powers, its own investigators and a budget it cannot be starved of will change that, beginning with our own party's files."
 LATAM_indigenous_and_minority_rights:0 "Indigenous and Minority Rights"
 LATAM_indigenous_and_minority_rights_desc:0 "Our constitution addresses a nation of one language and one people, which has never described this country. Recognition, bilingual schooling, land titles and reserved seats will make citizens of communities that are governed rather than represented."
 LATAM_gender_equality:0 "Gender Equality"
 LATAM_gender_equality_desc:0 "Half our population earns less for identical work, is barely present in the congress and has no protection worth the name against violence at home. Equal pay law, electoral quotas and specialized courts will begin correcting an arrangement everyone has agreed to call natural."
 LATAM_environmental_protection:0 "Environmental Protection"
 LATAM_environmental_protection_desc:0 "Our forests are worth a great deal to whoever fells them and nothing at all to the country that owns them. Protected areas, licensing with real conditions and inspectors who cannot be bought will preserve what our grandchildren would otherwise only read about."
 LATAM_regional_integration:0 "Regional Integration"
 LATAM_regional_integration_desc:0 "Alone, each of our republics negotiates with Washington and Brussels as a supplicant. Together we are a market of hundreds of millions holding commodities the world cannot do without. A customs union, common standards and one negotiating position will make that arithmetic real."
 LATAM_the_inclusive_republic:0 "The Inclusive Republic"
 LATAM_the_inclusive_republic_desc:0 "Poverty falls in every year of this government, the courts are trusted and citizens who were invisible to the state now carry its documents. This is the republic the constitution describes and the country has never seen."

 # Political: Look to the Future (spirits)
 LATAM_market_liberal_reforms:0 "Market Liberal Reforms"
 LATAM_market_liberal_reforms_desc:0 "The state is standing back, and private enterprise is discovering what it can do unsupervised."
 LATAM_market_liberal_reforms2:0 "Market Liberal Reforms"
 LATAM_market_liberal_reforms2_desc:0 "Foreign capital is buying into our industries, and taking positions it can leave quickly."
 LATAM_market_liberal_reforms3:0 "The Liberal Republic"
 LATAM_market_liberal_reforms3_desc:0 "Open markets, sound money and a small state. Our neighbors send delegations to study it."
 LATAM_independent_central_bank:0 "Independent Central Bank"
 LATAM_independent_central_bank_desc:0 "Our currency is managed by technocrats who do not stand for election, and who behave accordingly."
 LATAM_dollarization:0 "Dollarization"
 LATAM_dollarization_desc:0 "Our currency is gone and so is inflation. So is any monetary policy of our own."
 LATAM_social_liberal_reforms:0 "Social Liberal Reforms"
 LATAM_social_liberal_reforms_desc:0 "The state is reaching the citizens the boom passed over, and the budget is feeling it."
 LATAM_social_liberal_reforms2:0 "Social Liberal Reforms"
 LATAM_social_liberal_reforms2_desc:0 "Wages, clinics and classrooms are visibly better with every year that passes."
 LATAM_social_liberal_reforms3:0 "The Inclusive Republic"
 LATAM_social_liberal_reforms3_desc:0 "Poverty falls each year and our institutions are believed. Neither is anything our parents saw."
 LATAM_universal_healthcare:0 "Universal Health Coverage"
 LATAM_universal_healthcare_desc:0 "Every citizen is guaranteed treatment. The waiting lists are the new complaint."
 LATAM_labour_rights:0 "Labour Rights"
 LATAM_labour_rights_desc:0 "Contracts are enforced, the wage floor rises, and the inspectors actually arrive."

 # Liberal paths
 LATAM_the_case_for_the_market:0 "The Case for the Market"
 LATAM_the_case_for_the_market_desc:0 "Forty years of planning give us queues, shortages and an inflation rate quoted monthly. A generation of economists trained abroad now argues, in the newspapers and increasingly in the cabinet, that the cure is not better planning but a great deal less of it. Their moment has arrived."
 LATAM_win_over_the_business_class:0 "Win Over the Business Class"
 LATAM_win_over_the_business_class_desc:0 "The industrialists, exporters and bankers of this country own its newspapers, fund its campaigns and can move their capital abroad in an afternoon. Courting them costs us something with our other supporters. Not courting them costs us the election."
 LATAM_a_message_to_the_middle_class:0 "A Message to the Middle Class"
 LATAM_a_message_to_the_middle_class_desc:0 "They save in a currency that is devalued twice, queue for goods that never arrive and watch their sons emigrate. We shall offer them honest money, full shelves and a state that takes less and delivers more. It is the easiest sale in politics at this moment."
 LATAM_court_foreign_investors:0 "Court Foreign Investors"
 LATAM_court_foreign_investors_desc:0 "Capital is flooding into emerging markets, and the fund managers deciding where it lands have never visited this country and never will. Roadshows, a credible reform program and a convertible currency will put us on their list."
 LATAM_the_liberal_coalition:0 "The Liberal Coalition"
 LATAM_the_liberal_coalition_desc:0 "Exporters, reformist technocrats, the professional class and every household that lost its savings in the last crisis. An alliance with little in common beyond exhaustion, and quite enough votes to govern."
 LATAM_a_program_for_government:0 "A Program for Government"
 LATAM_a_program_for_government_desc:0 "Our economists have spent three years writing what most oppositions improvise in three weeks. Every measure is costed, sequenced and drafted as legislation, because the first hundred days are the only ones in which any of it can pass."
 LATAM_electoral_victory:0 "Electoral Victory"
 LATAM_electoral_victory_desc:0 "The count is finished and the mandate is ours, won on a platform that promised difficulty. Now we must do it, with a congress we do not control and a public whose patience is measured in months."
 LATAM_cut_the_red_tape:0 "Cut the Red Tape"
 LATAM_cut_the_red_tape_desc:0 "Registering a business takes eleven ministries, fourteen weeks and a sum in bribes most citizens do not have, which is exactly why half our economy operates outside the law. A single window and a two-week deadline will do more for employment than any subsidy."
 LATAM_balance_the_budget:0 "Balance the Budget"
 LATAM_balance_the_budget_desc:0 "Every peso the treasury spends beyond what it collects is printed, and the printing is what devours wages. Spending shall come down to revenue: subsidies cut, payrolls frozen, ministries merged. The least popular thing we do, and the one all the rest depends on."
 LATAM_open_the_capital_account:0 "Open the Capital Account"
 LATAM_open_the_capital_account_desc:0 "Nobody invests in a country where taking the profits home requires a permit and a friend at the central bank. We shall lift the exchange controls and let money move freely, which also means it can leave over a single weekend if we frighten it."
 LATAM_privatize_the_state_enterprises:0 "Privatize the State Enterprises"
 LATAM_privatize_the_state_enterprises_desc:0 "The state companies employ our supporters' cousins, lose money inside protected markets and serve every government as an employment agency. We shall value them, tender them internationally and sell. The unions have already announced the strike."
 LATAM_sell_the_utilities:0 "Sell the Utilities"
 LATAM_sell_the_utilities_desc:0 "A telephone line takes four years and a bribe, the grid fails twice a week and our ports are the slowest on the coast. Private operators, bound by contract to invest and watched by a regulator with real powers, will fix in five years what the state has not in fifty."
 LATAM_sell_the_national_airline:0 "Sell the National Airline"
 LATAM_sell_the_national_airline_desc:0 "The flag carrier is a matter of immense national pride, flies half-empty on routes chosen by politicians and costs the treasury more each year than the education ministry's building programme. Someone else may have the honor."
 LATAM_attract_foreign_capital:0 "Attract Foreign Capital"
 LATAM_attract_foreign_capital_desc:0 "The reforms are achieving what the roadshows could not. Foreign firms are building plants here rather than merely shipping to us, and bringing suppliers, standards and salaries our own firms must now match."
 LATAM_the_regional_common_market:0 "The Regional Common Market"
 LATAM_the_regional_common_market_desc:0 "Our neighbors buy the manufactures nobody else will buy from us, and the customs posts between us are staffed by people whose entire function is to slow that down. A common external tariff and free movement inside it will make this continent one market at last."
 LATAM_the_regional_financial_hub:0 "The Regional Financial Hub"
 LATAM_the_regional_financial_hub_desc:0 "Sound money, enforceable contracts and courts that rule within the year are quietly making our capital the place where the region's deals are signed. The business follows the institutions, exactly as promised, and rather later than promised."
 LATAM_a_republic_of_laws:0 "A Republic of Laws"
 LATAM_a_republic_of_laws_desc:0 "Our constitution guarantees rights our courts cannot enforce, against a state it cannot restrain. The distance between the text and the country is where every one of our crises begins, and where reform has to start."
 LATAM_judicial_independence:0 "Judicial Independence"
 LATAM_judicial_independence_desc:0 "A judge whose promotion depends on the minister he is investigating will investigate carefully. Tenure, competitive appointment, published rulings and a budget the executive cannot cut will give us courts able to rule against the government and survive having done so."
 LATAM_freedom_of_the_press:0 "Freedom of the Press"
 LATAM_freedom_of_the_press_desc:0 "The insult laws on our statute book exist to protect officials from journalists and have never done anything else. Repealing them will produce coverage this government does not enjoy, which is the entire reason for repealing them."
 LATAM_the_reform_coalition:0 "The Reform Coalition"
 LATAM_the_reform_coalition_desc:0 "Lawyers, editors, student unions, the bar association and a dozen civic committees arrive at a single list of demands. It is not a party and it cannot govern, but no party can afford to ignore it."
 LATAM_a_new_government:0 "A New Government"
 LATAM_a_new_government_desc:0 "A reformist administration takes office on the votes of people who have run out of patience rather than on any great affection for us. The honeymoon will be short and the expectations are unreasonable. So were the promises."
 LATAM_the_rule_of_law:0 "The Rule of Law"
 LATAM_the_rule_of_law_desc:0 "A minister prosecuted, a general tried, a company fined and made to pay it. Nothing this government builds outlasts it unless the law is seen to apply upward as readily as it has always applied down."
 LATAM_a_state_for_the_citizen:0 "A State for the Citizen"
 LATAM_a_state_for_the_citizen_desc:0 "Our ministries are organized for the convenience of those who work in them, which is why a pension claim takes a year and three visits. Service standards, published waiting times and officials hired by examination will turn the administration around to face the public."
 LATAM_rights_and_equality:0 "Rights and Equality"
 LATAM_rights_and_equality_desc:0 "A republic that guarantees equality in its first article and denies it throughout its statutes has a drafting problem it has chosen for two centuries not to notice. We intend to notice it."
 LATAM_police_reform:0 "Police Reform"
 LATAM_police_reform_desc:0 "Our police are recruited badly, trained briefly, paid miserably and feared accordingly, and every citizen knows which streets they do not enter. Vetting, training, decent salaries and an independent complaints body begin a reform that will take twenty years."
 LATAM_civilian_oversight_of_the_military:0 "Civilian Oversight of the Military"
 LATAM_civilian_oversight_of_the_military_desc:0 "The armed forces write their own budgets, choose their own generals and interpret their own doctrine. A civilian defense ministry empowered to approve all three will be resented in every officers' mess in the country."
 LATAM_truth_and_justice:0 "Truth and Justice"
 LATAM_truth_and_justice_desc:0 "The disappeared of the dictatorship years are uncounted, the officers responsible amnestied themselves by decree, and the families are still writing letters. A commission with access to the archives will establish what happened, name it, and oblige the country to read it."
 LATAM_housing_and_urban_renewal:0 "Housing and Urban Renewal"
 LATAM_housing_and_urban_renewal_desc:0 "A third of our capital lives in settlements it built itself, buying water by the drum and taking electricity from the pole. Titles, sewers, paving and public housing will make neighborhoods out of districts that are still officially errors on the map."
 LATAM_civic_participation:0 "Civic Participation"
 LATAM_civic_participation_desc:0 "Citizens who vote every four years and are ignored for the intervening forty-seven months learn quickly that voting is not enough. Participatory budgets, local referendums and published accounts will give them a say between elections."
 LATAM_constitutional_reform:0 "Constitutional Reform"
 LATAM_constitutional_reform_desc:0 "Our constitution is amended by decree, suspended by generals and rewritten by every government that dislikes it. A new text, drafted in open assembly and ratified by referendum, will belong to the country rather than to us."
 LATAM_flexible_labour_markets:0 "Flexible Labour Markets"
 LATAM_flexible_labour_markets_desc:0 "Hiring is easy, dismissal is cheap, and the informal economy is shrinking into the formal one."
 LATAM_property_rights:0 "Property Rights for All"
 LATAM_property_rights_desc:0 "Millions of families hold title to land they have occupied for decades, and banks will lend against it."
 LATAM_free_press:0 "Free Press"
 LATAM_free_press_desc:0 "Our journalists publish what they find, and the government reads it with everybody else."
 LATAM_public_education:0 "Public Education"
 LATAM_public_education_desc:0 "Schools are funded, staffed and open to every child, including those furthest from the capital."
 LATAM_equal_rights:0 "Equal Rights"
 LATAM_equal_rights_desc:0 "The law protects every citizen, whatever they speak at home and wherever they were born."

 # Social democracy and progressivism
 LATAM_a_new_social_contract:0 "A New Social Contract"
 LATAM_a_new_social_contract_desc:0 "The economy grows and the settlements around our cities grow with it, which is not a statistical paradox but a political choice. A functioning market and a state that redistributes what it produces are not alternatives. We intend to operate both at once."
 LATAM_the_trade_unions:0 "The Trade Unions"
 LATAM_the_trade_unions_desc:0 "The confederations outlast dictatorship, exile and every government since, and they still hold the halls, the presses and the strike funds. Their endorsement is worth more than any poll and it is never given without conditions."
 LATAM_the_workers_party:0 "The Workers' Party"
 LATAM_the_workers_party_desc:0 "A dozen federations, four exiled factions and a generation of shop stewards are arguing themselves into a single party. The program is a compromise and the leadership is shared, but this country will have a party of labour worth the name."
 LATAM_the_rural_movements:0 "The Rural Movements"
 LATAM_the_rural_movements_desc:0 "The landless leagues and smallholder unions organize the countryside village by village, and no campaign in living memory bothers to ask them for anything. We shall ask, and we shall offer something in return."
 LATAM_the_urban_poor:0 "The Urban Poor"
 LATAM_the_urban_poor_desc:0 "The settlements ringing our cities hold a third of the electorate and receive water, policing and attention from nobody at all. Every party visits them in the final week of a campaign. We intend to arrive earlier and to remain longer."
 LATAM_a_broad_front:0 "A Broad Front"
 LATAM_a_broad_front_desc:0 "Unions, party militants, neighborhood committees and rural leagues sign a single agreement: one candidate, one program, one campaign. Keeping all of them inside it will be the hardest work of the next four years."
 LATAM_land_and_bread:0 "Land and Bread"
 LATAM_land_and_bread_desc:0 "The oldest slogan on this continent still empties a plaza into a march. Agrarian reform for the countryside and food prices for the cities, bound together, give us one campaign in two very different countries."
 LATAM_the_voice_of_the_barrios:0 "The Voice of the Barrios"
 LATAM_the_voice_of_the_barrios_desc:0 "The neighborhood committees already run the soup kitchens, the water committees and the night watch. Turned into a campaign structure they give us canvassers on every street the opposition cannot even map."
 LATAM_the_peoples_platform:0 "The People's Platform"
 LATAM_the_peoples_platform_desc:0 "The program is drafted in four hundred public assemblies rather than in a party office, which shows in its length and in its priorities: wages, pensions, clinics, schools and the price of the bus."
 LATAM_a_government_for_the_many:0 "A Government for the Many"
 LATAM_a_government_for_the_many_desc:0 "The closing message of the campaign fits on a poster and needs no explaining in any barrio in the country. The state has served a small number of people for a very long time. That ends with this vote."
 LATAM_the_social_democratic_victory:0 "The Social Democratic Victory"
 LATAM_the_social_democratic_victory_desc:0 "A metalworker, a union lawyer and a schoolteacher take the presidential sash and the two great ministries, for the first time in our history. The exchange rate moves eight percent on the announcement. The plazas are full until morning and do not ask what it closed at."
 LATAM_the_first_hundred_days:0 "The First Hundred Days"
 LATAM_the_first_hundred_days_desc:0 "Our voters expect everything immediately and our creditors expect reassurance immediately, and the two demands are not compatible. What we do in the first hundred days will be remembered long after the details are forgotten."
 LATAM_raise_the_minimum_wage:0 "Raise the Minimum Wage"
 LATAM_raise_the_minimum_wage_desc:0 "The legal minimum has not kept pace with the price of bread for eleven years. Raising it substantially puts money into the poorest households within a month. The business federation warns of catastrophe, as it does after every increase."
 LATAM_reform_the_pension_system:0 "Reform the Pension System"
 LATAM_reform_the_pension_system_desc:0 "A pension in this country is earned by holding a formal job, which most of our elderly never do. A basic pension for every citizen over sixty-five ends destitution in old age and costs approximately what it sounds as though it costs."
 LATAM_universal_public_services:0 "Universal Public Services"
 LATAM_universal_public_services_desc:0 "Clinics, schools and childcare funded out of general taxation rather than payroll contributions, and open to the market seller, the domestic worker and the bricklayer on the same terms as the civil servant."
 LATAM_the_re_election_campaign:0 "The Re-election Campaign"
 LATAM_the_re_election_campaign_desc:0 "The reforms are popular, the treasury is strained, and the party is split between finishing the work and protecting what is done. The voters will settle the argument, which is what makes this a government rather than a movement."
 LATAM_deepen_the_reforms:0 "Deepen the Reforms"
 LATAM_deepen_the_reforms_desc:0 "The mandate is renewed and the left of the party has waited patiently enough. We shall extend the social state to its logical conclusion and find the revenue afterward, which is not a sequence our finance minister endorses."
 LATAM_moderate_and_consolidate:0 "Moderate and Consolidate"
 LATAM_moderate_and_consolidate_desc:0 "A reform that ends in a devaluation returns the opposition to power for a decade. We shall make our peace with the markets, hold the budget and defend what is won rather than gamble it on one more measure."
 LATAM_expand_the_welfare_state:0 "Expand the Welfare State"
 LATAM_expand_the_welfare_state_desc:0 "Unemployment insurance, disability support, family allowances and housing benefit: a net under every citizen from birth. The most expensive thing this country has ever attempted, and the only one no future government will be permitted to repeal."
 LATAM_free_university_education:0 "Free University Education"
 LATAM_free_university_education_desc:0 "The national universities are free in principle and reserved in practice for those whose parents can afford them a childhood of study. Abolishing fees, funding maintenance grants and expanding places will put the children of the barrios in the lecture halls."
 LATAM_workers_on_the_board:0 "Workers on the Board"
 LATAM_workers_on_the_board_desc:0 "Employee representatives take a fixed share of the seats on every large board, see the accounts and vote on restructuring. Industrial conflict falls sharply. So does the speed at which anything is ever closed, moved or modernized."
 LATAM_the_social_state:0 "The Social State"
 LATAM_the_social_state_desc:0 "Pension, clinic, classroom and unemployment cheque, from the first day of life to the last. Our critics call it European and unaffordable in a country such as ours. Our voters call it fifty years overdue."
 LATAM_a_pact_with_the_business_sector:0 "A Pact with the Business Sector"
 LATAM_a_pact_with_the_business_sector_desc:0 "Wage restraint from the unions, investment commitments from the employers, price agreements from both, signed at the palace with the government as witness. Nobody leaves the table satisfied, which is the usual sign of a bargain that will hold."
 LATAM_responsible_public_finances:0 "Responsible Public Finances"
 LATAM_responsible_public_finances_desc:0 "A government of the left that loses control of its currency governs exactly once. The books shall balance, the debt shall be serviced and the reforms shall be funded from taxation, which means taxing the people who have never yet been taxed properly."
 LATAM_an_investment_boom:0 "An Investment Boom"
 LATAM_an_investment_boom_desc:0 "With labour peace signed, inflation contained and rules that will not be rewritten after the next election, capital is building rather than speculating. New plants are opening in provinces that have not seen one in thirty years."
 LATAM_the_stable_republic:0 "The Stable Republic"
 LATAM_the_stable_republic_desc:0 "Wages rising, prices steady, and governments that finish their terms and hand over peacefully. By the standards of our history it is extraordinarily dull, and it is the most valuable thing this generation will leave behind."
 LATAM_the_social_democratic_model:0 "The Social Democratic Model"
 LATAM_the_social_democratic_model_desc:0 "Whichever road we take, the result is a country where a child's prospects no longer depend entirely on the district of birth, and where growth and fairness are no longer presented as a choice between two evils."
 LATAM_a_new_generation_of_activists:0 "A New Generation of Activists"
 LATAM_a_new_generation_of_activists_desc:0 "Students, ecologists and feminists born after the last coup, who feel no loyalty whatever to the parties that survived it, are organizing entirely outside them. They fill plazas the unions no longer can."
 LATAM_the_environmental_movement:0 "The Environmental Movement"
 LATAM_the_environmental_movement_desc:0 "A tailings dam failure, a burning forest visible from the capital and air the pediatricians write papers about are moving ecology from a student cause to a mass one. The mining chamber has noticed and is unhappy."
 LATAM_student_and_feminist_movements:0 "Student and Feminist Movements"
 LATAM_student_and_feminist_movements_desc:0 "The universities bring organization and the women's movement brings numbers, and between them they can put half a million people into the street on a fortnight's notice. Neither will settle for being the ward of a larger party."
 LATAM_the_green_alliance:0 "The Green Alliance"
 LATAM_the_green_alliance_desc:0 "Ecologists, students and feminists agree on one list of candidates and one manifesto, after six months of assemblies that collapse twice and reconvene both times. It holds, for now."
 LATAM_a_progressive_victory:0 "A Progressive Victory"
 LATAM_a_progressive_victory_desc:0 "A coalition the political editors call a protest movement walks into the presidential palace with a working majority and an average age under forty."
 LATAM_a_green_new_deal:0 "A Green New Deal"
 LATAM_a_green_new_deal_desc:0 "Public investment in clean generation, public transport and decent housing, on a scale this country attempts only for wars. It will employ hundreds of thousands and be denounced as a fantasy until the first line opens."
 LATAM_the_energy_transition:0 "The Energy Transition"
 LATAM_the_energy_transition_desc:0 "Our grid runs on imported diesel and plants older than the ministry regulating them, and demand rises every year. What replaces them is decided by this government and lived with for the next fifty years."
 LATAM_a_society_of_equals:0 "A Society of Equals"
 LATAM_a_society_of_equals_desc:0 "What a child here can become is still determined by the district on the birth certificate, the language spoken at home and the surname. A government can change less of that than it promises and far more than has ever been attempted."
 LATAM_renewable_power:0 "Renewable Power"
 LATAM_renewable_power_desc:0 "We have more sun, wind and falling water than any country requires, and a fuel import bill that doubles every five years. Building the capacity takes a decade and ends that bill permanently."
 LATAM_nuclear_power:0 "Nuclear Power"
 LATAM_nuclear_power_desc:0 "Three reactors would settle our energy question for a generation and free the grid from fuel prices entirely. Half of our own movement regards the proposal as a betrayal, and the argument inside the coalition will be uglier than the one outside it."
 LATAM_education_and_science:0 "Education and Science"
 LATAM_education_and_science_desc:0 "Scholarships, laboratories and research institutes paying a salary a graduate can live on. A country that does not produce knowledge buys it forever, at whatever price the seller cares to name."
 LATAM_equality_before_the_law:0 "Equality Before the Law"
 LATAM_equality_before_the_law_desc:0 "Every discriminatory clause struck from the statutes and equal protection written in where they stood. The cheapest reform in the entire program, and the one that will be fought hardest."
 LATAM_protect_the_rainforest:0 "Protect the Rainforest"
 LATAM_protect_the_rainforest_desc:0 "Concessions cancelled, protected areas doubled and rangers paid enough that the job is worth more than the bribe. The frontier keeps advancing; it will now do so illegally, and be prosecuted for it."
 LATAM_clean_cities:0 "Clean Cities"
 LATAM_clean_cities_desc:0 "Electric buses, cycle lanes, rivers that can be walked beside and air that does not send children to the clinic every winter. Urban life here is endured. It can be improved."
 LATAM_research_and_innovation:0 "Research and Innovation"
 LATAM_research_and_innovation_desc:0 "Our best graduates leave because there is no laboratory here worth their time, and they do not come back. Research funding, industrial partnerships and equipment budgets give them a reason to stay, which is cheaper than training their replacements."
 LATAM_indigenous_autonomy:0 "Indigenous Autonomy"
 LATAM_indigenous_autonomy_desc:0 "Indigenous communities govern their own territories without the state's permission and frequently against its interference. Legal autonomy, title to the land and a say over what is extracted from it will make the arrangement official."
 LATAM_drug_policy_reform:0 "Drug Policy Reform"
 LATAM_drug_policy_reform_desc:0 "Thirty years of prohibition fill our prisons with couriers, our morgues with young men and the cartels' accounts with everything else. Treating consumption as a health matter can hardly do worse, and Washington will say otherwise at considerable volume."
 LATAM_a_sustainable_economy:0 "A Sustainable Economy"
 LATAM_a_sustainable_economy_desc:0 "An economy that lives on what the land renews rather than on what can be stripped out of it in a single generation. It grows more slowly, and it does not stop."
 LATAM_a_society_for_everyone:0 "A Society for Everyone"
 LATAM_a_society_for_everyone_desc:0 "Rights that sit on paper for eighty years are now exercised in offices, courts and clinics by citizens nobody expected to turn up. The paperwork is enormous and entirely welcome."
 LATAM_the_green_republic:0 "The Green Republic"
 LATAM_the_green_republic_desc:0 "Cleaner air, better schools, fairer courts and a country our emigrants are beginning to return to. Slower to mobilize an armored division, it must be admitted."
 LATAM_social_democratic_reforms:0 "Social Democratic Reforms"
 LATAM_social_democratic_reforms_desc:0 "Wages, pensions and public services are all rising. So is the deficit, punctually."
 LATAM_social_democratic_reforms2:0 "Social Democratic Reforms"
 LATAM_social_democratic_reforms2_desc:0 "The welfare state is being built, on a budget renegotiated every quarter."
 LATAM_social_democratic_reforms3:0 "The Social State"
 LATAM_social_democratic_reforms3_desc:0 "A complete welfare state, funded with everything the budget might otherwise have done."
 LATAM_social_democratic_reforms3_moderate:0 "A Responsible Social Democracy"
 LATAM_social_democratic_reforms3_moderate_desc:0 "Social reform kept strictly inside what the treasury and the bond markets will tolerate."
 LATAM_minimum_wage:0 "Minimum Wage"
 LATAM_minimum_wage_desc:0 "A legal floor under every wage, money in the poorest pockets, and a complaint from every employer."
 LATAM_pension_reform:0 "Pension Reform"
 LATAM_pension_reform_desc:0 "Our elderly retire on an income they can live on, at a cost recalculated every budget."
 LATAM_public_services:0 "Universal Public Services"
 LATAM_public_services_desc:0 "Clinics, schools and childcare are open to every citizen, formally employed or not."
 LATAM_expanded_welfare_state:0 "Expanded Welfare State"
 LATAM_expanded_welfare_state_desc:0 "A net under every citizen from birth, and a permanent first line in the budget."
 LATAM_free_university:0 "Free University Education"
 LATAM_free_university_desc:0 "Our universities take anyone who passes the entrance exam, and charge them nothing."
 LATAM_business_pact:0 "Pact with the Business Sector"
 LATAM_business_pact_desc:0 "Wage restraint for investment, signed at the palace and grumbled about by both signatories."
 LATAM_progressive_movement:0 "The Progressive Movement"
 LATAM_progressive_movement_desc:0 "A young, loud coalition with no memory of the old politics and no patience for it."
 LATAM_progressive_movement2:0 "The Progressive Movement"
 LATAM_progressive_movement2_desc:0 "Green and social reform is remaking the country, and dividing it down the middle."
 LATAM_progressive_movement3:0 "The Green Republic"
 LATAM_progressive_movement3_desc:0 "Cleaner, better schooled and more equal, with very little appetite for a war."
 LATAM_green_movement:0 "The Green Movement"
 LATAM_green_movement_desc:0 "The environmental groups are a political force now, and the mining chamber treats them as one."
 LATAM_green_new_deal:0 "Green New Deal"
 LATAM_green_new_deal_desc:0 "Public money is rebuilding the grid, the buses and the housing stock, all at once."
 LATAM_renewable_energy:0 "Renewable Power"
 LATAM_renewable_energy_desc:0 "Sun, wind and water carry a growing share of the grid, and the fuel bill falls each year."
 LATAM_nuclear_energy:0 "Nuclear Power"
 LATAM_nuclear_energy_desc:0 "Our reactors supply cheap, abundant power and a permanent argument inside the coalition."
 LATAM_science_and_education:0 "Science and Education"
 LATAM_science_and_education_desc:0 "Our laboratories are worth staying for, and some of our emigrants have noticed."
 LATAM_equality_before_the_law_idea:0 "Equality Before the Law"
 LATAM_equality_before_the_law_idea_desc:0 "Discrimination is gone from the statute book, if not yet from the country."
 LATAM_sustainable_economy:0 "Sustainable Economy"
 LATAM_sustainable_economy_desc:0 "We live off what the land renews, and grow more slowly for it."

 # Progressivism spirits
 LATAM_protected_areas:0 "Protected Areas"
 LATAM_protected_areas_desc:0 "Forests and rivers protected by law, and by rangers paid enough to enforce it."

 # Policy spirits
 LATAM_simplified_taxes:0 "Simplified Taxes"
 LATAM_simplified_taxes_desc:0 "A flatter code with fewer exemptions collects more, from rather more people."
 LATAM_regional_common_market:0 "The Regional Common Market"
 LATAM_regional_common_market_desc:0 "Goods and capital cross the region freely, and our producers meet the competition."
 LATAM_rule_of_law:0 "The Rule of Law"
 LATAM_rule_of_law_desc:0 "The law reaches the powerful too, and the country has noticed the difference."
 LATAM_civil_rights_agenda:0 "Civil Rights Agenda"
 LATAM_civil_rights_agenda_desc:0 "Legal equality is reaching citizens the state spent a century overlooking."
 LATAM_civilian_oversight:0 "Civilian Oversight"
 LATAM_civilian_oversight_desc:0 "The armed forces answer to the elected government, and say so through clenched teeth."
 LATAM_responsible_finances:0 "Responsible Public Finances"
 LATAM_responsible_finances_desc:0 "The books balance, and the markets have stopped watching us quite so closely."
 LATAM_social_inclusion:0 "Social Inclusion"
 LATAM_social_inclusion_desc:0 "Citizens who spent their whole lives outside the system are inside it now."

 # Democratic socialism and communism
 LATAM_the_communist_party:0 "The Communist Party"
 LATAM_the_communist_party_desc:0 "Outlawed for decades and governed from exile, the party is legal again and has lost nothing in discipline. It holds cells in every factory of consequence and a membership that has already been tested once."
 LATAM_organize_the_workers:0 "Organize the Workers"
 LATAM_organize_the_workers_desc:0 "Cadres take the union locals one at a time, through steward elections and the sort of patience nobody else on the left possesses. Where the confederations go, the ports, the mines and the power stations follow."
 LATAM_the_student_vanguard:0 "The Student Vanguard"
 LATAM_the_student_vanguard_desc:0 "The universities supply the movement with its theorists, its printing presses and the militants willing to be arrested first. They are also the most disputatious people in the country."
 LATAM_the_popular_front:0 "The Popular Front"
 LATAM_the_popular_front_desc:0 "Communists, socialists and the left radicals suspend forty years of mutual denunciation for the length of one campaign. The agreement is written down, which is new."
 LATAM_the_revolution_arrives:0 "The Revolution Arrives"
 LATAM_the_revolution_arrives_desc:0 "The party takes power, by whichever road it took. Whether it now governs under the constitution or replaces it is the only question that matters, and everything after depends on the answer."
 LATAM_the_parliamentary_road:0 "The Parliamentary Road"
 LATAM_the_parliamentary_road_desc:0 "The revolution shall govern under the existing constitution, with a hostile supreme court, an unconvinced army and a congress to be negotiated with weekly. Slower, harder, and defensible in public."
 LATAM_the_dictatorship_of_the_proletariat:0 "The Dictatorship of the Proletariat"
 LATAM_the_dictatorship_of_the_proletariat_desc:0 "Elections are suspended, the congress dissolved and the party assumes direct control of the state. What is won by a majority at one election will not be surrendered to a majority at the next."
 LATAM_govern_in_coalition:0 "Govern in Coalition"
 LATAM_govern_in_coalition_desc:0 "Governing with partners means conceding on ministries, on timing and on the pace of everything except the direction. The junior parties will be blamed for whatever disappoints."
 LATAM_municipal_socialism:0 "Municipal Socialism"
 LATAM_municipal_socialism_desc:0 "In the cities we hold, the councils deliver housing, clinics, transport and clean water the national state never manages. It is the most persuasive argument the movement has, and it is made in concrete."
 LATAM_the_one_party_state:0 "The One-Party State"
 LATAM_the_one_party_state_desc:0 "The rival parties are dissolved and their functions absorbed. The party is the state, the state is the revolution, and nobody will be drifting away from either of them now."
 LATAM_the_peoples_militias:0 "The People's Militias"
 LATAM_the_peoples_militias_desc:0 "Every factory, barrio and cooperative raises its own armed committee, elected by its members and issued rifles from the arsenals. Numerous, devoted, and militarily about what one would expect."
 LATAM_nationalize_key_industries:0 "Nationalize Key Industries"
 LATAM_nationalize_key_industries_desc:0 "Not every shop and workshop, but everything the economy turns on: energy, steel, transport, credit and the ports. The owners are compensated at book value, which they will contest in foreign courts for twenty years."
 LATAM_workers_control_of_the_workplace:0 "Workers' Control of the Workplace"
 LATAM_workers_control_of_the_workplace_desc:0 "Factory committees elect the management, set the targets and divide the surplus. Productivity becomes a matter of debate, as does everything else on the shop floor."
 LATAM_the_unions_in_government:0 "The Unions in Government"
 LATAM_the_unions_in_government_desc:0 "Confederation leaders sit in the cabinet with portfolios, and the shop floor has a direct line to the palace. Striking against our own government becomes a very complicated proposition indeed."
 LATAM_the_state_security_apparatus:0 "The State Security Apparatus"
 LATAM_the_state_security_apparatus_desc:0 "An internal service to watch for counter-revolution, staffed largely by people who spent their own youth being watched. It will be efficient, and it will not be easy to switch off afterward."
 LATAM_expropriate_the_landowners:0 "Expropriate the Landowners"
 LATAM_expropriate_the_landowners_desc:0 "The great estates are seized without compensation and their owners, who have threatened to leave the country for a century, finally do. The harvest falls for three years. The land does not go back."
 LATAM_literacy_and_health_brigades:0 "Literacy and Health Brigades"
 LATAM_literacy_and_health_brigades_desc:0 "Students and doctors go to villages that have never had either, for a year at a time. Whatever else this revolution achieves or destroys, it will leave behind a country that can read."
 LATAM_a_democratic_planned_economy:0 "A Democratic Planned Economy"
 LATAM_a_democratic_planned_economy_desc:0 "Production targets drafted by the planning ministry, argued over in public assemblies and in the congress, amended and then voted on. Planning is slower this way and considerably harder to lie about."
 LATAM_civil_liberties_preserved:0 "Civil Liberties Preserved"
 LATAM_civil_liberties_preserved_desc:0 "The press, the courts and the opposition parties come through the revolution intact and hostile. Our comrades abroad call this a failure of nerve. We call it the reason we shall still be here in ten years."
 LATAM_the_planned_economy:0 "The Planned Economy"
 LATAM_the_planned_economy_desc:0 "Five-year targets set by the party, executed by the ministries and audited by the same people who set them. The published figures are always met."
 LATAM_survive_the_embargo:0 "Survive the Embargo"
 LATAM_survive_the_embargo_desc:0 "Washington closes its market to us and leans on everyone else to do the same. We shall make do with what we can grow, dig and improvise, and with the friends still willing to sell to us. Rationing begins this month."
 LATAM_socialism_by_the_ballot:0 "Socialism by the Ballot"
 LATAM_socialism_by_the_ballot_desc:0 "A socialist economy under a constitution that could still vote us out, which nobody in the history of this movement sustains for long. We know the record. We intend to improve on it."
 LATAM_the_permanent_revolution:0 "The Permanent Revolution"
 LATAM_the_permanent_revolution_desc:0 "Party, militia and plan are the state now, and no institution survives through which anyone could argue otherwise. Whatever this becomes, it will not be undone from the inside."
 LATAM_communist_movement:0 "The Communist Party"
 LATAM_communist_movement_desc:0 "A disciplined party is organizing the factories and the universities, and the embassies are filing reports."
 LATAM_communist_government:0 "A Communist Government"
 LATAM_communist_government_desc:0 "The party governs. Mobilization is high, the shelves are thinner, and our trading partners have gone quiet."
 LATAM_communist_government2_democratic:0 "Socialism by the Ballot"
 LATAM_communist_government2_democratic_desc:0 "A socialist government that still has to face the voters, and still has to keep them fed."
 LATAM_communist_government2_dictatorship:0 "The Dictatorship of the Proletariat"
 LATAM_communist_government2_dictatorship_desc:0 "The party rules directly, and the whole economy points wherever it decides matters."
 LATAM_communist_government3_democratic:0 "Democratic Socialism"
 LATAM_communist_government3_democratic_desc:0 "Public ownership and mass mobilization, under a constitution the party could still lose at an election."
 LATAM_communist_government3_dictatorship:0 "The Permanent Revolution"
 LATAM_communist_government3_dictatorship_desc:0 "A fully mobilized society, sealed off from the world market and answerable to the party alone."
 LATAM_proletarian_dictatorship:0 "Proletarian Dictatorship"
 LATAM_proletarian_dictatorship_desc:0 "Elections are suspended and the party rules alone. Unity is total, and so is the silence around it."
 LATAM_one_party_state:0 "The One-Party State"
 LATAM_one_party_state_desc:0 "One party, one line, and nothing left that could grow into an opposition."
 LATAM_peoples_militias:0 "The People's Militias"
 LATAM_peoples_militias_desc:0 "Armed committees in every factory and barrio: many hands, very few marksmen."
 LATAM_key_industries:0 "Nationalized Key Industries"
 LATAM_key_industries_desc:0 "Energy, steel and transport work for the state, and the markets have priced that in."
 LATAM_workers_control:0 "Workers' Control"
 LATAM_workers_control_desc:0 "The shop floor elects its managers, and lives with what it elected."
 LATAM_civil_liberties:0 "Civil Liberties Preserved"
 LATAM_civil_liberties_desc:0 "The press and the courts survive the revolution, and remind us of it daily."
 LATAM_state_security:0 "State Security"
 LATAM_state_security_desc:0 "The service knows what is said at every meeting, and everyone knows that it knows."
 LATAM_expropriation:0 "Expropriation"
 LATAM_expropriation_desc:0 "The estates and the foreign holdings are ours. No insurer abroad will cover a shipment to us."
 LATAM_literacy_brigades:0 "Literacy and Health Brigades"
 LATAM_literacy_brigades_desc:0 "A country that can read, and a generation that survives its own childhood."
 LATAM_embargo_economy:0 "Economy Under Embargo"
 LATAM_embargo_economy_desc:0 "Cut off from the world market, we are learning to repair what we cannot replace."

 # Democratic socialism
 LATAM_the_pink_tide:0 "The Pink Tide"
 LATAM_the_pink_tide_desc:0 "Across the continent, movements of workers, peasants and the urban poor are winning elections the political science faculties declare unwinnable. Three presidencies in five years, and not one from the families that usually supply them. Our turn is coming."
 LATAM_the_movement_of_the_landless:0 "The Movement of the Landless"
 LATAM_the_movement_of_the_landless_desc:0 "Rural families occupy estates that have lain unplanted for decades, sow them, and wait for the eviction order. Their marches on the capital are the largest this country has seen and the backbone of the movement."
 LATAM_the_wealth_beneath_our_feet:0 "The Wealth Beneath Our Feet"
 LATAM_the_wealth_beneath_our_feet_desc:0 "Foreign consortia extract our oil, gas and copper under contracts signed by ministers who now sit on their boards. We are left the royalties, the tailings and the holes. The nation sitting on that wealth should own it."
 LATAM_the_neighbourhood_assemblies:0 "The Neighbourhood Assemblies"
 LATAM_the_neighbourhood_assemblies_desc:0 "In the barrios the assemblies meet weekly to run soup kitchens, clinics, water committees and protests, because the state never arrives to do any of it. They are the only functioning administration a third of this country knows."
 LATAM_a_coalition_of_the_left:0 "A Coalition of the Left"
 LATAM_a_coalition_of_the_left_desc:0 "Unions, peasant leagues and eleven small parties agree, after two years and several walkouts, to run one candidate on one program."
 LATAM_a_program_of_the_people:0 "A Program of the People"
 LATAM_a_program_of_the_people_desc:0 "A platform drafted in public assemblies rather than by consultants: land, wages, bread, and the return of everything sold off in the last decade."
 LATAM_the_peoples_victory:0 "The People's Victory"
 LATAM_the_peoples_victory_desc:0 "A former union leader takes the presidential sash, with the plazas full from noon until dawn. The stock exchange loses a tenth of its value by lunchtime, and nobody in the plazas asks what it closed at."
 LATAM_renegotiate_the_contracts:0 "Renegotiate the Contracts"
 LATAM_renegotiate_the_contracts_desc:0 "No tanks and no expropriation decree, simply new terms: royalties tripled, a state share in every field, and contracts reopened whether or not they contain a clause permitting it. The companies may keep drilling, or they may go."
 LATAM_hunger_must_end:0 "Hunger Must End"
 LATAM_hunger_must_end_desc:0 "A government that leaves office with every citizen eating three meals a day earns its place in the histories, whatever else it gets wrong. It is a target, it is measurable, and we have made it public deliberately."
 LATAM_a_continental_bloc:0 "A Continental Bloc"
 LATAM_a_continental_bloc_desc:0 "A union of the left across the region: energy at preferential prices, credit outside the Washington institutions, and one answer to the north instead of eight different ones."
 LATAM_the_state_energy_company:0 "The State Energy Company"
 LATAM_the_state_energy_company_desc:0 "One national company to drill, refine and sell, its revenue paid directly into the treasury. Its profits will fund the social programs. So will its losses, eventually, in the other direction."
 LATAM_oil_for_doctors:0 "Oil for Doctors"
 LATAM_oil_for_doctors_desc:0 "Foreign doctors and teachers staff the clinics and schools of villages that have never had either, paid in subsidized fuel rather than currency. Both governments call it solidarity; both sets of accountants call it barter."
 LATAM_take_back_the_mines:0 "Take Back the Mines"
 LATAM_take_back_the_mines_desc:0 "The concessions revert to the nation, the state company takes the pits, and the expatriate engineers are already at the airport. Everything underground is ours. So is everything that now goes wrong above it."
 LATAM_the_social_missions:0 "The Social Missions"
 LATAM_the_social_missions_desc:0 "Clinics, food programs, literacy classes and schools set up directly in the barrios by the presidency, bypassing the ministries that never reach them. Fast, enormously popular, and accountable to almost nobody."
 LATAM_the_bank_of_the_south:0 "The Bank of the South"
 LATAM_the_bank_of_the_south_desc:0 "A development bank owned by our own governments, capitalized from our own reserves, lending for projects our finance ministries choose without a letter of intent attached. The Fund has expressed its concerns."
 LATAM_workers_take_the_factories:0 "Workers Take the Factories"
 LATAM_workers_take_the_factories_desc:0 "Plants abandoned by owners who take the value of the machinery abroad are reopened by the workers who used to run them, and the title transferred to their cooperative by law. Production resumes at about two thirds, and climbs."
 LATAM_land_to_those_who_work_it:0 "Land to Those Who Work It"
 LATAM_land_to_those_who_work_it_desc:0 "The great estates are broken up and titled to the families already farming them, with credit, seed and a technical service attached, because land without any of those is merely a document."
 LATAM_the_commanding_heights:0 "The Commanding Heights"
 LATAM_the_commanding_heights_desc:0 "Energy, mining, credit and heavy industry all answer to the state now, which means every shortage, stoppage and price rise is the government's fault by definition. We accept that when we take them."
 LATAM_a_new_constitution:0 "A New Constitution"
 LATAM_a_new_constitution_desc:0 "A constituent assembly, elected for the purpose, refounds the republic with social rights, public ownership and the resource wealth in its opening articles. Undoing it requires the same procedure, which is precisely the point."
 LATAM_break_with_the_imf:0 "Break with the IMF"
 LATAM_break_with_the_imf_desc:0 "The debt is repudiated, the program abandoned, the mission sent home and the conditions go with it. Nobody will lend to us at any price for years. We are not being lent to on terms worth having."
 LATAM_socialism_of_the_21st_century:0 "Socialism of the 21st Century"
 LATAM_socialism_of_the_21st_century_desc:0 "An economy owned publicly, feeding and employing its people, elected and re-elected by them. The rating agencies have a different summary and publish it monthly."
 LATAM_democratic_socialist_movement:0 "The Pink Tide"
 LATAM_democratic_socialist_movement_desc:0 "A continental movement of workers and the poor is on the march, and foreign capital is booking flights."
 LATAM_democratic_socialist_government:0 "A Socialist Government"
 LATAM_democratic_socialist_government_desc:0 "The nation's wealth is being reclaimed. Investors, exporters and creditors are all unhappy at once, which is efficient."
 LATAM_democratic_socialist_government2:0 "The Commanding Heights"
 LATAM_democratic_socialist_government2_desc:0 "The state owns what matters and spends what it earns. Anything new takes twice as long as it should."
 LATAM_democratic_socialist_government3:0 "Socialism of the 21st Century"
 LATAM_democratic_socialist_government3_desc:0 "An economy owned by the nation and closed off from the world that used to own it."
 LATAM_resource_royalties:0 "Resource Royalties"
 LATAM_resource_royalties_desc:0 "Our share of every barrel and every tonne has doubled, and no new investor has visited since."
 LATAM_zero_hunger:0 "Zero Hunger"
 LATAM_zero_hunger_desc:0 "No citizen goes without a meal. The food bill is the largest single line in the budget."
 LATAM_continental_bloc:0 "A Continental Bloc"
 LATAM_continental_bloc_desc:0 "Our neighbors are allies and customers, on terms that suit us both and nobody in the north."
 LATAM_state_energy_company:0 "State Energy Company"
 LATAM_state_energy_company_desc:0 "Fuel flows and the treasury is full, though the company is run by appointees rather than engineers."
 LATAM_national_mining_company:0 "National Mining Company"
 LATAM_national_mining_company_desc:0 "The mines belong to the nation. Output is up; efficiency is where the engineers left it."
 LATAM_social_missions:0 "The Social Missions"
 LATAM_social_missions_desc:0 "Clinics, kitchens and schools in every barrio, paid for straight out of resource revenue."
 LATAM_bank_of_the_south:0 "The Bank of the South"
 LATAM_bank_of_the_south_desc:0 "Development credit without conditions, and without the markets' approval."
 LATAM_recovered_factories:0 "Recovered Factories"
 LATAM_recovered_factories_desc:0 "Workers run the plants they occupied: careful, cooperative and reluctant to risk expanding."
 LATAM_land_to_the_tiller:0 "Land to the Tiller"
 LATAM_land_to_the_tiller_desc:0 "The countryside feeds itself, and fills with families rather than fences."
 LATAM_refounding_constitution:0 "A Refounded Republic"
 LATAM_refounding_constitution_desc:0 "Social rights and public ownership are constitutional now, and very hard to undo."

 # Pivot to the Past: Conservatism
 LATAM_the_conservative_alternative:0 "The Conservative Alternative"
 LATAM_the_conservative_alternative_desc:0 "This country has had its revolutions, its juntas and its miracle cures, and every one of them promises to remake it from scratch. There is another tradition, older and quieter, that asks a humbler question: what is worth keeping, and how shall we keep it?"
 LATAM_the_church_and_the_countryside:0 "The Church and the Countryside"
 LATAM_the_church_and_the_countryside_desc:0 "Every village has a priest, a landowner and a notion of how things ought to be done that has not changed since independence. They vote, they vote together, and nobody on the left has ever managed to reach them."
 LATAM_the_business_chambers:0 "The Business Chambers"
 LATAM_the_business_chambers_desc:0 "The industrialists and exporters want predictable rules, a stable currency and a government that does not surprise them. They will fund anyone who can promise all three."
 LATAM_a_government_of_order:0 "A Government of Order"
 LATAM_a_government_of_order_desc:0 "The campaign's message fits on a single banner: no more experiments. After twenty years of them, a remarkable number of voters find it moving."
 LATAM_the_conservative_victory:0 "The Conservative Victory"
 LATAM_the_conservative_victory_desc:0 "Our new president has been a finance minister, a senator and a university rector, and gives the impression of having been born in a suit. The markets are calm, the bishops are satisfied and the plazas are empty, which is exactly how his voters want it."
 LATAM_restore_order_in_the_streets:0 "Restore Order in the Streets"
 LATAM_restore_order_in_the_streets_desc:0 "Kidnappings in the capital, road blockades in the provinces and a police force that negotiates rather than enforces. The first duty of a state is to be a state, and we shall make ours one again."
 LATAM_a_prudent_budget:0 "A Prudent Budget"
 LATAM_a_prudent_budget_desc:0 "The treasury shall spend what it collects and not a peso more, whatever the unions say and whatever the next election requires. It is a dull promise and the only one this country has never tried keeping."
 LATAM_the_church_and_the_state:0 "The Church and the State"
 LATAM_the_church_and_the_state_desc:0 "The constitution says church and state are separate, and in the cathedral it has always been understood that the constitution is the work of lawyers. The bishops shall have a voice in education and family policy again, and they will use it."
 LATAM_liberal_conservatism:0 "Liberal Conservatism"
 LATAM_liberal_conservatism_desc:0 "Free markets and old values, open trade and a strong family, a light state and a firm hand. The heirs of the nineteenth-century liberals hold that the two traditions are separated only by men who wish to rule without either."
 LATAM_national_conservatism:0 "National Conservatism"
 LATAM_national_conservatism_desc:0 "The market has no loyalty and the world beyond the border has no interest in our survival. Faith, family, nation and an army worthy of them come first, and the economy shall be made to serve them."
 LATAM_sound_money:0 "Sound Money"
 LATAM_sound_money_desc:0 "The currency holds its value, and the central bank refuses to print anything to help."
 LATAM_order_and_liberty:0 "Order and Liberty"
 LATAM_order_and_liberty_desc:0 "The old motto on half the escutcheons of this continent, rescued from the generals who shorten it to the first word. Liberty without order is anarchy; order without liberty is the barracks."
 LATAM_open_markets_old_values:0 "Open Markets, Old Values"
 LATAM_open_markets_old_values_desc:0 "Trade with the world and keep the Sunday Mass. The exporters and the parish priests are learning, slightly to each other's surprise, that they can share a platform."
 LATAM_respected_courts:0 "Respected Courts"
 LATAM_respected_courts_desc:0 "Contracts are enforced and judges are respected, which investors find more persuasive than any subsidy."
 LATAM_foreign_investment_welcome:0 "Foreign Investment Welcome"
 LATAM_foreign_investment_welcome_desc:0 "The rules are stable, the currency holds and the courts work. Foreign firms that fled the last three governments are returning cautiously, with factories rather than lawyers."
 LATAM_strong_provinces:0 "Strong Provinces"
 LATAM_strong_provinces_desc:0 "The capital has governed the provinces for two centuries and made a mess of it. Provincial governors with real budgets are closer to their people, and further from the palace's worst ideas."
 LATAM_a_property_owning_democracy:0 "A Property-Owning Democracy"
 LATAM_a_property_owning_democracy_desc:0 "A man who owns his house, his shop or his field has a stake in order that no slogan can buy. Titles, mortgages and small loans shall make a nation of proprietors."
 LATAM_the_family_business:0 "The Family Business"
 LATAM_the_family_business_desc:0 "Nine firms in ten in this country are run by a family, often into the third generation. They are the backbone of the economy and the least likely thing in it to emigrate."
 LATAM_the_conservative_republic:0 "The Conservative Republic"
 LATAM_the_conservative_republic_desc:0 "Stable money, working courts, open markets and a country that goes to church on Sunday. It has never been exciting. It is, for once, lasting."
 LATAM_faith_and_family:0 "Faith and Family"
 LATAM_faith_and_family_desc:0 "Large families and full churches. The universities complain about the curriculum."
 LATAM_law_and_order:0 "Law and Order"
 LATAM_law_and_order_desc:0 "More police, tougher sentences and a prison system bursting at the seams."
 LATAM_defend_our_culture:0 "Defend Our Culture"
 LATAM_defend_our_culture_desc:0 "Our music, our saints, our language and our history, taught in schools and broadcast on the airwaves without apology. The foreign channels can compete on their own time."
 LATAM_strengthen_the_armed_forces:0 "Strengthen the Armed Forces"
 LATAM_strengthen_the_armed_forces_desc:0 "A nation that will not pay for its own army eventually pays for somebody else's. The barracks shall have new equipment, new respect and, carefully, a little more say."
 LATAM_protect_national_industry:0 "Protect National Industry"
 LATAM_protect_national_industry_desc:0 "The steelworks, the shipyard and the textile mills are not merely businesses; they are the towns built around them. A modest tariff keeps them open, whatever the free traders say."
 LATAM_secure_the_borders:0 "Secure the Borders"
 LATAM_secure_the_borders_desc:0 "Smugglers, traffickers and armed bands cross our frontiers as though they were garden fences. Garrisons, patrols and a border worthy of the name will remind everyone where the nation ends."
 LATAM_patriotic_education:0 "Patriotic Education"
 LATAM_patriotic_education_desc:0 "Every child knows the anthem and the heroes, and rather less of the sciences."
 LATAM_the_national_guard:0 "The National Guard"
 LATAM_the_national_guard_desc:0 "Volunteers from every province, trained on weekends and ready for the flood, the earthquake or the invasion. Every town shall see the uniform, and know it is theirs."
 LATAM_the_nation_restored:0 "The Nation Restored"
 LATAM_the_nation_restored_desc:0 "Faith in the churches, order in the streets, soldiers on the borders and a flag in every classroom. The country looks, to its admirers, as it used to. That is precisely what worries its critics."

 # Pivot to the Past: Right-Wing Populism
 LATAM_the_silent_majority:0 "The Silent Majority"
 LATAM_the_silent_majority_desc:0 "They are tired of being called ignorant by the newspapers, backward by the universities and deplorable by the politicians who ask for their votes. They are the majority, they have been silent, and somebody has finally decided to speak for them."
 LATAM_against_the_political_class:0 "Against the Political Class"
 LATAM_against_the_political_class_desc:0 "Every party in congress has governed, every one has been caught stealing and every one expects our vote at the next election. Our candidate does not wish to reform the system; he intends to burn it down, and says so on live television."
 LATAM_the_evangelical_vote:0 "The Evangelical Vote"
 LATAM_the_evangelical_vote_desc:0 "The megachurches have forty million members, their own television networks and pastors who tell their congregations exactly how to vote. The old parties laugh at them. The old parties are about to lose."
 LATAM_the_outsider_candidate:0 "The Outsider Candidate"
 LATAM_the_outsider_candidate_desc:0 "A retired army captain, a television host or a provincial deputy nobody had heard of five years ago, saying things on camera that no politician dares. Every outrage he provokes doubles his numbers."
 LATAM_the_people_have_spoken:0 "The People Have Spoken"
 LATAM_the_people_have_spoken_desc:0 "He wins. The pollsters do not see it coming, the newspapers still do not understand it, and the foreign ministries are drafting careful telegrams. In the provinces they have been setting off fireworks since midnight."
 LATAM_drain_the_swamp:0 "Drain the Swamp"
 LATAM_drain_the_swamp_desc:0 "Thousands of civil servants, appointed by the old parties and loyal to them, go in the first month. Their replacements are loyal to the president. Whether they know how to run a ministry is a question for later."
 LATAM_guns_for_good_citizens:0 "Guns for Good Citizens"
 LATAM_guns_for_good_citizens_desc:0 "The police cannot protect the honest citizen, so the honest citizen shall protect himself. Permits are simplified, calibres enlarged and the gun shops cannot restock fast enough."
 LATAM_unleash_agribusiness:0 "Unleash Agribusiness"
 LATAM_unleash_agribusiness_desc:0 "Environmental inspectors, indigenous reserves and conservation zones stand between our farmers and the richest soil on the planet. The soy and cattle barons have been waiting for a president who would say so out loud."
 LATAM_war_on_the_gangs:0 "War on the Gangs"
 LATAM_war_on_the_gangs_desc:0 "A good bandit is a dead bandit, the president says, and the special police units take him at his word. The homicide rate falls in the rich districts and nobody asks too closely about the poor ones."
 LATAM_open_up_the_interior:0 "Open Up the Interior"
 LATAM_open_up_the_interior_desc:0 "Roads cut through forest that has never seen a machine, ranches where there were trees, and a ministry of environment instructed to find reasons to approve rather than to refuse."
 LATAM_govern_by_rally:0 "Govern by Rally"
 LATAM_govern_by_rally_desc:0 "Why hold press conferences when one can speak directly to a hundred thousand supporters in a stadium? Congress, the courts and the newspapers are bypassed; the base is not."
 LATAM_school_without_party:0 "School Without Party"
 LATAM_school_without_party_desc:0 "Teachers watch their words, parents film the classrooms, and the universities fill with lawsuits."
 LATAM_the_media_war:0 "The Media War"
 LATAM_the_media_war_desc:0 "The major newspapers and television networks are the enemy of the people, and the president tells them so every morning. Government advertising goes to friendly outlets; hostile ones are sued, audited and insulted."
 LATAM_the_evangelical_alliance:0 "The Evangelical Alliance"
 LATAM_the_evangelical_alliance_desc:0 "The pastors helped win the election and now expect their share of the government: the ministries of family, human rights and education, and a veto over the rest."
 LATAM_rule_by_social_media:0 "Rule by Social Media"
 LATAM_rule_by_social_media_desc:0 "Policy is announced at midnight to twenty million followers, and the ministries learn of it from the morning papers. It is chaotic, unmediated and astonishingly effective."
 LATAM_the_culture_war:0 "The Culture War"
 LATAM_the_culture_war_desc:0 "Every issue is now a battle between the patriots and the enemies of the nation: textbooks, museums, carnival floats and footballers' opinions. Half the country is exhausted; the other half has never felt more alive."
 LATAM_pardon_the_police:0 "Pardon the Police"
 LATAM_pardon_the_police_desc:0 "Officers facing prosecution for excessive force are pardoned en masse. The rank and file are ecstatic, the human rights commissions are furious, and the next raid in the shantytowns is noticeably less careful."
 LATAM_sovereignty_first:0 "Sovereignty First"
 LATAM_sovereignty_first_desc:0 "No foreign treaty tells us what to do with our land. Few foreign partners still wish to trade with us."
 LATAM_the_nation_above_everything:0 "The Nation Above Everything"
 LATAM_the_nation_above_everything_desc:0 "The nation above everything, God above all. The slogan is on every banner and every ministry, and the country beneath it has never been more divided or more certain of what it believes."

 # Pivot to the Past: National spirits
 LATAM_conservative_movement:0 "The Conservative Movement"
 LATAM_conservative_movement_desc:0 "The quieter half of the country is organizing, and the universities are not pleased."
 LATAM_conservative_government:0 "A Conservative Government"
 LATAM_conservative_government_desc:0 "Order, prudence and continuity. The country is calmer, and nothing new is being built."
 LATAM_liberal_conservative_government:0 "Liberal Conservatism"
 LATAM_liberal_conservative_government_desc:0 "Open markets and old values. Trade is booming, the churches are full and the laboratories are empty."
 LATAM_liberal_conservative_government2:0 "The Conservative Republic"
 LATAM_liberal_conservative_government2_desc:0 "A stable, prosperous and profoundly unadventurous republic."
 LATAM_national_conservative_government:0 "National Conservatism"
 LATAM_national_conservative_government_desc:0 "Faith, family and nation first. The economy is expected to keep up on its own."
 LATAM_national_conservative_government2:0 "The Nation Restored"
 LATAM_national_conservative_government2_desc:0 "A disciplined, devout and inward-looking nation that has stopped asking the world for approval."
 LATAM_prudent_budget:0 "A Prudent Budget"
 LATAM_prudent_budget_desc:0 "Spending matches revenue. So does the pace of every public project."
 LATAM_church_and_state:0 "The Church and the State"
 LATAM_church_and_state_desc:0 "The bishops have a voice in education and family policy, and the curriculum shows it."
 LATAM_open_markets:0 "Open Markets, Old Values"
 LATAM_open_markets_desc:0 "Trade is free, the tariffs are gone, and the old industries are feeling it."
 LATAM_provincial_autonomy:0 "Strong Provinces"
 LATAM_provincial_autonomy_desc:0 "Governors with budgets of their own, and a capital that has lost some of its leverage."
 LATAM_property_owning_democracy:0 "A Property-Owning Democracy"
 LATAM_property_owning_democracy_desc:0 "A nation of proprietors, each with a title, a mortgage and a stake in order."
 LATAM_protected_industry:0 "Protected Industry"
 LATAM_protected_industry_desc:0 "The old industries survive behind their tariffs, and our trading partners have noticed."
 LATAM_border_security:0 "Border Security"
 LATAM_border_security_desc:0 "Garrisons and patrols along every frontier. The smugglers find it much harder going."
 LATAM_national_guard:0 "The National Guard"
 LATAM_national_guard_desc:0 "Weekend volunteers in every province, ready for the flood or the invasion."
 LATAM_populist_movement:0 "The Silent Majority"
 LATAM_populist_movement_desc:0 "An angry, energetic movement that promises to burn down the political class."
 LATAM_populist_government:0 "A Populist Government"
 LATAM_populist_government_desc:0 "The base is mobilized and delighted. Everyone else is alarmed."
 LATAM_populist_government2:0 "The Culture War"
 LATAM_populist_government2_desc:0 "Every question is a loyalty test, every institution a battlefield, and the government thrives on it."
 LATAM_populist_government3:0 "The Nation Above Everything"
 LATAM_populist_government3_desc:0 "A government of fervent supporters and furious opponents, with nothing in between."
 LATAM_purged_bureaucracy:0 "A Purged Bureaucracy"
 LATAM_purged_bureaucracy_desc:0 "The ministries are staffed by loyalists. They are enthusiastic, obedient and frequently lost."
 LATAM_armed_citizens:0 "Armed Citizens"
 LATAM_armed_citizens_desc:0 "Millions of new gun owners, and an argument about whether the streets are safer."
 LATAM_agribusiness_unleashed:0 "Agribusiness Unleashed"
 LATAM_agribusiness_unleashed_desc:0 "The frontier is open and the soy is booming. So are the fires, and so is the foreign criticism."
 LATAM_media_war:0 "The Media War"
 LATAM_media_war_desc:0 "The government fights the press daily, and its supporters love it for that."

 # Pivot to the Past: Monarchism
 LATAM_the_monarchist_circle:0 "The Monarchist Circle"
 LATAM_the_monarchist_circle_desc:0 "Perhaps two hundred people in the whole country meet above a bookshop in the capital to discuss a throne abolished before their grandparents were born. The newspapers, when they notice us at all, print it in the humour column."
 LATAM_reprint_the_imperial_histories:0 "Reprint the Imperial Histories"
 LATAM_reprint_the_imperial_histories_desc:0 "Memoirs, court diaries and a biography of the last emperor, published at our own expense and stacked in the back of provincial bookshops. Somebody has to tell the other half of the story."
 LATAM_court_the_old_families:0 "Court the Old Families"
 LATAM_court_the_old_families_desc:0 "The families whose great-grandfathers held titles still own half the countryside and none of the influence. They will listen politely, write a cheque, and ask us never to mention their names in public."
 LATAM_find_the_claimant:0 "Find the Claimant"
 LATAM_find_the_claimant_desc:0 "There is a genealogy, contested by three rival branches, that ends with a man living quietly in Europe who has never set foot here. Convincing him to return will be harder than convincing the country to want him."
 LATAM_the_pretender_returns:0 "The Pretender Returns"
 LATAM_the_pretender_returns_desc:0 "He lands to a crowd of four hundred, a police escort nobody requested and a congressional motion demanding his deportation. For the first time in a century, the newspapers print the word dynasty without irony."
 LATAM_a_party_of_our_own:0 "A Party of Our Own"
 LATAM_a_party_of_our_own_desc:0 "Registering a monarchist party in a republic requires fifty thousand signatures, a legal team and a tolerance for ridicule. We have the third in abundance."
 LATAM_endure_the_ridicule:0 "Endure the Ridicule"
 LATAM_endure_the_ridicule_desc:0 "Cartoonists make us their standing joke, the university debating societies invite us for entertainment and every talk show ends the same way. We keep turning up. That is the entire strategy."
 LATAM_the_aristocratic_salons:0 "The Aristocratic Salons"
 LATAM_the_aristocratic_salons_desc:0 "Dinners in old houses where the silver is engraved with arms nobody is legally allowed to use. Slow, discreet, extremely well connected work."
 LATAM_win_over_the_church:0 "Win Over the Church"
 LATAM_win_over_the_church_desc:0 "The hierarchy remembers that the republic seized its lands and the crown protected them. A monarchy consecrated rather than elected has an appeal no bishop will state on the record."
 LATAM_win_over_the_officers:0 "Win Over the Officers"
 LATAM_win_over_the_officers_desc:0 "Officers swear their oath to a constitution rewritten six times in eighty years. A crown is at least the same crown every morning, and some colonels find that argument unexpectedly persuasive."
 LATAM_the_case_for_a_crown:0 "The Case for a Crown"
 LATAM_the_case_for_a_crown_desc:0 "Not a return to absolutism but a head of state who owes nothing to any party, cannot be bought in an election and will still be there when this government has collapsed like the eleven before it. Put like that, the polls stop being a joke."
 LATAM_the_plebiscite:0 "The Plebiscite"
 LATAM_the_plebiscite_desc:0 "The question goes to the people: republic or monarchy, on a single ballot paper. Two years of patient, humiliating work come down to one afternoon."
 LATAM_the_coronation:0 "The Coronation"
 LATAM_the_coronation_desc:0 "Foreign royalty in the cathedral, a crown borrowed from a museum and a constitution the new sovereign has already sworn to obey. Half the country watches on television; a good deal of it is weeping."
 LATAM_a_crown_above_party:0 "A Crown Above Party"
 LATAM_a_crown_above_party_desc:0 "The sovereign does not govern, does not campaign and belongs to nobody. In a country where every institution has a faction behind it, that is the whole value of the thing."
 LATAM_the_royal_household:0 "The Royal Household"
 LATAM_the_royal_household_desc:0 "A court, a palace and an annual argument about the cost of both."
 LATAM_the_constitutional_settlement:0 "The Constitutional Settlement"
 LATAM_the_constitutional_settlement_desc:0 "Exactly what the crown may and may not do, written down in detail, so that the first crisis is settled by a clause rather than by a regiment."
 LATAM_the_orders_of_chivalry:0 "The Orders of Chivalry"
 LATAM_the_orders_of_chivalry_desc:0 "Ancient orders revived and new ones invented, with ribbons, ranks and a ceremony at the palace. Soldiers who would never take a bribe will work a very long time for a medal."
 LATAM_royal_diplomacy:0 "Royal Diplomacy"
 LATAM_royal_diplomacy_desc:0 "Doors open for a sovereign that stayed shut for a century of ambassadors."
 LATAM_guardian_of_the_constitution:0 "Guardian of the Constitution"
 LATAM_guardian_of_the_constitution_desc:0 "When a government oversteps, the crown withholds its signature and forces the argument into the open. Used once a decade it is priceless; used twice a year it would be fatal."
 LATAM_the_civil_list:0 "The Civil List"
 LATAM_the_civil_list_desc:0 "The court's finances are settled by statute, audited annually and published. Every republican deputy will read the figures aloud, which is precisely why they must be beyond reproach."
 LATAM_a_second_chamber:0 "A Second Chamber"
 LATAM_a_second_chamber_desc:0 "A senate of the realm to revise the laws the lower house passes in a hurry: slower legislation, fewer disasters, and a permanent complaint about unelected influence."
 LATAM_honours_and_titles:0 "Honours and Titles"
 LATAM_honours_and_titles_desc:0 "Knighthoods for surgeons, peerages for industrialists and decorations for sergeants. The cheapest currency any state has ever issued."
 LATAM_marriages_of_state:0 "Marriages of State"
 LATAM_marriages_of_state_desc:0 "A royal wedding to a European house turns a curiosity into a dynasty, and a dynasty into an embassy. The bride is followed by trade delegations."
 LATAM_the_crown_and_the_people:0 "The Crown and the People"
 LATAM_the_crown_and_the_people_desc:0 "The sovereign opens hospitals, tours the flood districts and speaks at the mine disaster. The old families are appalled at how popular this makes him in the barrios."
 LATAM_the_crown_abroad:0 "The Crown Abroad"
 LATAM_the_crown_abroad_desc:0 "State visits and royal tours do more for our exports than three trade ministries."
 LATAM_the_kingdom_endures:0 "The Kingdom Endures"
 LATAM_the_kingdom_endures_desc:0 "What begins as two hundred people above a bookshop ends as the state itself. The republic is now the thing our grandchildren will read about in the histories."

 # Pivot to the Past: Monarchist spirits
 LATAM_monarchist_circle:0 "The Monarchist Circle"
 LATAM_monarchist_circle_desc:0 "A fringe movement in a republican country. Nobody in politics returns our calls."
 LATAM_the_pretender:0 "The Pretender"
 LATAM_the_pretender_desc:0 "A claimant with a genealogy, a foreign accent and no constituency whatsoever."
 LATAM_monarchist_movement:0 "The Monarchist Movement"
 LATAM_monarchist_movement_desc:0 "Still a joke in the capital, but a joke with a party, a newspaper and growing provincial branches."
 LATAM_the_altar_and_the_throne:0 "The Altar and the Throne"
 LATAM_the_altar_and_the_throne_desc:0 "The hierarchy is quietly with us, and the parish pulpits are not entirely silent about it."
 LATAM_the_sword_and_the_throne:0 "The Sword and the Throne"
 LATAM_the_sword_and_the_throne_desc:0 "A number of colonels have concluded that an oath to a person beats an oath to a document."
 LATAM_the_restored_crown:0 "The Restored Crown"
 LATAM_the_restored_crown_desc:0 "A head of state above the parties, and a country still deciding how it feels about him."
 LATAM_the_restored_crown2:0 "The Crown Established"
 LATAM_the_restored_crown2_desc:0 "The monarchy is no longer an experiment. Foreign ministries treat it as permanent."
 LATAM_the_restored_crown3:0 "The Kingdom Endures"
 LATAM_the_restored_crown3_desc:0 "An institution above politics, respected abroad and impossible for any faction to capture."
 LATAM_crown_above_party:0 "A Crown Above Party"
 LATAM_crown_above_party_desc:0 "The sovereign belongs to no faction, which is worth more than any vote he could cast."
 LATAM_constitutional_settlement:0 "The Constitutional Settlement"
 LATAM_constitutional_settlement_desc:0 "The crown's powers are written down, which is why nobody has to fight over them."
 LATAM_orders_of_chivalry:0 "The Orders of Chivalry"
 LATAM_orders_of_chivalry_desc:0 "Ribbons, ranks and ceremonies. The officer corps has never been so loyal for so little money."
 LATAM_the_senate_of_the_realm:0 "The Senate of the Realm"
 LATAM_the_senate_of_the_realm_desc:0 "An upper house that revises, delays and occasionally prevents. Legislation moves slowly."
 LATAM_dynastic_ties:0 "Dynastic Ties"
 LATAM_dynastic_ties_desc:0 "A marriage into a European house, and the trade delegations that follow the bride."

 # Pivot to the Past: Nationalism
 LATAM_the_nation_betrayed:0 "The Nation Betrayed"
 LATAM_the_nation_betrayed_desc:0 "Crime in the cities, corruption in congress, foreign banks dictating the budget and politicians who treat all three as the weather. A country does not decline by accident; somebody sold it, and the men who did are still in office."
 LATAM_the_road_of_the_barracks:0 "The Road of the Barracks"
 LATAM_the_road_of_the_barracks_desc:0 "The ballot box produces this mess and will not clean it up. The army is the only institution left with discipline, a chain of command and the means to act. It has done this before, and the country survived."
 LATAM_the_officers_conspire:0 "The Officers Conspire"
 LATAM_the_officers_conspire_desc:0 "Dinners in the officers' club where the conversation turns, as it always does, to the state of the nation. This time somebody brings a list of names and a timetable."
 LATAM_the_colonels_committee:0 "The Colonels' Committee"
 LATAM_the_colonels_committee_desc:0 "Not the generals, who are political, but the colonels who command the regiments that matter. Everything depends on which way the garrison of the capital turns."
 LATAM_manufacture_the_crisis:0 "Manufacture the Crisis"
 LATAM_manufacture_the_crisis_desc:0 "A strike allowed to spread, a riot policed badly, a bombing nobody claims. By the time the country is frightened enough, the solution is already in the barracks waiting."
 LATAM_neutralize_the_unions:0 "Neutralize the Unions"
 LATAM_neutralize_the_unions_desc:0 "The confederation can put half a million people in the streets on the morning of the coup. Its leaders shall be arrested, bought or warned the night before."
 LATAM_the_coup:0 "The Coup"
 LATAM_the_coup_desc:0 "Tanks at the palace gates before dawn, a communiqué on national radio at six, and a junta of three officers on television by noon. Congress is dissolved, the constitution suspended and the country is told this is temporary."
 LATAM_the_junta_governs:0 "The Junta Governs"
 LATAM_the_junta_governs_desc:0 "Three officers in a cabinet room discovering that running a country involves the price of bread, the teachers' payroll and the sewerage of a city of six million."
 LATAM_dissolve_the_congress:0 "Dissolve the Congress"
 LATAM_dissolve_the_congress_desc:0 "The deputies are sent home, the parties suspended and the chamber locked. Nobody in the street protests, which the junta takes for approval."
 LATAM_the_state_of_siege:0 "The State of Siege"
 LATAM_the_state_of_siege_desc:0 "Curfew, censorship and arrest without charge, renewed every ninety days for as long as necessary. The definition of necessary is left to the junta."
 LATAM_the_security_services:0 "The Security Services"
 LATAM_the_security_services_desc:0 "An intelligence directorate with its own prisons and no obligation to explain them."
 LATAM_national_reorganization:0 "National Reorganization"
 LATAM_national_reorganization_desc:0 "The euphemism the juntas of the seventies used, revived without irony. Ministries are purged, provinces are given military governors and the word provisional quietly disappears from the communiqués."
 LATAM_purge_the_universities:0 "Purge the Universities"
 LATAM_purge_the_universities_desc:0 "Faculties closed, professors dismissed and student unions banned. A generation of the country's best minds emigrates within eighteen months."
 LATAM_the_economic_technocrats:0 "The Economic Technocrats"
 LATAM_the_economic_technocrats_desc:0 "The junta has no economic policy, so it hires one: young economists with foreign doctorates, delighted to work without a congress to argue with."
 LATAM_restore_investor_confidence:0 "Restore Investor Confidence"
 LATAM_restore_investor_confidence_desc:0 "Stable rules, no strikes and a government that cannot be voted out. Foreign capital has never much minded who signs the guarantees."
 LATAM_order_and_progress:0 "Order and Progress"
 LATAM_order_and_progress_desc:0 "The streets are safe, the accounts balance and nobody asks where the missing went. The junta calls this the new nation; the exiles call it something else."
 LATAM_the_road_of_the_ballot:0 "The Road of the Ballot"
 LATAM_the_road_of_the_ballot_desc:0 "Power taken by force must be defended by force forever. Power won at the polls can be used to change the rules themselves, and nobody abroad can say a word about it."
 LATAM_the_law_and_order_party:0 "The Law and Order Party"
 LATAM_the_law_and_order_party_desc:0 "A party built on one promise, repeated in every speech: the killing in the streets stops the day we take office."
 LATAM_the_provincial_bosses:0 "The Provincial Bosses"
 LATAM_the_provincial_bosses_desc:0 "The old caudillos of the interior deliver their provinces intact, in exchange for being left entirely alone inside them."
 LATAM_the_security_election:0 "The Security Election"
 LATAM_the_security_election_desc:0 "Every debate is about crime, every broadcast opens with a body on a pavement, and every opponent is asked why he is soft. It is not subtle and it is extremely effective."
 LATAM_alliance_with_the_conservatives:0 "Alliance with the Conservatives"
 LATAM_alliance_with_the_conservatives_desc:0 "The respectable right holds its nose and signs, because the alternative is the left and because they believe they can control us. They are half right."
 LATAM_the_nationalist_victory:0 "The Nationalist Victory"
 LATAM_the_nationalist_victory_desc:0 "Elected, cleanly, with a majority the commentators call impossible. Every institution we intend to dismantle congratulates us on our democratic mandate."
 LATAM_a_mandate_for_order:0 "A Mandate for Order"
 LATAM_a_mandate_for_order_desc:0 "The mandate is real and the first hundred days are spent spending it: police on the streets, prisons expanded, and a country that notices the difference."
 LATAM_emergency_powers:0 "Emergency Powers"
 LATAM_emergency_powers_desc:0 "Rule by decree, granted for six months and renewed indefinitely."
 LATAM_the_war_on_crime:0 "The War on Crime"
 LATAM_the_war_on_crime_desc:0 "Military police in the shantytowns, sentences doubled and rules of engagement no prosecutor will examine. Homicides fall and nobody counts the other column."
 LATAM_the_armed_forces_restored:0 "The Armed Forces Restored"
 LATAM_the_armed_forces_restored_desc:0 "Budgets, promotions and the old privileges returned, along with an understanding about who the government's real allies are."
 LATAM_pack_the_courts:0 "Pack the Courts"
 LATAM_pack_the_courts_desc:0 "The supreme court is enlarged, the new seats filled by friends and the rulings change accordingly. Entirely constitutional, which is the beauty of it."
 LATAM_the_referendum_on_reform:0 "The Referendum on Reform"
 LATAM_the_referendum_on_reform_desc:0 "A single question, worded by us, campaigned for with the state's resources, and a result that transfers the parliament's powers to the presidency. It has been done before on this continent, and rewarded with re-election."
 LATAM_the_strong_presidency:0 "The Strong Presidency"
 LATAM_the_strong_presidency_desc:0 "Decree powers, a compliant court, indefinite re-election and elections that continue to be held. The observers will keep calling it a democracy for years."
 LATAM_a_government_of_national_unity:0 "A Government of National Unity"
 LATAM_a_government_of_national_unity_desc:0 "The opposition is invited in, given ministries without budgets and blamed for whatever goes wrong. Several of them accept."
 LATAM_the_authoritarian_republic:0 "The Authoritarian Republic"
 LATAM_the_authoritarian_republic_desc:0 "Elections, courts, a congress and a press, all of them functioning and none of them able to remove the president. It is the most durable form of authoritarian rule ever invented."

 # Pivot to the Past: Fascism
 LATAM_the_movement_marches:0 "The Movement Marches"
 LATAM_the_movement_marches_desc:0 "Ranks of young men in identical shirts march through provincial capitals under a banner nobody recognizes. The newspapers are amused, and will be for about eighteen months."
 LATAM_the_veterans_leagues:0 "The Veterans' Leagues"
 LATAM_the_veterans_leagues_desc:0 "Men who fought the last border war come home to unemployment and a state that forgets them. They have discipline, weapons training and a grievance the movement can use."
 LATAM_the_student_squads:0 "The Student Squads"
 LATAM_the_student_squads_desc:0 "The universities are the movement's recruiting ground and its battlefield. Every fight in a lecture hall is reported, and every report brings more volunteers."
 LATAM_the_party_militia:0 "The Party Militia"
 LATAM_the_party_militia_desc:0 "Thousands of uniformed men under party discipline and beyond police interest."
 LATAM_the_march_on_the_capital:0 "The March on [ROOT.capital.GetCapitalVictoryPointName]"
 LATAM_the_march_on_the_capital_desc:0 "Columns converge on [ROOT.capital.GetCapitalVictoryPointName], the garrison stays in barracks and the president learns by telephone that he has resigned. It takes a single afternoon, and eighty years of republican tradition end with it."
 LATAM_the_single_party:0 "The Single Party"
 LATAM_the_single_party_desc:0 "One legal opinion, enforced. Emigration queues at every consulate."
 LATAM_the_new_state:0 "The New State"
 LATAM_the_new_state_desc:0 "Not a coup but a refoundation, the movement insists: a new constitution, a new flag on the ministries and a new calendar dating from the march."
 LATAM_the_militarized_nation:0 "The Militarized Nation"
 LATAM_the_militarized_nation_desc:0 "Drill in the schools, uniforms in the ministries and a youth organization every child is expected to join. The nation is to be understood as an army that happens to be at peace."
 LATAM_the_falangist_wing:0 "The Falangist Wing"
 LATAM_the_falangist_wing_desc:0 "Corporatism, the church and the fatherland, ordered by the state and blessed at the altar. The nation is a body with a soul, and the party is its will."
 LATAM_the_national_socialist_wing:0 "The National Socialist Wing"
 LATAM_the_national_socialist_wing_desc:0 "The party's radicals have no use for bishops or syndicates. The nation is defined by blood, the state exists to serve it, and everything else is sentimentality."
 LATAM_the_corporations:0 "The Corporations"
 LATAM_the_corporations_desc:0 "Employers and workers in every industry are enrolled in a single chamber under a party official. Strikes are illegal, lockouts are illegal, and the party decides the wage."
 LATAM_faith_and_fatherland:0 "Faith and Fatherland"
 LATAM_faith_and_fatherland_desc:0 "Full churches, large families and a curriculum the universities cannot recognize."
 LATAM_the_vertical_syndicates:0 "The Vertical Syndicates"
 LATAM_the_vertical_syndicates_desc:0 "One syndicate per industry containing everyone in it, from the owner to the sweeper, presided over by the party. Industrial peace, absolutely guaranteed."
 LATAM_the_national_syndicalist_economy:0 "The National Syndicalist Economy"
 LATAM_the_national_syndicalist_economy_desc:0 "Private ownership, state direction and no unions worth the name. The industrialists keep their factories and discover they no longer decide what those factories make."
 LATAM_the_bloc_of_the_motherland:0 "The Bloc of the Motherland"
 LATAM_the_bloc_of_the_motherland_desc:0 "A brotherhood of nations bound by language, faith and a shared contempt for the Anglo-Saxon world. Madrid has been calling it Hispanidad since the thirties."
 LATAM_the_traditionalist_state:0 "The Traditionalist State"
 LATAM_the_traditionalist_state_desc:0 "Order, faith and the corporation, presented as the recovery of something older than the republic. It is, at least, more stable than the other wing intended."
 LATAM_the_cult_of_the_leader:0 "The Cult of the Leader"
 LATAM_the_cult_of_the_leader_desc:0 "His portrait in every classroom, his speeches broadcast at the same hour daily and his name spoken with an adjective attached. The state is now a man, and the man is not young."
 LATAM_the_party_above_the_state:0 "The Party Above the State"
 LATAM_the_party_above_the_state_desc:0 "Every ministry acquires a party commissar who outranks the minister. The civil service becomes a formality and administration a matter of loyalty."
 LATAM_laws_of_blood_and_nation:0 "Laws of Blood and Nation"
 LATAM_laws_of_blood_and_nation_desc:0 "Citizenship by descent, and hundreds of thousands of people made foreign in their own country."
 LATAM_total_mobilization:0 "Total Mobilization"
 LATAM_total_mobilization_desc:0 "Rationing, labour conscription and a war economy without a war."
 LATAM_the_armed_party:0 "The Armed Party"
 LATAM_the_armed_party_desc:0 "The militia becomes a second army, equipped from the state arsenals and answering to the party rather than the general staff. The officers understand exactly what this means."
 LATAM_the_totalitarian_state:0 "The Totalitarian State"
 LATAM_the_totalitarian_state_desc:0 "Nothing outside the state, nothing above the state, nothing against the state. The phrase is borrowed; the machinery is entirely our own."
 LATAM_a_new_order_for_the_continent:0 "A New Order for the Continent"
 LATAM_a_new_order_for_the_continent_desc:0 "The republic is gone, the borders are provisional and the general staff has been asked to update its plans. Our neighbours have noticed the request."

 # Pivot to the Past: Nationalist and fascist spirits
 LATAM_nationalist_movement:0 "The Nationalist Movement"
 LATAM_nationalist_movement_desc:0 "A movement of order and grievance, growing every month the crime figures are published."
 LATAM_the_conspiracy:0 "The Conspiracy"
 LATAM_the_conspiracy_desc:0 "Officers meeting after hours with lists and timetables. The government suspects and cannot prove it."
 LATAM_the_military_junta:0 "The Military Junta"
 LATAM_the_military_junta_desc:0 "Three officers govern by communiqué. The streets are quiet and the ministries are paralyzed."
 LATAM_the_military_junta2:0 "National Reorganization"
 LATAM_the_military_junta2_desc:0 "The junta has stopped calling itself provisional and started calling itself a process."
 LATAM_the_military_junta3:0 "Order and Progress"
 LATAM_the_military_junta3_desc:0 "A disciplined, obedient and internationally isolated country that works, after a fashion."
 LATAM_junta_rule:0 "Junta Rule"
 LATAM_junta_rule_desc:0 "Government by communiqué. Nobody argues, and nobody tells the junta when it is wrong."
 LATAM_state_of_siege:0 "The State of Siege"
 LATAM_state_of_siege_desc:0 "Curfew and censorship, renewed every ninety days for as long as necessary."
 LATAM_purged_universities:0 "Purged Universities"
 LATAM_purged_universities_desc:0 "Quiet campuses, dismissed faculties and a generation of graduates working abroad."
 LATAM_technocratic_ministry:0 "The Technocratic Ministry"
 LATAM_technocratic_ministry_desc:0 "Economists with foreign doctorates, governing without a congress to obstruct them."
 LATAM_investor_confidence:0 "Investor Confidence"
 LATAM_investor_confidence_desc:0 "Foreign capital approves of stability, whoever is providing it."
 LATAM_the_strong_government:0 "A Strong Government"
 LATAM_the_strong_government_desc:0 "Elected, decisive and steadily rewriting the rules that elected it."
 LATAM_the_strong_government2:0 "The Strong Presidency"
 LATAM_the_strong_government2_desc:0 "Decree powers and a court that agrees with them."
 LATAM_the_strong_government3:0 "The Authoritarian Republic"
 LATAM_the_strong_government3_desc:0 "Elections still happen. They no longer decide anything important."
 LATAM_law_and_order_party:0 "The Law and Order Party"
 LATAM_law_and_order_party_desc:0 "One promise, endlessly repeated, and a public that wants to believe it."
 LATAM_mandate_for_order:0 "A Mandate for Order"
 LATAM_mandate_for_order_desc:0 "Police on the streets and a public that has noticed the difference."
 LATAM_war_on_crime:0 "The War on Crime"
 LATAM_war_on_crime_desc:0 "Homicides are down in the districts that count and nobody audits the rest."
 LATAM_strong_presidency:0 "The Strong Presidency"
 LATAM_strong_presidency_desc:0 "A presidency that legislates, judges and stands for re-election as often as it likes."
 LATAM_fascist_movement:0 "The Movement"
 LATAM_fascist_movement_desc:0 "Uniformed columns in the provincial capitals, and an amused press that has stopped laughing."
 LATAM_fascist_government:0 "The New State"
 LATAM_fascist_government_desc:0 "The republic is abolished and the movement is the state. The world is cancelling contracts."
 LATAM_militarized_nation:0 "The Militarized Nation"
 LATAM_militarized_nation_desc:0 "Drill in the schools and uniforms in the ministries, paid for out of the shops."
 LATAM_falangist_government:0 "The Falangist State"
 LATAM_falangist_government_desc:0 "Corporations, church and fatherland, with the factories directed rather than owned."
 LATAM_falangist_government2:0 "The Traditionalist State"
 LATAM_falangist_government2_desc:0 "Order and faith, stable at home and unwelcome everywhere else."
 LATAM_falangist_government3:0 "The New Order"
 LATAM_falangist_government3_desc:0 "An armed, corporatist state with a war industry and a list of grievances against its neighbours."
 LATAM_national_socialist_government:0 "The National Socialist State"
 LATAM_national_socialist_government_desc:0 "Blood, party and army. The emigration is now a haemorrhage."
 LATAM_national_socialist_government2:0 "The Totalitarian State"
 LATAM_national_socialist_government2_desc:0 "Nothing outside the state. Our borders are the only thing anyone abroad still discusses with us."
 LATAM_national_socialist_government3:0 "A New Order for the Continent"
 LATAM_national_socialist_government3_desc:0 "A mobilized, isolated and heavily armed state that has stopped pretending it means to stay inside its borders."
 LATAM_corporate_economy:0 "The Corporate Economy"
 LATAM_corporate_economy_desc:0 "Owners keep their factories and take their orders from a party chamber."
 LATAM_vertical_syndicates:0 "The Vertical Syndicates"
 LATAM_vertical_syndicates_desc:0 "Industrial peace by statute. Nobody strikes and nobody innovates."
 LATAM_bloc_of_the_motherland:0 "The Bloc of the Motherland"
 LATAM_bloc_of_the_motherland_desc:0 "A brotherhood of like-minded states, bound by language and grievance."
 LATAM_cult_of_the_leader:0 "The Cult of the Leader"
 LATAM_cult_of_the_leader_desc:0 "His portrait in every classroom and his name in every sentence."
 LATAM_party_above_the_state:0 "The Party Above the State"
 LATAM_party_above_the_state_desc:0 "Commissars outrank ministers, and competence is a secondary qualification."

 # Pivot to the Past: Fundamentalism
 LATAM_the_great_revival:0 "The Great Revival"
 LATAM_the_great_revival_desc:0 "Forty years ago this was a Catholic country with a handful of storefront chapels. Today the pastors fill football stadiums, own television networks and count their congregations in the millions, and not one politician has worked out what to do about it."
 LATAM_the_prayer_networks:0 "The Prayer Networks"
 LATAM_the_prayer_networks_desc:0 "Cell groups in every neighbourhood, meeting in living rooms twice a week, led by people who know every family on the street. No party machine in the country's history has ever been organized this finely."
 LATAM_the_gospel_on_the_airwaves:0 "The Gospel on the Airwaves"
 LATAM_the_gospel_on_the_airwaves_desc:0 "Radio stations in every province and a satellite channel broadcasting eighteen hours a day. The message is salvation; the running theme is that the nation has been handed over to men who despise God."
 LATAM_the_moral_majority:0 "The Moral Majority"
 LATAM_the_moral_majority_desc:0 "The pastors announce, from the pulpit and on air, that the faithful will vote as a bloc. Eleven million people are listening, and the parties that laughed at them for thirty years begin returning their calls."
 LATAM_a_nation_under_god:0 "A Nation Under God"
 LATAM_a_nation_under_god_desc:0 "Elected, decisively, by congregations that turned out to the last member. The inauguration is held in a stadium and opens with two hours of worship before a word of politics is spoken."
 LATAM_the_ministry_of_the_faith:0 "The Ministry of the Faith"
 LATAM_the_ministry_of_the_faith_desc:0 "A ministry to oversee religious affairs, the schools, broadcasting and the family, staffed by men whose qualification is the pulpit rather than the university. It will decide what the nation is taught."
 LATAM_the_moral_law:0 "The Moral Law"
 LATAM_the_moral_law_desc:0 "Sin is a criminal category again, and the police have the statutes to prove it."
 LATAM_the_christian_schools:0 "The Christian Schools"
 LATAM_the_christian_schools_desc:0 "The national curriculum is rewritten: scripture in every year, creation taught beside biology and the moral instruction of the young treated as the state's first duty. The science faculties protest and are ignored."
 LATAM_the_family_charter:0 "The Family Charter"
 LATAM_the_family_charter_desc:0 "Marriage bonuses and child allowances, and a legal definition that excludes a great many households."
 LATAM_against_the_red_priests:0 "Against the Red Priests"
 LATAM_against_the_red_priests_desc:0 "Liberation theology is finished, and so are a number of the priests who preached it."
 LATAM_the_rule_of_the_righteous:0 "The Rule of the Righteous"
 LATAM_the_rule_of_the_righteous_desc:0 "Elections are suspended, because a nation that has recognized God's law has nothing left to vote about. The pastors who won power by the ballot now explain, at length, why it is no longer required."
 LATAM_the_war_on_vice:0 "The War on Vice"
 LATAM_the_war_on_vice_desc:0 "Quiet streets, closed bars and a great many informers."
 LATAM_the_missionary_frontier:0 "The Missionary Frontier"
 LATAM_the_missionary_frontier_desc:0 "Missions in the interior doing what no ministry ever managed, on their own terms."
 LATAM_the_defenders_of_the_faith:0 "The Defenders of the Faith"
 LATAM_the_defenders_of_the_faith_desc:0 "A volunteer guard raised from the congregations, drilled after services and answerable to the ministry rather than the general staff. Devoted, numerous and militarily amateur."
 LATAM_the_holy_alliance:0 "The Holy Alliance"
 LATAM_the_holy_alliance_desc:0 "Warm relations with the godly abroad, and cold ones with everyone else."
 LATAM_the_new_crusade:0 "The New Crusade"
 LATAM_the_new_crusade_desc:0 "Foreign policy conducted as a religious obligation, and a general staff asked to plan accordingly."
 LATAM_the_kingdom_on_earth:0 "The Kingdom on Earth"
 LATAM_the_kingdom_on_earth_desc:0 "A state that governs in God's name, answerable to no electorate and increasingly to no treaty. Its people are devout, numerous and willing to march; its universities are empty and its embassies are closing."

 # Pivot to the Past: Fundamentalist spirits
 LATAM_the_revival:0 "The Great Revival"
 LATAM_the_revival_desc:0 "The congregations are growing faster than the parties, and they have begun to notice their own weight."
 LATAM_the_electronic_church:0 "The Electronic Church"
 LATAM_the_electronic_church_desc:0 "Television, radio and satellite, preaching salvation and politics in the same sentence."
 LATAM_the_godly_government:0 "A Nation Under God"
 LATAM_the_godly_government_desc:0 "A devout government, large families and a scientific establishment in flight."
 LATAM_the_godly_government2:0 "The Rule of the Righteous"
 LATAM_the_godly_government2_desc:0 "Elections are gone and the ministry decides what is taught, printed and permitted."
 LATAM_the_godly_government3:0 "The Kingdom on Earth"
 LATAM_the_godly_government3_desc:0 "A theocracy with a growing population, a willing army and almost no one left abroad who will deal with it."
 LATAM_ministry_of_the_faith:0 "The Ministry of the Faith"
 LATAM_ministry_of_the_faith_desc:0 "Pastors administer the schools, the airwaves and the family courts."
 LATAM_christian_schools:0 "The Christian Schools"
 LATAM_christian_schools_desc:0 "Scripture in every year and biology in retreat. The universities are losing their intake."
 LATAM_defenders_of_the_faith:0 "The Defenders of the Faith"
 LATAM_defenders_of_the_faith_desc:0 "A volunteer guard raised from the pews: devoted, numerous and barely trained."

 # Foreign policy
 LATAM_a_place_in_the_world:0 "A Place in the World"
 LATAM_a_place_in_the_world_desc:0 "We are too small to set the terms and too large to be ignored, which is the most uncomfortable size a country can be. The century will be spent deciding whose telephone calls we take first."
 LATAM_review_our_alignments:0 "Review Our Alignments"
 LATAM_review_our_alignments_desc:0 "The foreign ministry produces a paper nobody has asked for in twenty years: who buys from us, who sells to us, who would defend us, and what each of them would want in return."
 LATAM_look_north:0 "Look North"
 LATAM_look_north_desc:0 "Washington is the largest market, the deepest arms supplier and the neighbour whose marines have landed in this hemisphere more times than anyone cares to count. There are worse things than being useful to it."
 LATAM_the_security_agreement:0 "The Security Agreement"
 LATAM_the_security_agreement_desc:0 "Joint exercises, an officer exchange and a training mission that arrives with equipment. The general staff is delighted and the foreign ministry is drafting a careful clause about sovereignty."
 LATAM_join_the_western_alliance:0 "Join the Western Alliance"
 LATAM_join_the_western_alliance_desc:0 "Full membership, mutual defence and a seat at a table where we will rarely speak first. Our security is guaranteed by somebody else, which is both the benefit and the entire objection."
 LATAM_partners_not_allies:0 "Partners, Not Allies"
 LATAM_partners_not_allies_desc:0 "Trade, training and intelligence, without a mutual defence clause that could drag us into a war on another continent. Washington finds this frustrating and accepts it."
 LATAM_look_to_europe:0 "Look to Europe"
 LATAM_look_to_europe_desc:0 "Europe buys our beef and our soy, lectures us about our courts and pays for our roads. It is the least dangerous of the great powers to be close to, largely because it is the least capable of intervening."
 LATAM_align_with_european_standards:0 "Align with European Standards"
 LATAM_align_with_european_standards_desc:0 "Food safety, environmental rules, procurement law and a thousand technical annexes. Our exporters complain for two years and then discover their goods clear customs anywhere on earth."
 LATAM_full_alignment_with_europe:0 "Full Alignment with Europe"
 LATAM_full_alignment_with_europe_desc:0 "Institutional membership in everything Brussels will admit us to, with the regulations and the development funds that come with it. Our sovereignty is pooled; our roads are excellent."
 LATAM_the_association_agreement:0 "The Association Agreement"
 LATAM_the_association_agreement_desc:0 "Trade, investment and cooperation, without the political obligations. Europe would prefer we joined properly; Europe will sign anyway."
 LATAM_look_to_beijing:0 "Look to Beijing"
 LATAM_look_to_beijing_desc:0 "Beijing wants our copper, our soy and our iron, will pay above the market for all three and asks nothing whatsoever about our judiciary. No great power has ever made us an offer this simple."
 LATAM_the_infrastructure_loans:0 "The Infrastructure Loans"
 LATAM_the_infrastructure_loans_desc:0 "Ports, railways and highways, built fast by Chinese contractors and financed by Chinese banks at rates our finance ministry cannot quite believe. The repayment schedule is somebody else's problem."
 LATAM_join_the_eastern_bloc:0 "Join the Eastern Bloc"
 LATAM_join_the_eastern_bloc_desc:0 "Formal alignment with Beijing: defence cooperation, coordinated votes and a hemisphere that suddenly finds our capital very interesting. Washington will make its displeasure known within the week."
 LATAM_a_commercial_partnership:0 "A Commercial Partnership"
 LATAM_a_commercial_partnership_desc:0 "Trade, investment and infrastructure, without a word about alliances. We sell, they buy, and both foreign ministries keep the meetings short."
 LATAM_look_to_moscow:0 "Look to Moscow"
 LATAM_look_to_moscow_desc:0 "Moscow sells the weapons nobody else will sell us, at prices nobody else will match, and asks only that we vote with them occasionally. The State Department has already noticed the delegation's flight number."
 LATAM_arms_and_energy:0 "Arms and Energy"
 LATAM_arms_and_energy_desc:0 "Fighters, helicopters and a nuclear cooperation agreement carefully described as civilian. The contracts are signed in a week; the spare parts will take rather longer."
 LATAM_join_the_eastern_alliance:0 "Join the Eastern Alliance"
 LATAM_join_the_eastern_alliance_desc:0 "A defence treaty with Moscow and a permanent place on the wrong side of every Western ledger. What we get in return is the certainty that nobody will invade us twice."
 LATAM_a_strategic_partnership:0 "A Strategic Partnership"
 LATAM_a_strategic_partnership_desc:0 "Arms, energy and diplomatic cover, without a treaty obligation. Moscow calls it strategic; our ambassadors call it deniable."
 LATAM_look_to_our_neighbours:0 "Look to Our Neighbours"
 LATAM_look_to_our_neighbours_desc:0 "The great powers are distant, distracted and interested in us only when a commodity price moves. Our neighbours are permanent. Perhaps the answer has been next door for two centuries."
 LATAM_the_common_external_tariff:0 "The Common External Tariff"
 LATAM_the_common_external_tariff_desc:0 "One tariff wall around the bloc and none inside it. The industries that survive the second part will be exporting through the first."
 LATAM_the_customs_union:0 "The Customs Union"
 LATAM_the_customs_union_desc:0 "One tariff outward, none inward, and a bloc that negotiates as a single voice."
 LATAM_a_common_market:0 "A Common Market"
 LATAM_a_common_market_desc:0 "Capital and workers move as freely as goods. Our cities fill with neighbours looking for work, and our own graduates leave for theirs."

 # Foreign policy spirits
 LATAM_american_partnership:0 "American Partnership"
 LATAM_american_partnership_desc:0 "Training, technology and market access, with an embassy that expects to be consulted."
 LATAM_the_western_alliance:0 "The Western Alliance"
 LATAM_the_western_alliance_desc:0 "Mutual defence, shared doctrine and a foreign policy written substantially in another capital."
 LATAM_the_american_partnership_neutral:0 "Partners, Not Allies"
 LATAM_the_american_partnership_neutral_desc:0 "The benefits of Washington's friendship without the mutual defence clause."
 LATAM_european_association:0 "European Association"
 LATAM_european_association_desc:0 "Development funds and technical standards, and an industry adjusting painfully to both."
 LATAM_european_alignment:0 "European Alignment"
 LATAM_european_alignment_desc:0 "Regulations, subsidies and institutions. Excellent roads, and an army nobody expects to use."
 LATAM_european_association_neutral:0 "The Association Agreement"
 LATAM_european_association_neutral_desc:0 "Trade and investment with Brussels, and no obligations attached to either."
 LATAM_chinese_partnership:0 "Chinese Partnership"
 LATAM_chinese_partnership_desc:0 "Beijing buys everything we dig up and builds the railways to move it. Our factories cannot compete with what comes back."
 LATAM_the_eastern_bloc:0 "The Eastern Bloc"
 LATAM_the_eastern_bloc_desc:0 "Formal alignment with Beijing: capital, infrastructure and a very cold season with the West."
 LATAM_chinese_partnership_neutral:0 "A Commercial Partnership"
 LATAM_chinese_partnership_neutral_desc:0 "Commodities out, capital in, and no alliance in either direction."
 LATAM_russian_partnership:0 "Russian Partnership"
 LATAM_russian_partnership_desc:0 "Cheap fuel, cheap weapons and a Western press that has started calling us a concern."
 LATAM_the_eastern_alliance:0 "The Eastern Alliance"
 LATAM_the_eastern_alliance_desc:0 "A defence treaty with Moscow, and an economy cut off from half the world's markets."
 LATAM_russian_partnership_neutral:0 "A Strategic Partnership"
 LATAM_russian_partnership_neutral_desc:0 "Arms and energy from Moscow, without a signature committing us to anything."
 LATAM_free_movement:0 "Free Movement"
 LATAM_free_movement_desc:0 "Workers cross the borders both ways. The cities are fuller and the wage bill is lower."
