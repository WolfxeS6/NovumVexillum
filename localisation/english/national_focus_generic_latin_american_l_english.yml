l_english:
# Generic Latin American Focus Tree

 # Economy
 LATAM_national_development_plan:0 "National Development Plan"
 LATAM_national_development_plan_desc:0 "The new millennium demands a clear vision for our nation's growth. A national development plan will coordinate public investment in the infrastructure our economy needs."
 LATAM_highway_investment_initiative:0 "Highway Investment Initiative"
 LATAM_highway_investment_initiative_desc:0 "Much of our interior is still connected by little more than dirt roads. Modern highways will bind our regions together and open new markets for our producers."
 LATAM_railway_modernization_program:0 "Railway Modernization Program"
 LATAM_railway_modernization_program_desc:0 "Our railways, many of them built a century ago, have been left to decay. Modernizing the network will cut transport costs and revive freight across the country."
 LATAM_expanding_the_merchant_fleet:0 "Expanding the Merchant Fleet"
 LATAM_expanding_the_merchant_fleet_desc:0 "Most of our trade leaves by sea, yet it travels under foreign flags. A national merchant fleet will keep more of that wealth at home."
 LATAM_digital_infrastructure_initiative:0 "Digital Infrastructure Initiative"
 LATAM_digital_infrastructure_initiative_desc:0 "The information age has arrived, and we cannot afford to be left behind. Expanding telecommunications and internet access will connect our people and businesses to the world."
 LATAM_subsidize_resource_industry:0 "Subsidize the Resource Industry"
 LATAM_subsidize_resource_industry_desc:0 "Our natural wealth is the foundation of the economy. Targeted subsidies will help our extractive industries modernize and expand their output."
 LATAM_industrial_investments:0 "Industrial Investments"
 LATAM_industrial_investments_desc:0 "Public investment in new factories will lay the groundwork for an industrial base capable of competing on the global market."
 LATAM_expand_the_capital_university:0 "Expand the [ROOT.capital.GetCapitalVictoryPointName] University"
 LATAM_expand_the_capital_university_desc:0 "Our national university in [ROOT.capital.GetCapitalVictoryPointName] has trained generations of leaders, but it can no longer meet demand. Expanding its campus and faculties will prepare the professionals of tomorrow."
 LATAM_subsidize_domestic_industry:0 "Subsidize Domestic Industry"
 LATAM_subsidize_domestic_industry_desc:0 "Local manufacturers struggle to compete against cheap imports. Subsidies will give them the breathing room they need to grow."
 LATAM_expand_recycling_plants:0 "Expand Recycling Plants"
 LATAM_expand_recycling_plants_desc:0 "Recovering materials from waste is both cleaner and cheaper than importing them. New recycling plants will ease the strain on our resources."
 LATAM_import_substitution_policies:0 "Import Substitution Policies"
 LATAM_import_substitution_policies_desc:0 "Why should we buy abroad what we can produce at home? By protecting our industries, we can replace foreign imports with national products."
 LATAM_made_in_nation:0 "Made in [ROOT.GetName]"
 LATAM_made_in_nation_desc:0 "Products bearing our national mark should be a source of pride, not a curiosity. We will promote domestic brands at home and abroad."
 LATAM_heavy_industry_development:0 "Heavy Industry Development"
 LATAM_heavy_industry_development_desc:0 "Steel, chemicals and machinery are the backbone of any industrial nation. We will invest in the heavy industries the rest of the economy depends on."
 LATAM_industrial_self_suficiency:0 "Industrial Self-Sufficiency"
 LATAM_industrial_self_suficiency_desc:0 "Past crises have shown how vulnerable we are to shocks abroad. An economy that can supply its own needs will not be held hostage by foreign markets."
 LATAM_industrial_subsidizing:0 "Industrial Subsidizing"
 LATAM_industrial_subsidizing_desc:0 "Continued state support will keep our industrial sector growing until it can stand on its own."
 LATAM_create_the_national_industrial_park:0 "Create the [ROOT.capital.GetCapitalVictoryPointName] Industrial Park"
 LATAM_create_the_national_industrial_park_desc:0 "Concentrating factories, suppliers and infrastructure in a single industrial park located in [ROOT.capital.GetCapitalVictoryPointName] will make our industry more efficient and attract new investment."
 LATAM_increase_education_funding:0 "Increase Education Funding"
 LATAM_increase_education_funding_desc:0 "A modern economy needs a skilled workforce. Greater funding for our schools and universities will pay dividends for generations."
 LATAM_resource_based_economy:0 "Resource-Based Economy"
 LATAM_resource_based_economy_desc:0 "Rather than fight our strengths, we will build on them. Our mines, oil fields and farms will drive the nation's prosperity."
 LATAM_expand_the_iron_mines:0 "Expand the Iron Mines"
 LATAM_expand_the_iron_mines_desc:0 "Global demand for iron ore is rising. Expanding our mines will supply our own industry and bring in valuable export revenue."
 LATAM_divert_steel_to_arms_industry:0 "Divert Steel to the Arms Industry"
 LATAM_divert_steel_to_arms_industry_desc:0 "A share of our steel production will be reserved for national arms manufacturers, reducing our dependence on foreign weapons."
 LATAM_invest_in_refineries:0 "Invest in Refineries"
 LATAM_invest_in_refineries_desc:0 "We export crude oil only to buy it back refined at a premium. New refineries will put an end to this absurdity."
 LATAM_agricultural_subsidies:0 "Agricultural Subsidies"
 LATAM_agricultural_subsidies_desc:0 "Our farmers feed the nation and fill our export ledgers. Supporting them will keep the countryside prosperous and stable."
 LATAM_land_redistribution:0 "Land Redistribution"
 LATAM_land_redistribution_desc:0 "Vast estates lie idle while rural families have no land to work. Redistributing it will put more land into production and ease centuries-old grievances."
 LATAM_invest_in_the_gold_industry:0 "Invest in the Gold Industry"
 LATAM_invest_in_the_gold_industry_desc:0 "Gold remains a safe haven in uncertain times. Investing in modern mining will turn our deposits into a steady source of revenue."
 LATAM_resource_export_boom:0 "Resource Export Boom"
 LATAM_resource_export_boom_desc:0 "With commodity prices climbing, the world is hungry for what we produce. We will ride this boom for as long as it lasts."
 LATAM_national_century:0 "The [ROOT.GetAdjective] Century"
 LATAM_national_century_desc:0 "The twentieth century was one of unfulfilled promises. The twenty-first will belong to us."
 LATAM_debate_the_economic_model:0 "Debate the Economic Model"
 LATAM_debate_the_economic_model_desc:0 "The reforms of the 1990s left deep divisions over the role of the state in the economy. The time has come to decide which path we will follow."
 LATAM_mixed_market:0 "Mixed Market"
 LATAM_mixed_market_desc:0 "Neither the state nor the market alone holds every answer. A balanced approach will combine public planning with private initiative."
 LATAM_public_private_partnership:0 "Public-Private Partnerships"
 LATAM_public_private_partnership_desc:0 "By sharing the costs and risks of large projects with private investors, we can build far more than the state could alone."
 LATAM_strategic_industrial_investments:0 "Strategic Industrial Investments"
 LATAM_strategic_industrial_investments_desc:0 "The state will direct investment toward the sectors most vital to our long-term development."
 LATAM_balanced_economic_regulations:0 "Balanced Economic Regulations"
 LATAM_balanced_economic_regulations_desc:0 "Sensible regulations will protect workers and consumers without stifling enterprise."
 LATAM_sustainable_economic_growth:0 "Sustainable Economic Growth"
 LATAM_sustainable_economic_growth_desc:0 "Growth that exhausts our resources or our people is no growth at all. We will pursue a prosperity that lasts."
 LATAM_state_market:0 "State-Led Economy"
 LATAM_state_market_desc:0 "Our key industries are too important to be left in foreign hands. The state will take the lead in directing the economy."
 LATAM_automotive_manufacturing:0 "Automotive Manufacturing"
 LATAM_automotive_manufacturing_desc:0 "A national automotive industry will create jobs, develop our suppliers and put vehicles built at home on our roads."
 LATAM_fund_electronics_industry:0 "Fund the Electronics Industry"
 LATAM_fund_electronics_industry_desc:0 "Electronics are the foundation of the modern economy. State funding will allow us to build a domestic sector from the ground up."
 LATAM_modern_industrial_economy:0 "Modern Industrial Economy"
 LATAM_modern_industrial_economy_desc:0 "Our state-led efforts have transformed the economy. We now stand as a modern industrial nation."
 LATAM_national_industrial_powerhouse:0 "National Industrial Powerhouse"
 LATAM_national_industrial_powerhouse_desc:0 "Our factories now rival those of the developed world. [ROOT.GetName] has become an industrial power in its own right."
 LATAM_free_market:0 "Free Market"
 LATAM_free_market_desc:0 "The market, not the state, is best suited to allocate our resources. We will open our economy and let private enterprise flourish."
 LATAM_market_liberalization_reforms:0 "Market Liberalization Reforms"
 LATAM_market_liberalization_reforms_desc:0 "Tariffs, price controls and red tape hold our economy back. Sweeping reforms will unleash private investment."
 LATAM_privatize_state_industries:0 "Privatize State Industries"
 LATAM_privatize_state_industries_desc:0 "Inefficient state companies are a drain on the treasury. Selling them to private investors will raise funds and improve their management."
 LATAM_competitive_private_sector:0 "Competitive Private Sector"
 LATAM_competitive_private_sector_desc:0 "Competition drives innovation. A dynamic private sector will make our industries more productive than ever."
 LATAM_financial_hub_of_the_americas:0 "Financial Hub of the Americas"
 LATAM_financial_hub_of_the_americas_desc:0 "With stable institutions and open markets, our capital can become the region's center for banking and investment."
 LATAM_economic_miracle:0 "Economic Miracle"
 LATAM_economic_miracle_desc:0 "Whatever path we chose, the results speak for themselves. The world now speaks of the [ROOT.GetAdjective] economic miracle."

 # Army
 LATAM_modernize_the_armed_forces:0 "Modernize the Armed Forces"
 LATAM_modernize_the_armed_forces_desc:0 "Much of our equipment and organization dates back to the Cold War. Bringing our military into the twenty-first century is long overdue."
 LATAM_professionalize_the_officer_corps:0 "Professionalize the Officer Corps"
 LATAM_professionalize_the_officer_corps_desc:0 "Our officers must serve the nation, not political factions. A professional, well-educated officer corps is the foundation of any modern army."
 LATAM_the_national_armed_forces:0 "The National Armed Forces"
 LATAM_the_national_armed_forces_desc:0 "With reform underway, we must decide what kind of military our nation needs, and how it will face the threats of a new century."
 LATAM_modernize_our_command_structure:0 "Modernize Our Command Structure"
 LATAM_modernize_our_command_structure_desc:0 "Outdated chains of command slow down every decision. A streamlined structure will let our commanders react to events as they happen."
 LATAM_expand_training_programs:0 "Expand Training Programs"
 LATAM_expand_training_programs_desc:0 "Well-trained soldiers are worth more than any equipment. New programs and exchanges with foreign militaries will raise the standard of our troops."
 LATAM_logistics_modernization:0 "Logistics Modernization"
 LATAM_logistics_modernization_desc:0 "An army marches on its supply lines. Modern logistics will ensure our troops are fed, fueled and armed wherever they are deployed."
 LATAM_joint_operations_command:0 "Joint Operations Command"
 LATAM_joint_operations_command_desc:0 "Our army, navy and air force have long operated in isolation. A joint command will coordinate them as a single fighting force."
 LATAM_conventional_warfare_doctrine:0 "Conventional Warfare Doctrine"
 LATAM_conventional_warfare_doctrine_desc:0 "Our neighbors have not forgotten old border disputes, and neither have we. A strong conventional army built around armor and artillery is the surest deterrent."
 LATAM_armored_spearheads:0 "Armored Spearheads"
 LATAM_armored_spearheads_desc:0 "Modern tanks, even if bought second-hand, will give our army the striking power to break through any defensive line."
 LATAM_combined_arms_integrations:0 "Combined Arms Integration"
 LATAM_combined_arms_integrations_desc:0 "Tanks, infantry and artillery are at their most effective when they fight as one. We will reorganize our formations around combined arms."
 LATAM_mechanized_warfare_training:0 "Mechanized Warfare Training"
 LATAM_mechanized_warfare_training_desc:0 "Infantry riding in armored vehicles can keep pace with our tanks. We will train our troops to fight from and alongside them."
 LATAM_fire_superiority:0 "Fire Superiority"
 LATAM_fire_superiority_desc:0 "Whoever brings the most firepower to bear decides the battle. Modern artillery will give us that edge."
 LATAM_modern_battlefield_coordination:0 "Modern Battlefield Coordination"
 LATAM_modern_battlefield_coordination_desc:0 "On the modern battlefield, reconnaissance, communications and air support must work together seamlessly."
 LATAM_regional_military_powerhouse:0 "Regional Military Powerhouse"
 LATAM_regional_military_powerhouse_desc:0 "Our armed forces are now among the most capable in Latin America. No neighbor will dare to test our resolve."
 LATAM_asymmetric_warfare_doctrine:0 "Asymmetric Warfare Doctrine"
 LATAM_asymmetric_warfare_doctrine_desc:0 "We cannot match the great powers tank for tank. Instead, we will fight on our own terms, using our terrain and our people to wear down any enemy."
 LATAM_decentralized_command_structure:0 "Decentralized Command Structure"
 LATAM_decentralized_command_structure_desc:0 "Small units operating far from headquarters must be able to act on their own initiative. We will give our junior officers the authority to do so."
 LATAM_counterinsurgency_operations:0 "Counterinsurgency Operations"
 LATAM_counterinsurgency_operations_desc:0 "Armed groups and drug cartels challenge the authority of the state within our own borders. Our army must be ready to restore order and win back the population."
 LATAM_jungle_and_riverine_units:0 "Jungle and Riverine Units"
 LATAM_jungle_and_riverine_units_desc:0 "Insurgents hide where roads do not reach. Specialized units able to operate in dense jungle and along our rivers will deny them any safe haven."
 LATAM_guerilla_warfare_training:0 "Guerrilla Warfare Training"
 LATAM_guerilla_warfare_training_desc:0 "Should an invader ever cross our borders, every hill and forest must become a battlefield. We will train our soldiers to fight as guerrillas."
 LATAM_protracted_warfare_doctrine:0 "Protracted Warfare Doctrine"
 LATAM_protracted_warfare_doctrine_desc:0 "An enemy may take our cities, but they will never take the nation. We will prepare to fight for as long as it takes."
 LATAM_rapid_response_doctrine:0 "Rapid Response Doctrine"
 LATAM_rapid_response_doctrine_desc:0 "Crises in the modern world break out with little warning. A smaller, highly mobile force able to deploy anywhere within days will serve us better than a large standing army."
 LATAM_air_mobile_operations:0 "Air Mobile Operations"
 LATAM_air_mobile_operations_desc:0 "Helicopters can carry our troops over jungles, mountains and rivers in a matter of hours. We will build up our capacity for air mobile operations."
 LATAM_integrated_support_units:0 "Integrated Support Units"
 LATAM_integrated_support_units_desc:0 "Fast-moving forces cannot wait for their supplies to catch up. We will integrate engineers, medics and logistics directly into our frontline units."
 LATAM_rapid_reaction_forces:0 "Rapid Reaction Forces"
 LATAM_rapid_reaction_forces_desc:0 "We will form dedicated brigades kept at constant readiness, able to respond to any crisis at home or abroad."
 LATAM_elite_commando_units:0 "Elite Commando Units"
 LATAM_elite_commando_units_desc:0 "Small teams of highly trained operators can achieve what entire battalions cannot. We will expand and professionalize our special forces."
 LATAM_precision_strike_coordination:0 "Precision Strike Coordination"
 LATAM_precision_strike_coordination_desc:0 "Accurate air and artillery strikes called in by forward units will let our small forces hit far above their weight."
 LATAM_modern_armed_forces:0 "Modern Armed Forces"
 LATAM_modern_armed_forces_desc:0 "The reforms are complete. Our armed forces stand ready to defend the nation in the twenty-first century."

 # Air Force
 LATAM_modernize_the_air_force:0 "Modernize the Air Force"
 LATAM_modernize_the_air_force_desc:0 "Our air force still flies jets designed during the Cold War, many of them older than their pilots. Replacing them is no longer optional."
 LATAM_air_force_academy_reform:0 "Air Force Academy Reform"
 LATAM_air_force_academy_reform_desc:0 "A modern aircraft is worthless without a pilot who knows how to fly it. More flight hours and a reformed academy will give us the aviators we need."
 LATAM_american_aircraft_suppliers:0 "American Aircraft Suppliers"
 LATAM_american_aircraft_suppliers_desc:0 "American jets are the best money can buy, and Washington is eager to arm its friends in the hemisphere. The price, however, is not only paid in dollars."
 LATAM_european_aircraft_suppliers:0 "European Aircraft Suppliers"
 LATAM_european_aircraft_suppliers_desc:0 "French, Swedish and Israeli manufacturers offer capable aircraft with fewer political strings attached than our northern neighbor."
 LATAM_russian_aircraft_suppliers:0 "Russian Aircraft Suppliers"
 LATAM_russian_aircraft_suppliers_desc:0 "Moscow sells powerful fighters at a fraction of the Western price, and asks few questions. Washington will not be pleased."
 LATAM_domestic_aviation_industry:0 "Domestic Aviation Industry"
 LATAM_domestic_aviation_industry_desc:0 "Why depend on foreign suppliers at all? With our industrial base maturing, we can design and build aircraft of our own."
 LATAM_air_force_procurement_plan:0 "Air Force Procurement Plan"
 LATAM_air_force_procurement_plan_desc:0 "With our suppliers secured, a long-term procurement plan will decide where every peso of the air force budget is spent."
 LATAM_multirole_fighters:0 "Multirole Fighters"
 LATAM_multirole_fighters_desc:0 "We cannot afford specialized aircraft for every mission. A single multirole fighter able to intercept, strike and patrol will form the backbone of our air force."
 LATAM_beyond_visual_range_missiles:0 "Beyond Visual Range Missiles"
 LATAM_beyond_visual_range_missiles_desc:0 "Modern air combat is decided long before pilots see each other. Beyond visual range missiles will let our fighters strike first."
 LATAM_aerial_refueling:0 "Aerial Refueling"
 LATAM_aerial_refueling_desc:0 "Our territory is vast and our fighters' range is limited. Tanker aircraft will allow them to reach any corner of the nation and beyond."
 LATAM_light_attack_aircraft:0 "Light Attack Aircraft"
 LATAM_light_attack_aircraft_desc:0 "Rugged turboprops cost a fraction of a jet to buy and operate, yet they are ideal for hunting insurgents from remote airstrips."
 LATAM_air_bridge_denial:0 "Air Bridge Denial"
 LATAM_air_bridge_denial_desc:0 "Drug traffickers fly their cargo across our skies with impunity. Intercepting these flights will strike at the heart of their operations."
 LATAM_close_air_support_integration:0 "Close Air Support Integration"
 LATAM_close_air_support_integration_desc:0 "Our pilots and ground troops must learn to fight together. Forward air controllers will call in strikes exactly where they are needed."
 LATAM_integrated_air_defense:0 "Integrated Air Defense"
 LATAM_integrated_air_defense_desc:0 "An air force alone cannot guard our skies. Linking our fighters, radars and anti-air batteries into a single network will leave no gap for an enemy to exploit."
 LATAM_airspace_surveillance_network:0 "Airspace Surveillance Network"
 LATAM_airspace_surveillance_network_desc:0 "Huge stretches of our airspace go unwatched, especially over the jungle and our borders. A national radar network will change that."
 LATAM_airborne_early_warning:0 "Airborne Early Warning"
 LATAM_airborne_early_warning_desc:0 "Radar aircraft can see far beyond the horizon, giving our fighters precious minutes of warning before any threat arrives."
 LATAM_unmanned_aerial_vehicles:0 "Unmanned Aerial Vehicles"
 LATAM_unmanned_aerial_vehicles_desc:0 "Drones can watch our borders for hours on end without risking a single pilot. They are the future of military aviation, and we intend to be part of it."
 LATAM_strategic_airlift:0 "Strategic Airlift"
 LATAM_strategic_airlift_desc:0 "Transport aircraft will allow us to move troops and supplies across the country in hours rather than days."
 LATAM_humanitarian_air_operations:0 "Humanitarian Air Operations"
 LATAM_humanitarian_air_operations_desc:0 "Earthquakes, floods and hurricanes strike our region all too often. An air force ready to deliver aid will save lives and win the gratitude of our people."
 LATAM_maritime_patrol:0 "Maritime Patrol"
 LATAM_maritime_patrol_desc:0 "Our territorial waters hold fisheries and resources others would gladly take. Patrol aircraft will keep watch over our coasts and sea lanes."
 LATAM_guardians_of_the_skies:0 "Guardians of the Skies"
 LATAM_guardians_of_the_skies_desc:0 "Our air force has been reborn. From the mountains to the coast, no intruder will cross our skies unchallenged."

 # National Spirits (keys shared with a focus of the same name use that focus' localisation)
 LATAM_education_funding:0 "Education Funding"
 LATAM_education_funding_desc:0 "Greater investment in education is producing a more skilled workforce, though it places a strain on the budget."
 LATAM_oil_boom:0 "Oil Boom"
 LATAM_oil_boom_desc:0 "Rising oil prices have filled the treasury, and every new well brings in more revenue."
 LATAM_gold_trade:0 "Gold Trade"
 LATAM_gold_trade_desc:0 "Gold exports provide the state with a steady stream of revenue."
 LATAM_resource_based_economy2:0 "Resource-Based Economy"
 LATAM_resource_based_economy2_desc:0 "Our mines, oil fields and farms have become the engine of national prosperity."
 LATAM_mixed_market2:0 "Mixed Market"
 LATAM_mixed_market2_desc:0 "Public-private partnerships are bringing new investment into our infrastructure."
 LATAM_mixed_market3:0 "Mixed Market"
 LATAM_mixed_market3_desc:0 "Strategic state investment is strengthening our key industries."
 LATAM_mixed_market4:0 "Mixed Market"
 LATAM_mixed_market4_desc:0 "Balanced regulations keep our economy both fair and competitive."
 LATAM_mixed_market5:0 "Mixed Market"
 LATAM_mixed_market5_desc:0 "Our balanced economic model has delivered steady and sustainable growth."
 LATAM_subsidized_electronics_sector:0 "Subsidized Electronics Sector"
 LATAM_subsidized_electronics_sector_desc:0 "State funding is fostering a domestic electronics industry and the research behind it."
 LATAM_state_market1:0 "State-Led Economy"
 LATAM_state_market1_desc:0 "State investment in automotive manufacturing is building a modern industrial base."
 LATAM_state_market2:0 "State-Led Economy"
 LATAM_state_market2_desc:0 "Under state direction, our nation has become a modern industrial economy."
 LATAM_free_market1:0 "Free Market"
 LATAM_free_market1_desc:0 "Liberalization reforms have opened our economy to private investment."
 LATAM_free_market2:0 "Free Market"
 LATAM_free_market2_desc:0 "Open markets and stable institutions have made us a regional financial hub."
 LATAM_modern_officer_corps:0 "Modern Officer Corps"
 LATAM_modern_officer_corps_desc:0 "Our officers are trained professionals, loyal to the constitution rather than to any political faction."
 LATAM_modern_officer_corps2:0 "Modern Officer Corps"
 LATAM_modern_officer_corps2_desc:0 "A streamlined command structure allows our officers to plan and act more quickly."
 LATAM_modern_officer_corps3:0 "Joint Command"
 LATAM_modern_officer_corps3_desc:0 "Our army, navy and air force now plan and fight under a unified command."
 LATAM_armed_forces_modernization:0 "Armed Forces Modernization"
 LATAM_armed_forces_modernization_desc:0 "New equipment and training methods are gradually transforming our military."
 LATAM_armed_forces_modernization2:0 "Modernized Armed Forces"
 LATAM_armed_forces_modernization2_desc:0 "Our armed forces are fully modernized and among the best prepared in the region."
 LATAM_expanded_training_programs:0 "Expanded Training Programs"
 LATAM_expanded_training_programs_desc:0 "New programs are producing better-trained soldiers in less time."
 LATAM_modern_logistics:0 "Modern Logistics"
 LATAM_modern_logistics_desc:0 "An efficient logistics network keeps our troops supplied wherever they are deployed."
 LATAM_conventional_doctrine:0 "Conventional Doctrine"
 LATAM_conventional_doctrine_desc:0 "Our army is organized to win decisive battles through firepower and maneuver."
 LATAM_conventional_doctrine2:0 "Combined Arms Doctrine"
 LATAM_conventional_doctrine2_desc:0 "Tanks, infantry and artillery now train and fight as integrated formations."
 LATAM_conventional_doctrine3:0 "Regional Military Power"
 LATAM_conventional_doctrine3_desc:0 "Our conventional forces are now the strongest in the region."
 LATAM_asymmetric_doctrine:0 "Asymmetric Doctrine"
 LATAM_asymmetric_doctrine_desc:0 "Our army is prepared to trade space for time and turn the terrain against any invader."
 LATAM_asymmetric_doctrine2:0 "Decentralized Command"
 LATAM_asymmetric_doctrine2_desc:0 "Our small units act on their own initiative and can keep fighting even when cut off."
 LATAM_counterinsurgency_doctrine:0 "Counterinsurgency Doctrine"
 LATAM_counterinsurgency_doctrine_desc:0 "Our forces are trained to root out armed groups while winning over the local population."
 LATAM_counterinsurgency_doctrine2:0 "Jungle Warfare Specialists"
 LATAM_counterinsurgency_doctrine2_desc:0 "Our specialized units can pursue insurgents deep into the jungle and along remote rivers."
 LATAM_peoples_war_doctrine:0 "People's War"
 LATAM_peoples_war_doctrine_desc:0 "Every citizen is a potential soldier, and every village a potential stronghold."
 LATAM_peoples_war_doctrine2:0 "Protracted People's War"
 LATAM_peoples_war_doctrine2_desc:0 "Our people will fight on for as long as it takes. No occupation of our land will ever be secure."
 LATAM_rapid_response_doctrine2:0 "Rapid Reaction Forces"
 LATAM_rapid_response_doctrine2_desc:0 "Brigades held at constant readiness can deploy to any crisis within days."
 LATAM_elite_commandos:0 "Elite Commandos"
 LATAM_elite_commandos_desc:0 "Our special forces are among the most capable in Latin America."
 LATAM_precision_strike_doctrine:0 "Precision Strike Doctrine"
 LATAM_precision_strike_doctrine_desc:0 "Forward units coordinate air and artillery strikes with deadly accuracy."

 # Air Force Spirits
 LATAM_air_force_modernization:0 "Air Force Modernization"
 LATAM_air_force_modernization_desc:0 "New aircraft and training are gradually bringing our air force into the modern era."
 LATAM_air_force_modernization2:0 "Guardians of the Skies"
 LATAM_air_force_modernization2_desc:0 "Our air force is fully modernized and ready to defend our skies."
 LATAM_pilot_training_program:0 "Pilot Training Program"
 LATAM_pilot_training_program_desc:0 "More flight hours and a reformed academy are producing better pilots."
 LATAM_american_aircraft:0 "American Aircraft"
 LATAM_american_aircraft_desc:0 "Our air force flies American jets, backed by American training and support."
 LATAM_european_aircraft:0 "European Aircraft"
 LATAM_european_aircraft_desc:0 "Our air force operates capable European aircraft without Washington's strings attached."
 LATAM_russian_aircraft:0 "Russian Aircraft"
 LATAM_russian_aircraft_desc:0 "Powerful Russian fighters now fly under our colors."
 LATAM_national_aviation_industry:0 "National Aviation Industry"
 LATAM_national_aviation_industry_desc:0 "Our own factories now design and build aircraft for our air force."
 LATAM_air_superiority_doctrine:0 "Air Superiority Doctrine"
 LATAM_air_superiority_doctrine_desc:0 "Our multirole fighters are trained to control the skies above the battlefield."
 LATAM_air_superiority_doctrine2:0 "Air Superiority Doctrine"
 LATAM_air_superiority_doctrine2_desc:0 "Aerial refueling allows our fighters to project power across our vast territory."
 LATAM_light_attack_squadrons:0 "Light Attack Squadrons"
 LATAM_light_attack_squadrons_desc:0 "Cheap and rugged light attack aircraft support our troops from remote airstrips."
 LATAM_light_attack_squadrons2:0 "Light Attack Squadrons"
 LATAM_light_attack_squadrons2_desc:0 "Our pilots and ground forces now fight as one, calling in strikes exactly where needed."
 LATAM_air_defense_network:0 "Air Defense Network"
 LATAM_air_defense_network_desc:0 "Our fighters, radars and anti-air batteries are linked into a single defensive network."
